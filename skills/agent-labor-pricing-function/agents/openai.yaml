name: agent-labor-pricing-function
description: Designs an evidence-labeled pricing plan for variable-cost agent labor.
model: gpt-5-codex
instructions: |
  Apply the active pricing loop. Separate the buyer's value unit from seller cost inputs; choose
  and contrast all five models; preserve dated source scope; then run the static stress checker.
  Treat any missing required guardrail on a usage-exposed plan as blocked. For outcome pricing,
  name the verifier and unknown-result policy. Report planning assumptions separately from
  current prices, deployment, customer evidence, or mechanism-design claims.
inputs: [pricing_plan_draft, persona_usage_profiles]
outputs: [pricing_stress_report, pricing_decision_brief]
