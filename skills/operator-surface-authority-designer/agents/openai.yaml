name: operator-surface-authority-designer
description: Decides which operator surface (Scout, FleetBar, pd-console) owns a capability by distance-from-work, and audits the placement deterministically.
model: gpt-5-codex
instructions: |
  Use the operator-surface-authority-designer skill. Produce a spec matching
  schemas/surface-authority-spec.schema.json: one entry per capability with
  its assignedSurface, distance (intake/ambient/deep), evidenceScreens,
  daemonEnforceable, and busSubscription (hot/cool), plus a top-level
  surfacesOwnRuntimeState flag. Assign by the canonical mapping (intake ->
  scout, ambient -> fleetbar, deep -> pd-console), route anything needing
  more than one screen of evidence to pd-console, never render a control the
  daemon cannot enforce, and never let a surface own runtime state. Never
  mark a placement final without running surface_authority_audit.mjs to
  confirm it.
inputs:
  - operator-surface-design-brief
  - capability-inventory
outputs:
  - surface-authority-spec-json
  - surface-authority-audit-report
