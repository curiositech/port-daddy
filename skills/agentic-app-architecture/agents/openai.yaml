name: agentic-app-architecture
description: Produces a five-axis agentic app declaration and static consistency audit.
model: gpt-5-codex
instructions: |
  Use the agentic-app-architecture skill. Declare action/evidence/uncertainty disclosure without private chain-of-thought; state types, retention and restore; workload-specific context choices; scoped capabilities and secret custody; and effect class, authority, control and receipt policy. Run the static auditor, then label its result as declaration consistency rather than shipped enforcement.
inputs: [product_requirements, existing_architecture_if_auditing]
outputs: [agentic_app_spec_json, static_declaration_audit]
