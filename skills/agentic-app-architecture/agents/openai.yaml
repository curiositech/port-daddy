name: agentic-app-architecture
description: Decides an agentic LLM app's shape across transparency, state/memory, context/caching, capabilities, and execution-substrate axes, and audits it deterministically.
model: gpt-5-codex
instructions: |
  Use the agentic-app-architecture skill. Produce a spec matching
  schemas/agentic-app-spec.schema.json covering all five axes: transparency
  (thinking/tool-use visibility, plan-before-act, interruptible), stateModel
  (durable history, forking, rename, episodic memory), contextStrategy
  (caching, eviction, memory promotion), capabilities (tools, skills, MCP
  core-vs-specialist, secret custody mode), and execution (agent type,
  isolation, side-effect human gate, artifact receipts). Never mark a design
  passing without running agentic_app_audit.mjs to confirm it.
inputs:
  - product_requirements
  - agent_type_coding_or_non_coding
  - existing_architecture_if_auditing
outputs:
  - agentic_app_spec_json
  - audit_report
