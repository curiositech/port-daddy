<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">pd tube phone integration dry run</title>
  <desc id="desc">A simulated phone publishes JSON to phone:inbox, a local assistant reads it, and a reply goes back on the same thread.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#20243d"/>
    </linearGradient>
    <style>
      .title { fill:#f4fbff; font:700 28px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .muted { fill:#93a8bf; font:500 18px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .label { fill:#e6f4ff; font:700 22px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .code { fill:#baf5dc; font:500 18px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .phone { fill:#101827; stroke:#52f2b8; stroke-width:4; }
      .screen { fill:#17263a; }
      .daemon { fill:#201a34; stroke:#ffcf5a; stroke-width:4; }
      .bubble { fill:#102820; stroke:#52f2b8; stroke-width:2; }
      .arrow { fill:none; stroke:#ffcf5a; stroke-width:7; stroke-linecap:round; stroke-dasharray:16 14; animation:dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-30; } }
    </style>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="58" y="62" class="title">Phone-integration dry run: rehearse the relay shape locally</text>
  <g transform="translate(96 124)">
    <rect class="phone" width="230" height="350" rx="34"/>
    <rect class="screen" x="24" y="48" width="182" height="254" rx="18"/>
    <text x="50" y="105" class="label">phone</text>
    <text x="42" y="152" class="code">intent:</text>
    <text x="42" y="182" class="code">summarize-fleet</text>
    <circle cx="115" cy="324" r="12" fill="#52f2b8"/>
  </g>
  <g transform="translate(480 168)">
    <rect class="bubble" width="250" height="120" rx="22"/>
    <text x="38" y="52" class="label">phone:inbox</text>
    <text x="36" y="86" class="muted">tube.msg envelope</text>
  </g>
  <g transform="translate(874 136)">
    <rect class="daemon" width="230" height="320" rx="34"/>
    <text x="45" y="82" class="label">local</text>
    <text x="45" y="114" class="label">assistant</text>
    <text x="36" y="174" class="code">read body</text>
    <text x="36" y="210" class="code">reply in thread</text>
  </g>
  <path class="arrow" d="M326 258 H480"/>
  <path class="arrow" d="M730 228 H874"/>
  <path class="arrow" d="M874 336 H730"/>
  <path class="arrow" d="M480 336 H326"/>
  <text x="354" y="508" class="muted">Today both sides are local. Later the relay sits in the middle.</text>
</svg>
