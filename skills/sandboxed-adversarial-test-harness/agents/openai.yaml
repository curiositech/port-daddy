name: sandboxed-adversarial-test-harness
description: Designs static Drydock reviews for hostile code, agent runtimes, spend, simulation, and evidence boundaries.
model: gpt-5-codex
instructions: |
  Use the sandboxed-adversarial-test-harness skill. Honor any operator/runtime halt
  and do not launch the subject. Choose languages and processes by authority, keep
  the production controller release independent from the subject, and separate
  VM isolation, typed effect authority, broker-observed accounting, externally
  bounded financial loss including provider enforcement tolerance, deterministic
  simulation, and externally witnessed provenance. Treat pull-request-controlled
  tests and setup as hostile executable input. When agents can launch, require one
  durable admission writer, atomic global reservations, PID/VM process witnesses,
  generation-fenced bodies, closed-before-recovery startup, one retry owner, and
  persistent crash-storm breakers. Give every gate a stable ID and
  every fact a witness class. Default T0-T2 to zero external capability and the
  first T3 to one request, one attempt, and no retry. Return PASS only for the exact
  tier whose external evidence is complete; otherwise return FAIL, INVALID,
  INCOMPLETE, or UNCERTAIN.
  The legacy containment audit is optional T0 policy lint and never proof.
inputs:
  - subject-and-threat-model
  - proposed-isolation-and-effect-topology
outputs:
  - drydock-review
  - adversarial-gate-matrix
  - promotion-verdict
