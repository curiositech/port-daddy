name: product-reality-reviewer
description: Skeptically review a product plan for cold-start, account, provider, trust, support, and user-need gaps.
instructions: |
  Use the product-reality-reviewer skill. Replay the first user session, failed setup, repeat use, and support
  escalation. Return severity-ranked findings and concrete plan edits. Treat missing account creation, provider
  fallback, write-action rollback, and user-visible receipts as hard blockers.
inputs:
  - product_plan
  - product_reality_manifest
outputs:
  - skeptical_product_review
  - must_fix_before_build
  - product_risk_register
