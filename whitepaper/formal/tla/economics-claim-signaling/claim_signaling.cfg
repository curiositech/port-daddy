\* claim_signaling.cfg
\*
\* TLC configuration for whitepaper/formal/tla/economics-claim-signaling/claim_signaling.tla.
\*
\* Default entry: delta = 35/100 = 0.35 (just above the closed-form
\* threshold delta* ≈ 0.3425). The IC invariant should hold here.
\*
\* To re-run at other delta values, edit DeltaNum below OR use
\* whitepaper/formal/tla/economics-claim-signaling/sweep-delta.sh which generates per-delta cfg files
\* in whitepaper/formal/.sweep/ and runs them in turn.
\*
\* Horizon = 4 rounds: this is the *minimal* horizon that exercises the
\* full one-shot-deviation analysis the IC cubic comes from — one
\* deviation round plus the 3-round graduated trigger. Earlier drafts
\* used Horizon = 8, which causes TLC to overflow its 32-bit signed
\* integer arithmetic inside `Pow(100, 8)` (10^16, far above 2^31-1).
\* At Horizon = 4 the discount weights Pow(DeltaDen, Horizon) = 100^4
\* = 10^8 fit comfortably and accumulated scores stay below ~1.6e9.
\*
\* The IC inequality 1 <= 2*(d + d^2 + d^3) is *exactly* what this
\* horizon exercises: follow-path payoff = 3 + 3d + 3d^2 + 3d^3,
\* deviate-then-punished payoff = 4 + d + d^2 + d^3 (the punishment
\* rounds pay the mutual-claim 1, not 0). So no information is lost by
\* setting Horizon = 4; this is the discrete-state analogue of the
\* closed-form one-shot deviation principle and it agrees exactly with
\* the closed-form cubic checked by delta-threshold.z3.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  DeltaNum = 35
  DeltaDen = 100
  Horizon = 4
  PunishmentRounds = 3

INVARIANTS
  NoUnilateralDeviationPositive
