<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book · Visual atlas</title><link rel="stylesheet" href="atlas.css"><body><header><p class="eyebrow">Port Daddy / Editorial workbench</p><h1>Visual atlas <span>Book</span></h1><p id="edition"></p><div class="actions"><button id="export">Export decisions</button><label class="button" tabindex="0" role="button">Import decisions<input hidden type="file" id="import" accept="application/json"></label><button id="print">Print review</button><button id="theme">Theme</button></div></header><div class="method"><strong>Compare the argument and the craft.</strong><p>Quality /100 = 50% aesthetics + 50% information. Provenance is separate. Unreviewed work stays unscored.</p><span id="storage" role="status"></span></div><div class="workspace"><aside><p class="eyebrow">Visual families</p><label class="mobile-family-label">Choose a family<select id="mobile-family" aria-label="Visual family"></select></label><nav id="types" aria-label="Visual type"></nav><div id="summary"></div><p class="aside-note">Compare a family's visual language, inspect its evidence, then record your decisions.</p></aside><main><section class="toolbar"><label>ID / title lookup<input id="lookup" type="search" placeholder="Find a known work…"></label><label>Chapter<select id="chapter"></select></label><label>Data kind<select id="dataKind"></select></label><label>Evidence<select id="evidence"></select></label><label>Order<select id="sort"><option value="ranked">Quality · highest first</option><option value="original">Book order</option><option value="manual">My arrangement</option></select></label></section><label class="audit-toggle"><input id="include-excluded" type="checkbox">Include excluded fragments and duplicates</label><div class="heading"><div><p class="eyebrow" id="family-subtitle"></p><h2 id="family-title"></h2></div><button id="compare" disabled>Compare selected (0)</button></div><p id="results" aria-live="polite"></p><div class="grid" id="grid"></div><button id="load-more" class="load-more" hidden>Show more</button></main></div><dialog id="inspector"><div class="heading"><h2 id="dialog-title"></h2><button id="close">Close</button></div><div id="dialog-body"></div></dialog><script src="atlas-data.js"></script><script src="atlas.js"></script></body></html>
