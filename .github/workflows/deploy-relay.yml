name: Deploy relay latest (Cloudflare Worker, staging channel)

# Why this workflow exists:
#   apps/relay is the LIVE control plane for the cloud fleet — GitHub webhook
#   ingress (producer for the fleet-runs queue), the operator fleet API, the
#   OIDC→card exchange, and (since ADR-0101) the human-facing run detail pages
#   that check runs link via details_url. It had NO deploy automation: it was
#   hand-deployed 2026-06-24 and then drifted from main for weeks (the ADR-0101
#   run page 404'd in production until 2026-07-14 because nothing redeployed
#   it).
#
# RELEASE CHANNELS (ADR-0119): this workflow is the LATEST channel. On every
# push to main touching apps/relay/** it:
#   1. applies pending D1 migrations to the STAGING database
#      (port-daddy-relay-staging — the [env.latest] binding),
#   2. records them in the staging ledger
#      (apps/relay/migrations/applied-staging.json),
#   3. deploys the relay-latest Worker (`wrangler deploy --env latest`), and
#   4. publishes any changed ledger on a deterministic auto-merge PR.
# PRODUCTION (relay.portdaddy.dev) is NOT touched here — it deploys only from
# a relay-v* release tag via deploy-relay-prod.yml, gated on the ledger this
# workflow writes (staging-first, enforced).
#
# Config model — committed file, NOT a secret:
#   The Worker config lives in apps/relay/wrangler.deploy.toml, committed to
#   the repo. It contains ONLY non-credential values: resource ids (D1, KV),
#   bindings, and plaintext vars. Cloudflare resource ids grant no access
#   without an API token, so there is nothing to hide — and committing the file
#   means main is the single source of truth (no "refresh the repo secret from
#   my laptop" step that silently goes stale).
#
#   Runtime secrets are set out-of-band via `wrangler secret put --env latest`
#   and are PRESERVED across deploys — this workflow never touches them:
#     RELAY_OPERATOR_TOKEN, RELAY_ED25519_PRIVATE_KEY_HEX,
#     GITHUB_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY (optional),
#     RUN_PAGE_SECRET (ADR-0101 run pages; must equal the fleet-executor's).
#
# Required repository secrets (already used by deploy-fleet-executor):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - 'apps/relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  # The built-in token only reads the checkout. A separately probed mutation
  # token publishes the generated ledger PR so its events trigger the ordinary
  # CI/Fleet gates automatically; GITHUB_TOKEN-created PR runs require a human
  # approval before they execute.
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never run from a fork; the secrets only exist on the canonical repo.
    if: github.repository == 'curiositech/port-daddy'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the freshest main before generating the ledger branch (another
          # merge may have landed while we ran).
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Don't ship a red build (same gate deploy-fleet-executor uses).
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run

      # STAGING FIRST (ADR-0119): schema before code, staging before prod.
      # Wrangler tracks applied files per-database, so re-running is a no-op.
      # A failure here silently wedges the PROD release too: the ledger this
      # step feeds is the only thing deploy-relay-prod.yml's gate trusts, so an
      # unauthorized staging DB reads downstream as "migrations not rehearsed."
      # Print the diagnosis and the exact commands rather than leaving a 7403.
      - name: Apply D1 migrations to STAGING
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler d1 migrations apply port-daddy-relay-staging \
                 --config wrangler.deploy.toml --env latest --remote; then
            echo "::error title=Staging D1 migrations failed::This also blocks the PROD release gate (ADR-0119)."
            echo ""
            echo "Which account is this token actually bound to, and is the DB there?"
            npx wrangler whoami || true
            npx wrangler d1 list || true
            echo ""
            echo "A 'code: 7403 — account not valid or is not authorized' means one of:"
            echo "  (a) CLOUDFLARE_API_TOKEN lacks the D1:Edit permission, or"
            echo "  (b) port-daddy-relay-staging lives on a DIFFERENT account than"
            echo "      CLOUDFLARE_ACCOUNT_ID (compare the id above with the database_id"
            echo "      in apps/relay/wrangler.deploy.toml [[env.latest.d1_databases]])."
            echo ""
            echo "Mint or re-scope the token (needs Workers Scripts:Edit + D1:Edit):"
            echo "  https://dash.cloudflare.com/profile/api-tokens"
            echo "Create the staging DB on the CI account if it is missing:"
            echo "  npx wrangler d1 create port-daddy-relay-staging"
            echo "  # then paste the returned database_id into [[env.latest.d1_databases]]"
            echo "D1 databases on the account CI/Pages deploys to (ids are not secrets —"
            echo "same convention as the committed database_id in wrangler.deploy.toml):"
            echo "  https://dash.cloudflare.com/1f7b49a13841037a867d879bd01af641/workers/d1"
            echo "Wrangler D1 command reference:"
            echo "  https://developers.cloudflare.com/d1/wrangler-commands/"
            exit 1
          fi

      # The ledger writer must itself be green before it writes gate truth.
      - name: Test the migration-gate script
        working-directory: .
        run: node --test scripts/check-migrations-gate.test.mjs

      # Record what staging now has. The committed ledger is the ONLY thing the
      # prod release gate trusts (scripts/check-migrations-gate.mjs --check).
      - name: Record staging ledger
        working-directory: .
        run: node scripts/check-migrations-gate.mjs --record

      - name: Detect staging ledger change
        id: ledger_change
        working-directory: .
        run: |
          if git diff --quiet -- apps/relay/migrations/applied-staging.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One-time self-provisioning, idempotent on every run: the staging queue,
      # plus staging-only secrets. Staging secrets are ROTATED on each deploy —
      # fine for a rehearsal channel; prod secrets are never touched here.
      - name: Provision staging queue + secrets (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler queues create fleet-runs-staging 2>/dev/null || echo "staging queue already exists"
          openssl rand -hex 32 | npx wrangler secret put RELAY_OPERATOR_TOKEN --config wrangler.deploy.toml --env latest
          openssl rand -hex 32 | npx wrangler secret put RELAY_ED25519_PRIVATE_KEY_HEX --config wrangler.deploy.toml --env latest

      - name: Deploy relay-latest Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.toml --env latest

      # A protected main branch cannot accept a CI bot's direct push. The
      # previous workflow applied the migration, committed its ledger, then
      # died at `git push HEAD:main` before deploying relay-latest. Select a
      # live PAT only after staging is healthy, and expose only its source name.
      - name: Select a working ledger-mutation token
        id: ledger_token
        if: steps.ledger_change.outputs.changed == 'true'
        working-directory: .
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          token_source=$(node scripts/release-workflow-state.mjs \
            select-live-token "$GITHUB_REPOSITORY") || {
            echo "::error title=Ledger PR disabled::No configured automation credential proved it can push to $GITHUB_REPOSITORY. relay-latest is deployed, but PROD remains gated until the credential is repaired and this workflow is rerun."
            exit 1
          }
          echo "source=$token_source" >> "$GITHUB_OUTPUT"
          echo "Selected $token_source after a live repository push-permission probe."

      - name: Publish staging ledger PR (if changed)
        if: steps.ledger_change.outputs.changed == 'true'
        working-directory: .
        env:
          TOKEN_SOURCE: ${{ steps.ledger_token.outputs.source }}
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SOURCE" = "RELEASE_TRAIN_TOKEN" ]; then
            export GH_TOKEN="$RELEASE_TRAIN_TOKEN"
          elif [ "$TOKEN_SOURCE" = "HOMEBREW_TAP_TOKEN" ]; then
            export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          else
            echo "::error title=Ledger PR disabled::Token selector returned an unknown non-secret source name."
            exit 1
          fi

          # checkout's GITHUB_TOKEN extraheader would otherwise override the
          # dedicated PAT and leave PR-triggered workflows approval-gated. gh
          # installs a credential helper without printing the token.
          git config --local --unset-all http.https://github.com/.extraheader || true
          gh auth setup-git
          git config user.name "port-daddy-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/relay/migrations/applied-staging.json
          git commit -m "chore(relay): record staging-applied migrations"

          ledger_branch="automation/relay-staging-ledger"
          remote_sha="$(git ls-remote --heads origin "$ledger_branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${ledger_branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${ledger_branch}"
          else
            git push origin "HEAD:refs/heads/${ledger_branch}"
          fi

          body=$'## Summary\n\nRecords D1 migrations that the relay latest workflow successfully applied to the isolated staging database. This generated PR is the auditable handoff from staging rehearsal to the protected production migration gate.\n\n## Test Plan\n\nThe generating workflow passed Relay typecheck and unit tests, applied staging D1 migrations successfully, and deployed relay-latest before publishing this ledger update.\n\nRoadmap-Item: none — generated staging migration ledger receipt'
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$ledger_branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$ledger_branch" --title "chore(relay): record staging-applied migrations" \
              --body "$body")"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "chore(relay): record staging-applied migrations" --body "$body"
          fi

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --rebase
          echo "::notice title=Staging ledger PR::PR #${pr_number} is updated and auto-merge is armed; PROD stays gated until its required checks land it."
