name: Deploy relay (Cloudflare Worker)

# Why this workflow exists:
#   apps/relay is the LIVE control plane for the cloud fleet — GitHub webhook
#   ingress (producer for the fleet-runs queue), the operator fleet API, the
#   OIDC→card exchange, and (since ADR-0101) the human-facing run detail pages
#   that check runs link via details_url. It had NO deploy automation: it was
#   hand-deployed 2026-06-24 and then drifted from main for weeks (the ADR-0101
#   run page 404'd in production until 2026-07-14 because nothing redeployed
#   it). This workflow deploys on every push to main that touches the app.
#
# Config model — committed file, NOT a secret:
#   The Worker config lives in apps/relay/wrangler.deploy.toml, committed to
#   the repo. It contains ONLY non-credential values: resource ids (D1, KV),
#   bindings, and plaintext vars. Cloudflare resource ids grant no access
#   without an API token, so there is nothing to hide — and committing the file
#   means main is the single source of truth (no "refresh the repo secret from
#   my laptop" step that silently goes stale).
#
#   Runtime secrets are set out-of-band via `wrangler secret put` and are
#   PRESERVED across `wrangler deploy` — this workflow never touches them:
#     RELAY_OPERATOR_TOKEN, RELAY_ED25519_PRIVATE_KEY_HEX,
#     GITHUB_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY (optional),
#     RUN_PAGE_SECRET (ADR-0101 run pages; must equal the fleet-executor's).
#
# Required repository secrets (already used by deploy-fleet-executor):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - 'apps/relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never run from a fork; the secrets only exist on the canonical repo.
    if: github.repository == 'curiositech/port-daddy'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Don't ship a red build (same gate deploy-fleet-executor uses).
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.toml
