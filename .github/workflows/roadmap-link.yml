name: Roadmap Link Gate

# Blocking gate: does this PR declare the roadmap item it advances?
# `roadmap-link` is a required status check in branch protection, so it must
# report on every ref the merge queue evaluates.
#
# Merge-queue parity: the queue evaluates required checks on the temporary
# merge_group ref, not the PR branch. A merge_group head has no PR body /
# roadmap link to check, so without a merge_group trigger this required check
# would never report there — the queue would wait until timeout and eject the
# PR despite green PR checks. The merge_group trigger below makes it report as
# a pass-through (exit 0): the substantive check runs at pull_request time, and
# a rebase in the queue does not change a PR's roadmap declaration, so the PR
# verdict is sufficient. Its other teeth — the `needs-roadmap-link` label the
# land/auto-merge flow treats as "hold for a human" — are unchanged.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: write

# One run per PR (or per merge_group head); a fast follow-up edit cancels the
# in-flight PR run. Merge-queue runs key on the head SHA and never cancel.
concurrency:
  group: roadmap-link-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  roadmap-link:
    runs-on: ubuntu-latest
    steps:
      - name: Merge-queue pass-through
        if: github.event_name == 'merge_group'
        run: echo "merge_group head — roadmap link already gated at PR time; passing through."

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - name: Use Node.js 22
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Check PR links a roadmap item
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/check-roadmap-link.ts
