name: Release Cadence

# Operator directive (2026-07-14): we do not publish daemon versions to
# Homebrew often enough, and stale installed daemons drift from main.
#
# Since 2026-08-09 the RELEASE TRAIN (.github/workflows/release-train.yml)
# actually CUTS releases on schedule — this workflow is now the train's
# WATCHDOG. If the cadence still slips (the train is held, broken, stalled on
# a red bump PR, or its PAT died), this files/updates a single "Homebrew
# release overdue" issue so the failure has a face. When this fires, the
# question is "why didn't the train cut?", not "who will run RELEASING.md".

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-cadence:
    runs-on: ubuntu-latest
    env:
      MAX_UNRELEASED_DAYS: '7'
      ISSUE_TITLE: 'Homebrew release overdue'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Measure unreleased daemon changes
        id: measure
        run: |
          set -euo pipefail
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            echo "No release tags found — treating as overdue."
            echo "overdue=true" >> "$GITHUB_OUTPUT"
            echo "latest_tag=none" >> "$GITHUB_OUTPUT"
            echo "days=∞" >> "$GITHUB_OUTPUT"
            echo "commits=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_date=$(git log -1 --format=%ct "$latest_tag")
          now=$(date +%s)
          days=$(( (now - tag_date) / 86400 ))
          # Only daemon-facing surfaces count toward the cadence. Keep this
          # list in lockstep with release-train.yml's DAEMON_PATHSPEC — the
          # old narrow list (server.ts lib/ cli/ shared/ package.json) was
          # blind to routes/, mcp/, bin/, hooks/ and the packaging itself, and
          # reported "0 unreleased daemon commits" while the daemon churned.
          commits=$(git rev-list --count "$latest_tag"..HEAD -- server.ts lib/ cli/ shared/ routes/ mcp/ bin/ hooks/ skills/port-daddy-agent-skill/ agents/port-daddy-pilot/ package.json release-artifacts.json .github/workflows/release.yml)
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          if [ "$days" -gt "$MAX_UNRELEASED_DAYS" ] && [ "$commits" -gt 0 ]; then
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File or refresh the overdue issue
        if: steps.measure.outputs.overdue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.measure.outputs.latest_tag }}
          DAYS: ${{ steps.measure.outputs.days }}
          COMMITS: ${{ steps.measure.outputs.commits }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          **The last release (\`$LATEST_TAG\`) is $DAYS days old with $COMMITS unreleased commits touching daemon surfaces** (server.ts, lib/, cli/, shared/).

          Operator standing order: publish daemon versions to Homebrew regularly. Stale installed daemons drift from main and fork machine truth.

          **The release train (\`.github/workflows/release-train.yml\`) should have cut this already** — this issue firing means the train failed. Triage in order:
          1. Is there an open "Release train: hold" issue? Close it if the hold is stale.
          2. Is a \`release-train/*\` bump PR stuck open with red CI or unresolved review? Fix and let auto-merge land it.
          3. Did the train's last run fail (missing/expired \`RELEASE_TRAIN_TOKEN\` / \`HOMEBREW_TAP_TOKEN\`, or a formula-compat mismatch with curiositech/homebrew-tap)? Check its run log.
          4. Worst case, cut by hand per \`docs/RELEASING.md\` — release.yml still soaks, battens, and formula-checks everything on tag publish.

          This issue is refreshed weekly by \`.github/workflows/release-cadence.yml\` and should be closed by the release that clears the backlog.
          EOF
          )
          existing=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body" --label release
          fi

      - name: Cadence healthy
        if: steps.measure.outputs.overdue == 'false'
        env:
          LATEST_TAG: ${{ steps.measure.outputs.latest_tag }}
          DAYS: ${{ steps.measure.outputs.days }}
          COMMITS: ${{ steps.measure.outputs.commits }}
        run: echo "Release cadence healthy — $DAYS days since $LATEST_TAG, $COMMITS unreleased daemon commits."
