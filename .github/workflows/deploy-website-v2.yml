name: Deploy website-v2 (snap + wrangler)

# Why this workflow exists:
#   Cloudflare Pages' git integration runs `npm run build` in a Node
#   image that doesn't ship the Playwright chromium binary. That makes
#   the snap step impossible there. This workflow runs the FULL build
#   (build:full = vite build + inject-route-html + snap-routes) on a
#   GitHub-hosted Ubuntu runner (which DOES have chromium), then
#   deploys the resulting dist/ directly to the existing Cloudflare
#   Pages project via wrangler.
#
#   The CF Pages git integration still fires on push to main and may
#   produce an empty-body deploy as a safety net. This workflow runs
#   afterward and overwrites the deployment with snapped HTML, so the
#   last-writer-wins outcome is: full content shipped to Google.
#
# Required repository secrets:
#   - CLOUDFLARE_API_TOKEN — a token with Pages:Edit on the port-daddy
#     project. Create in CF dashboard → My Profile → API Tokens →
#     "Create Custom Token" → permission "Account > Cloudflare Pages > Edit".
#   - CLOUDFLARE_ACCOUNT_ID — visible in the Pages dashboard URL.
#
# The Book. The `book` job (book-publication.yml) sets the Book in Suisse from
# the merged source, checks every page, and lays out the facing copy. When it
# hands back an edition, the deploy serves those two PDFs in place of the
# committed ones and records their page count, size and digest in the site's
# metadata before building, so the site always carries the Book as merged.
# When the fonts are not configured it hands back nothing and the committed
# Book ships as before. When it fails, nothing deploys: a Book that failed its
# page checks is not published, and the previous deployment stays live.
#   - BOOK_SUISSE_00..11 — the licensed fonts, set once with
#     `python3 scripts/book-fonts/ci_fonts.py upload`. Optional.

on:
  push:
    branches: [main]
    paths:
      - 'website-v2/**'
      - 'book/**'
      - 'scripts/build-book-source.py'
      - 'scripts/stage-book-public-assets.mjs'
      - 'scripts/verify-book-source-download.mjs'
      - 'scripts/build-whitepapers.sh'
      - 'scripts/generate-mega-whitepaper.mjs'
      - 'scripts/generate-book-glossary.mjs'
      - 'scripts/lint/check-welds.mjs'
      - 'scripts/harbor-research/render_status_tables.py'
      - 'scripts/prepare-book-fonts.py'
      - 'scripts/build_facing_pdf.py'
      - 'scripts/build-spreads.sh'
      - 'scripts/book-fonts/**'
      - '.github/workflows/book-publication.yml'
      - '.github/workflows/deploy-website-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  # Serialize deploys against the same Pages project so two pushes in
  # rapid succession don't race to overwrite each other.
  group: deploy-website-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  book:
    uses: ./.github/workflows/book-publication.yml
    # The called workflow reads only BOOK_SUISSE_00..11.
    secrets: inherit

  build-and-deploy:
    needs: book
    # Playwright 1.58.2 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website-v2/package-lock.json

      - name: Install website-v2 dependencies
        working-directory: website-v2
        run: npm ci

      - name: Fetch the Suisse Book this run set and checked
        if: needs.book.outputs.edition == 'suisse'
        uses: actions/download-artifact@v4
        with:
          name: book-publication
          path: ${{ runner.temp }}/book-publication

      # The PDF, the facing copy and the copy's receipt replace the committed
      # three, and the metadata that describes them (page count, size, digest)
      # is recomputed from the bytes before the site is built from it. The
      # prebuild's check-book-spreads.mjs then binds the copy to this Book.
      - name: Serve the Suisse Book in place of the committed one
        if: needs.book.outputs.edition == 'suisse'
        env:
          FETCHED: ${{ runner.temp }}/book-publication
        run: |
          set -euo pipefail
          pub=website-v2/public/whitepaper
          for f in coordination-papers-mega-volume.pdf \
                   coordination-papers-mega-volume-spreads.pdf \
                   coordination-papers-mega-volume-spreads.json; do
            test -s "$FETCHED/$f"
            cp "$FETCHED/$f" "$pub/$f"
          done
          command -v pdfinfo >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          ( cd website-v2 && npx tsx scripts/check-whitepaper-metadata.ts --fix ) || true
          ( cd website-v2 && npx tsx scripts/check-whitepaper-metadata.ts )
          node website-v2/scripts/check-book-spreads.mjs
          {
            echo "### Book served by this deploy"
            echo
            echo '```json'
            cat "$FETCHED/book-publication.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say that the committed Book is served
        if: needs.book.outputs.edition != 'suisse'
        run: echo "::notice::The Suisse fonts are not configured, so this deploy serves the committed Book."

      - name: Install Playwright chromium
        working-directory: website-v2
        # --with-deps grabs apt packages chromium needs on Ubuntu runners.
        run: npx playwright install --with-deps chromium

      - name: Verify the complete source archive is publicly readable
        run: node scripts/verify-book-source-download.mjs

      - name: Build + snap rendered HTML
        working-directory: website-v2
        # build:full = `npm run build` + `npm run snap:routes`.
        # snap-routes spins up vite preview, walks every indexable
        # route in a headless chromium, captures the post-mount HTML,
        # and writes it back into dist/<route>/index.html.
        run: npm run build:full

      - name: Assert snap landed real content (defense in depth)
        working-directory: website-v2
        # If snap silently no-op'd, dist/index.html would still have an
        # empty <div id="root">. Hard-fail rather than deploy an empty
        # site that pretends to ship full content.
        run: |
          set -euo pipefail
          for route in dist/index.html dist/blog/control-plane-is-the-product/index.html dist/docs/quickstart/index.html; do
            if [ ! -f "$route" ]; then
              echo "Missing post-snap file: $route" >&2
              exit 1
            fi
            if grep -q '<div id="root"></div>' "$route"; then
              echo "Empty root in $route — snap did not run or failed silently" >&2
              exit 1
            fi
            size=$(wc -c < "$route")
            if [ "$size" -lt 10000 ]; then
              echo "Suspiciously small file: $route ($size bytes)" >&2
              exit 1
            fi
            echo "  ok: $route ($size bytes)"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # wrangler-action@v3 does NOT expand env vars in `command:` —
        # the prior `--branch=$DEPLOY_BRANCH` shipped the literal string
        # and CF promoted to its fallback `deploy-branch.*.pages.dev`
        # alias instead of the production `portdaddy.dev`. Hardcode
        # `main` (matching the project's production_branch) to deploy
        # straight to prod.
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website-v2/dist --project-name=port-daddy --branch=main --commit-dirty=true
