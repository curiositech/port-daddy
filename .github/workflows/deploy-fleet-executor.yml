name: Deploy fleet-executor (Cloudflare Worker)

# Why this workflow exists:
#   apps/fleet-executor is the LIVE cloud fleet bot (the Cloudflare Queues
#   consumer that posts PR review + ideation-ship comments). It had no deploy
#   automation, so merging a change to main left the OLD Worker running until
#   someone remembered to `wrangler deploy` by hand. This workflow deploys it on
#   every push to main that touches the app, so main == what's live.
#
# Config model — committed file, NOT a secret:
#   The Worker config lives in apps/fleet-executor/wrangler.deploy.toml,
#   committed to the repo. It contains ONLY non-credential values: KV/D1
#   resource ids, queue bindings, the GitHub App id (public — it appears in the
#   App's own page URL), and plaintext vars like RUN_DETAILS_BASE_URL.
#   Cloudflare resource ids grant no access without an API token, so there is
#   nothing to hide — and committing the file makes main the single source of
#   truth. This replaces the old FLEET_EXECUTOR_WRANGLER_TOML repo secret,
#   whose hand-refresh step silently went stale whenever the local
#   wrangler.toml changed (that repo secret can now be deleted).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN            already used by deploy-website-v2; a token
#                                     with Workers Scripts:Edit on this account.
#   - CLOUDFLARE_ACCOUNT_ID           already used by deploy-website-v2.
#
# The Worker's runtime secrets are set out-of-band via `wrangler secret put`
# and are PRESERVED across `wrangler deploy` — this workflow never touches them:
#   - GITHUB_APP_PRIVATE_KEY     PEM signing key for the GitHub App.
#   - RUN_PAGE_SECRET            HMAC secret for run-page capability URLs
#                                (ADR-0101); must equal the relay's.
#   - PORT_DADDY_TELEMETRY_TOKEN Bearer token for POST /telemetry/cloud-app
#                                (cost + failure events back to the daemon /
#                                FleetBar). OPTIONAL: unset ⇒ the executor runs
#                                identically and emits nothing.

on:
  push:
    branches: [main]
    paths:
      - 'apps/fleet-executor/**'
      - '.github/workflows/deploy-fleet-executor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize deploys so two rapid pushes can't race the same Worker.
  group: deploy-fleet-executor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never run from a fork; the secrets only exist on the canonical repo.
    if: github.repository == 'curiositech/port-daddy'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/fleet-executor
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Don't ship a red build. main is already tested by ci.yml, but a deploy
      # that skips its own gate can push a broken Worker if the two ever drift.
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test
        run: bunx vitest run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config wrangler.deploy.toml
