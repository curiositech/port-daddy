name: VHS Tape Generation
on:
  push:
    paths:
      - 'demos/*.tape'
      - '.github/workflows/vhs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        # onnxruntime-node downloads a native binary during installation. Retry
        # one transient transport failure, but keep a second failure red.
        run: npm ci || (echo "npm ci transport failed; retrying once in 30s" && sleep 30 && npm ci)

      - name: Build daemon and expose this checkout's CLI
        run: |
          set -euo pipefail
          npm run build:daemon:dist
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$GITHUB_WORKSPACE/bin/port-daddy-cli.js" "$RUNNER_TEMP/bin/pd"
          ln -s "$GITHUB_WORKSPACE/bin/port-daddy-cli.js" "$RUNNER_TEMP/bin/port-daddy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install recorder tools
        env:
          VHS_VERSION: 0.11.0
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          # Retried, same reason as ci.yml's agg download: a blip on a
          # third-party release host is not a defect in this repository.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --max-time 600 \
            -o "$RUNNER_TEMP/vhs.deb" \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/vhs.deb"
          vhs --version

      - name: Start daemon for recording
        run: |
          set -euo pipefail
          pd start
          pd status

      - name: Run VHS tapes
        run: |
          set -euo pipefail
          for tape in demos/*.tape; do
            echo "Recording: $tape"
            vhs "$tape"
          done

      - name: Stop daemon
        if: always()
        run: pd stop --yes || true

      - name: Commit changes
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update VHS demos [skip ci]"
          file_pattern: "demos"
