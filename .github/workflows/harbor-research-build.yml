name: Harbor Research PDF Build

# Renders the harbor-research corpus (docs/harbor-research/tex/*.tex — the
# seven arXiv-style papers, the execution reports, and the treatise/portfolio
# drafts) from LaTeX source under the same pinned texlive digest the
# whitepaper build uses, so the two corpora never drift onto different TeX
# Live dialects. No TeX toolchain exists in the interactive dev container;
# this workflow is the only place these PDFs get rendered.
#
# Modes mirror whitepaper-build.yml:
#   * feature-branch push / same-repo PR -> rebuild and COMMIT changed PDFs
#     back onto the branch (self-healing).
#   * main push -> rebuild and FAIL if a committed PDF is stale (main only
#     receives fresh renders via merged PRs, which already healed themselves).

on:
  push:
    branches: [main]
    paths:
      - 'docs/harbor-research/tex/**/*.tex'
      - 'docs/harbor-research/figures/**/*.png'
      - 'docs/harbor-research/figures/**/*.tex'
      - 'docs/harbor-research/Makefile'
      - '.github/workflows/harbor-research-build.yml'
  pull_request:
    paths:
      - 'docs/harbor-research/tex/**/*.tex'
      - 'docs/harbor-research/figures/**/*.png'
      - 'docs/harbor-research/figures/**/*.tex'
      - 'docs/harbor-research/Makefile'
      - '.github/workflows/harbor-research-build.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harbor-research-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Skipped jobs report success, so this advisory/healing workflow can never
    # hang the merge queue — same reasoning as whitepaper-build.yml.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Same digest as whitepaper-build.yml, deliberately: one TeX Live
      # dialect across the whole repository's rendered LaTeX. Bump both
      # pins together.
      image: texlive/texlive@sha256:ee8ecc627897eabeb42d862d8187546483455e66ce94aa5c2bce1b45a977ab27
    steps:
      - name: Ensure git present
        run: command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4
        with:
          # A branch-name checkout can silently test a newer push while the
          # check run is attached to an older SHA. Bind the evidence to the
          # event head, then let a retry inspect the source inputs explicitly.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Trust the checkout dir (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Render the harbor-research corpus reproducibly
        shell: bash
        run: |
          set -euo pipefail
          # The epoch is bound to renderer inputs only. A generated PDF,
          # metadata record, or review proof must not produce a different PDF
          # merely because it advanced HEAD. `source-epoch` uses the maximum
          # author timestamp, which survives a rebase.
          SOURCE_DATE_EPOCH="$(make -s -C docs/harbor-research source-epoch)"
          test -n "$SOURCE_DATE_EPOCH"
          export SOURCE_DATE_EPOCH FORCE_SOURCE_DATE=1
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

          # Build into empty runner-temporary directories, never on top of
          # committed PDFs. The hash check is a real proof within this pinned
          # TeX Live image: a renderer that cannot reproduce its own output
          # stops before staging artifacts.
          build_dir="$RUNNER_TEMP/harbor-research-build"
          pdf_dir="$RUNNER_TEMP/harbor-research-pdf"
          rm -rf "$build_dir" "$pdf_dir"
          make -C docs/harbor-research docs BUILD_DIR="$build_dir" PDF_DIR="$pdf_dir"
          hash_file="$RUNNER_TEMP/harbor-research-pdfs.sha256"
          sha256sum "$pdf_dir"/*.pdf > "$hash_file"
          rm -rf "$build_dir" "$pdf_dir"
          make -C docs/harbor-research docs BUILD_DIR="$build_dir" PDF_DIR="$pdf_dir"
          sha256sum --check "$hash_file"

          # The current renderer owns the `TEXS` output set. The committed
          # directory also retains historical research PDFs outside that set;
          # do not relabel them as fresh output or delete them here. Instead,
          # require this clean render to produce precisely the 19 declared
          # names before it overwrites those current artifacts.
          find "$pdf_dir" -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort > "$RUNNER_TEMP/harbor-rendered-names.txt"
          make -s -C docs/harbor-research output-names | sort > "$RUNNER_TEMP/harbor-expected-names.txt"
          diff -u "$RUNNER_TEMP/harbor-expected-names.txt" "$RUNNER_TEMP/harbor-rendered-names.txt"
          cp "$pdf_dir"/*.pdf docs/harbor-research/pdf/

      - name: Publish the eight papers + execution reports for the site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website-v2/public/research
          for f in paper1 paper2 paper3 paper4 paper5 paper6 paper7 paper8 exec4 exec5; do
            cp "docs/harbor-research/pdf/$f.pdf" "website-v2/public/research/$f.pdf"
          done

      - name: Commit rebuilt PDFs (same-repo branch)
        if: >-
          (github.event_name == 'push' && github.ref_name != 'main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        # The retry guard uses `mapfile`; containers default to `sh` unless
        # this is explicit.
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rendered_head="$(git rev-parse HEAD)"
          if [ -z "$(git status --porcelain --untracked-files=all -- docs/harbor-research/pdf/*.pdf website-v2/public/research/*.pdf)" ]; then
            echo "PDFs already match source — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/harbor-research/pdf/*.pdf website-v2/public/research/*.pdf
          echo "Changed PDFs:"; git diff --cached --stat
          git commit -m "build(harbor-research): regenerate PDFs from source"
          # The same race whitepaper-build already survives, and this job did
          # not: the branch moves while the papers compile, so a bare push is
          # rejected and the job reports red for a build that succeeded --
          # exactly what happened at c11b5d073, where the PDFs were built and
          # committed and the push lost to a source commit pushed meanwhile.
          # Rebase the one PDF commit onto whatever arrived and try again, a
          # few times, because the same race can be lost twice. No force: if
          # the rebase cannot replay the commit, that is a real conflict over
          # the PDFs and a person should see it.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "pushed the regenerated PDFs on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) — inspecting the branch movement"
            git fetch origin "$TARGET_BRANCH"
            if ! git merge-base --is-ancestor "$rendered_head" "origin/$TARGET_BRANCH"; then
              echo "::notice::target branch no longer descends from the rendered source head; leaving this artifact commit unpushed"
              exit 0
            fi
            # Replaying a render on top of changed TeX, figures, builder, or
            # workflow inputs would bind old artifacts to new source. Let the
            # newer source-triggered run own that work instead. Metadata and
            # proof-only movement is safe only when the source epoch also
            # agrees: a source change/revert can restore the same bytes while
            # changing the maximum author timestamp and therefore the PDF ID.
            mapfile -t source_inputs < <(make -s -C docs/harbor-research source-inputs)
            head_epoch="$(make -s -C docs/harbor-research source-epoch)"
            target_epoch="$(make -s -C docs/harbor-research source-epoch SOURCE_REF="origin/$TARGET_BRANCH")"
            test -n "$head_epoch"
            test -n "$target_epoch"
            if ! git diff --quiet HEAD "origin/$TARGET_BRANCH" -- "${source_inputs[@]}" || [ "$head_epoch" != "$target_epoch" ]; then
              echo "::notice::renderer inputs or source epoch moved while rendering; leaving this obsolete render unpushed for the newer run"
              exit 0
            fi
            echo "branch moved only outside renderer inputs; rebasing the deterministic artifact commit"
            git rebase "origin/$TARGET_BRANCH" || {
              git rebase --abort || true
              echo "::error::the regenerated PDFs conflict with $TARGET_BRANCH and cannot be replayed automatically"
              exit 1
            }
          done
          echo "::error::could not push the regenerated PDFs after three attempts; the branch is moving faster than the papers build"
          exit 1

      - name: Freshness check (advisory on PRs, enforced on main)
        shell: bash
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all -- docs/harbor-research/pdf/*.pdf website-v2/public/research/*.pdf)" ]; then
            echo "All in-scope harbor-research PDFs match a fresh render. ✔"; exit 0
          fi
          echo "Rendered PDFs differ from what's committed:"
          git diff --stat -- 'docs/harbor-research/pdf/*.pdf' 'website-v2/public/research/*.pdf' || true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::main is serving stale harbor-research PDFs — a PR must carry"
            echo "rebuilt PDFs (the feature-branch build commits them automatically)."
            exit 1
          fi
          echo "::notice::Advisory only — PDFs are regenerated and committed on the"
          echo "feature branch, so the merge carries fresh artifacts to main."
