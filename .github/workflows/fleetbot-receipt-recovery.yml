name: Fleetbot receipt recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original Fleetbot actuator run whose signed manifest should be recovered.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  main-ref-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the reviewed main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Fleetbot recovery code may only run from refs/heads/main." >&2
            exit 1
          fi

  recover:
    needs: main-ref-gate
    runs-on: ubuntu-latest
    environment: fleetbot-workload
    timeout-minutes: 5
    env:
      FLEETBOT_RELAY_URL: https://relay.portdaddy.dev
      FLEETBOT_RELAY_PUBLIC_KEY_HEX: ${{ vars.FLEETBOT_RELAY_PUBLIC_KEY_HEX }}
      FLEETBOT_MANIFEST_PATH: ${{ github.workspace }}/fleetbot-recovery-manifest.json
      FLEETBOT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      FLEETBOT_SOURCE_WORKFLOW: Fleetbot actuator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Retrieve the original signed recovery manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fleetbot-recovery-${{ inputs.source_run_id }}
          path: ${{ github.workspace }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Recover the original receipt without retrying the mutation
        env:
          FLEETBOT_WORKLOAD_PRIVATE_KEY_HEX: ${{ secrets.FLEETBOT_WORKLOAD_PRIVATE_KEY_HEX }}
        run: node scripts/fleetbot-workload.mjs recover-manifest
