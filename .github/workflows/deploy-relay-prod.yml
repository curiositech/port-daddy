name: Deploy relay PROD (release tag, gated, versions rollout)

# RELEASE CHANNELS (ADR-0119): this is the PROD channel for apps/relay
# (port-daddy-relay @ relay.portdaddy.dev — the top-level config in
# apps/relay/wrangler.deploy.toml). It runs ONLY on a v* release tag, never on
# merge; the per-merge staging channel is deploy-relay.yml (relay-latest).
#
# The chain, in order — each step refuses to proceed past a failure:
#   1. MIGRATION GATE: scripts/check-migrations-gate.mjs fails the release
#      unless every file in apps/relay/migrations/ is recorded in the staging
#      ledger (applied-staging.json, written by deploy-relay.yml after a
#      successful staging apply). A migration that never ran on staging
#      cannot reach prod.
#   2. Typecheck + tests at the tagged commit.
#   3. Apply pending migrations to the PROD D1 (wrangler tracks applied files
#      per-database — re-running is a no-op).
#   4. `wrangler versions upload` (build + upload, NO traffic shift), then
#      `wrangler versions deploy <id>@100%` to cut traffic over.
#
# GRADUAL ROLLOUT + ROLLBACK (documented in ADR-0119): for a risky release,
# after the upload step you can split traffic manually:
#     npx wrangler versions deploy <new-id>@10% <old-id>@90% -y --config apps/relay/wrangler.deploy.toml
# ONE-COMMAND ROLLBACK — every prior version stays uploaded; shifting traffic
# back takes seconds and needs no rebuild:
#     npx wrangler versions list --config apps/relay/wrangler.deploy.toml
#     npx wrangler versions deploy <previous-version-id>@100% -y --config apps/relay/wrangler.deploy.toml
# (Migrations are forward-only and rollback-compatible by rule — see
# apps/relay/migrations/README.md — so the rolled-back Worker runs fine
# against the migrated schema.)
#
# Required repository secrets (same as deploy-relay.yml, kept as-is):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    tags:
      # relay-v* (not v*): keeps relay releases disjoint from the daemon's
      # release ceremony, which owns plain v* tags/releases (docs/RELEASING.md).
      - 'relay-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never run from a fork; the secrets only exist on the canonical repo.
    if: github.repository == 'curiositech/port-daddy'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/relay/package-lock.json

      # The gate must itself be green before we trust its verdict.
      - name: Test the migration-gate script
        working-directory: .
        run: node --test scripts/check-migrations-gate.test.mjs

      # THE GATE (ADR-0119): staging-first, enforced. Runs before npm ci even —
      # nothing about this release proceeds with an unrehearsed migration.
      - name: Migration gate (staging ledger must cover every migration)
        working-directory: .
        run: node scripts/check-migrations-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run

      # Schema before code: the new Worker version may depend on the migrated
      # schema; the old (still-serving) version must tolerate it, per the
      # forward-only/rollback-compatible rule in migrations/README.md.
      - name: Apply D1 migrations to PROD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler d1 migrations apply port-daddy-relay
          --config wrangler.deploy.toml --remote

      - name: Upload Worker version (no traffic shift)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --config wrangler.deploy.toml \
            --tag "${GITHUB_REF_NAME}" \
            --message "release ${GITHUB_REF_NAME} (${GITHUB_SHA})" \
            | tee upload.out
          VERSION_ID=$(grep -oiE 'Version ID:\s*[0-9a-f-]{36}' upload.out | grep -oE '[0-9a-f-]{36}' | head -1)
          if [ -z "$VERSION_ID" ]; then
            echo "::error::could not parse the uploaded Worker version id from wrangler output"
            exit 1
          fi
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy version to 100% traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler versions deploy
          "${{ steps.upload.outputs.version_id }}@100%"
          -y --config wrangler.deploy.toml
