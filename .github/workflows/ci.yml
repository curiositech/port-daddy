name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose: the purser stacks test PRs onto
  # other PRs (test-pr -> reviewed-pr -> ... -> main), so most open PRs at any
  # given time have a non-main base. A `branches: [main]` filter meant only the
  # bottom of each stack ever got real `npm test`/`tsc` signal — every PR above
  # it merged through Fleetbot's presence check and nothing else. Run on every
  # pull_request event regardless of base so the whole stack gets tested against
  # its own head, and so the purser's adversarial tests are a REAL merge gate on
  # the PR they were written for rather than an advisory comment.
  pull_request:
  # Merge queue: GitHub builds a temporary branch (latest main + queued PRs)
  # and requires every required check to report on it before merging.
  merge_group:

# Cancel superseded runs: a new push to a PR aborts the older, now-pointless
# run instead of letting both finish. Frees runners and shrinks the merge-race
# window. main runs use a per-SHA group so post-merge runs never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brand-color-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Brand-color guard (retired Harbor Heritage hexes must not return)
        run: node scripts/check-brand-colors.mjs

  version-drift-guard:
    # ADR-0057 phase dist-version-authority: package.json is the sole version
    # authority and scripts/sync-version.ts stamps it across every distribution
    # surface (JSON manifests, the MCP/server TS constants, the website constant,
    # the VERSION file, and core/pd-console/Cargo.toml — the GPU app's
    # CARGO_PKG_VERSION). This guard FAILS the build when any source surface has
    # drifted, so a release can never ship a daemon that says 3.20.0 next to a
    # console that says 0.3.0. The deep (embedded-artifact) check runs in
    # release.yml where the bundles actually exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version drift guard (every surface must match package.json)
        run: node scripts/check-version-drift.mjs

  doc-citation-guard:
    # The machine-checkable half of the ship checklist's "citations are real" killer
    # item (AGENTS.md § Pull Request Operating Procedure). Verifies that backtick'd
    # repo paths + relative markdown links in the docs THIS PR changed resolve to real
    # files. Scoped to changed docs (not the whole legacy) so it gates what you touch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure origin/main ref for the changed-files diff
        # fetch-depth: 0 already fetched full history; this just guarantees the
        # refs/remotes/origin/main ref points at the true tip. No `|| true` — a real
        # fetch failure should be loud, not silently diff against a stale base.
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Doc-citation guard (cited repo paths in changed docs must exist)
        run: node scripts/check-doc-citations.mjs

  # NOTE: the PR-description / visual-artifact gate (pr-requirements-guard) lives in
  # its own workflow, .github/workflows/pr-requirements.yml, so it can also re-run on
  # `edited` events (a body gutted after the last code push must be re-checked) — the
  # full matrix here deliberately does not listen to `edited`.

  # Decide whether website-terminal-recordings (the heaviest job, ~7 min)
  # needs to run on this PR. It re-records terminal GIFs of the CLI, so only
  # changes to the website, the CLI/daemon surface it demos, the build
  # scripts, or this workflow can affect its output. Push-to-main always
  # records (publish path). Uses the PR files API instead of a git diff so no
  # checkout / fetch-depth gymnastics are needed.
  detect-changes:
    runs-on: ubuntu-latest
    # Job-level grant so the files-API read works even if the repo/org
    # default token permissions are restricted. This job needs nothing else
    # (no checkout), and job-level permissions reset unlisted scopes to none.
    permissions:
      pull-requests: read
    outputs:
      recordings: ${{ steps.filter.outputs.recordings }}
      fleetbar: ${{ steps.filter.outputs.fleetbar }}
      console: ${{ steps.filter.outputs.console }}
      pd-ios: ${{ steps.filter.outputs.pd-ios }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "recordings=true" >> "$GITHUB_OUTPUT"
            echo "fleetbar=true" >> "$GITHUB_OUTPUT"
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "pd-ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail safe: if the files API errors (outage, rate limit), run the
          # gated jobs rather than silently skipping a required gate.
          if ! changed="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"; then
            echo "recordings=true" >> "$GITHUB_OUTPUT"
            echo "fleetbar=true" >> "$GITHUB_OUTPUT"
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "pd-ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(website-v2/|bin/|cli/|lib/|scripts/|server\.ts$|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "recordings=true" >> "$GITHUB_OUTPUT"
          else
            echo "recordings=false" >> "$GITHUB_OUTPUT"
          fi
          # FleetBar (Swift menu bar app) only depends on its own sources and
          # its packaging script. ci.yml changes re-run it so the gate itself
          # can be edited under test.
          if printf '%s\n' "$changed" | grep -qE '^(apps/FleetBar/|scripts/package-fleetbar\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "fleetbar=true" >> "$GITHUB_OUTPUT"
          else
            echo "fleetbar=false" >> "$GITHUB_OUTPUT"
          fi
          # The GPUI window build (rust-console-gpui, macOS) only depends on the
          # pd-console crate; ci.yml changes re-run it so the gate can be edited
          # under test.
          if printf '%s\n' "$changed" | grep -qE '^(core/pd-console/|\.github/workflows/ci\.yml$)'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
          fi
          # pd-ios (the SwiftUI operator app) depends on its own sources AND on
          # everything it holds a hand-written port of: lib/maritime-signals.ts,
          # the control-command contract fixture, and the relay's interruptions
          # shape (publicShape() plus the operator_interruptions column types,
          # which live in the feature migration and the relay baseline). Editing
          # any of those without regenerating the iOS parity fixtures is exactly
          # the drift this gate catches, so they trigger it. In particular a
          # relay-only PR that retypes a column must run this job — the shape
          # mismatch it would otherwise introduce is invisible on the relay side.
          # ci.yml changes re-run it so the gate can be edited under test.
          if printf '%s\n' "$changed" | grep -qE '^(apps/pd-ios/|scripts/generate-pd-ios-fixtures\.ts$|lib/maritime(-signals)?\.ts$|skills/agent-control-command-contract/examples/sample-input\.json$|apps/relay/src/interruptions\.ts$|apps/relay/migrations/(2026-08-04-operator-interruptions|2026-08-08-relay-baseline)\.sql$|\.github/workflows/ci\.yml$)'; then
            echo "pd-ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "pd-ios=false" >> "$GITHUB_OUTPUT"
          fi

  # PR-blocking unit tests: only the node-22 legs (the required checks). The
  # node 20/24 compatibility matrix moved to `unit-tests-compat` which runs
  # post-merge on main — every PR previously paid for 4 extra full ~10-min
  # test runs (ubuntu+macos × node 20/24) that no required check gates on.
  #
  # The macOS leg lives in its own job (unit-tests-macos) so that the heavy
  # downstream jobs (`needs: unit-tests`) start as soon as the ubuntu leg is
  # green instead of also waiting out the macOS runner queue. Both legs are
  # still required checks — branch protection requires the contexts
  # "unit-tests (ubuntu-latest, 22)" and "unit-tests (macos-latest, 22)", so
  # this job stays a 1-cell matrix and unit-tests-macos pins its display
  # `name:` to the macOS context. Do NOT rename either without updating
  # branch protection.
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        # `purser` is selected explicitly alongside `unit`: --selectProjects is an
        # allowlist, so a new jest project is invisible here until it is named.
        # That is how tests/purser/ stayed inert — see tests/unit/purser-routing.test.js.
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --selectProjects unit purser

      - name: Run purser adversarial tests (node:test set)
        # Routed per-file by tests/purser/ROUTING.json; the jest-shaped ones ran
        # in the step above, these target node:test.
        run: npm run test:purser

      - name: Daemon backend transcript E2E (hermetic CLI fallback)
        # BIG BROKEN E2E for the launchd-path/stale-Claude-override regression.
        # The broad integration-tests job below is advisory; this required
        # unit-tests job is not. The smoke script defaults to hermetic fakes:
        # launchd-restricted PATH, stale PD_CLI_CLAUDE_CODE_BIN, fake `claude`
        # discovered through PD_CLI_BIN_DIRS, fake OpenAI-compatible server,
        # /spawn, and full /transcripts/:id readback. Live paid/provider rows
        # remain opt-in behind PD_RUN_LIVE_BACKEND_TRANSCRIPT_SMOKE=1.
        run: node scripts/smoke-daemon-backend-transcripts.mjs
        timeout-minutes: 5

      - name: Test CLI tools
        run: |
          node bin/port-daddy-cli.js --help
          node bin/port-daddy-cli.js version || true

      - name: Test CLI subcommands
        run: |
          node bin/port-daddy-cli.js status || true
          node bin/port-daddy-cli.js doctor || true
          node bin/port-daddy-cli.js --version

  # macOS node-22 leg. Same steps as unit-tests, but a separate job so macOS
  # runner queue latency stays off the critical path of integration-tests and
  # compiled-daemon-smoke. The display name is pinned to match the required
  # status-check context "unit-tests (macos-latest, 22)" exactly — see the
  # comment on unit-tests above.
  unit-tests-macos:
    name: unit-tests (macos-latest, 22)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        # Two consecutive required macOS jobs exhausted V8's ~2 GiB default
        # heap after nearly five minutes of otherwise-passing tests. Keep the
        # larger budget scoped to Jest so setup-node and every other step retain
        # their normal process limits.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --selectProjects unit

      - name: Test CLI tools
        run: |
          node bin/port-daddy-cli.js --help
          node bin/port-daddy-cli.js version || true

      - name: Test CLI subcommands
        run: |
          node bin/port-daddy-cli.js status || true
          node bin/port-daddy-cli.js doctor || true
          node bin/port-daddy-cli.js --version

  # Node 20/24 compatibility: full coverage, but only post-merge on main so it
  # never blocks (or slows) a PR. If a Node-version regression lands, it shows
  # red on main immediately and is caught before release.
  unit-tests-compat:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 24]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --selectProjects unit

  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --selectProjects integration
        timeout-minutes: 10

  compiled-daemon-smoke:
    # Builds the `bun build --compile` daemon (bun:sqlite), boots it on a
    # scratch port + DB, and asserts hot read routes return HTTP 200.
    # This is the gate that would have caught the GET /roadmap/items 500
    # SQLITE_MISMATCH: jest runs on better-sqlite3 and never executes the
    # compiled bun:sqlite binary against real routes. See
    # scripts/smoke-compiled-daemon.sh and tests/bun/.
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: bun:sqlite regression tests (roadmap + usage-telemetry)
        run: npm run test:bun

      - name: Build compiled daemon binary
        run: npm run build:daemon:dist

      # The Bosun watchdog is now REQUIRED: `pd doctor` reports a missing supervisor
      # as CRITICAL, so the doctor gate below must validate the FULL artifact — daemon
      # + watchdog — not the daemon alone. Build it before the smoke/gate so the booted
      # daemon resolves core/target/release/pd-bosun (a resolveBosunBinaryPath candidate).
      - name: Install Rust toolchain (for pd-bosun watchdog)
        uses: dtolnay/rust-toolchain@stable

      - name: Build pd-bosun (required daemon watchdog)
        run: npm run build:bosun

      - name: Boot compiled daemon and smoke hot routes
        run: bash scripts/smoke-compiled-daemon.sh
        timeout-minutes: 3

      - name: Build compiled CLI binary
        run: npm run build:bin

      - name: Doctor health gate (boot daemon, fail build on CRITICAL only)
        # Boots the COMPILED daemon on a scratch port/prefix and runs the
        # COMPILED `pd doctor --json` / `--ci` against it. Asserts /health
        # carries the shared `severity` field and that doctor reports zero
        # CRITICAL checks. WARN-level findings (no systemd unit for a
        # manually-booted daemon, etc.) are loud but never gate — the
        # three-tier contract. This is the machine-readable health gate that
        # folds the daemon's whole route/runtime contract into one verdict.
        run: bash scripts/ci-doctor-gate.sh
        timeout-minutes: 3

      - name: Smoke compiled CLI `pd secret set` stdin path
        # Drives the compiled-bun CLI's stdin read end-to-end: a piped value must
        # reach the daemon, and empty stdin must error loudly (never a silent
        # no-op). Guards the bun-compiled isTTY/setRawMode prompt regression.
        run: bash scripts/smoke-compiled-cli-secret.sh
        timeout-minutes: 3

      - name: Smoke compiled CLI `pd tube --send` stdin path
        # Same bun-compiled isTTY class: a piped body must post to the channel,
        # and an interactive (PTY) `--send` with no pipe must error FAST rather
        # than hanging forever on stdin EOF. Guards the tube-hang regression.
        run: bash scripts/smoke-compiled-cli-tube.sh
        timeout-minutes: 3

      - name: Smoke compiled CLI actually RUNS (bare status + tube + hostile .env.local cwd)
        # THE gate that was missing: the prior compiled smokes set PORT_DADDY_URL
        # and the single-binary smoke only ran `__daemon`, so a compiled CLI that
        # couldn't bootstrap or whose CLI path was dead shipped GREEN. This boots
        # the daemon from the compiled binary, then drives the BARE CLI the way an
        # operator does (discovery, no URL override): `pd status` 3x must run and
        # report a running daemon, `pd tube --send` must post, and a 2-listener
        # fan-out must deliver to both. Fails the build if the compiled CLI is dead.
        #
        # NOW ALSO: the cwd-`.env.local` gate. The Homebrew `pd` is a
        # `bun build --compile` binary; bun auto-loads `.env.local` from the cwd
        # before our code runs, and a `KEY="${KEY:-$(...)}"` value segfaults bun
        # (exit 133) during that autoload — so `pd` was TOTALLY MUTE from a repo
        # containing such a file, yet shipped GREEN because every prior smoke ran
        # from a CLEAN cwd. This step now runs the binary from a SAFE-`.env.local`
        # cwd (must speak — hard gate) and a HOSTILE-`.env.local` cwd (must either
        # speak, if bun is fixed, OR `pd doctor` must ship the named diagnostic so
        # the muteness is loud, never silent). NODE_ENV is dropped for these runs
        # because `NODE_ENV=test` makes bun skip `.env.local` autoload and would
        # hide the crash. See scripts/smoke-compiled-cli-runs.sh step 4.
        run: bash scripts/smoke-compiled-cli-runs.sh
        timeout-minutes: 3

      - name: E2E compiled CLI surface — EVERY verb through the compiled binary
        # The gigantic breaking E2E. smoke-compiled-cli-runs.sh proves the
        # binary bootstraps; THIS drives every top-level verb in the
        # bin/port-daddy-cli.ts dispatch through the COMPILED binary against a
        # single scratch daemon (discovery env, never :9876, never the real
        # ~/.port-daddy). Read verbs must run + print; mutating verbs round-trip
        # (claim→release, lock→unlock, begin→done, note, pub, tube, tuple, dns)
        # and clean up; dangerous/lifecycle verbs (install, start, spawn, watch,
        # mcp, dashboard, …) are run in a non-mutating subform or explicitly
        # SKIPped with a printed reason. A new dispatch verb that is neither
        # tested nor skipped FAILS the build (verb-surface reconciliation), so
        # the gate cannot silently rot. Guards against the failure that shipped
        # green: the compiled binary silently dying (exit 1, empty output).
        run: bash scripts/e2e-compiled-cli-surface.sh
        timeout-minutes: 6

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Check package.json validity
        run: npm pkg get name version description

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high || true

      - name: Validate skill metadata
        run: |
          test -f skills/port-daddy-agent-skill/SKILL.md && echo "SKILL.md exists" || exit 1
          test -f .claude-plugin/plugin.json && echo "plugin.json exists" || exit 1
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))" && echo "plugin.json is valid JSON" || exit 1

  fleet-ui:
    # Builds + type-checks + tests the Control Center (fleet-config-ui). This is
    # the gate that keeps the NeedsYou force-zoom invariant (legibility F3) from
    # rotting: a P0/irreversible attention item must not be dismissable until the
    # operator has expanded it. The fleet-config-ui has its own tsconfig graph and
    # vitest suite — root jest never compiles or runs it, so without this job a
    # regression in the gate (or any TS break in the UI) would ship green.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-config-ui
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fleet-config-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc -b — app + node + test projects)
        run: npm run typecheck

      - name: Component tests (vitest — force-zoom gate)
        run: npm test

      - name: Production build (vite)
        run: npm run build

  skill-hygiene:
    # Audit every skill bundle for drift on every PR. Fails the build if any
    # bundle has orphaned docs, broken links, INDEX drift, or a missing INDEX
    # hub. Uploads the snapshot JSON as a build artifact for inspection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auditor unit tests
        run: python3 -m unittest discover -s skills/skill-hygiene/tests -p 'test_*.py' -v

      - name: Verify agent-surface skill mirrors are in sync
        # Mirrors under .codex/.claude/.agents/.gemini must stay byte-identical
        # to their canonical skills/<name>. If this fails, run:
        #   npm run sync:skill-mirrors
        run: node scripts/sync-skill-mirrors.mjs --check

      - name: Audit every skill bundle
        run: |
          python3 skills/skill-hygiene/scripts/audit_skill_library.py \
            --root skills \
            --snapshot /tmp/skill-audit.json \
            --no-persist \
            --deterministic

      - name: Upload audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-audit-snapshot
          path: /tmp/skill-audit.json
          if-no-files-found: warn

  website-terminal-recordings:
    # Path-gated via detect-changes: skipped on PRs that can't affect the
    # GIFs. "skipped" satisfies the required status check (branch protection
    # treats job-level `if:` skips as passing), so this stays a required
    # check without running on every PR.
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.recordings == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install recorder tools
        # agg is a Rust binary; `cargo install --git` recompiled it from source
        # on every run (several minutes). Pull the pinned prebuilt linux release
        # instead — seconds, not minutes. Bump AGG_VERSION to upgrade.
        env:
          AGG_VERSION: v1.9.0
        run: |
          python3 -m pip install --user asciinema
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/agg" \
            "https://github.com/asciinema/agg/releases/download/${AGG_VERSION}/agg-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/agg"
          "$HOME/.local/bin/agg" --version

      - name: Build daemon binary
        run: npm run build:daemon:dist

      - name: Start daemon and recording session
        run: |
          node bin/port-daddy-cli.js start
          # CI runs on the main worktree by design (no linked worktrees in
          # actions/checkout). Pass --allow-main-worktree so the worktree
          # policy added in 47840169 doesn't refuse the integration session.
          # Rent-at-claim (S3): CI recording sessions are maintenance work,
          # not roadmap items — opt out with an explicit sidequest reason.
          node bin/port-daddy-cli.js begin --identity ci:website:gifs --purpose "Regenerate website terminal GIFs" --lifecycle durable --allow-main-worktree --sidequest "CI website GIF regeneration"

      - name: Regenerate website terminal GIFs
        working-directory: website-v2
        run: npm run record:gifs

      - name: Cheap recording reviewer
        working-directory: website-v2
        run: npm run test:gifs

      - name: Stop daemon
        if: always()
        run: node bin/port-daddy-cli.js stop || true

  rust-console:
    # Verify the pd-console Rust crate (core/pd-console) compiles and all unit
    # tests pass. Additions-only right now; no binary artefact is published.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/pd-console

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/pd-console

      - name: cargo check
        run: cargo check

      - name: cargo test
        run: cargo test

  rust-console-gpui:
    # Build the GPU-native window (the deliverable). gpui is Metal/macOS-centric
    # and won't compile on the ubuntu rust-console job, so the window lives behind
    # the `gpui` feature and is built here on macOS. Path-gated to console changes
    # via detect-changes; a skip satisfies the (non-required) gate. Operator call
    # (#318): the native window is the point, so it gets a real CI build despite
    # the macOS cost.
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true'
    defaults:
      run:
        working-directory: core/pd-console
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/pd-console

      - name: cargo build --features gpui (GPU-native window)
        run: cargo build --features gpui --bin pd-console

  rust-kernel:
    # Verify the core/kernel workspace (pd-anchor — the CANONICAL macaroon discharge
    # gate per ADR-0054 — plus pd-core/pd-eventlog/pd-mesh/pd-runtime/pd-compat/pd-tui)
    # compiles and all unit tests pass, INCLUDING tests/parity_vectors.rs. That parity
    # test is the Rust half of the ADR-0054 I11 cross-runtime gate: it asserts the
    # canonical Rust impl reproduces tests/fixtures/macaroon-parity-vectors.json, the
    # same fixture the TS suite asserts. Before this job the workspace was never built
    # in CI, so the parity gate could only ever fail locally — the gate was theater.
    # Always-run (not path-gated) so a parity divergence can never be silently skipped.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/kernel

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/kernel

      # fmt/clippy widening (grand-plan node fmt-clippy-widening — ADR-0120's
      # "mechanical cleanup PR"): pd-anchor is the canonical macaroon discharge
      # gate, so it gets the same strict-lint treatment rust-harbor-card
      # pioneered. Scoped to -p pd-anchor on purpose; the sibling kernel crates
      # join as their sweeps land.
      - name: cargo fmt --check (pd-anchor)
        run: cargo fmt -p pd-anchor -- --check

      - name: cargo clippy (pd-anchor)
        run: cargo clippy -p pd-anchor --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (incl. macaroon parity vectors)
        run: cargo test --workspace

  rust-broker:
    # core/pd-broker is the ADR-0087 trusted-computing-base slice: the
    # separate-process credential broker that holds the raw secret and mints
    # scoped tickets. It is a member of the core/ workspace, but rust-console
    # scopes to core/pd-console and rust-kernel to core/kernel — so its three
    # test files (broker_behavior, dos_isolation, socket_framing) had NEVER
    # executed in CI (found during the ADR-0120 audit). Always-run, matching
    # the rust-kernel/rust-harbor-card philosophy: a TCB test that only runs
    # locally is theater.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # fmt/clippy widening (grand-plan node fmt-clippy-widening — ADR-0120's
      # "mechanical cleanup PR"): a TCB slice that mints credentials should not
      # carry clippy debt. Scoped to -p pd-broker; pd-console's burn-down is a
      # deliberate follow-up (~40k LOC of GPU code, and an agent is active in
      # that crate).
      - name: cargo fmt --check (pd-broker)
        run: cargo fmt -p pd-broker -- --check

      - name: cargo clippy (pd-broker)
        run: cargo clippy -p pd-broker --all-targets -- -D warnings

      - name: cargo test pd-broker (TCB behavior + DoS isolation + framing)
        run: cargo test -p pd-broker

  rust-harbor-card:
    # core/harbor-card-rs is a standalone FFI cdylib (excluded from the core/
    # workspace — see core/Cargo.toml's `exclude` comment) that lib/arbiter.ts
    # loads at runtime via koffi and scripts/build-core.sh compiles for every
    # release. Nothing built or tested it in CI before this job — it shipped
    # to production with zero test coverage and would have failed clippy the
    # first time anyone turned strict linting on. Always-run (not path-gated),
    # matching rust-kernel's philosophy for a security-relevant Rust crate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/harbor-card-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/harbor-card-rs

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (incl. FFI boundary, property tests, hv:2 parity fixture)
        run: cargo test

  relay-tests:
    # apps/relay is a Cloudflare Worker with its own tsconfig graph and vitest
    # suite; root jest never compiles or runs it. Until now the ONLY workflow
    # that executed `npx vitest run` for the relay was deploy-relay.yml, which
    # fires on push to main and is path-gated to apps/relay/** — so a PR could
    # go green with a broken relay, and a change to a shared fixture OUTSIDE
    # apps/relay (tests/fixtures/**) would never run the relay's assertions at
    # all.
    #
    # That matters for ADR-0120 rule 1: the relay cannot dlopen the Rust kernel,
    # so apps/relay/src/auth.ts is a byte-parity twin of core/harbor-card-rs
    # locked by tests/fixtures/harbor-card-hv2-parity-vectors.json. A fixture
    # asserted by only one of its two suites is not a gate. Always-run (not
    # path-gated) for the same reason rust-harbor-card is: a security twin whose
    # tests only run on the deploy path is theater.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: vitest (incl. hv:2 harbor-card parity fixture ⇄ core/harbor-card-rs)
        run: npx vitest run

  steward-tests:
    # apps/steward is the Steward's seat (ADR-0109; docs/plans/THE_FULL_WHEEL.md
    # P1) — a Cloudflare Worker with its own tsconfig graph and vitest suite
    # that root jest never compiles or runs. Always-run rather than path-gated
    # for the same reason relay-tests is: the suite is seconds long, and the
    # merge-authority scaffold going red only on its own deploy path would be
    # theater. Wired into ci-gate's needs like every other enforced job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/steward

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/steward/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: vitest (seat identity, wake inbox, deck-log discipline, ledgers)
        run: npx vitest run

  fleetbar:
    # Build + unit-test the FleetBar Swift menu bar app. Its tests never ran in
    # CI before, so FleetPopoverTests rotted red on main unnoticed (the
    # `backend` native surface from #218 was never added to its expected list).
    # Now a required gate. swift is preinstalled on the macOS runner (release.yml
    # already packages FleetBar there). Path-gated via detect-changes: a non-
    # FleetBar PR skips this, and a skip satisfies the required check.
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.fleetbar == 'true'
    defaults:
      run:
        working-directory: apps/FleetBar
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apps/FleetBar/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/FleetBar/Package.resolved', 'apps/FleetBar/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build FleetBar
        run: swift build

      - name: Test FleetBar
        run: swift test

  pd-ios:
    # Build + unit-test the Port Daddy iOS operator app (ADR-0125).
    #
    # This is the FIRST xcodebuild in this repo. Every other Apple surface here
    # is SwiftPM plus hand-assembled bundles, and `swift build` cannot target
    # iOS at all — so the compile proof for apps/pd-ios is xcodebuild against
    # an iOS Simulator destination, run on the same macos-latest runner and
    # with the same "whatever Xcode the image ships" convention the fleetbar
    # job uses. There is no .xcodeproj: xcodebuild builds the SwiftPM package's
    # generated PortDaddyKit scheme directly.
    #
    # SIGNING: none, deliberately. A simulator build is unsigned, and
    # CODE_SIGNING_ALLOWED=NO is passed so this can never start depending on a
    # certificate. The five APPLE_* secrets in release.yml are a macOS
    # Developer ID / notarization pair — they do not cover iOS device signing,
    # provisioning profiles, or App Store Connect distribution. A TestFlight
    # lane needs an Apple Distribution certificate and a provisioning profile
    # that DO NOT EXIST in this account yet; until they do, this gate proves
    # the app compiles and its tests pass, and nothing here ships an artifact.
    #
    # Path-gated via detect-changes: a non-iOS PR skips this, and a skip
    # satisfies the required ci-gate check.
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.pd-ios == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Fixture drift gate (TypeScript -> Swift)
        # MaritimeSignals.swift, ControlVerbs.swift and Interruptions.swift are
        # hand-written ports of lib/maritime-signals.ts, the
        # agent-control-command-contract fixture, and the relay's interruptions
        # shape. This regenerates the parity fixtures from those canonical
        # sources and fails if the checked-in copies are stale. The Swift tests
        # then assert the ports reproduce the fixtures. Together: neither side
        # can move without the other going red. No `bun install` is needed —
        # the script imports two dependency-free local modules and READS the
        # relay's source and migration as text (importing interruptions.ts
        # would pull @noble/hashes in through crypto.ts).
        run: bun run scripts/generate-pd-ios-fixtures.ts --check

      - name: Show available schemes
        # A diagnostic that makes a scheme-resolution failure legible instead of
        # a wall of xcodebuild output. Never the reason a PR goes red — the
        # build and test steps below are the gate.
        continue-on-error: true
        working-directory: apps/pd-ios
        run: xcodebuild -list

      - name: Resolve an iOS Simulator destination
        # Pinning a device name breaks the moment the runner image rotates its
        # simulators. The helper picks the newest available iPhone and fails
        # loudly when the image has none, rather than letting xcodebuild build
        # for something that is not an iPhone.
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json \
            | python3 apps/pd-ios/scripts/resolve-simulator-destination.py)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build PortDaddyKit for the simulator
        working-directory: apps/pd-ios
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme PortDaddyKit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test PortDaddyKit
        working-directory: apps/pd-ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PortDaddyKit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------------------
  # ci-gate: the single required check for branch protection / the merge queue.
  #
  # Every other job above is path-filtered or matrix-conditional, so on any
  # given PR some of them legitimately *skip*. A skipped job never reports the
  # "success" that a required-status-check rule waits for, so requiring those
  # jobs individually deadlocks the merge queue (it waits forever for a check
  # that will never arrive). This job depends on all of them, always runs, and
  # passes when each dependency either succeeded or was skipped — failing only
  # on a real failure or cancellation. Point branch protection at THIS check
  # alone and the queue converges without dropping any actual enforcement.
  ci-gate:
    name: ci-gate
    if: always()
    runs-on: ubuntu-latest
    # The verdict script asks the PR API whether this run's commit is still the
    # head. Without this, a repo/org on restricted default GITHUB_TOKEN
    # permissions 403s, resolveStale fails closed, and the superseded-run false
    # failure this job exists to stop comes straight back — silently, since a
    # fail-closed gate looks exactly like the old behaviour. `detect-changes`
    # declares the same grant for the same reason.
    permissions:
      pull-requests: read
    needs:
      - brand-color-guard
      - compiled-daemon-smoke
      - doc-citation-guard
      - fleet-ui
      - fleetbar
      - integration-tests
      - lint
      - pd-ios
      - rust-console
      - rust-console-gpui
      - rust-kernel
      - skill-hygiene
      - steward-tests
      - unit-tests
      - version-drift-guard
      - website-terminal-recordings
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate decides merges, so its own decision logic is tested before it
      # is trusted — including the cases where a cancellation must stay red.
      - name: Test the gate's decision logic
        run: node --test scripts/ci-gate-verdict.test.mjs

      - name: Verify no required job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-gate-verdict.mjs
