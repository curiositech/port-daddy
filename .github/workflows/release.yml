name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build binaries for (e.g. v3.14.0)'
        required: true

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pd-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pd-linux-x64
          # darwin-x64 (Intel Mac) was dropped 2026-05-22. macos-13 runners in
          # the GHA pool routinely queue for 24+ hours (wedged v3.14.1 +
          # v3.15.0). The brew formula already ships only darwin-arm64 +
          # linux-x64, so the artifact was dead weight. Intel Mac users can
          # install from npm or build from source until we add it back via
          # a different runner pool.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      # Bun's compile path resolves bare imports against node_modules. Without
      # this step, specifiers like 'yaml', 'msgpackr', '@clack/prompts' fail
      # with "Could not resolve" and the binary build aborts. The repo doesn't
      # ship a bun.lockb (npm is canonical), so Bun resolves against package.json.
      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          node scripts/build-single-binary.mjs --target=${{ matrix.target }} --outfile=dist/pd

      - name: Build dedicated daemon binary
        run: npm run build:daemon:dist

      # Bosun is now a REQUIRED watchdog: the compiled-daemon smoke runs `pd doctor`,
      # which criticals a missing supervisor. Build it BEFORE the smoke so the booted
      # daemon resolves core/target/release/pd-bosun. (The step below also stages it
      # flat into dist/ for the release tarball.)
      - name: Install Rust toolchain (for pd-bosun watchdog)
        uses: dtolnay/rust-toolchain@stable

      - name: Build pd-bosun before the smoke (required watchdog)
        run: npm run build:bosun

      - name: Smoke dedicated daemon binary
        run: bash scripts/smoke-compiled-daemon.sh

      # Bosun is the daemon's out-of-process supervisor (ADR-0036). It MUST ship
      # in the same artifact as the daemon so `port-daddy install` can co-load a
      # KeepAlive launchd/systemd job that restarts a dead daemon (2026-07-14
      # halt-mandate). Before this step the release tar carried only pd +
      # port-daddy, so a brew install had NO bosun binary — install-daemon.ts's
      # BOSUN_BINARY_PATH resolved to a missing binary and the supervisor was
      # silently skipped. The binary is tiny (~200kB, zero-dep Rust).
      - name: Install Rust toolchain (for pd-bosun)
        uses: dtolnay/rust-toolchain@stable

      - name: Build + stage pd-bosun (daemon supervisor)
        run: |
          set -euo pipefail
          cargo build --manifest-path core/pd-bosun/Cargo.toml --release -j 1
          # `core/` is a Cargo WORKSPACE → the member build lands in the shared
          # workspace target dir core/target/release, NOT core/pd-bosun/target.
          # Stage FLAT as dist/pd-bosun (next to pd/port-daddy) — a collision-free
          # install path that does NOT shadow the source-tree `core/pd-bosun/`
          # DIRECTORY. install-daemon.ts resolves `<root>/pd-bosun` first.
          cp core/target/release/pd-bosun dist/pd-bosun
          chmod +x dist/pd-bosun
          # NOTE: the old per-binary `test -s dist/pd-bosun` fail-loud check moved
          # into the declarative `pd batten verify` gate below (release-artifacts.json
          # declares pd-bosun required+executable). A daemon that ships without its
          # watchdog is the silent-death regression #3496 closed — batten now guards
          # it alongside every other required artifact instead of a one-off assert.
          ./dist/pd-bosun status || true  # smoke: the binary at least runs

      # Sign the macOS daemon + launcher with the Curiositech LLC (P5H9P59X2M)
      # Developer ID, reusing scripts/sign-and-notarize.mjs — the same proven path
      # FleetBar uses (ADR-0057 phase dist-ci-signing-secrets; closes ADR-0028's
      # "daemon ships unsigned" gap). Locally verified 2026-06-17: the shipped
      # adhoc-signed `pd` re-signs to a valid hardened-runtime Developer ID binary.
      #
      # Required repo secrets (set once by the operator; until then this step
      # no-ops and the binary ships adhoc as before — the build never breaks):
      #   APPLE_CERT_P12_BASE64   base64 of the Developer ID Application .p12
      #   APPLE_CERT_PASSWORD     the .p12 export password
      # Optional — when present, the binary is also NOTARIZED + stapled; absent,
      # it is signed only (still a Gatekeeper improvement over adhoc):
      #   APPLE_NOTARY_KEY_P8_BASE64  base64 of the App Store Connect API .p8 key
      #   APPLE_NOTARY_KEY_ID         the API key id
      #   APPLE_NOTARY_KEY_ISSUER     the API key issuer uuid
      - name: Sign macOS binary (Developer ID)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "::warning::APPLE_CERT_P12_BASE64 not set — shipping adhoc-signed (unsigned) daemon. Add the Developer ID secrets to sign."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/pd-signing.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          export PORT_DADDY_SIGN_IDENTITY="Developer ID Application: Curiositech LLC (P5H9P59X2M)"
          # Notarize only if the notary credentials are present AND actually
          # authenticate. A bad/expired/rotated App Store Connect key must NOT
          # break a release — it degrades to a signed-but-not-notarized binary
          # (still a Gatekeeper improvement over adhoc). store-credentials does a
          # live validation call, so it's the right gate. (Verified 2026-06-20 via
          # the _sign-smoke workflow: signing is independent of notary auth.)
          export PORT_DADDY_SKIP_NOTARIZE=1
          if [ -n "${APPLE_NOTARY_KEY_P8_BASE64:-}" ]; then
            echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            if xcrun notarytool store-credentials pd-notary \
                 --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
                 --issuer "$APPLE_NOTARY_KEY_ISSUER" --keychain "$KEYCHAIN"; then
              unset PORT_DADDY_SKIP_NOTARIZE
              export PORT_DADDY_NOTARY_PROFILE=pd-notary
              # read the profile from the temp keychain, not the default login one
              export PORT_DADDY_NOTARY_KEYCHAIN="$KEYCHAIN"
            else
              echo "::warning::notary credentials failed validation — signing only, not notarizing. Check APPLE_NOTARY_KEY_ID / _ISSUER / _P8_BASE64."
            fi
          else
            echo "::warning::notary secrets absent — signing only, not notarizing."
          fi
          node scripts/sign-and-notarize.mjs dist/port-daddy
          node scripts/sign-and-notarize.mjs dist/pd
          codesign --verify --strict --verbose=2 dist/port-daddy
          codesign --verify --strict --verbose=2 dist/pd
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" || true
          security delete-keychain "$KEYCHAIN" || true

      # Soak the EXACT binary that ships (post-signing on macOS). v3.24.0
      # segfaulted ~68s after boot (Bun null-deref on a ~60s timer) and
      # nothing in CI had ever run the packaged binary — unit tests run from
      # source, which is a different runtime shape than the compiled bundle.
      # 180s is comfortably past that signature and lets every first-firing
      # ~60s timer (pheromone evaporator, bosun heartbeat) run at least twice.
      # A crash, a health wedge, or a dirty SIGTERM here FAILS THE RELEASE.
      - name: Soak the packaged binary (crash/wedge gate)
        env:
          SOAK_SECONDS: 180
          SOAK_PORT: 19876
        run: bash scripts/soak-binary.sh dist/port-daddy

      - name: Stage squid tentacles (pd-hook-* + statusline)
        # Same failure class as the pd-bosun omission above: lib/squid/adapter.ts's
        # tentaclePath() resolves pd-hook-{prompt,pre-tool,post-tool} at execDir/<name>
        # (flat, next to `pd`) OR execDir/bin/<name> (a bin/ subdirectory). Nothing
        # ever staged the tentacles, so every packaged release shipped with them
        # simply absent — `pd squid on`/`pd hooks install` fail with "missing
        # tentacle binary" on every brew/tarball install, silently.
        #
        # Stage BOTH layouts the adapter accepts: flat next to `pd` (the preferred
        # candidate) AND under bin/ (the fallback, which also carries pd-statusline).
        # The old per-file `test -s` asserts are gone — release-artifacts.json now
        # declares each tentacle required+executable and `pd batten verify` below is
        # the single fail-loud gate for the whole cargo.
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for f in pd-hook-prompt pd-hook-pre-tool pd-hook-post-tool pd-statusline; do
            cp "bin/$f" "dist/bin/$f"
            chmod +x "dist/bin/$f"
          done
          for f in pd-hook-prompt pd-hook-pre-tool pd-hook-post-tool; do
            cp "bin/$f" "dist/$f"
            chmod +x "dist/$f"
          done

      # THE generalized gate. Every required artifact (pd, port-daddy, its
      # manifest, pd-bosun, the squid tentacles, pd-statusline) is declared in
      # release-artifacts.json; `pd batten verify` asserts each is present,
      # executable where required, and >= minBytes — collecting ALL failures and
      # exiting nonzero with a per-artifact report. This REPLACES the scattered
      # per-binary `test -s dist/<name>` asserts that each drifted silently and
      # let releases ship with a missing watchdog / missing hooks GREEN. Running
      # the just-built ./dist/pd also dogfoods that the shipped binary can run
      # the gate offline. release-artifacts.json is resolved from the repo-root
      # cwd, so no --manifest is needed.
      - name: Batten — verify staged release artifacts (fail-loud gate)
        run: ./dist/pd batten verify --staged-dir dist

      - name: Package binary
        # Ship pd-bosun (core/pd-bosun) inside the same tar as the daemon so a
        # brew/tarball install lands the supervisor at <root>/core/pd-bosun,
        # exactly where install-daemon.ts's BOSUN_BINARY_PATH looks (it prefers
        # dist/core/pd-bosun, then core/pd-bosun/... — the extracted `core/`
        # dir satisfies the daemon-relative fallback). Without this the tarball
        # had no watchdog and the KeepAlive supervisor job was silently skipped.
        #
        # native/ (onnxruntime-node runtime libs, #3561) and the squid tentacles
        # in BOTH layouts (flat + bin/, staged in the "Stage squid tentacles"
        # step above) are packed here too. `pd batten verify` (above) already
        # proved every required member is present before we seal the tar.
        run: cd dist && tar -czf ${{ matrix.artifact }}.tar.gz pd port-daddy port-daddy-manifest.json pd-bosun native pd-hook-prompt pd-hook-pre-tool pd-hook-post-tool bin

      # Content-address the sealed cargo: sha256 every staged artifact into
      # release-imprint.json and ship it as a release asset. This is the
      # verifiable record of exactly which bytes went into the tarball — a
      # downstream check (or `pd upgrade`) can confirm an install matches the
      # imprint. Runs after Package so it hashes the same files that were tarred.
      # Per-matrix filename (darwin/linux both run this job → same-named asset
      # would clobber on the shared Release). Name it after the tarball it seals.
      - name: Batten — imprint sealed release artifacts (sha256 record)
        run: ./dist/pd batten imprint --staged-dir dist --out dist/${{ matrix.artifact }}-imprint.json

      - name: Upload release imprint to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/${{ matrix.artifact }}-imprint.json

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/${{ matrix.artifact }}.tar.gz

  build-fleetbar-preview:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # package-fleetbar.sh bundles the CLI payload via scripts/build-single-binary.mjs,
      # which shells out to bun. Keep this job aligned with build-binaries so
      # recovery reruns do not fail after the Swift build succeeds.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install

      - name: Package + sign + notarize FleetBar.app
        # Same Developer ID path the daemon (#447) and pd-console use — same APPLE_*
        # secrets. No-ops to ad-hoc if the cert secret is absent so the build never
        # breaks; the guard below makes ad-hoc a hard failure on a real signed run.
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
        run: |
          set -euo pipefail
          export PORT_DADDY_SKIP_NOTARIZE=1
          if [ -n "${APPLE_CERT_P12_BASE64:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/pd-signing.keychain-db"
            KCPASS="$(openssl rand -hex 24)"
            security create-keychain -p "$KCPASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
            echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            export PORT_DADDY_SIGN_IDENTITY="Developer ID Application: Curiositech LLC (P5H9P59X2M)"
            export PORT_DADDY_NOTARY_KEYCHAIN="$KEYCHAIN"
            if [ -n "${APPLE_NOTARY_KEY_P8_BASE64:-}" ]; then
              echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
              if xcrun notarytool store-credentials pd-notary \
                   --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
                   --issuer "$APPLE_NOTARY_KEY_ISSUER" --keychain "$KEYCHAIN"; then
                unset PORT_DADDY_SKIP_NOTARIZE
                export PORT_DADDY_NOTARY_PROFILE=pd-notary
              else
                echo "::warning::notary creds failed validation — signing FleetBar.app only."
              fi
            fi
          else
            echo "::warning::APPLE_CERT_P12_BASE64 unset — FleetBar.app ships unsigned."
          fi
          scripts/package-fleetbar.sh dist/fleetbar
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" 2>/dev/null || true
          if [ -n "${APPLE_CERT_P12_BASE64:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

      - name: Signature guard — reject ad-hoc when signing was configured
        # The "ensure it's signed from now on" lever: if the Developer ID cert
        # secret is present, the produced .app MUST carry a Developer ID signature.
        # Without this, a future regression silently reverts to an unsigned,
        # Gatekeeper-quarantined .app (the v3.21.0 state this PR fixes).
        #
        # GATE IN BASH, NOT IN `if:`. A step-level `if: ${{ secrets.X != '' }}`
        # is rejected by GitHub's workflow parser ("Unrecognized named-value:
        # 'secrets'") — this exact line made the whole workflow invalid and
        # silently killed the v3.25.0 release trigger (an invalid workflow
        # produces NO run on release.published). Same env-gated pattern as
        # the packaging step above.
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "APPLE_CERT_P12_BASE64 unset — signature guard skipped (unsigned build path)."
            exit 0
          fi
          zip="$(ls dist/fleetbar/PortDaddy-FleetBar-macOS-*.zip | head -n1)"
          work="$RUNNER_TEMP/fleetbar-verify"; rm -rf "$work"; mkdir -p "$work"
          ditto -x -k "$zip" "$work"
          app="$work/FleetBar.app"
          codesign --verify --strict --verbose=2 "$app"
          auth="$(codesign -dvv "$app" 2>&1 | grep '^Authority=' | head -n1 || true)"
          echo "FleetBar.app $auth"
          if ! printf '%s' "$auth" | grep -q 'Developer ID Application'; then
            echo "::error::FleetBar.app is NOT Developer ID signed (got: ${auth:-adhoc/none}). Refusing to ship a Gatekeeper-quarantined app."
            exit 1
          fi

      - name: Upload FleetBar preview to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/fleetbar/PortDaddy-FleetBar-macOS-*.zip
            dist/fleetbar/PortDaddy-FleetBar-macOS-*.zip.sha256
            dist/fleetbar/fleetbar-preview-manifest.json

  build-pd-console-app:
    # Bundle the GPU-native pd-console (core/pd-console, --features gpui) into a
    # signed + notarized pd-console.app (ADR-0057 phase dist-console-app-bundle).
    # Reuses the exact Developer ID signing path proven for the daemon in #447;
    # locally verified 2026-06-20 (the real pd-console binary bundles to a valid
    # hardened-runtime Developer ID .app). Same APPLE_* secrets; no-ops unsigned
    # if the cert secret is absent so the build never breaks.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/pd-console

      - name: Build pd-console (--release --features gpui)
        run: cargo build --release --features gpui --bin pd-console
        working-directory: core/pd-console

      - name: Package + sign + notarize pd-console.app
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
        run: |
          set -euo pipefail
          export PORT_DADDY_SKIP_NOTARIZE=1
          if [ -n "${APPLE_CERT_P12_BASE64:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/pd-signing.keychain-db"
            KCPASS="$(openssl rand -hex 24)"
            security create-keychain -p "$KCPASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
            echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            export PORT_DADDY_SIGN_IDENTITY="Developer ID Application: Curiositech LLC (P5H9P59X2M)"
            export PORT_DADDY_NOTARY_KEYCHAIN="$KEYCHAIN"
            if [ -n "${APPLE_NOTARY_KEY_P8_BASE64:-}" ]; then
              echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
              if xcrun notarytool store-credentials pd-notary \
                   --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
                   --issuer "$APPLE_NOTARY_KEY_ISSUER" --keychain "$KEYCHAIN"; then
                unset PORT_DADDY_SKIP_NOTARIZE
                export PORT_DADDY_NOTARY_PROFILE=pd-notary
              else
                echo "::warning::notary creds failed validation — signing pd-console.app only."
              fi
            fi
          else
            echo "::warning::APPLE_CERT_P12_BASE64 unset — pd-console.app ships unsigned."
          fi
          scripts/package-pd-console.sh dist/console
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" 2>/dev/null || true

      - name: Version drift guard — deep (embedded artifact versions must match)
        # ADR-0057 §Consequences: a source-only gate can be Goodharted by bumping
        # the version string without rebuilding a surface. Now that the pd-console
        # binary + .app exist, --deep reads the version EMBEDDED in the built
        # artifact (the .app's CFBundleShortVersionString and the binary's build
        # stamp) and fails the release if it disagrees with package.json.
        # --require-artifacts: the .app was just built here, so its absence is a
        # real failure, not a skip.
        run: node scripts/check-version-drift.mjs --deep --require-artifacts

      - name: Upload pd-console.app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/console/PortDaddy-Console-macOS-*.zip
            dist/console/PortDaddy-Console-macOS-*.zip.sha256

  build-latest-json:
    # ADR-0057 phase 7 (dist-update-channel): publish a latest.json update feed
    # alongside each Release. Runs AFTER the artifact jobs so the checksums match
    # exactly what shipped. Downloads the uploaded Release assets, computes their
    # SHA-256, and uploads latest.json back to the same Release — so
    # `releases/latest/download/latest.json` always resolves to the newest feed
    # that `pd upgrade` (and the GUI apps) poll. Gated on the daemon + FleetBar
    # builds succeeding (the same ESSENTIAL gate update-homebrew uses); the
    # console job is best-effort and may be absent from the feed if it failed.
    needs: [build-binaries, build-fleetbar-preview, build-pd-console-app]
    if: always() && needs.build-binaries.result == 'success' && needs.build-fleetbar-preview.result == 'success' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release tag
        id: tag
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"

      # Pull the assets that the build jobs uploaded to this Release so the feed's
      # checksums are computed from the EXACT bytes that ship (not a rebuild).
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Daemon tars, FleetBar zip, console zip — whatever this release has.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'pd-*.tar.gz' \
            --pattern 'PortDaddy-FleetBar-macOS-*.zip' \
            --pattern 'PortDaddy-Console-macOS-*.zip' || true
          ls -la dist

      # When the Apple cert secret is present the mac artifacts shipped signed +
      # notarized, so mark them signed in the feed. Absent → unsigned (the feed
      # tells the truth either way; `pd upgrade` surfaces the signed flag).
      - name: Generate latest.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          set -euo pipefail
          SIGNED_FLAG=""
          if [ -n "${APPLE_CERT_P12_BASE64:-}" ]; then SIGNED_FLAG="--signed"; fi
          node scripts/build-latest-json.mjs \
            --tag "$TAG" \
            --dist dist \
            --out dist/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            $SIGNED_FLAG
          echo "---- latest.json ----"
          cat dist/latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/latest.json

  # publish-npm was RETIRED 2026-07-04 (operator decision): brew + the release
  # binaries + latest.json cover every supported install path, the npm token
  # had been dead since 3.15.0 (every publish 404'd), and the perpetually red
  # job trained everyone to ignore release failures. The manual companion
  # .github/workflows/publish.yml remains if npm distribution is ever revived;
  # the registry package should be `npm deprecate`d when a working token exists.

  # Roll the brew tap ONLY for a real, non-prerelease published Release. A
  # prerelease (vX.Y.Z-rc.N) builds + signs binaries but must NEVER roll the tap —
  # candidates are opt-in (RELEASING.md §2). A workflow_dispatch re-run also skips
  # this (it's for re-building a failed release, not re-rolling the tap); dispatch
  # the tap by hand via RELEASING.md §1 step J if a real release needs a re-roll.
  # Previously this fired for ANY release event incl. prereleases — an RC would have
  # shipped to every `brew upgrade` user.
  update-homebrew:
    runs-on: ubuntu-latest
    # FleetBar is now ESSENTIAL (operator directive 2026-06-18): a release ships
    # the daemon AND its GUI together, so the tap MUST NOT roll if the FleetBar
    # preview failed to build. This reverses the prior "binaries-only" gate — that
    # let FleetBar rot silently across releases. The tradeoff is deliberate: a
    # flaky FleetBar build now blocks the release, which forces FleetBar to be
    # FIXED rather than bypassed.
    needs: [build-binaries, build-fleetbar-preview]
    if: always() && needs.build-binaries.result == 'success' && needs.build-fleetbar-preview.result == 'success' && github.event_name == 'release' && github.event.release.prerelease == false
    steps:
      - name: Set release version
        id: release
        env:
          # On workflow_dispatch, github.ref_name is the dispatch branch, not
          # the release tag — use the explicit `tag` input. On release events,
          # the input is absent and github.ref_name IS the tag.
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: curiositech/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ steps.release.outputs.version }}"}'
