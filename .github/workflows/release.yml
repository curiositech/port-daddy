name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build binaries for (e.g. v3.14.0)'
        required: true

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pd-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pd-linux-x64
          # darwin-x64 (Intel Mac) was dropped 2026-05-22. macos-13 runners in
          # the GHA pool routinely queue for 24+ hours (wedged v3.14.1 +
          # v3.15.0). The brew formula already ships only darwin-arm64 +
          # linux-x64, so the artifact was dead weight. Intel Mac users can
          # install from npm or build from source until we add it back via
          # a different runner pool.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      # Bun's compile path resolves bare imports against node_modules. Without
      # this step, specifiers like 'yaml', 'msgpackr', '@clack/prompts' fail
      # with "Could not resolve" and the binary build aborts. The repo doesn't
      # ship a bun.lockb (npm is canonical), so Bun resolves against package.json.
      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          node scripts/build-single-binary.mjs --target=${{ matrix.target }} --outfile=dist/pd
          cd dist && tar -czf ${{ matrix.artifact }}.tar.gz pd port-daddy port-daddy-manifest.json

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/${{ matrix.artifact }}.tar.gz

  build-fleetbar-preview:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # package-fleetbar.sh bundles the CLI payload via scripts/build-single-binary.mjs,
      # which shells out to bun. Keep this job aligned with build-binaries and
      # publish-npm so recovery reruns do not fail after the Swift build succeeds.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install

      - name: Package FleetBar app
        run: |
          scripts/package-fleetbar.sh dist/fleetbar

      - name: Upload FleetBar preview to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/fleetbar/PortDaddy-FleetBar-macOS-*.zip
            dist/fleetbar/PortDaddy-FleetBar-macOS-*.zip.sha256
            dist/fleetbar/fleetbar-preview-manifest.json

  publish-npm:
    # Run on real release events and on operator-triggered workflow_dispatch.
    # workflow_dispatch is privileged (repo-write required), so this isn't a
    # broadening of who can publish — it's a recovery path for releases where
    # the original `release: published` run failed partway through (e.g. the
    # bun-missing-in-publish-npm regression that wedged v3.14.1 + v3.15.0).
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # npm publish runs prepublishOnly which calls build:daemon:dist, which
      # shells out to `bun` to compile the standalone daemon binary that ships
      # in the npm tarball. v3.14.1's release run failed here with
      # `Error: bun --version failed` because the ubuntu-latest runner doesn't
      # ship with bun. Mirror the bun setup that build-binaries uses above.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    runs-on: ubuntu-latest
    # FleetBar is now ESSENTIAL (operator directive 2026-06-18): a release ships
    # the daemon AND its GUI together, so the tap MUST NOT roll if the FleetBar
    # preview failed to build. This reverses the prior "binaries-only" gate — that
    # let FleetBar rot silently across releases. The tradeoff is deliberate: a
    # flaky FleetBar build now blocks the release, which forces FleetBar to be
    # FIXED rather than bypassed. publish-npm stays non-gating (it's a separate
    # distribution channel, not part of the daemon+GUI bundle).
    needs: [build-binaries, build-fleetbar-preview]
    if: always() && needs.build-binaries.result == 'success' && needs.build-fleetbar-preview.result == 'success' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Set release version
        id: release
        env:
          # On workflow_dispatch, github.ref_name is the dispatch branch, not
          # the release tag — use the explicit `tag` input. On release events,
          # the input is absent and github.ref_name IS the tag.
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: curiositech/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ steps.release.outputs.version }}"}'
