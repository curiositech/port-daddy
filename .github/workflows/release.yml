name: Release

on:
  release:
    types: [published]

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pd-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: pd-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pd-linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build binary
        run: |
          bun build --compile --target=${{ matrix.target }} bin/port-daddy-cli.ts --outfile dist/pd
          cd dist && tar -czf ${{ matrix.artifact }}.tar.gz pd
          rm pd

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.tar.gz

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [build-binaries, publish-npm]
    steps:
      - name: Set release version
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: curiositech/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ steps.release.outputs.version }}"}'
