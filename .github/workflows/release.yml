name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build binaries for (e.g. v3.28.0)'
        required: true

jobs:
  # ==========================================================================
  # DOCUMENTATION COUNCIL GATE
  # This atomic fail-closed gate ensures that GitHub Release, binary builds,
  # FleetBar, pd-console, and Homebrew publication are ONLY gated after:
  #   1. A multi-agent documentation review council assembles independently
  #   2. At least 4 distinct Port Daddy reviewer agents validate
  #   3. At least 3 substantive cross-steelman records from ≥3 reviewers
  #   4. All 5 canonical instruction surfaces reviewed (AGENTS.md, CLAUDE.md,
  #      README.md, skills/port-daddy-agent-skill/SKILL.md,
  #      skills/port-daddy-internal-dev/SKILL.md)
  #   5. Visual proof artifacts match (hashed conformance demos)
  #   6. A named non-stable feature daemon runs at exact candidate version
  #   7. Final synthesis SHIP verdict with zero blockers
  #
  # The gate validates that the receipt's candidate digest matches the
  # working tree. If ANY file changes after review, the digest invalidates
  # and the gate fails closed. This prevents shipping partially-reviewed
  # candidates and ensures a deterministic, auditable release process.
  # ==========================================================================
  release-doc-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify atomic multi-agent documentation council review
        run: node scripts/check-release-doc-review.mjs
        env:
          # Fail-closed: missing or invalid receipt blocks all downstream jobs
          CI: 'true'

  build-binaries:
    needs: release-doc-review
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pd-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pd-linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          node scripts/build-single-binary.mjs --target=${{ matrix.target }} --outfile=dist/pd

      - name: Build dedicated daemon binary
        run: npm run build:daemon:dist

      - name: Prove occupied preferred port falls back and publishes discovery
        run: npm run prove:daemon-port-fallback -- dist/daemon/port-daddy-daemon

      - name: Install Rust toolchain (for pd-bosun watchdog)
        uses: dtolnay/rust-toolchain@stable

      - name: Build pd-bosun before the smoke (required watchdog)
        run: npm run build:bosun

      - name: Smoke dedicated daemon binary
        run: bash scripts/smoke-compiled-daemon.sh

      - name: Build + stage pd-bosun (daemon supervisor)
        run: |
          set -euo pipefail
          cargo build --manifest-path core/pd-bosun/Cargo.toml --release -j 1
          cp core/target/release/pd-bosun dist/

      - name: Stage FleetBar binary
        run: |
          set -euo pipefail
          (cd apps/FleetBar && ./scripts/build-release.sh)
          cp apps/FleetBar/dist/FleetBar dist/

      - name: Stage pd-console binary
        run: |
          set -euo pipefail
          npm run build:console:dist
          cp dist/pd-console dist/

      - name: Create release tarball
        run: |
          set -euo pipefail
          mkdir -p dist/port-daddy-${{ matrix.artifact }}
          cp dist/pd dist/port-daddy-${{ matrix.artifact }}/
          cp dist/pd-bosun dist/port-daddy-${{ matrix.artifact }}/
          cp dist/FleetBar dist/port-daddy-${{ matrix.artifact }}/
          cp dist/pd-console dist/port-daddy-${{ matrix.artifact }}/
          tar -czf port-daddy-${{ matrix.artifact }}.tar.gz -C dist port-daddy-${{ matrix.artifact }}
          ls -lh port-daddy-${{ matrix.artifact }}.tar.gz

      - name: Upload binary artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: port-daddy-${{ matrix.artifact }}.tar.gz
          asset_name: port-daddy-${{ matrix.artifact }}.tar.gz
          asset_content_type: application/gzip

  publish-homebrew:
    needs: [release-doc-review, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-verify documentation council gate before Homebrew
        run: node scripts/check-release-doc-review.mjs

      - name: Extract release version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          DARWIN_X64_SHA=$(curl -sL "${{ github.event.release.assets[1].browser_download_url }}" | sha256sum | cut -d' ' -f1)
          LINUX_X64_SHA=$(curl -sL "${{ github.event.release.assets[0].browser_download_url }}" | sha256sum | cut -d' ' -f1)
          node scripts/update-homebrew-formula.mjs \
            --version "${{ steps.version.outputs.VERSION }}" \
            --darwin-arm64-sha "$DARWIN_X64_SHA" \
            --linux-x64-sha "$LINUX_X64_SHA"

      - name: Push Homebrew formula
        run: |
          git config user.name "Port Daddy Release Bot"
          git config user.email "release@port-daddy.dev"
          git add Formula/port-daddy.rb
          git commit -m "chore(release): update Homebrew formula to ${{ steps.version.outputs.VERSION }}"
          git push origin main

  notify-release:
    needs: [release-doc-review, build-binaries, publish-homebrew]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report release status
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✓ Release ${{ github.ref }} complete (doc council gate ✓, binaries ✓, Homebrew ✓)"
          else
            echo "✗ Release ${{ github.ref }} failed (doc council gate required all downstream jobs)"
            exit 1
          fi
