name: Release Train

# Operator directive (2026-08-09): "we don't cut new daemons enough on
# homebrew… the backend code changes radically quickly yet we're never using
# it." The old release-cadence workflow only NAGGED — it filed an issue and
# waited for a human to walk the 12-step RELEASING.md recipe, which is exactly
# why v3.27.0 sat unreleased for weeks while main accumulated 150+ commits.
#
# This workflow CUTS. Twice a week (and on demand) it:
#   1. measures unreleased commits on daemon-facing surfaces,
#   2. proves the tarball layout release.yml will produce is one the tap
#      formula accepts (scripts/check-formula-compat.mjs — the drift that
#      silently broke every would-be release after v3.27.0),
#   3. opens a version-bump PR (conventional-commit-derived bump, every
#      version surface synced, CHANGELOG stamped) with auto-merge armed, and
#   4. when that PR merges, tags the commit and publishes the GitHub Release —
#      which triggers release.yml: build, sign, 180s soak of the exact
#      packaged binary, batten verify, formula-compat preflight, tap roll.
#      The fresh-install workflow then smokes the published artifacts AND the
#      brew install path on pristine runners.
#
# The old "releases stay human-triggered because artifacts must be soaked"
# rationale is retired: the soak IS in CI (scripts/soak-binary.sh gates the
# release on running the exact packaged binary), and the fresh-install smoke
# gates the published result. What remains human is fixing what the gates
# catch — and `brew upgrade` on operator machines.
#
# TOKENS: GitHub suppresses events created with the workflow GITHUB_TOKEN, so
# a bump PR opened with it would never run CI, and a Release published with it
# would never trigger release.yml. The train therefore uses RELEASE_TRAIN_TOKEN
# (a PAT with repo scope; falls back to HOMEBREW_TAP_TOKEN which already has
# cross-repo rights for the tap roll). If neither can push/PR, the run fails
# loudly with instructions instead of pretending.
#
# HOLD SWITCH: open an issue titled exactly "Release train: hold" to pause
# cutting (the run explains itself and skips). Close it to resume.

on:
  schedule:
    - cron: '0 16 * * 1,4' # Mondays + Thursdays 16:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (patch/minor). Blank = derive from commits.'
        required: false
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  # Daemon-facing surfaces that make a release worth cutting. Deliberately
  # broader than the old cadence check's list (server.ts lib/ cli/ shared/
  # package.json), which was blind to routes/, mcp/, bin/, hooks/, and the
  # packaging itself — it reported "0 unreleased daemon commits" while the
  # daemon's route/tooling code churned.
  DAEMON_PATHSPEC: >-
    server.ts lib/ cli/ shared/ routes/ mcp/ bin/ hooks/
    skills/port-daddy-agent-skill/ agents/port-daddy-pilot/
    package.json release-artifacts.json .github/workflows/release.yml

jobs:
  cut:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve a token that can trigger CI
        id: token
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TRAIN_TOKEN:-}" ]; then
            echo "using RELEASE_TRAIN_TOKEN"
            echo "token=$RELEASE_TRAIN_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::RELEASE_TRAIN_TOKEN not set — falling back to HOMEBREW_TAP_TOKEN. Set a dedicated RELEASE_TRAIN_TOKEN (classic PAT, repo scope) for least surprise."
            echo "token=$HOMEBREW_TAP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither RELEASE_TRAIN_TOKEN nor HOMEBREW_TAP_TOKEN is set. A PAT is REQUIRED: PRs opened and Releases published with the workflow GITHUB_TOKEN do not trigger CI or release.yml, so the train would silently stall. Create a classic PAT with repo scope and save it as RELEASE_TRAIN_TOKEN."
            exit 1
          fi

      - name: Hold switch — skip when the operator has paused the train
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          held=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Release train: hold"' --json number --jq 'length')
          if [ "$held" != "0" ]; then
            echo "Release train is HELD (open 'Release train: hold' issue). Skipping."
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure unreleased daemon-surface commits
        id: measure
        if: steps.hold.outputs.held == 'false'
        run: |
          set -euo pipefail
          latest_tag=$(git describe --tags --abbrev=0)
          # Word-splitting of the pathspec is intentional.
          commits=$(git rev-list --count "$latest_tag"..HEAD -- $DAEMON_PATHSPEC)
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "$commits unreleased daemon-surface commits since $latest_tag"

      - name: Skip when an open train PR already exists
        id: existing
        if: steps.hold.outputs.held == 'false' && steps.measure.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'head:release-train/' --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "An open release-train PR already exists — not stacking another."

      - name: Derive the next version
        id: version
        if: steps.hold.outputs.held == 'false' && steps.measure.outputs.commits != '0' && steps.existing.outputs.open == '0'
        env:
          LATEST_TAG: ${{ steps.measure.outputs.latest_tag }}
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          bump="${FORCED_BUMP:-}"
          if [ -z "$bump" ]; then
            # feat commits (or breaking markers) on daemon surfaces → minor;
            # otherwise patch. Majors stay deliberate + human.
            if git log "$LATEST_TAG"..HEAD --pretty=%s -- $DAEMON_PATHSPEC | grep -qiE '^(feat|[a-z]+!)(\(|:|!)|BREAKING'; then
              bump=minor
            else
              bump=patch
            fi
          fi
          case "$bump" in patch|minor) ;; *) echo "::error::unsupported bump '$bump' (patch/minor only — majors are human-cut)"; exit 1;; esac
          next=$(node -e "
            const [ma,mi,pa]=process.argv[1].split('.').map(Number);
            console.log(process.argv[2]==='minor'?[ma,mi+1,0].join('.'):[ma,mi,pa+1].join('.'));
          " "$current" "$bump")
          echo "current=$current"; echo "bump=$bump"; echo "next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Formula-compat preflight — refuse to cut a version brew would reject
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          entries=$(grep -m1 'TARBALL_ENTRIES:' .github/workflows/release.yml | sed 's/.*TARBALL_ENTRIES:\s*//')
          node scripts/check-formula-compat.mjs --version "$NEXT" --entries "$entries"

      - name: Use Node.js 22
        if: steps.version.outputs.next != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Open the version-bump PR with auto-merge armed
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NEXT: ${{ steps.version.outputs.next }}
          BUMP: ${{ steps.version.outputs.bump }}
          LATEST_TAG: ${{ steps.measure.outputs.latest_tag }}
          COMMITS: ${{ steps.measure.outputs.commits }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          branch="release-train/v$NEXT"
          git checkout -b "$branch"
          # npm pkg set (not `npm version`) — the repo's postversion hook runs
          # `git commit --amend`, which on a CI branch would amend main's tip.
          npm pkg set version="$NEXT"
          npx tsx scripts/sync-version.ts
          npm run check:version-drift
          # Stamp the CHANGELOG: everything under [Unreleased] becomes this
          # version's section; a fresh empty [Unreleased] stays on top.
          perl -0pi -e "s/^## \[Unreleased\]/## [Unreleased]\n\n## [$NEXT] - $(date -u +%F)/m" CHANGELOG.md
          git config user.name "port-daddy-release-train"
          git config user.email "release-train@portdaddy.dev"
          git add -A
          git commit -m "chore(release): bump to $NEXT"
          git push -u origin "$branch"
          body=$(printf '%s\n' \
            "## Summary" \
            "Automated release-train bump: \`$LATEST_TAG\` → \`v$NEXT\` ($BUMP). $COMMITS unreleased commits touch daemon-facing surfaces." \
            "" \
            "On merge, the train tags \`v$NEXT\` and publishes the GitHub Release; release.yml then builds, signs, soaks the exact packaged binary for 180s, verifies the cargo (batten + formula-compat), and rolls the Homebrew tap. The fresh-install workflow smokes the published artifacts and the \`brew install\` path on pristine runners." \
            "" \
            "To stop this release: close this PR, or open an issue titled \"Release train: hold\" to pause the train entirely." \
            "" \
            "## Test Plan" \
            "- CI on this PR (distribution-freshness + version-drift gates prove every version surface moved together)" \
            "- release.yml's soak + batten + formula-compat gates on the tag" \
            "- fresh-install smoke (tarball path + brew path) after publish")
          gh pr create --title "chore(release): bump to $NEXT" --body "$body"
          gh pr merge --auto --squash "$branch"

  tag-and-publish:
    # Fires when a release-train bump PR merges to main: tag the merge commit
    # and publish the Release, which triggers release.yml end to end.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release-train/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag the merged bump and publish the Release
        env:
          # A PAT is REQUIRED here: a Release published with GITHUB_TOKEN does
          # not trigger release.yml (GitHub suppresses recursive events), so
          # binaries would never build and the tap would never roll.
          GH_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No PAT available (RELEASE_TRAIN_TOKEN / HOMEBREW_TAP_TOKEN) — cannot publish a Release that triggers release.yml. Publish manually: gh release create v<version> --generate-notes"
            exit 1
          fi
          # The version comes from the merged tree, not from any PR-controlled
          # string — read it at the merge commit and validate its shape.
          git checkout "$MERGE_SHA"
          version=$(node -p "require('./package.json').version")
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '$version' at merge commit is not a plain x.y.z — refusing to tag."
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists — nothing to do."
            exit 0
          fi
          git config user.name "port-daddy-release-train"
          git config user.email "release-train@portdaddy.dev"
          git tag -a "$tag" -m "Port Daddy $version — release train"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" \
            --generate-notes --title "$tag — release train"
          echo "Release $tag published — release.yml takes it from here (build → sign → soak → batten → formula-compat → tap roll), then fresh-install smokes the result."
