                headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10', 'Content-Type': 'application/json' },
                body: body === undefined ? undefined : JSON.stringify(body),
