        id: app
        if: steps.publication.outputs.should_publish == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_TRAIN_APP_ID }}
