name: Release Train

# Operator directive (2026-08-09): "we don't cut new daemons enough on
# homebrew… the backend code changes radically quickly yet we're never using
# it." The old release-cadence workflow only NAGGED — it filed an issue and
# waited for a human to walk the 12-step RELEASING.md recipe, which is exactly
# why v3.27.0 sat unreleased for weeks while main accumulated 150+ commits.
#
# This workflow CUTS. Twice a week (and on demand) it:
#   1. measures unreleased commits on daemon-facing surfaces,
#   2. proves the tarball layout release.yml will produce is one the tap
#      formula accepts (scripts/check-formula-compat.mjs — the drift that
#      silently broke every would-be release after v3.27.0),
#   3. opens a version-bump PR (conventional-commit-derived bump, every
#      version surface synced, CHANGELOG stamped) with auto-merge armed, and
#   4. when the version bump reaches main (directly or through a Purser
#      carrier), detects that package.json is ahead of the latest tag, tags
#      the exact merged tree, and publishes the GitHub Release — which
#      triggers release.yml: build, sign, 180s soak of the exact
#      packaged binary, batten verify, formula-compat preflight, tap roll.
#      The fresh-install workflow then smokes the published artifacts AND the
#      brew install path on pristine runners.
#
# The old "releases stay human-triggered because artifacts must be soaked"
# rationale is retired: the soak IS in CI (scripts/soak-binary.sh gates the
# release on running the exact packaged binary), and the fresh-install smoke
# gates the published result. What remains human is fixing what the gates
# catch — and `brew upgrade` on operator machines.
#
# AUTHORITY: read-only discovery uses the built-in workflow token. Mutations
# use existing App 3810450, explicitly restricted to this repository. There is
# no PAT, operator identity, or second-App fallback. App configuration and a
# controlled rollout are separate from source validation.
#
# HOLD SWITCH: open an issue titled exactly "Release train: hold" to pause
# cutting (the run explains itself and skips). Close it to resume.

on:
  schedule:
    - cron: '0 16 * * 1,4' # Mondays + Thursdays 16:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (patch/minor). Blank = derive from commits.'
        required: false
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  # Daemon-facing surfaces that make a release worth cutting. Deliberately
  # broader than the old cadence check's list (server.ts lib/ cli/ shared/
  # package.json), which was blind to routes/, mcp/, bin/, hooks/, and the
  # packaging itself — it reported "0 unreleased daemon commits" while the
  # daemon's route/tooling code churned.
  #
  # This list is ALSO the changelog-fragment requirement's classifier. It is
  # mirrored in scripts/lib/user-visible-surfaces.mjs, which is the source of
  # truth for every JS consumer; the copy stays inline here because a shell
  # `git diff` pathspec cannot import ESM. The two cannot drift silently:
  # tests/unit/changelog-fragments.test.js parses this block and FAILS if it
  # stops matching the module's DAEMON_PATHSPEC export. Edit both together.
  DAEMON_PATHSPEC: >-
    server.ts lib/ cli/ shared/ routes/ mcp/ bin/ hooks/
    skills/port-daddy-agent-skill/ agents/port-daddy-pilot/
    package.json release-artifacts.json .github/workflows/release.yml

jobs:
  cut:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-train-cut
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Discovery needs no App secret and never writes repository state.
      - name: Hold switch — skip when the operator has paused the train
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          held=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Release train: hold"' --json number --jq 'length')
          if [ "$held" != "0" ]; then
            echo "Release train is HELD (open 'Release train: hold' issue). Skipping."
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure unreleased daemon-surface commits
        id: measure
        if: steps.hold.outputs.held == 'false'
        run: |
          set -euo pipefail
          discovery_sha=$(git rev-parse HEAD)
          echo "discovery_sha=$discovery_sha" >> "$GITHUB_OUTPUT"
          latest_tag=$(git describe --tags --abbrev=0)
          # Word-splitting of the pathspec is intentional.
          # shellcheck disable=SC2086
          commits=$(git rev-list --count "$latest_tag"..HEAD -- $DAEMON_PATHSPEC)
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "$commits unreleased daemon-surface commits since $latest_tag"

      - name: Skip when an open train PR already exists
        id: existing
        if: steps.hold.outputs.held == 'false' && steps.measure.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'head:release-train/' --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "An open release-train PR already exists — not stacking another."

      - name: Derive the next version
        id: version
        if: steps.hold.outputs.held == 'false' && steps.measure.outputs.commits != '0' && steps.existing.outputs.open == '0'
        env:
          LATEST_TAG: ${{ steps.measure.outputs.latest_tag }}
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          bump="${FORCED_BUMP:-}"
          if [ -z "$bump" ]; then
            # feat commits (or breaking markers) on daemon surfaces → minor;
            # otherwise patch. Majors stay deliberate + human.
            # shellcheck disable=SC2086
            if git log "$LATEST_TAG"..HEAD --pretty=%s -- $DAEMON_PATHSPEC | grep -qiE '^(feat|[a-z]+!)(\(|:|!)|BREAKING'; then
              bump="minor"
            else
              bump="patch"
            fi
          fi
          case "$bump" in patch|minor) ;; *) echo "::error::unsupported bump '$bump' (patch/minor only — majors are human-cut)"; exit 1;; esac
          next=$(node -e "
            const [ma,mi,pa]=process.argv[1].split('.').map(Number);
            console.log(process.argv[2]==='minor'?[ma,mi+1,0].join('.'):[ma,mi,pa+1].join('.'));
          " "$current" "$bump")
          echo "current=$current"; echo "bump=$bump"; echo "derived=$next"

          # VERSION FLOOR — the formula decides the minimum shippable version.
          # Without this the train deadlocks permanently: off 3.27.0 it derives
          # patch → 3.27.1, and the preflight below correctly refuses because
          # the tap only accepts our current tarball layout from its cutoff
          # (3.28.0) onward. That is exactly what happened on 2026-08-10 and
          # 2026-08-13 — two scheduled runs, both dead at the same step, no
          # release. The constraint had been written as a note in a PR body,
          # which is not a control. Now the train asks the live formula for the
          # floor and bumps to it.
          entries=$(grep -m1 'TARBALL_ENTRIES:' .github/workflows/release.yml | sed 's/.*TARBALL_ENTRIES:[[:space:]]*//')
          floor=$(node scripts/check-formula-compat.mjs --min-accepted-version --entries "$entries")
          next=$(node -e "
            const cmp=(a,b)=>{const p=s=>s.split('.').map(Number);const[x,y]=[p(a),p(b)];
              for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0);}return 0;};
            const [derived,floorV]=process.argv.slice(1);
            console.log(cmp(derived,floorV)<0?floorV:derived);
          " "$next" "$floor")
          echo "floor=$floor"; echo "next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Formula-compat preflight — refuse to cut a version brew would reject
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          entries=$(grep -m1 'TARBALL_ENTRIES:' .github/workflows/release.yml | sed 's/.*TARBALL_ENTRIES:\s*//')
          node scripts/check-formula-compat.mjs --version "$NEXT" --entries "$entries"

      - name: Use Node.js 22
        if: steps.version.outputs.next != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require approved App configuration
        if: steps.version.outputs.next != ''
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_TRAIN_APP_ID }}
          RELEASE_APP_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          if (process.env.RELEASE_APP_ID !== '3810450' || !process.env.RELEASE_APP_KEY?.trim()) {
            console.error('::error::Release train requires approved Actions configuration for App 3810450: RELEASE_TRAIN_APP_ID and RELEASE_TRAIN_APP_PRIVATE_KEY. No publication attempted; configuration provisioning is separate work.');
            process.exitCode = 1;
          }
          NODE

      - name: Mint repository-scoped App token
        id: app
        if: steps.version.outputs.next != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false

      - name: Pin the exact measured source
        if: steps.version.outputs.next != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.measure.outputs.discovery_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build, publish and read back the exact version PR
        id: publish
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          DISCOVERY_SHA: ${{ steps.measure.outputs.discovery_sha }}
          NEXT: ${{ steps.version.outputs.next }}
          LATEST_TAG: ${{ steps.measure.outputs.latest_tag }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const env = process.env;
          const repo = env.GITHUB_REPOSITORY;
          const token = env.GH_TOKEN;
          const fail = (message) => { const error = new Error(message); error.sanitized = true; throw error; };
          const receipt = (value) => {
            const line = JSON.stringify(value);
            console.log(line);
            appendFileSync(env.GITHUB_STEP_SUMMARY, line + '\n');
          };
          const childEnv = { ...env };
          delete childEnv.GH_TOKEN;
          delete childEnv.GITHUB_TOKEN;
          const run = (file, args, extra = {}) => execFileSync(file, args, {
            encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'],
            timeout: 120_000, env: { ...childEnv, ...extra },
          }).trim();
          async function api(path, { method = 'GET', body, absent = false } = {}) {
            let response;
            try {
              response = await fetch('https://api.github.com' + path, {
                method, redirect: 'error', signal: AbortSignal.timeout(10_000),
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10', 'Content-Type': 'application/json' },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
            } catch { fail('GitHub transport/timeout failure; outcome requires exact readback'); }
            if (method === 'GET' && absent && response.status === 404) return null;
            if (!response.ok) fail('GitHub request failed (HTTP ' + response.status + '); no credential fallback');
            try { return await response.json(); } catch { fail('GitHub response could not be verified'); }
          }
          async function verifyApp() {
            if (!token || env.APP_SLUG !== 'port-daddy' || !/^[0-9]+$/.test(env.INSTALLATION_ID || '')) fail('App identity witness failed');
            const installation = await api('/installation/repositories?per_page=100');
            if (installation.total_count !== 1 || installation.repositories?.length !== 1 ||
                installation.repositories[0].full_name !== repo) fail('App repository scope witness failed');
            const bot = await api('/users/port-daddy%5Bbot%5D');
            if (bot.login !== 'port-daddy[bot]' || bot.type !== 'Bot' || !Number.isSafeInteger(bot.id)) fail('App bot identity witness failed');
            return bot;
          }
          async function revoke() {
            let confirmed = false;
            try {
              const response = await fetch('https://api.github.com/installation/token', {
                method: 'DELETE', redirect: 'error', signal: AbortSignal.timeout(10_000),
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10' },
              });
              confirmed = response.status === 204;
            } catch { /* Never print provider bodies, tokens, or transport errors. */ }
            receipt({ phase: 'token-cleanup', status: confirmed ? 'confirmed-204' : 'UNCONFIRMED' });
            if (!confirmed) {
              console.error('::error::Publication may already have succeeded; token cleanup UNCONFIRMED. Preserve the preceding exact-state receipts; do not replay publication. The action post-step remains a fallback.');
              process.exitCode = 1;
            }
          }
          (async () => {
            try {
              const bot = await verifyApp();
              const { NEXT: next, DISCOVERY_SHA: source } = env;
              if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(next || '') ||
                  !/^[a-f0-9]{40}$/.test(source || '') || run('git', ['rev-parse', 'HEAD']) !== source) fail('Discovery source/version mismatch');
              const branch = 'release-train/v' + next;
              const branchPath = '/repos/' + repo + '/git/ref/heads/' + branch;
              const prPath = '/repos/' + repo + '/pulls?state=all&base=main&head=' + encodeURIComponent(repo.split('/')[0] + ':' + branch);
              // Do not overwrite or regenerate an existing branch, even after a previous partial run.
              if (await api(branchPath, { absent: true })) fail('Release branch already exists; inspect its exact head and PR before continuing');
              if ((await api(prPath)).length !== 0) fail('Release PR already exists; no new write');
              run('npm', ['ci', '--no-audit', '--no-fund']);
              run('git', ['checkout', '-b', branch, source]);
              // npm version invokes a postversion amend; use pkg set instead.
              run('npm', ['pkg', 'set', 'version=' + next]);
              run('npx', ['tsx', 'scripts/sync-version.ts']);
              run('npm', ['run', 'check:version-drift']);
              run('node', ['scripts/assemble-changelog.mjs', '--release', next, '--date', new Date().toISOString().slice(0, 10)]);
              const attribution = {
                GIT_AUTHOR_NAME: bot.login, GIT_COMMITTER_NAME: bot.login,
                GIT_AUTHOR_EMAIL: bot.id + '+' + bot.login + '@users.noreply.github.com',
                GIT_COMMITTER_EMAIL: bot.id + '+' + bot.login + '@users.noreply.github.com',
              };
              run('git', ['add', '-A']);
              run('git', ['commit', '-m', 'chore(release): bump to ' + next,
                '-m', 'Port-Daddy-Role: release-train\nPort-Daddy-App: 3810450\nActions-Run: ' + env.GITHUB_RUN_ID], attribution);
              const head = run('git', ['rev-parse', 'HEAD']);
              if (!/^[a-f0-9]{40}$/.test(head)) fail('Invalid generated head');
              // Header is command-scoped environment, never a URL, log, Git config file or artifact.
              const pushEnv = {
                GIT_CONFIG_COUNT: '2', GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
                GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ' + Buffer.from('x-access-token:' + token).toString('base64'),
                GIT_CONFIG_KEY_1: 'credential.helper', GIT_CONFIG_VALUE_1: '', GIT_TERMINAL_PROMPT: '0',
              };
              // Empty expected value is create-only CAS: a branch appearing during build cannot be fast-forwarded.
              try { run('git', ['push', '--force-with-lease=refs/heads/' + branch + ':', 'origin', 'HEAD:refs/heads/' + branch], pushEnv); } catch { /* Read before deciding whether the write failed. */ }
              const remote = await api(branchPath);
              if (remote.object?.sha !== head) fail('Pushed branch head unconfirmed or changed; never force-push');
              receipt({ phase: 'branch', source, branch, head });
              const body = [
                '## Summary',
                'Automated release-train version bump from ' + env.LATEST_TAG + ' to v' + next + ', generated from exact measured source ' + source + '.',
                'Every version surface and dated changelog move together. Required reviews, resolved threads, CI and the native protected queue remain in force.',
                'On merge the exact version transition is tagged and published. Signing, exact-binary 180-second soak, Batten, provenance, independent tap promotion and fresh-install checks remain separate downstream gates.',
                '',
                '## Test Plan',
                'npm ci, sync-version.ts, check:version-drift and changelog assembly completed in this Actions run. PR CI and required independent review must still pass before protected merge; distribution is not yet verified.',
                '',
                '<!-- visual-exempt: generated version strings only; no layout, rendered interaction or asset changes. -->',
                '',
                'Roadmap-Item: release-safety-pipeline',
                '',
                'Responsible Port Daddy role: release-train; App 3810450; source ' + source + '; head ' + head + '; Actions run ' + env.GITHUB_RUN_ID + '.',
              ].join('\n');
              try {
                await api('/repos/' + repo + '/pulls', { method: 'POST', body: {
                  base: 'main', head: branch, title: 'chore(release): bump to ' + next, body, draft: false,
                } });
              } catch { /* A lost response is not permission for a second POST. */ }
              const prs = await api(prPath);
              if (prs.length !== 1 || prs[0].head?.sha !== head || prs[0].head?.ref !== branch ||
                  prs[0].head?.repo?.full_name !== repo || prs[0].base?.ref !== 'main' ||
                  prs[0].user?.id !== bot.id || prs[0].state !== 'open' || !Number.isSafeInteger(prs[0].number)) fail('Exact App PR publication unconfirmed');
              const pr = prs[0].number;
              receipt({ phase: 'pr', number: pr, head, author: bot.login });
              async function queueState() {
                let after = null;
                let current;
                for (let page = 0; page < 10; page++) {
                  const result = await api('/graphql', { method: 'POST', body: {
                    query: 'query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid state autoMergeRequest{enabledAt} mergeQueueEntry{id} reviewThreads(first:100,after:$after){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}',
                    variables: { owner: repo.split('/')[0], name: repo.split('/')[1], number: pr, after },
                  } });
                  current = result.data?.repository?.pullRequest;
                  if (result.errors || !current || current.headRefOid !== head) fail('Exact PR queue/review readback failed');
                  if (current.reviewThreads.nodes.some((thread) => !thread.isResolved)) return { ...current, unresolved: true };
                  if (!current.reviewThreads.pageInfo.hasNextPage) return current;
                  after = current.reviewThreads.pageInfo.endCursor;
                  if (!after) fail('Missing review pagination witness');
                }
                fail('Review pagination exceeded bounded limit');
              }
              const before = await queueState();
              if (before.unresolved) {
                receipt({ phase: 'protected-merge', number: pr, head, status: 'waiting-for-review-thread-resolution' });
                return;
              }
              // gh uses the same App token; never --admin. Match the head even if main advanced.
              try {
                run('gh', ['pr', 'merge', String(pr), '--repo', repo, '--auto', '--squash', '--match-head-commit', head], { GH_TOKEN: token });
              } catch { /* A queue/auto-merge response can also be lost; inspect, do not replay. */ }
              const state = await queueState();
              receipt({ phase: 'protected-merge', number: pr, head,
                status: state.state === 'MERGED' ? 'merged' : state.mergeQueueEntry ? 'queued' : state.autoMergeRequest ? 'auto-merge-armed' : 'unconfirmed' });
              if (state.state !== 'MERGED' && !state.autoMergeRequest && !state.mergeQueueEntry) fail('Protected queue/auto-merge admission requires readback; publication must not be repeated');
            } catch (error) {
              if (error.sanitized) console.error('::error::' + error.message);
              // Child-process errors may contain credentials and are never printed.
              console.error('::error::Release PR phase incomplete or unconfirmed. Preserve exact-state receipts and inspect the run before continuing. No fallback or automatic publication replay.');
              process.exitCode = 1;
            } finally { await revoke(); }
          })();
          NODE

  tag-and-publish:
    # A merged carrier may contain the version transition; its PR name is not authority.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    concurrency:
      group: release-train-tag-and-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect an unpublished merged release version
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/release-workflow-state.mjs validate-version "$version" >/dev/null
          # Full merged ancestry also finds the transition when its tag already exists.
          range="$MERGE_SHA"
          release_sha=$(node scripts/release-workflow-state.mjs find-transition "$version" "$range")
          # Consume the whole blob: grep -q can SIGPIPE git show under pipefail.
          if ! git show "$release_sha:CHANGELOG.md" | grep -F "## [$version] -" >/dev/null; then
            echo "::error::Exact version transition lacks its dated changelog."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "release_sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Read exact tag, Release and default-branch workflow state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const env = process.env;
          const repo = env.GITHUB_REPOSITORY;
          const token = env.GH_TOKEN;
          const fail = (message) => { const error = new Error(message); error.sanitized = true; throw error; };
          const receipt = (value) => {
            const line = JSON.stringify(value);
            console.log(line);
            appendFileSync(env.GITHUB_STEP_SUMMARY, line + '\n');
          };
          const childEnv = { ...env };
          delete childEnv.GH_TOKEN;
          delete childEnv.GITHUB_TOKEN;
          const run = (file, args, extra = {}) => execFileSync(file, args, {
            encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'],
            timeout: 120_000, env: { ...childEnv, ...extra },
          }).trim();
          async function api(path, { method = 'GET', body, absent = false } = {}) {
            let response;
            try {
              response = await fetch('https://api.github.com' + path, {
                method, redirect: 'error', signal: AbortSignal.timeout(10_000),
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10', 'Content-Type': 'application/json' },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
            } catch { fail('GitHub transport/timeout failure; outcome requires exact readback'); }
            if (method === 'GET' && absent && response.status === 404) return null;
            if (!response.ok) fail('GitHub request failed (HTTP ' + response.status + '); no credential fallback');
            try { return await response.json(); } catch { fail('GitHub response could not be verified'); }
          }
          async function workflowTree(commit) {
            const object = await api('/repos/' + repo + '/git/commits/' + commit);
            let sha = object.tree?.sha;
            if (!/^[a-f0-9]{40}$/.test(sha || '')) fail('Invalid commit tree witness');
            for (const name of ['.github', 'workflows']) {
              const tree = await api('/repos/' + repo + '/git/trees/' + sha);
              if (tree.truncated || !Array.isArray(tree.tree)) fail('Incomplete workflow tree witness');
              const entry = tree.tree.find((item) => item.path === name);
              if (!entry) return null;
              if (entry.type !== 'tree' || !/^[a-f0-9]{40}$/.test(entry.sha || '')) fail('Unexpected workflow tree entry');
              sha = entry.sha;
            }
            return sha;
          }
          async function workflowsNeeded(target) {
            const metadata = await api('/repos/' + repo);
