name: R2 media

# Two jobs, and the split between them is the point.
#
#   manifest-drift  runs on every push and every PR, needs no credentials and no
#                   network, and fails when media/r2-manifest.json has drifted
#                   from the git tree it is a projection of. A checker that
#                   exists but that nothing runs is worse than no checker
#                   (scripts/check-whitepaper-corpus.mjs says so in its own
#                   header, and it is right).
#
#   sync            uploads what R2 does not already hold. It runs on main and
#                   on branch pushes alike, because content addressing means a
#                   branch and main share every object whose bytes they share --
#                   there is no preview bucket and no promotion step, so a PR
#                   preview's assets are simply already there. See ADR-0142 §6.
#
# The sync job cannot run until the bucket and the scoped token exist; until
# then it fails closed on the missing secrets, which is correct. See ADR-0142
# §11 for exactly what needs provisioning.

on:
  push:
    branches: ['**']
    paths:
      - '.github/assets/**'
      - 'docs/artifacts/**'
      - 'docs/pr-assets/**'
      - 'docs/pr-media/**'
      - 'docs/reports/**'
      - 'fleet-config-ui/docs/**'
      - 'website-v2/docs/**'
      - 'website-v2/screenshots/**'
      - 'media/r2-manifest.json'
      - 'scripts/r2-media-manifest.mjs'
      - 'scripts/check-r2-media-manifest.mjs'
      - 'scripts/sync-r2-media.mjs'
      - '.github/workflows/r2-media.yml'
  pull_request:
    paths:
      - '.github/assets/**'
      - 'docs/artifacts/**'
      - 'docs/pr-assets/**'
      - 'docs/pr-media/**'
      - 'docs/reports/**'
      - 'fleet-config-ui/docs/**'
      - 'website-v2/docs/**'
      - 'website-v2/screenshots/**'
      - 'media/r2-manifest.json'
      - 'scripts/r2-media-manifest.mjs'
      - 'scripts/check-r2-media-manifest.mjs'
      - 'scripts/sync-r2-media.mjs'
      - '.github/workflows/r2-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-drift:
    name: R2 media / manifest matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history is not needed, but the full WORKING TREE is: the manifest
      # is regenerated by hashing every tracked file under the offload roots,
      # and buildManifest() refuses an incomplete checkout rather than silently
      # emitting a shorter manifest.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: media/r2-manifest.json is what regeneration produces right now
        run: node scripts/check-r2-media-manifest.mjs

  sync:
    name: R2 media / upload what is missing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: manifest-drift
    # A fork PR has no access to repository secrets; running the sync there
    # would fail closed on every run and teach everyone to ignore a red job.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tool reads these four from the environment and refuses to start if
      # any is absent or blank. It never echoes a value: the secret is held on a
      # non-enumerable property with a redacting toJSON, and every error path
      # reports a status code and an object key instead.
      - name: Upload every manifest object R2 does not already hold
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-r2-media.mjs
