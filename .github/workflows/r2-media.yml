name: R2 media

# Three jobs, and the split between them is the point.
#
#   manifest-drift  runs on every push and every PR, needs no credentials and no
#                   network, and fails when media/r2-manifest.json has drifted
#                   from the git tree it is a projection of. A checker that
#                   exists but that nothing runs is worse than no checker
#                   (scripts/check-whitepaper-corpus.mjs says so in its own
#                   header, and it is right).
#
#   public-reads    fetches every URL in media/r2-offloaded.json -- the files
#                   Phase 2 removed from git -- over media.portdaddy.dev and
#                   hashes the bytes against the key. It holds NO credentials,
#                   so it runs on fork PRs too. It is the only thing that can
#                   notice an offloaded URL going dead, because those files are
#                   no longer in the tree the manifest projects.
#
#   sync            uploads what R2 does not already hold. It runs on main and
#                   on branch pushes alike, because content addressing means a
#                   branch and main share every object whose bytes they share --
#                   there is no preview bucket and no promotion step, so a PR
#                   preview's assets are simply already there. See ADR-0142 §6.
#
# The sync job cannot run until the bucket and the scoped token exist; until
# then it fails closed on the missing secrets, which is correct. See ADR-0142
# §11 for exactly what needs provisioning.

on:
  push:
    branches: ['**']
    paths:
      - '.github/assets/**'
      - 'docs/artifacts/**'
      - 'docs/pr-assets/**'
      - 'docs/pr-media/**'
      - 'docs/reports/**'
      - 'fleet-config-ui/docs/**'
      - 'website-v2/docs/**'
      - 'website-v2/screenshots/**'
      - 'media/r2-manifest.json'
      - 'scripts/r2-media-manifest.mjs'
      - 'scripts/check-r2-media-manifest.mjs'
      - 'scripts/sync-r2-media.mjs'
      - 'scripts/r2-offload-move.mjs'
      - 'scripts/verify-r2-public-reads.mjs'
      - 'media/r2-offloaded.json'
      - '.github/workflows/r2-media.yml'
  pull_request:
    paths:
      - '.github/assets/**'
      - 'docs/artifacts/**'
      - 'docs/pr-assets/**'
      - 'docs/pr-media/**'
      - 'docs/reports/**'
      - 'fleet-config-ui/docs/**'
      - 'website-v2/docs/**'
      - 'website-v2/screenshots/**'
      - 'media/r2-manifest.json'
      - 'scripts/r2-media-manifest.mjs'
      - 'scripts/check-r2-media-manifest.mjs'
      - 'scripts/sync-r2-media.mjs'
      - 'scripts/r2-offload-move.mjs'
      - 'scripts/verify-r2-public-reads.mjs'
      - 'media/r2-offloaded.json'
      - '.github/workflows/r2-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-drift:
    name: R2 media / manifest matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history is not needed, but the full WORKING TREE is: the manifest
      # is regenerated by hashing every tracked file under the offload roots,
      # and buildManifest() refuses an incomplete checkout rather than silently
      # emitting a shorter manifest.
      - uses: actions/checkout@v4
        with:
          # The manifest records the media bytes, not Git LFS pointer files.
          # Without hydration this job hashes 130-byte pointers and reports
          # every LFS-managed review image as drifted.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: media/r2-manifest.json is what regeneration produces right now
        run: node scripts/check-r2-media-manifest.mjs

  # The Phase 2 check, and the reason it is a separate job from `sync`.
  #
  # Once a file is removed from git, the manifest stops describing it (the
  # manifest is a projection of the tree) and NOTHING else would notice its URL
  # going dead. media/r2-offloaded.json is what describes those files, and this
  # job fetches every one of their URLs.
  #
  # IT HOLDS NO SECRETS. Not "it skips when secrets are absent" -- it has no
  # `env:` block at all, because a public bucket behind a custom domain answers
  # an anonymous GET. That is why it runs on `pull_request` including from a
  # fork, where `sync` deliberately cannot. A check that silently passes without
  # credentials is worse than no check; the fix here was to ask a question that
  # does not need them, rather than to skip.
  #
  # It compares BYTES, not status: each key is the sha256 of its object, so the
  # response body is hashed against the key. A 200 from the wrong object fails.
  public-reads:
    name: R2 media / offloaded files are publicly readable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --origin appends a cache-busting query so this reads past Cloudflare's
      # edge. Objects are served `immutable, max-age=31536000`, so a clobbered
      # object would keep serving the OLD cached bytes for up to a year and a
      # cache HIT would report health the origin does not have.
      - name: Every offloaded URL still serves the bytes its key claims
        run: node scripts/verify-r2-public-reads.mjs --origin

  sync:
    name: R2 media / upload what is missing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: manifest-drift
    # A fork PR has no access to repository secrets; running the sync there
    # would fail closed on every run and teach everyone to ignore a red job.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tool reads these four from the environment and refuses to start if
      # any is absent or blank. It never echoes a value: the secret is held on a
      # non-enumerable property with a redacting toJSON, and every error path
      # reports a status code and an object key instead.
      - name: Upload every manifest object R2 does not already hold
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Fallback transport. An account-owned Cloudflare API token cannot be
          # turned into an S3 access key id, so a repo holding only that token
          # sets this and leaves the two R2_*_KEY secrets unset. The tool picks
          # the S3 path whenever those exist and never silently downgrades.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-r2-media.mjs
