name: Proofs (TLA+ / Z3 / ProVerif / Kani / Monte Carlo)

# Runs the v2.6 mechanization artifacts that close the credibility loan
# from the game-theory expository page
# (website-v2/src/pages/whitepaper/HowWeProveGameTheory.tsx), plus the
# rest of the proof estate wired up in wave-p1/proof-estate:
#   - proofs/economics/delta-threshold.z3          (Z3 SMT)
#   - proofs/economics/claim_signaling.tla         (TLA+ via TLC)
#   - proofs/economics/claim_signaling.tla         (TLA+ via Apalache)
#   - proofs/bonded/conservation/Conservation.tla  (TLA+ via TLC)
#   - proofs/relay/CardRevocation.tla              (TLA+ via TLC, 3 configs)
#   - proofs/relay/WebhookDelivery.tla             (TLA+ via TLC, 2 configs)
#   - proofs/bonded/pareto/threat-bands.mjs        (Monte Carlo)
#   - every analyses/**, proofs/**, docs/adr/models/** .pv model (ProVerif)
#   - the three #[kani::proof] harnesses in core/harbor-card-rs (Kani)
#   - the 19 skills/harbor-results/scripts/*.py result-checkers (R1-R17)
#   - scripts/check-whitepaper-corpus.mjs (the estate's own WIRED/RETIRED
#     manifest, so an unregistered formal artifact fails closed)
#
# Failure of any job fails the PR. No untrusted inputs are used.

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'analyses/**'
      - 'docs/adr/models/**'
      - 'core/harbor-card-rs/**'
      - 'scripts/proofs/**'
      - 'whitepaper/corpus.json'
      - 'whitepaper/corpus.schema.json'
      - 'scripts/check-whitepaper-corpus.mjs'
      - 'tests/unit/whitepaper-corpus.test.js'
      - 'tests/unit/proverif-runner-comparison.test.mjs'
      - '.github/workflows/proofs.yml'
      - 'website-v2/public/whitepaper/agent-transactions-whitepaper.tex'
      - 'skills/harbor-results/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'analyses/**'
      - 'docs/adr/models/**'
      - 'core/harbor-card-rs/**'
      - 'scripts/proofs/**'
      - 'whitepaper/corpus.json'
      - 'whitepaper/corpus.schema.json'
      - 'scripts/check-whitepaper-corpus.mjs'
      - 'tests/unit/whitepaper-corpus.test.js'
      - 'tests/unit/proverif-runner-comparison.test.mjs'
      - '.github/workflows/proofs.yml'
      - 'website-v2/public/whitepaper/agent-transactions-whitepaper.tex'
      - 'skills/harbor-results/scripts/**'
  # Merge queue: trigger on the queued group so every proof job reports a check
  # context (no path filter is possible on merge_group). The heavy jobs SKIP on
  # merge_group via their per-job `if:` below, and a skipped job reports
  # success — so if any proof job is ever a required check, a queued PR that
  # doesn't touch proofs can never hang the merge queue waiting for a context
  # that never appears. The substantive proofs already ran at pull_request time
  # and re-run on push to main; the queue trusts that result.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z3-delta-threshold:
    # Skip on merge_group (reports success) — keeps the queue from hanging; the
    # real proof ran at PR time and re-runs on push to main.
    if: github.event_name != 'merge_group'
    name: Z3 / delta-threshold cubic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Z3
        run: |
          set -euo pipefail
          sudo apt-get update
          # Pinned to the Ubuntu 24.04 (noble) universe archive build,
          # queried 2026-09-06 via Launchpad
          # (getPublishedBinaries for z3/noble/amd64). If ubuntu-latest
          # migrates to a newer Ubuntu release and this build string 404s,
          # re-pin with: apt-cache madison z3
          sudo apt-get install -y z3=4.8.12-3.1build1
          z3 --version

      - name: Run delta-threshold.z3
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          z3 delta-threshold.z3 | tee delta-threshold.actual.txt

      - name: Assert sat / sat / unsat triple
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          # Expected sequence: sat, sat, unsat (three check-sat results).
          # Match only lone 'sat'/'unsat' lines (ignore tokens inside
          # (define-fun ...)).
          results=$(grep -E '^(sat|unsat)$' delta-threshold.actual.txt | tr '\n' ' ' | sed 's/ *$//')
          echo "results = [$results]"
          if [ "$results" != "sat sat unsat" ]; then
            echo "FAIL: expected 'sat sat unsat', got '$results'"
            echo "Full output:"
            cat delta-threshold.actual.txt
            exit 1
          fi
          echo "PASS: delta-threshold cubic has a unique root in [0.34, 0.35]."

      - name: Upload Z3 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-threshold-z3-output
          path: proofs/economics/delta-threshold.actual.txt

  tla-claim-signaling:
    if: github.event_name != 'merge_group'
    name: TLA+ / claim-signaling (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          # Pinned to v1.8.0 — same line the Conservation.tla artifact
          # was validated against.
          curl -sSL -o "${HOME}/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run claim_signaling under TLC
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC \
            -config claim_signaling.cfg claim_signaling.tla \
            | tee claim_signaling.tlc.log

      - name: Assert no invariant violation
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          if grep -q "No error has been found" claim_signaling.tlc.log; then
            echo "PASS: TLC found no invariant violation."
          else
            echo "FAIL: TLC did not report 'No error has been found'."
            tail -50 claim_signaling.tlc.log
            exit 1
          fi

      - name: Run sweep across delta (TLC)
        working-directory: proofs/economics
        env:
          TLA_TOOLS_JAR: ${{ env.TLA_TOOLS_JAR }}
        run: |
          set -euo pipefail
          chmod +x sweep-delta.sh
          ./sweep-delta.sh | tee sweep-delta.tlc.log

      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-signaling-tlc-log
          path: |
            proofs/economics/claim_signaling.tlc.log
            proofs/economics/sweep-delta.tlc.log

  tla-claim-signaling-apalache:
    if: github.event_name != 'merge_group'
    name: TLA+ / claim_signaling (Apalache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apalache
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/apalache"
          # Pinned to v0.57.0 — the version this artifact was validated
          # against locally on macOS Darwin 26.1 / OpenJDK 26 on 2026-05-20.
          # SMT/Z3 is bundled. ~130 MB.
          curl -sSL -o /tmp/apalache.tgz \
            https://github.com/apalache-mc/apalache/releases/download/v0.57.0/apalache.tgz
          tar -xzf /tmp/apalache.tgz -C "${HOME}/apalache"
          echo "${HOME}/apalache/apalache/bin" >> "$GITHUB_PATH"

      - name: Verify Apalache install
        run: apalache-mc version

      - name: Run claim_signaling under Apalache
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          apalache-mc check \
            --inv=NoUnilateralDeviationPositive \
            --length=10 \
            --config=claim_signaling.cfg \
            claim_signaling.tla \
            | tee claim_signaling.apalache.log

      - name: Assert no Apalache error
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          if grep -q "The outcome is: NoError" claim_signaling.apalache.log; then
            echo "PASS: Apalache reports NoError on the IC invariant at delta=0.35."
          else
            echo "FAIL: Apalache did not report NoError."
            tail -100 claim_signaling.apalache.log
            exit 1
          fi

      - name: Run sweep across delta (Apalache)
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          chmod +x sweep-delta.sh
          TLA_CHECKER=apalache ./sweep-delta.sh | tee sweep-delta.apalache.log

      - name: Upload Apalache logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-signaling-apalache-log
          path: |
            proofs/economics/claim_signaling.apalache.log
            proofs/economics/sweep-delta.apalache.log

  tla-conservation:
    if: github.event_name != 'merge_group'
    name: TLA+ / bonded Conservation (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          curl -sSL -o "${HOME}/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run Conservation under TLC
        working-directory: proofs/bonded/conservation
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC \
            -config Conservation.cfg Conservation.tla \
            | tee Conservation.tlc.log

      - name: Assert no invariant violation
        working-directory: proofs/bonded/conservation
        run: |
          set -euo pipefail
          if grep -q "No error has been found" Conservation.tlc.log; then
            echo "PASS: TLC found no invariant violation on Conservation."
          else
            echo "FAIL: TLC did not report 'No error has been found'."
            tail -50 Conservation.tlc.log
            exit 1
          fi

      - name: Upload Conservation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservation-tlc-log
          path: proofs/bonded/conservation/Conservation.tlc.log

  monte-carlo-threat-bands:
    if: github.event_name != 'merge_group'
    name: Monte Carlo / threat-bands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run threat-bands.mjs (text + JSON)
        run: |
          set -euo pipefail
          node proofs/bonded/pareto/threat-bands.mjs --samples=1000 \
            | tee proofs/bonded/pareto/threat-bands.ci.log
          node proofs/bonded/pareto/threat-bands.mjs --samples=1000 --json \
            > proofs/bonded/pareto/threat-bands.ci.json

      - name: Assert zero matched-band failures
        run: |
          set -euo pipefail
          matched_failures=$(jq '.matched_failures | length' proofs/bonded/pareto/threat-bands.ci.json)
          echo "matched_failures = $matched_failures"
          if [ "$matched_failures" != "0" ]; then
            echo "FAIL: matched-band assertion violated."
            jq '.matched_failures' proofs/bonded/pareto/threat-bands.ci.json
            exit 1
          fi
          widening=$(jq '.widening_recommendations | length' proofs/bonded/pareto/threat-bands.ci.json)
          echo "widening_recommendations = $widening (informational)"
          echo "PASS: all matched-band rows within the assertion ceiling."

      - name: Upload Monte Carlo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threat-bands-output
          path: |
            proofs/bonded/pareto/threat-bands.ci.log
            proofs/bonded/pareto/threat-bands.ci.json

  # ── Harbor research estate (R1–R12): every executed result re-verified ──────
  # The strongest verification work in the repo previously had zero CI coverage
  # (scripts lived in skills/, invoked by nothing). Each script asserts its own
  # headline numbers at seed 20260816 and exits nonzero on drift; a failure
  # here means a result the volume cites no longer reproduces.
  harbor-results-estate:
    name: Harbor results / R-scripts (seed 20260816)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric deps (pinned)
        run: pip install -r skills/harbor-results/scripts/requirements.txt
      - name: Run the executed-results scripts
        run: |
          set -euo pipefail
          cd skills/harbor-results/scripts
          for s in a3_epsilon_ledger a4_canary_sprt a6_no_mint                    a7_experiment b1_frontier b2_tower b3_controllability                    b4_deontic_fragment b5_engine_substitution b6_probation                    b7_escalation_band b8_specialization b9_context_paging                    c0_workunit c1_noninterference sheaf_mechanism_proof                    sheaf_harness_v2 sheaf_consistency_radius zoom_bound_check; do
            echo "::group::$s"
            python3 "$s.py"
            echo "::endgroup::"
          done

  # ── ProVerif (2.05): the model estate that never ran ────────────────────────
  # 25 .pv models under analyses/, proofs/**, and docs/adr/models/ previously
  # had zero CI coverage -- evidenced only by committed *_results.txt/.run.log
  # transcripts a human ran locally at some point. scripts/proofs/run-proverif.py
  # re-runs every one of them and fails on any RESULT-line drift from its
  # committed evidence, and separately asserts every negative control
  # (*_vuln*.pv, *naive_unsound*.pv) genuinely fails its query (so the checker
  # itself can't go vacuous). skills/pd-relay-zero-trust/templates/proverif-relay.pv
  # is a skill teaching template, not a claim about this repo's protocol, and is
  # deliberately out of the runner's three scan roots (see whitepaper/corpus.json).
  proverif-estate:
    if: github.event_name != 'merge_group'
    name: ProVerif / model estate (2.05)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ProVerif 2.05 (opam, pinned)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export OPAMYES=1
          sudo apt-get update
          # opam itself pinned to the Ubuntu 24.04 (noble) archive version;
          # pkg-config/libgtk2.0-dev/m4 satisfy proverif's opam dependency on
          # conf-gtk2 (its bundled graph viewer links against GTK2 even
          # though this job only needs the `proverif` CLI).
          sudo apt-get install -y opam=2.1.5-1 pkg-config libgtk2.0-dev m4
          opam init --bare --disable-sandboxing -y
          # Pinned OCaml compiler. proverif.2.05 itself only requires
          # ocaml >= 4.03; 4.14.2 is just a concrete, reproducible choice
          # confirmed to build proverif.2.05 + its lablgtk dependency cleanly.
          opam switch create default 4.14.2
          eval "$(opam env)"
          # Pinned to 2.05 -- see https://bblanche.gitlabpages.inria.fr/proverif/
          # ("Install with OPAM: opam install proverif"; no Linux prebuilt
          # binary is offered, only a Windows one, so opam is the
          # reproducible route on ubuntu-latest).
          opam install -y proverif.2.05
          eval "$(opam env)"
          echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Verify ProVerif install
        run: proverif -help | head -3

      - name: Run the ProVerif estate checker
        run: |
          set -euo pipefail
          python3 scripts/proofs/run-proverif.py --check | tee proverif-estate-summary.md

      - name: Upload check summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proverif-estate-summary
          path: proverif-estate-summary.md

  # ── Kani: the harnesses that never ran ───────────────────────────────────────
  # core/harbor-card-rs carries three #[kani::proof] harnesses (added in
  # anticipation of this job -- Cargo.toml already allow-lists `cfg(kani)`) but
  # nothing ever installed kani-verifier or ran `cargo kani`, so they never
  # executed even once.
  #
  # proof_verify_logic_only is genuinely expensive: even with its crypto/decode
  # internals stubbed, CBMC still bit-blasts a fully symbolic 32-byte
  # core::str::from_utf8 validation plus the stub's own concrete-input call
  # into curve25519-dalek's field arithmetic. Verified locally to run for
  # 40+ CPU-minutes at 99%+ CPU before this comment was written (still running
  # when this job was authored) -- timeout-minutes below is generous on
  # purpose. If this becomes a real per-PR tax, consider moving it to a
  # schedule/nightly trigger instead of pull_request/push.
  kani-harbor-card:
    if: github.event_name != 'merge_group'
    name: Kani / harbor-card-rs (3 proof harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: core/harbor-card-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/harbor-card-rs
          key: kani

      - name: Install kani-verifier (pinned)
        run: |
          set -euo pipefail
          # Pinned to 0.67.0 -- the latest stable release per crates.io
          # metadata as of 2026-09-06 (default_version/max_version/
          # newest_version/max_stable_version all agree; see
          # https://crates.io/api/v1/crates/kani-verifier).
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      - name: Run the three #[kani::proof] harnesses
        run: |
          set -euo pipefail
          # -Z stubbing: proof_verify_logic_only replaces the crypto/decode
          # internals with symbolic-friendly stand-ins via #[kani::stub(...)]
          # (see the harness's own doc comment); that attribute is gated
          # behind Kani's unstable stubbing feature.
          cargo kani -Z stubbing | tee kani.log

      - name: Assert all three harnesses verified successfully
        run: |
          set -euo pipefail
          if grep -q "Complete - 3 successfully verified harnesses, 0 failures, 3 total." kani.log; then
            echo "PASS: all three Kani harnesses verified."
          else
            echo "FAIL: expected all three harnesses to verify cleanly."
            tail -80 kani.log
            exit 1
          fi

      - name: Upload Kani output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-harbor-card-log
          path: core/harbor-card-rs/kani.log

  # ── Relay TLA+ (TLC): revocation finality and webhook delivery ──────────────
  # proofs/relay/{CardRevocation,WebhookDelivery}.tla and their five .cfg files
  # had zero CI coverage. Both models exhaust their finite bounded state space
  # -- once every card is issued+revoked, or every event delivered, there is
  # nothing left to do -- so `-deadlock` is required on every config (verified
  # locally: without it, TLC reports "Error: Deadlock reached" on the PASSING
  # configs too; -deadlock does not affect genuine invariant violations, which
  # TLC still reports normally).
  tla-relay-card-revocation:
    if: github.event_name != 'merge_group'
    name: TLA+ / relay CardRevocation (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          curl -sSL -o "${HOME}/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run CardRevocation under TLC (baseline, epoch mitigation, rollback attack)
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config CardRevocation_baseline.cfg CardRevocation.tla \
            | tee CardRevocation_baseline.tlc.log
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config CardRevocation_epoch.cfg CardRevocation.tla \
            | tee CardRevocation_epoch.tlc.log
          # Negative control: Rollback=TRUE, Epoched=FALSE reproduces ADR-0018
          # Attack Vector 2 (backup/restore) and MUST violate RevocationFinal.
          # TLC exits nonzero when it finds a violation; `|| true` lets this
          # specific run "fail" so the assertion step below can judge it --
          # the baseline/epoch runs above are NOT given this treatment, so an
          # unexpected TLC failure on either of those still aborts the job here.
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config CardRevocation_rollback.cfg CardRevocation.tla \
            | tee CardRevocation_rollback.tlc.log || true

      - name: Assert baseline and epoch mitigation hold, rollback is refuted by design
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          for cfg in baseline epoch; do
            if grep -q "No error has been found" "CardRevocation_${cfg}.tlc.log"; then
              echo "PASS: CardRevocation_${cfg} -- TLC found no invariant violation."
            else
              echo "FAIL: CardRevocation_${cfg} did not report 'No error has been found'."
              tail -50 "CardRevocation_${cfg}.tlc.log"
              exit 1
            fi
          done
          if grep -q "No error has been found" CardRevocation_rollback.tlc.log; then
            echo "FAIL: CardRevocation_rollback was expected to violate RevocationFinal (the backup/restore attack, ADR-0018 Attack Vector 2) but TLC reported no error -- the negative control has gone vacuous."
            exit 1
          fi
          if grep -q "Invariant RevocationFinal is violated" CardRevocation_rollback.tlc.log; then
            echo "PASS: CardRevocation_rollback violates RevocationFinal as designed (negative control)."
          else
            echo "FAIL: CardRevocation_rollback did not report the expected RevocationFinal violation -- TLC may have failed for an unrelated reason."
            tail -50 CardRevocation_rollback.tlc.log
            exit 1
          fi

      - name: Upload CardRevocation TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-card-revocation-tlc-log
          path: |
            proofs/relay/CardRevocation_baseline.tlc.log
            proofs/relay/CardRevocation_epoch.tlc.log
            proofs/relay/CardRevocation_rollback.tlc.log

  tla-relay-webhook-delivery:
    if: github.event_name != 'merge_group'
    name: TLA+ / relay WebhookDelivery (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          curl -sSL -o "${HOME}/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run WebhookDelivery under TLC (fixed daemon, negative control)
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config WebhookDelivery.cfg WebhookDelivery.tla \
            | tee WebhookDelivery.tlc.log
          # Negative control: Dedup=FALSE dispatches whatever the (adversarial)
          # relay delivers. AtMostOnce MUST fail once the relay duplicates a
          # delivery. See the CardRevocation job above for why `|| true` here
          # is deliberate and scoped to only this one, expected-to-fail run.
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config WebhookDelivery_vuln.cfg WebhookDelivery.tla \
            | tee WebhookDelivery_vuln.tlc.log || true

      - name: Assert the fixed daemon holds, the negative control is refuted by design
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          if grep -q "No error has been found" WebhookDelivery.tlc.log; then
            echo "PASS: WebhookDelivery (Dedup=TRUE) -- TLC found no safety or liveness violation."
          else
            echo "FAIL: WebhookDelivery did not report 'No error has been found'."
            tail -50 WebhookDelivery.tlc.log
            exit 1
          fi
          if grep -q "No error has been found" WebhookDelivery_vuln.tlc.log; then
            echo "FAIL: WebhookDelivery_vuln (Dedup=FALSE) was expected to violate AtMostOnce but TLC reported no error -- the negative control has gone vacuous."
            exit 1
          fi
          if grep -q "Invariant AtMostOnce is violated" WebhookDelivery_vuln.tlc.log; then
            echo "PASS: WebhookDelivery_vuln violates AtMostOnce as designed (negative control)."
          else
            echo "FAIL: WebhookDelivery_vuln did not report the expected AtMostOnce violation -- TLC may have failed for an unrelated reason."
            tail -50 WebhookDelivery_vuln.tlc.log
            exit 1
          fi

      - name: Upload WebhookDelivery TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-webhook-delivery-tlc-log
          path: |
            proofs/relay/WebhookDelivery.tlc.log
            proofs/relay/WebhookDelivery_vuln.tlc.log

  # ── Proof-estate manifest: WIRED or RETIRED, no third state ─────────────────
  # whitepaper/corpus.json is the ledger every formal artifact and R-script
  # must appear in; scripts/check-whitepaper-corpus.mjs fails the build if an
  # on-disk formal artifact (or #[kani::proof] harness) is unregistered, or if
  # a registered path is missing on disk. Node/stdlib-only; no TLA+/Z3/
  # ProVerif/Kani toolchain needed, so this job is fast.
  whitepaper-corpus-manifest:
    name: Proof estate / manifest (WIRED or RETIRED)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every formal artifact is WIRED to a CI job or explicitly RETIRED
        run: node scripts/check-whitepaper-corpus.mjs

      - name: ProVerif result-comparison unit tests (offline, no ProVerif needed)
        run: node --test tests/unit/proverif-runner-comparison.test.mjs
