name: Proofs (TLA+ / Z3 / ProVerif / Kani / Monte Carlo)

# Runs the v2.6 mechanization artifacts that close the credibility loan
# from the game-theory expository page
# (website-v2/src/pages/whitepaper/HowWeProveGameTheory.tsx), plus the
# rest of the proof estate wired up in wave-p1/proof-estate:
#   - proofs/economics/delta-threshold.z3          (Z3 SMT)
#   - proofs/economics/claim_signaling.tla         (TLA+ via TLC)
#   - proofs/economics/claim_signaling.tla         (TLA+ via Apalache)
#   - proofs/bonded/conservation/Conservation.tla  (TLA+ via TLC)
#   - proofs/relay/CardRevocation.tla              (TLA+ via TLC, 4 configs)
#   - proofs/relay/WebhookDelivery.tla             (TLA+ via TLC, 2 configs)
#   - proofs/bonded/pareto/threat-bands.mjs        (Monte Carlo)
#   - every analyses/** and proofs/** .pv model (ProVerif)
#   - the decoded-policy, attenuation, comparator and parser harnesses in core/harbor-card-rs (Kani)
#   - the 20 skills/harbor-results/scripts/*.py result-checkers (R1-R17)
#   - scripts/check-whitepaper-corpus.mjs (the estate's own WIRED/RETIRED
#     manifest, so an unregistered formal artifact fails closed)
#
# Failure of any job fails the PR. No untrusted inputs are used.

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'analyses/**'
      - 'core/harbor-card-rs/**'
      - 'scripts/proofs/**'
      - 'book/corpus.json'
      - 'book/corpus.schema.json'
      - 'scripts/check-whitepaper-corpus.mjs'
      - 'tests/unit/whitepaper-corpus.test.js'
      - 'tests/unit/proverif-runner-comparison.test.mjs'
      - '.github/workflows/proofs.yml'
      - 'book/agent-transactions-whitepaper.tex'
      - 'skills/harbor-results/scripts/**'
      - 'tests/fixtures/harbor-research/**'
      - 'docs/harbor-research/research/claim-audit-example.json'
      - 'scripts/harbor-research/**'
      - 'docs/harbor-research/campaigns/2026-11-06/models/**'
      - 'docs/harbor-research/campaigns/2026-11-06/white/**'
      - 'docs/harbor-research/campaigns/2026-11-06/round-two/**'
      - 'skills/harbor-results/SKILL.md'
      - 'package.json'
      - 'package-lock.json'
      # The writer audit discovers new files, not only known dispatch paths.
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.sql'
  pull_request:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'analyses/**'
      - 'core/harbor-card-rs/**'
      - 'scripts/proofs/**'
      - 'book/corpus.json'
      - 'book/corpus.schema.json'
      - 'scripts/check-whitepaper-corpus.mjs'
      - 'tests/unit/whitepaper-corpus.test.js'
      - 'tests/unit/proverif-runner-comparison.test.mjs'
      - '.github/workflows/proofs.yml'
      - 'book/agent-transactions-whitepaper.tex'
      - 'skills/harbor-results/scripts/**'
      - 'tests/fixtures/harbor-research/**'
      - 'docs/harbor-research/research/claim-audit-example.json'
      - 'scripts/harbor-research/**'
      - 'docs/harbor-research/campaigns/2026-11-06/models/**'
      - 'docs/harbor-research/campaigns/2026-11-06/white/**'
      - 'docs/harbor-research/campaigns/2026-11-06/round-two/**'
      - 'skills/harbor-results/SKILL.md'
      - 'package.json'
      - 'package-lock.json'
      # Match the source audit's language domain, including future writers.
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.sql'
  # Merge queue: trigger on the queued group so every proof job reports a check
  # context (no path filter is possible on merge_group). The heavy jobs SKIP on
  # merge_group via their per-job `if:` below, and a skipped job reports
  # success — so if any proof job is ever a required check, a queued PR that
  # doesn't touch proofs can never hang the merge queue waiting for a context
  # that never appears. The substantive proofs already ran at pull_request time
  # and re-run on push to main; the queue trusts that result.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z3-delta-threshold:
    # Skip on merge_group (reports success) — keeps the queue from hanging; the
    # real proof ran at PR time and re-runs on push to main.
    if: github.event_name != 'merge_group'
    name: Z3 / delta-threshold cubic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Z3
        run: |
          set -euo pipefail
          sudo apt-get update
          # Pinned to the Ubuntu 24.04 (noble) universe archive build,
          # queried 2026-09-06 via Launchpad
          # (getPublishedBinaries for z3/noble/amd64). Keep the runner
          # release aligned with this pinned archive build; a runner upgrade
          # requires an explicit solver-version and proof-evidence review.
          sudo apt-get install -y z3=4.8.12-3.1build1
          z3 --version

      - name: Run delta-threshold.z3
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          z3 delta-threshold.z3 | tee delta-threshold.actual.txt

      - name: Assert sat / sat / unsat triple
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          # Expected sequence: sat, sat, unsat (three check-sat results).
          # Match only lone 'sat'/'unsat' lines (ignore tokens inside
          # (define-fun ...)).
          results=$(grep -E '^(sat|unsat)$' delta-threshold.actual.txt | tr '\n' ' ' | sed 's/ *$//')
          echo "results = [$results]"
          if [ "$results" != "sat sat unsat" ]; then
            echo "FAIL: expected 'sat sat unsat', got '$results'"
            echo "Full output:"
            cat delta-threshold.actual.txt
            exit 1
          fi
          echo "PASS: delta-threshold cubic has a unique root in [0.34, 0.35]."

      - name: Upload Z3 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-threshold-z3-output
          path: proofs/economics/delta-threshold.actual.txt

  tla-claim-signaling:
    if: github.event_name != 'merge_group'
    name: TLA+ / claim-signaling (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache TLA+ tools
        # Keyed on the pinned version: a warm cache means this job never
        # touches GitHub's release CDN. Bump with the URL below.
        uses: actions/cache@v4
        with:
          path: ~/tla/tla2tools.jar
          key: pinned-tla2tools-v1.8.0

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          # Pinned to v1.8.0 — same line the Conservation.tla artifact
          # was validated against.
          #
          # Retrying, and every other pinned-tool fetch in this file with it:
          # on 2026-09-08 this exact line died with "curl: (35) Recv failure:
          # Connection reset by peer" and red-lighted the claim-signaling gate
          # without TLC ever starting. A formal-verification result that turns
          # on one TCP connection is not reporting on the proof, it is
          # reporting on GitHub's CDN. --retry-all-errors is the flag that
          # matters: plain --retry ignores a reset mid-transfer.
          # Fetched through the shared script: it refuses an error page saved
          # as the jar, which is how a CDN 504 used to surface here as
          # "Could not find or load main class tlc2.TLC".
          "${GITHUB_WORKSPACE}/scripts/ci/fetch-pinned-tool.sh" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            "${HOME}/tla/tla2tools.jar" jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run claim_signaling under TLC
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC \
            -config claim_signaling.cfg claim_signaling.tla \
            | tee claim_signaling.tlc.log

      - name: Assert no invariant violation
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          if grep -q "No error has been found" claim_signaling.tlc.log; then
            echo "PASS: TLC found no invariant violation."
          else
            echo "FAIL: TLC did not report 'No error has been found'."
            tail -50 claim_signaling.tlc.log
            exit 1
          fi

      - name: "Negative control: delta 0.30 must violate"
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          # delta = 30/100 = 0.30 is BELOW the closed-form threshold
          # delta* ~= 0.3425 (delta-threshold.z3), so the IC invariant MUST
          # fail here. TLC exits nonzero on a violation -- that is the
          # expected outcome, so `|| true` lets this one run "fail" and the
          # assertions below judge it (same pattern as the relay
          # CardRevocation_rollback / WebhookDelivery_vuln negative controls).
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC \
            -config claim_signaling_delta30.cfg claim_signaling.tla \
            | tee claim_signaling_delta30.tlc.log || true

          if grep -q "No error has been found" claim_signaling_delta30.tlc.log; then
            echo "FAIL: claim_signaling_delta30 (delta=0.30) was expected to violate NoUnilateralDeviationPositive but TLC reported no error -- the negative control has gone vacuous."
            exit 1
          fi

          VIOLATION="Invariant NoUnilateralDeviationPositive is violated."
          if grep -qF "$VIOLATION" claim_signaling_delta30.tlc.log; then
            echo "PASS: claim_signaling_delta30 violates NoUnilateralDeviationPositive as designed (negative control)."
          else
            echo "FAIL: claim_signaling_delta30 did not report the expected violation string: $VIOLATION"
            tail -50 claim_signaling_delta30.tlc.log
            exit 1
          fi

          # The committed proofs/economics/claim_signaling_delta30.run.log is
          # the trace cited by the whitepaper's ex:bonded-tla-two-deltas
          # solution -- if the counterexample shape ever drifts (spec edit,
          # TLC version bump), this run's trace and the committed one must
          # still agree on how many states TLC printed.
          actual_states=$(grep -cE '^State [0-9]+:' claim_signaling_delta30.tlc.log || true)
          committed_states=$(grep -cE '^State [0-9]+:' claim_signaling_delta30.run.log || true)
          echo "trace states: this run = ${actual_states}, committed claim_signaling_delta30.run.log = ${committed_states}"
          if [ "$actual_states" != "$committed_states" ]; then
            echo "FAIL: counterexample trace length changed (${actual_states} states) vs the committed claim_signaling_delta30.run.log (${committed_states} states) -- re-run TLC locally and update the committed log."
            exit 1
          fi
          echo "PASS: counterexample trace length (${actual_states} states) matches the committed claim_signaling_delta30.run.log."

      - name: Run sweep across delta (TLC)
        working-directory: proofs/economics
        env:
          TLA_TOOLS_JAR: ${{ env.TLA_TOOLS_JAR }}
        run: |
          set -euo pipefail
          chmod +x sweep-delta.sh
          ./sweep-delta.sh | tee sweep-delta.tlc.log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check admission revision and concrete TLC controls
        run: python3 -B scripts/harbor-research/check_admission_revision.py --jar "${TLA_TOOLS_JAR}"

      - name: Check atomic admission and exact TLC witnesses
        run: python3 -B scripts/harbor-research/check_atomic_admission_model.py --jar "${TLA_TOOLS_JAR}"

      - name: Check atomic admission evidence validation
        run: python3 -B -m unittest discover -s scripts/harbor-research -p test_atomic_admission_model.py -v

      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-signaling-tlc-log
          include-hidden-files: true
          path: |
            proofs/economics/claim_signaling.tlc.log
            proofs/economics/claim_signaling_delta30.tlc.log
            proofs/economics/sweep-delta.tlc.log
            .cache/admission-revision/
            .cache/atomic-admission/

  tla-claim-signaling-apalache:
    if: github.event_name != 'merge_group'
    name: TLA+ / claim_signaling (Apalache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Apalache
        # Keyed on the pinned version, like the TLA+ tools above.
        uses: actions/cache@v4
        with:
          path: ~/pinned/apalache.tgz
          key: pinned-apalache-v0.57.0

      - name: Download Apalache
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/apalache"
          # Pinned to v0.57.0 — the version this artifact was validated
          # against locally on macOS Darwin 26.1 / OpenJDK 26 on 2026-05-20.
          # SMT/Z3 is bundled. ~130 MB.
          "${GITHUB_WORKSPACE}/scripts/ci/fetch-pinned-tool.sh" \
            https://github.com/apalache-mc/apalache/releases/download/v0.57.0/apalache.tgz \
            "${HOME}/pinned/apalache.tgz" tgz
          tar -xzf "${HOME}/pinned/apalache.tgz" -C "${HOME}/apalache"
          echo "${HOME}/apalache/apalache/bin" >> "$GITHUB_PATH"

      - name: Verify Apalache install
        run: apalache-mc version

      - name: Run claim_signaling under Apalache
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          apalache-mc check \
            --inv=NoUnilateralDeviationPositive \
            --length=10 \
            --config=claim_signaling.cfg \
            claim_signaling.tla \
            | tee claim_signaling.apalache.log

      - name: Assert no Apalache error
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          if grep -q "The outcome is: NoError" claim_signaling.apalache.log; then
            echo "PASS: Apalache reports NoError on the IC invariant at delta=0.35."
          else
            echo "FAIL: Apalache did not report NoError."
            tail -100 claim_signaling.apalache.log
            exit 1
          fi

      - name: Run sweep across delta (Apalache)
        working-directory: proofs/economics
        run: |
          set -euo pipefail
          chmod +x sweep-delta.sh
          TLA_CHECKER=apalache ./sweep-delta.sh | tee sweep-delta.apalache.log

      - name: Upload Apalache logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-signaling-apalache-log
          path: |
            proofs/economics/claim_signaling.apalache.log
            proofs/economics/sweep-delta.apalache.log

  tla-conservation:
    if: github.event_name != 'merge_group'
    name: TLA+ / bonded Conservation (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache TLA+ tools
        # Keyed on the pinned version: a warm cache means this job never
        # touches GitHub's release CDN. Bump with the URL below.
        uses: actions/cache@v4
        with:
          path: ~/tla/tla2tools.jar
          key: pinned-tla2tools-v1.8.0

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          # Fetched through the shared script: it refuses an error page saved
          # as the jar, which is how a CDN 504 used to surface here as
          # "Could not find or load main class tlc2.TLC".
          "${GITHUB_WORKSPACE}/scripts/ci/fetch-pinned-tool.sh" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            "${HOME}/tla/tla2tools.jar" jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run Conservation under TLC
        working-directory: proofs/bonded/conservation
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC \
            -config Conservation.cfg Conservation.tla \
            | tee Conservation.tlc.log

      - name: Assert no invariant violation
        working-directory: proofs/bonded/conservation
        run: |
          set -euo pipefail
          if grep -q "No error has been found" Conservation.tlc.log; then
            echo "PASS: TLC found no invariant violation on Conservation."
          else
            echo "FAIL: TLC did not report 'No error has been found'."
            tail -50 Conservation.tlc.log
            exit 1
          fi

      - name: Upload Conservation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservation-tlc-log
          path: proofs/bonded/conservation/Conservation.tlc.log

  monte-carlo-threat-bands:
    if: github.event_name != 'merge_group'
    name: Monte Carlo / threat-bands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run threat-bands.mjs (text + JSON)
        run: |
          set -euo pipefail
          node proofs/bonded/pareto/threat-bands.mjs --samples=1000 \
            | tee proofs/bonded/pareto/threat-bands.ci.log
          node proofs/bonded/pareto/threat-bands.mjs --samples=1000 --json \
            > proofs/bonded/pareto/threat-bands.ci.json

      - name: Assert zero matched-band failures
        run: |
          set -euo pipefail
          matched_failures=$(jq '.matched_failures | length' proofs/bonded/pareto/threat-bands.ci.json)
          echo "matched_failures = $matched_failures"
          if [ "$matched_failures" != "0" ]; then
            echo "FAIL: matched-band assertion violated."
            jq '.matched_failures' proofs/bonded/pareto/threat-bands.ci.json
            exit 1
          fi
          widening=$(jq '.widening_recommendations | length' proofs/bonded/pareto/threat-bands.ci.json)
          echo "widening_recommendations = $widening (informational)"
          echo "PASS: all matched-band rows within the assertion ceiling."

      - name: Upload Monte Carlo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threat-bands-output
          path: |
            proofs/bonded/pareto/threat-bands.ci.log
            proofs/bonded/pareto/threat-bands.ci.json

  # ── Harbor research estate (R1–R12): every executed result re-verified ──────
  # The strongest verification work in the repo previously had zero CI coverage
  # (scripts lived in skills/, invoked by nothing). Each script asserts its own
  # headline numbers at seed 20260816 and exits nonzero on drift; a failure
  # here means a result the volume cites no longer reproduces.
  harbor-results-estate:
    name: Harbor results / R-scripts (seed 20260816)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric deps (pinned)
        run: pip install -r skills/harbor-results/scripts/requirements.txt
      - name: Run the executed-results scripts
        run: |
          set -euo pipefail
          cd skills/harbor-results/scripts
          for s in a3_epsilon_ledger a4_canary_sprt a6_no_mint                    a7_experiment b1_frontier b2_tower b3_controllability                    b4_deontic_fragment b5_engine_substitution b6_probation                    b7_escalation_band b8_specialization b9_context_paging                    c0_workunit c1_noninterference sheaf_mechanism_proof                    sheaf_harness_v2 paper7_failure_cases continuation_observation_model receipt_bundle_design sheaf_consistency_radius sheaf_repair_and_2complex zoom_bound_check test_cr4_contract; do
            echo "::group::$s"
            python3 "$s.py"
            echo "::endgroup::"
          done

      # The heavy-tail sweep takes about 17 minutes, so CI does not re-run it.
      # --check recomputes every derived number from the stored delays and
      # compares the Book's figure, table and quoted numbers with them;
      # --smoke runs the simulator live against two exact answers.
      - name: Heavy-tail sweep, stored results and a live smoke run
        run: |
          set -euo pipefail
          python3 -B skills/harbor-results/scripts/b8_heavy_tails.py --check
          python3 -B skills/harbor-results/scripts/b8_heavy_tails.py --smoke

      - name: Check categorical claims and retained-evidence certificates
        run: |
          set -euo pipefail
          python3 -B skills/harbor-results/scripts/test_claim_audit.py
          python3 -B skills/harbor-results/scripts/test_costed_claim_certificates.py
          python3 -B skills/harbor-results/scripts/claim_audit.py docs/harbor-research/research/claim-audit-example.json --hodge
          python3 -B skills/harbor-results/scripts/research_envelopes.py
          python3 -B skills/harbor-results/scripts/test_research_envelopes.py
          python3 -B skills/harbor-results/scripts/test_legibility_corrections.py

      - name: Check future admission and all-state bonded incentives
        run: |
          set -euo pipefail
          python3 -B skills/harbor-results/scripts/test_future_fact_reachability.py
          python3 -B skills/harbor-results/scripts/test_bonded_trigger_audit.py

      - name: Check literature-scout counterexamples and graph controls
        run: |
          set -euo pipefail
          python3 -B skills/harbor-results/scripts/scout_claim_counterexamples.py
          python3 -B skills/harbor-results/scripts/scout_graph_code_checks.py

      - name: Check campaign evidence recorder and transcript export
        run: |
          set -euo pipefail
          # Unix fcntl/process groups are available on this Ubuntu runner.
          # Recorder fixtures enforce this scratch root; no HOME override.
          mkdir -p "${HOME}/coding/tmp"
          python3 -B scripts/harbor-research/test_war_room.py
          python3 -B scripts/harbor-research/test_export_campaign_transcripts.py
          python3 -B scripts/harbor-research/check_campaign_seals.py

  # ── ProVerif (2.05): the model estate that never ran ────────────────────────
  # 25 .pv models under analyses/ and proofs/** previously had
  # zero CI coverage -- evidenced only by committed *_results.txt/.run.log
  # transcripts a human ran locally at some point. scripts/proofs/run-proverif.py
  # re-runs every one of them and fails on any RESULT-line drift from its
  # committed evidence, and separately asserts every negative control
  # (*_vuln*.pv, *naive_unsound*.pv) genuinely fails its query (so the checker
  # itself can't go vacuous). skills/pd-relay-zero-trust/templates/proverif-relay.pv
  # is a skill teaching template, not a claim about this repo's protocol, and is
  # deliberately out of the runner's two scan roots (see book/corpus.json).
  proverif-estate:
    if: github.event_name != 'merge_group'
    name: ProVerif / model estate (2.05)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ProVerif 2.05 (opam, pinned)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export OPAMYES=1
          sudo apt-get update
          # opam itself pinned to the Ubuntu 24.04 (noble) archive version;
          # pkg-config/libgtk2.0-dev/m4 satisfy proverif's opam dependency on
          # conf-gtk2 (its bundled graph viewer links against GTK2 even
          # though this job only needs the `proverif` CLI).
          sudo apt-get install -y opam=2.1.5-1 pkg-config libgtk2.0-dev m4
          opam init --bare --disable-sandboxing -y
          # Pinned OCaml compiler. proverif.2.05 itself only requires
          # ocaml >= 4.03; 4.14.2 is just a concrete, reproducible choice
          # confirmed to build proverif.2.05 + its lablgtk dependency cleanly.
          opam switch create default 4.14.2
          eval "$(opam env)"
          # Pinned to 2.05 -- see https://bblanche.gitlabpages.inria.fr/proverif/
          # ("Install with OPAM: opam install proverif"; no Linux prebuilt
          # binary is offered, only a Windows one, so opam is the
          # reproducible route on the pinned Ubuntu 24.04 runner).
          opam install -y proverif.2.05
          eval "$(opam env)"
          opam var bin >> "$GITHUB_PATH"

      - name: Verify ProVerif install
        run: proverif -help | head -3

      - name: Run the ProVerif estate checker
        run: |
          set -euo pipefail
          python3 scripts/proofs/run-proverif.py --check | tee proverif-estate-summary.md

      - name: Check isolation participation and adversarial controls
        run: |
          set -euo pipefail
          python3 -B docs/harbor-research/campaigns/2026-11-06/white/verify_controls.py --proverif proverif

      - name: Upload check summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proverif-estate-summary
          path: proverif-estate-summary.md

  # ── Kani: post-decoding decisions, attenuation, and comparator ────────────
  # The signed-token path and the harness share validate_decoded_claims.
  # The finite capability grammars and list/hop bounds are explicit in
  # src/kani_claims.rs. CI requires reachable acceptance AND rejection paths,
  # then checks that removing expiry/ceiling checks, or restoring the replaced
  # pattern-cover rule, produces counterexamples.
  kani-harbor-card:
    if: github.event_name != 'merge_group' && github.event_name != 'schedule'
    name: Kani / harbor-card-rs (decoded claims and attenuation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core/harbor-card-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/harbor-card-rs
          key: kani

      - name: Install kani-verifier (pinned)
        run: |
          set -euo pipefail
          # Pinned to 0.67.0 -- the latest stable release per crates.io
          # metadata as of 2026-09-06 (default_version/max_version/
          # newest_version/max_stable_version all agree; see
          # https://crates.io/api/v1/crates/kani-verifier).
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      - name: Run decoded-policy and capability harnesses
        run: |
          set -euo pipefail
          cargo kani --harness proof_constant_time_behavior \
            --harness proof_decoded_claims_policy \
            --harness proof_decoded_channel_authority \
            --harness proof_decoded_delegation_two_hops \
            --harness proof_capability_attenuation | tee kani.log
          python3 -m unittest discover -s scripts -p test_kani_log.py
          python3 scripts/check-kani-log.py kani.log

      - name: Require counterexamples for removed policy checks
        run: |
          set -euo pipefail
          python3 scripts/check-kani-negative-controls.py

      - name: Upload Kani output and negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-harbor-card-log
          include-hidden-files: true
          path: |
            core/harbor-card-rs/kani.log
            core/harbor-card-rs/.cache/kani-negative-controls/*.log
            core/harbor-card-rs/.cache/kani-negative-controls/receipt.json

  # The parser harness: bit-precise symbolic UTF-8 validation plus concrete
  # curve25519 arithmetic under #[kani::unwind(128)]. Measured at 50+ CPU-minutes
  # without concluding locally, so it runs only on explicit workflow_dispatch,
  # not on pull requests. No recurring parser run is configured.
  kani-harbor-card-parser:
    if: github.event_name == 'workflow_dispatch'
    name: Kani / harbor-card-rs (parser harness, manual)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: core/harbor-card-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/harbor-card-rs
          key: kani-parser

      - name: Install kani-verifier (pinned)
        run: |
          set -euo pipefail
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      - name: Run proof_verify_logic_only
        run: |
          set -euo pipefail
          cargo kani -Z stubbing --harness proof_verify_logic_only | tee kani-parser.log

      - name: Assert the parser harness verified successfully
        run: |
          set -euo pipefail
          if grep -q "Complete - 1 successfully verified harnesses, 0 failures, 1 total." kani-parser.log; then
            echo "PASS: proof_verify_logic_only verified."
          else
            echo "FAIL: proof_verify_logic_only did not verify cleanly."
            tail -80 kani-parser.log
            exit 1
          fi

      - name: Upload Kani output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-harbor-card-parser-log
          path: core/harbor-card-rs/kani-parser.log

  # ── Relay TLA+ (TLC): revocation finality and webhook delivery ──────────────
  # proofs/relay/{CardRevocation,WebhookDelivery}.tla and their six .cfg files
  # had zero CI coverage. Both models exhaust their finite bounded state space
  # -- once every card is issued+revoked, or every event delivered, there is
  # nothing left to do -- so `-deadlock` is required on every config (verified
  # locally: without it, TLC reports "Error: Deadlock reached" on the PASSING
  # configs too; -deadlock does not affect genuine invariant violations, which
  # TLC still reports normally).
  tla-relay-card-revocation:
    if: github.event_name != 'merge_group'
    name: TLA+ / relay CardRevocation (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache TLA+ tools
        # Keyed on the pinned version: a warm cache means this job never
        # touches GitHub's release CDN. Bump with the URL below.
        uses: actions/cache@v4
        with:
          path: ~/tla/tla2tools.jar
          key: pinned-tla2tools-v1.8.0

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          # Fetched through the shared script: it refuses an error page saved
          # as the jar, which is how a CDN 504 used to surface here as
          # "Could not find or load main class tlc2.TLC".
          "${GITHUB_WORKSPACE}/scripts/ci/fetch-pinned-tool.sh" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            "${HOME}/tla/tla2tools.jar" jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run CardRevocation under TLC (baseline, rollback attack, card-epoch control, dbEpoch rule)
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config CardRevocation_baseline.cfg CardRevocation.tla \
            | tee CardRevocation_baseline.tlc.log
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config CardRevocation_dbepoch.cfg CardRevocation.tla \
            | tee CardRevocation_dbepoch.tlc.log
          # Negative control: Rollback=TRUE, Epoched=FALSE reproduces ADR-0018
          # Attack Vector 2 (backup/restore) and MUST violate RevocationFinal.
          # TLC exits nonzero when it finds a violation; `|| true` lets this
          # specific run "fail" so the assertion step below can judge it --
          # the baseline/dbepoch runs above are NOT given this treatment, so an
          # unexpected TLC failure on either of those still aborts the job here.
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config CardRevocation_rollback.cfg CardRevocation.tla \
            | tee CardRevocation_rollback.tlc.log || true
          # Over-strict control: the card-epoch rule keeps RevocationFinal but
          # MUST violate Availability (after any revocation it refuses every
          # outstanding card). -continue makes TLC explore every state instead
          # of stopping at the first Availability counterexample, so the
          # assertion below can also require that RevocationFinal never fails.
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock -continue \
            -config CardRevocation_epoch.cfg CardRevocation.tla \
            | tee CardRevocation_epoch.tlc.log || true

      - name: Assert baseline and dbEpoch hold, rollback and card-epoch are refuted by design
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          # A missing or empty log means TLC never ran for that config; say so
          # instead of letting a grep on a nonexistent file read as "no error".
          for cfg in baseline dbepoch rollback epoch; do
            if [ ! -s "CardRevocation_${cfg}.tlc.log" ]; then
              echo "FAIL: CardRevocation_${cfg}.tlc.log is missing or empty -- TLC did not run for this config."
              exit 1
            fi
          done
          for cfg in baseline dbepoch; do
            if grep -q "No error has been found" "CardRevocation_${cfg}.tlc.log"; then
              echo "PASS: CardRevocation_${cfg} -- TLC found no invariant violation."
            else
              echo "FAIL: CardRevocation_${cfg} did not report 'No error has been found'."
              tail -50 "CardRevocation_${cfg}.tlc.log"
              exit 1
            fi
          done
          if grep -q "No error has been found" CardRevocation_rollback.tlc.log; then
            echo "FAIL: CardRevocation_rollback was expected to violate RevocationFinal (the backup/restore attack, ADR-0018 Attack Vector 2) but TLC reported no error -- the negative control has gone vacuous."
            exit 1
          fi
          if grep -q "Invariant RevocationFinal is violated" CardRevocation_rollback.tlc.log; then
            echo "PASS: CardRevocation_rollback violates RevocationFinal as designed (negative control)."
          else
            echo "FAIL: CardRevocation_rollback did not report the expected RevocationFinal violation -- TLC may have failed for an unrelated reason."
            tail -50 CardRevocation_rollback.tlc.log
            exit 1
          fi
          # Card-epoch control: Availability must fail, nothing else may, and
          # -continue must have exhausted the state space. A -continue run
          # still ends with "No error has been found" after reporting
          # violations, so that sentence is not evidence either way here.
          if ! grep -q "Invariant Availability is violated" CardRevocation_epoch.tlc.log; then
            echo "FAIL: CardRevocation_epoch was expected to violate Availability (the card-epoch rule refuses every outstanding card after a revocation) but TLC reported no Availability violation -- the over-strict control has gone vacuous."
            tail -50 CardRevocation_epoch.tlc.log
            exit 1
          fi
          other=$(grep -E "^Error:" CardRevocation_epoch.tlc.log \
            | grep -vxF -e "Error: Invariant Availability is violated." \
                         -e "Error: The behavior up to this point is:" || true)
          if [ -n "${other}" ]; then
            echo "FAIL: CardRevocation_epoch reported an error other than the Availability violation:"
            echo "${other}" | sort | uniq -c
            exit 1
          fi
          if ! grep -q "distinct states found, 0 states left on queue" CardRevocation_epoch.tlc.log; then
            echo "FAIL: CardRevocation_epoch did not exhaust its state space under -continue, so RevocationFinal was not checked on every state."
            tail -50 CardRevocation_epoch.tlc.log
            exit 1
          fi
          echo "PASS: CardRevocation_epoch keeps RevocationFinal on every state and violates Availability as designed (over-strict control)."

      - name: Upload CardRevocation TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-card-revocation-tlc-log
          path: |
            proofs/relay/CardRevocation_baseline.tlc.log
            proofs/relay/CardRevocation_dbepoch.tlc.log
            proofs/relay/CardRevocation_epoch.tlc.log
            proofs/relay/CardRevocation_rollback.tlc.log

  tla-relay-webhook-delivery:
    if: github.event_name != 'merge_group'
    name: TLA+ / relay WebhookDelivery (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache TLA+ tools
        # Keyed on the pinned version: a warm cache means this job never
        # touches GitHub's release CDN. Bump with the URL below.
        uses: actions/cache@v4
        with:
          path: ~/tla/tla2tools.jar
          key: pinned-tla2tools-v1.8.0

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/tla"
          # Fetched through the shared script: it refuses an error page saved
          # as the jar, which is how a CDN 504 used to surface here as
          # "Could not find or load main class tlc2.TLC".
          "${GITHUB_WORKSPACE}/scripts/ci/fetch-pinned-tool.sh" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            "${HOME}/tla/tla2tools.jar" jar
          echo "TLA_TOOLS_JAR=${HOME}/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run WebhookDelivery under TLC (fixed daemon, negative control)
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config WebhookDelivery.cfg WebhookDelivery.tla \
            | tee WebhookDelivery.tlc.log
          # Negative control: Dedup=FALSE dispatches whatever the (adversarial)
          # relay delivers. AtMostOnce MUST fail once the relay duplicates a
          # delivery. See the CardRevocation job above for why `|| true` here
          # is deliberate and scoped to only this one, expected-to-fail run.
          java -XX:+UseParallelGC -cp "${TLA_TOOLS_JAR}" tlc2.TLC -deadlock \
            -config WebhookDelivery_vuln.cfg WebhookDelivery.tla \
            | tee WebhookDelivery_vuln.tlc.log || true

      - name: Assert the fixed daemon holds, the negative control is refuted by design
        working-directory: proofs/relay
        run: |
          set -euo pipefail
          if grep -q "No error has been found" WebhookDelivery.tlc.log; then
            echo "PASS: WebhookDelivery (Dedup=TRUE) -- TLC found no safety or liveness violation."
          else
            echo "FAIL: WebhookDelivery did not report 'No error has been found'."
            tail -50 WebhookDelivery.tlc.log
            exit 1
          fi
          if grep -q "No error has been found" WebhookDelivery_vuln.tlc.log; then
            echo "FAIL: WebhookDelivery_vuln (Dedup=FALSE) was expected to violate AtMostOnce but TLC reported no error -- the negative control has gone vacuous."
            exit 1
          fi
          if grep -q "Invariant AtMostOnce is violated" WebhookDelivery_vuln.tlc.log; then
            echo "PASS: WebhookDelivery_vuln violates AtMostOnce as designed (negative control)."
          else
            echo "FAIL: WebhookDelivery_vuln did not report the expected AtMostOnce violation -- TLC may have failed for an unrelated reason."
            tail -50 WebhookDelivery_vuln.tlc.log
            exit 1
          fi

      - name: Upload WebhookDelivery TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-webhook-delivery-tlc-log
          path: |
            proofs/relay/WebhookDelivery.tlc.log
            proofs/relay/WebhookDelivery_vuln.tlc.log

  # ── Proof-estate manifest: WIRED or RETIRED, no third state ─────────────────
  # book/corpus.json is the ledger every formal artifact and R-script
  # must appear in; scripts/check-whitepaper-corpus.mjs fails the build if an
  # on-disk formal artifact (or #[kani::proof] harness) is unregistered, or if
  # a registered path is missing on disk. The manifest uses Node/stdlib; the
  # dispatch writer audit adds only the locked TypeScript parser. No solver
  # or native database dependency is needed in this job.
  whitepaper-corpus-manifest:
    name: Proof estate / manifest (WIRED or RETIRED)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every formal artifact is WIRED to a CI job or explicitly RETIRED
        run: node scripts/check-whitepaper-corpus.mjs

      - name: ProVerif result-comparison unit tests (offline, no ProVerif needed)
        run: node --test tests/unit/proverif-runner-comparison.test.mjs

      - name: Install the locked TypeScript parser for the writer audit
        run: |
          set -euo pipefail
          mkdir -p .cache/dispatch-writer-tools
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = '5.9.3';
          const locked = JSON.parse(readFileSync('package-lock.json', 'utf8')).packages['node_modules/typescript'];
          if (locked.version !== version || !locked.integrity) throw new Error('review the TypeScript parser pin before changing it');
          const pkg = { name: 'dispatch-writer-proof-tools', version: '1.0.0', private: true, devDependencies: { typescript: version } };
          const prefix = '.cache/dispatch-writer-tools/';
          writeFileSync(prefix + 'package.json', JSON.stringify(pkg));
          writeFileSync(prefix + 'package-lock.json', JSON.stringify({
            name: pkg.name, version: pkg.version, lockfileVersion: 3, requires: true,
            packages: { '': pkg, 'node_modules/typescript': locked },
          }));
          NODE
          npm ci --prefix .cache/dispatch-writer-tools --ignore-scripts --no-audit --no-fund --cache .cache/npm-proof-tools
          mkdir -p node_modules
          ln -s ../.cache/dispatch-writer-tools/node_modules/typescript node_modules/typescript

      - name: Check reviewed dispatch writers and scanner controls
        run: |
          set -euo pipefail
          node scripts/harbor-research/check_dispatch_writer_coverage.mjs \
            | tee .cache/dispatch-writer-tools/coverage.json
          node --test scripts/harbor-research/check_dispatch_writer_coverage.test.mjs \
            | tee .cache/dispatch-writer-tools/controls.log

      - name: Upload dispatch writer audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-writer-coverage
          include-hidden-files: true
          path: |
            .cache/dispatch-writer-tools/coverage.json
            .cache/dispatch-writer-tools/controls.log
            .cache/dispatch-writer-tools/package-lock.json
