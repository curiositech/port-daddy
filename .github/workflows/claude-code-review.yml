name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"
  # Merge queue: `claude-review` is a required check, so it must also report
  # on merge_group heads or queued PRs hang forever. The substantive review
  # already ran at PR time and a rebase does not change its verdict, so the
  # merge_group path is a pass-through — the review steps below are gated to
  # pull_request events.
  merge_group:

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write so the /code-review plugin can post inline review comments / nits
      # on the diff. Still non-blocking — this job's pass/fail does not gate merge;
      # the comments are advisory.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Merge-queue pass-through
        if: github.event_name == 'merge_group'
        run: echo "Review verdict carries over from the pull_request run; merge queue re-validates build and tests."

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: github.event_name == 'pull_request'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Without this, Claude's calls to the inline-comment tool are denied by
          # the action's OWN tool sandbox (separate from the job's GITHUB_TOKEN
          # perms) — the run is green but posts nothing ("No buffered inline
          # comments"). Allowlisting the tool lets the plugin post inline nits.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
