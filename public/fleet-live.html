<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Live</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-hover: #1a2744;
      --surface-deep: #0f1729;
      --border: #2a3a5e;
      --border-subtle: #1e2d4a;
      --text: #e8e8e8;
      --text-dim: #a0b0c0;
      --text-muted: #8090a8;
      --accent: #5EEAD4;
      --accent-glow: rgba(94, 234, 212, 0.2);
      --accent-dim: rgba(94, 234, 212, 0.08);
      --red: #FB7185;
      --red-dim: rgba(251, 113, 133, 0.12);
      --green: #34D399;
      --green-dim: rgba(52, 211, 153, 0.12);
      --orange: #FBBF24;
      --orange-dim: rgba(251, 191, 36, 0.12);
      --blue: #58B5FF;
      --blue-dim: rgba(88, 181, 255, 0.12);
      --yellow: #FBBF24;
      --yellow-dim: rgba(251, 191, 36, 0.12);
      --purple: #C4B5FD;
      --purple-dim: rgba(196, 181, 253, 0.12);
      --teal: #1abc9c;
      --grey: #7f8c8d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 400px;
      max-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      font-size: 13px;
      line-height: 1.4;
    }

    /* ===================== SCANLINES ===================== */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 3px,
        rgba(0, 0, 0, 0.025) 3px, rgba(0, 0, 0, 0.025) 4px
      );
      z-index: 999;
    }

    /* ===================== HEADER ===================== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-deep) 100%);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      min-height: 40px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 18px;
      height: 18px;
    }

    .header-logo svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
      fill: none;
    }

    .header-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      transition: all 0.4s ease;
    }

    .conn-dot.disconnected {
      background: var(--red);
      box-shadow: 0 0 6px rgba(231, 76, 60, 0.5);
    }

    .conn-dot.connected {
      background: var(--green);
      box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
      animation: pulse-conn 2s ease-in-out infinite;
    }

    @keyframes pulse-conn {
      0%, 100% { box-shadow: 0 0 4px rgba(46, 204, 113, 0.3); }
      50% { box-shadow: 0 0 10px rgba(46, 204, 113, 0.7); }
    }

    .uptime-label {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ===================== AGENT RIBBON ===================== */
    .agent-ribbon {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      background: var(--surface-deep);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .agent-ribbon::-webkit-scrollbar { display: none; }

    .agent-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 7px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: default;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .agent-chip.active {
      border-color: var(--chip-color, var(--accent));
      background: color-mix(in srgb, var(--chip-color, var(--accent)) 10%, var(--surface));
      color: var(--text);
      box-shadow: 0 0 10px color-mix(in srgb, var(--chip-color, var(--accent)) 20%, transparent);
    }

    .agent-chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .agent-chip.active .agent-chip-dot {
      box-shadow: 0 0 6px var(--chip-color, var(--accent));
    }

    .agent-chip.selected {
      border-color: var(--chip-color, var(--accent));
      background: color-mix(in srgb, var(--chip-color, var(--accent)) 25%, var(--surface));
      color: #fff;
      box-shadow: 0 0 12px color-mix(in srgb, var(--chip-color, var(--accent)) 30%, transparent),
                  inset 0 0 8px color-mix(in srgb, var(--chip-color, var(--accent)) 15%, transparent);
    }

    .feed-item-content.expandable { cursor: pointer; }
    .feed-item-content .expand-toggle {
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
    }
    .feed-item-content .content-full { white-space: pre-wrap; word-break: break-word; }

    /* ===================== STATS STRIP ===================== */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .stat-cell {
      background: var(--surface-deep);
      padding: 7px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .stat-value.highlight { color: var(--accent); }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1px;
    }

    /* ===================== FILTER TABS ===================== */
    .filter-bar {
      display: flex;
      gap: 2px;
      padding: 6px 14px;
      background: var(--surface-deep);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .filter-btn {
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .filter-btn:hover {
      color: var(--text);
      background: var(--surface);
    }

    .filter-btn.active {
      color: var(--accent);
      background: var(--accent-dim);
      border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .filter-spacer { flex: 1; }

    .feed-count {
      font-size: 10px;
      color: var(--text-muted);
      align-self: center;
      font-variant-numeric: tabular-nums;
    }

    /* ===================== LIVE FEED ===================== */
    .feed-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .feed-container::-webkit-scrollbar { width: 4px; }
    .feed-container::-webkit-scrollbar-track { background: transparent; }
    .feed-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .feed-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-muted);
      gap: 8px;
    }

    .feed-empty-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feed-empty-icon::after {
      content: '';
      width: 12px;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
    }

    /* ---- Time period markers ---- */
    .time-marker {
      padding: 4px 14px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: var(--surface-deep);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    /* ---- Feed Items ---- */
    .feed-item {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s ease;
      animation: slide-in 0.25s ease-out;
      position: relative;
    }

    .feed-item:hover { background: var(--surface); }

    .feed-item.is-new {
      animation: slide-in-glow 0.5s ease-out;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide-in-glow {
      0% { opacity: 0; transform: translateY(-10px); background: var(--accent-dim); }
      40% { background: var(--accent-dim); }
      100% { opacity: 1; transform: translateY(0); background: transparent; }
    }

    .feed-item.age-old { opacity: 0.5; }
    .feed-item.age-ancient { opacity: 0.3; }

    .feed-item-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .feed-item-agent-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .feed-item-agent {
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .feed-item-type {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .type-note { color: var(--blue); background: var(--blue-dim); }
    .type-handoff { color: var(--orange); background: var(--orange-dim); }
    .type-session-start { color: var(--green); background: var(--green-dim); }
    .type-session-end { color: var(--text-dim); background: rgba(120, 137, 160, 0.1); }
    .type-claim { color: var(--accent); background: var(--accent-dim); }
    .type-violation { color: var(--red); background: var(--red-dim); }
    .type-agent { color: var(--purple); background: var(--purple-dim); }
    .type-sugar { color: var(--yellow); background: var(--yellow-dim); }
    .type-lock { color: var(--teal); background: rgba(26, 188, 156, 0.12); }

    .feed-item-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .feed-item-content {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .feed-item-session-purpose {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- Collapsed group (batch of similar events) ---- */
    .feed-item-collapsed {
      padding: 6px 14px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      animation: slide-in 0.25s ease-out;
    }

    .feed-item-collapsed:hover { background: var(--surface); }
    .feed-item-collapsed.age-old { opacity: 0.5; }
    .feed-item-collapsed.age-ancient { opacity: 0.3; }

    .collapsed-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1px 6px;
      flex-shrink: 0;
      min-width: 20px;
      text-align: center;
    }

    .collapsed-text {
      font-size: 11px;
      color: var(--text-dim);
      flex: 1;
    }

    .collapsed-expand-hint {
      font-size: 9px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .collapsed-items {
      display: none;
      border-bottom: 1px solid var(--border-subtle);
    }

    .collapsed-items.open { display: block; }

    .collapsed-items .feed-item {
      padding-left: 28px;
      background: var(--surface-deep);
      opacity: 0.75;
    }

    /* ---- Session cards ---- */
    .feed-item.session-card {
      cursor: pointer;
      border-left: 3px solid transparent;
      padding-left: 11px;
    }

    .feed-item.session-card.active-session {
      border-left-color: var(--green);
      background: var(--green-dim);
    }

    .session-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .session-status-dot.active {
      background: var(--green);
      box-shadow: 0 0 5px rgba(46, 204, 113, 0.4);
      animation: session-pulse 2.5s ease-in-out infinite;
    }

    .session-status-dot.completed { background: var(--text-muted); }

    @keyframes session-pulse {
      0%, 100% { box-shadow: 0 0 3px rgba(46, 204, 113, 0.2); }
      50% { box-shadow: 0 0 8px rgba(46, 204, 113, 0.6); }
    }

    .session-notes-expand {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
      display: none;
    }

    .session-notes-expand.open {
      display: block;
      animation: expand-in 0.2s ease-out;
    }

    @keyframes expand-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .session-note-item {
      font-size: 11px;
      color: var(--text-dim);
      padding: 3px 0 3px 10px;
      border-left: 2px solid var(--border);
      margin-bottom: 3px;
    }

    .session-note-item .note-time {
      font-size: 9px;
      color: var(--text-muted);
      margin-right: 4px;
    }

    /* ===================== SESSIONS SIDEBAR ===================== */
    .sessions-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      background: var(--surface-deep);
      border-top: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .sessions-toggle:hover { background: var(--surface); }

    .sessions-toggle-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .sessions-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-dim);
      padding: 1px 6px;
      border-radius: 8px;
    }

    .sessions-toggle-arrow {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--text-muted);
      transition: transform 0.2s ease;
    }

    .sessions-toggle-arrow.open { transform: rotate(180deg); }

    .sessions-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: var(--surface-deep);
    }

    .sessions-panel.open {
      max-height: 220px;
      overflow-y: auto;
    }

    .sessions-panel::-webkit-scrollbar { width: 4px; }
    .sessions-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .session-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s ease;
    }
    .session-row:hover { background: var(--surface); }
    .session-row:last-child { border-bottom: none; }

    .session-row-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .session-row-dot.active {
      background: var(--green);
      box-shadow: 0 0 4px rgba(46, 204, 113, 0.4);
      animation: session-pulse 2.5s ease-in-out infinite;
    }
    .session-row-dot.completed { background: var(--text-muted); }

    .session-row-body { flex: 1; min-width: 0; }

    .session-row-purpose {
      font-size: 11px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-row.is-completed .session-row-purpose { color: var(--text-dim); }

    .session-row-meta {
      font-size: 9px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      margin-top: 1px;
    }

    .session-row-age {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* ===================== LOADING STATE ===================== */
    .loading-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 400px) {
      body { width: 100vw; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2v3M12 5c-2 0-4 1.5-4 4 0 2 1.5 3.5 4 4 2.5-.5 4-2 4-4 0-2.5-2-4-4-4zM12 13v6M8 17h8M5 21h14M12 19v2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="header-title">Fleet Live</span>
    </div>
    <div class="header-right">
      <span class="uptime-label" id="uptime"></span>
      <div class="conn-status">
        <div class="conn-dot disconnected" id="conn-dot"></div>
        <span id="conn-label">...</span>
      </div>
    </div>
  </div>

  <!-- AGENT RIBBON -->
  <div class="agent-ribbon" id="agent-ribbon"></div>

  <!-- STATS STRIP -->
  <div class="stats-strip">
    <div class="stat-cell">
      <div class="stat-value highlight" id="stat-active">--</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-cell">
      <div class="stat-value" id="stat-sessions">--</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat-cell">
      <div class="stat-value" id="stat-services">--</div>
      <div class="stat-label">Ports</div>
    </div>
    <div class="stat-cell">
      <div class="stat-value" id="stat-notes">--</div>
      <div class="stat-label">Notes</div>
    </div>
  </div>

  <!-- FILTER TABS -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="notes">Notes</button>
    <button class="filter-btn" data-filter="activity">Activity</button>
    <button class="filter-btn" data-filter="sessions">Sessions</button>
    <div class="filter-spacer"></div>
    <span class="feed-count" id="feed-count"></span>
  </div>

  <!-- LIVE FEED -->
  <div class="feed-container" id="feed-container">
    <div class="loading-screen" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Connecting to daemon...</div>
    </div>
  </div>

  <!-- SESSIONS SIDEBAR TOGGLE -->
  <div class="sessions-toggle" id="sessions-toggle">
    <div class="sessions-toggle-left">
      <span>Sessions</span>
      <span class="sessions-badge" id="sessions-active-badge">0</span>
    </div>
    <div class="sessions-toggle-arrow" id="sessions-arrow"></div>
  </div>

  <!-- SESSIONS PANEL -->
  <div class="sessions-panel" id="sessions-panel"></div>

<script>
(function() {
  'use strict';

  const BASE = 'http://localhost:9876';

  const FLEET_AGENTS = [
    { name: 'gardener',      color: '#7f8c8d' },
    { name: 'qa',            color: '#e74c3c' },
    { name: 'test-hunter',   color: '#e67e22' },
    { name: 'documentarian', color: '#3498db' },
    { name: 'simplifier',    color: '#1abc9c' },
    { name: 'cartographer',  color: '#2ecc71' },
    { name: 'spark',         color: '#f0a500' },
    { name: 'spider',        color: '#9b59b6' },
  ];

  const INTERESTING_ACTIVITY = new Set([
    'service.claim', 'session.start', 'session.end',
    'security.violation', 'agent.register', 'agent.unregister',
    'sugar_begin', 'sugar_done',
    'lock.acquire', 'lock.release',
    'pheromone.spray', 'note.create',
  ]);

  // How many consecutive same-type events before collapsing
  const COLLAPSE_THRESHOLD = 3;

  // State
  let allFeedItems = [];
  let allSessions = [];
  let sessionNotesCache = {};
  let currentFilter = 'all';
  let sseSource = null;
  let daemonStartTime = null;
  let uptimeInterval = null;

  // Identity resolution map: agentId -> {name, identity, purpose, color}
  const agentIdentityMap = new Map();

  // DOM
  const $ = id => document.getElementById(id);
  const $connDot = $('conn-dot');
  const $connLabel = $('conn-label');
  const $uptime = $('uptime');
  const $ribbon = $('agent-ribbon');
  const $feed = $('feed-container');
  const $loading = $('loading');
  const $statActive = $('stat-active');
  const $statSessions = $('stat-sessions');
  const $statServices = $('stat-services');
  const $statNotes = $('stat-notes');
  const $feedCount = $('feed-count');
  const $sessionsToggle = $('sessions-toggle');
  const $sessionsArrow = $('sessions-arrow');
  const $sessionsPanel = $('sessions-panel');
  const $sessionsActiveBadge = $('sessions-active-badge');

  // ===== UTILITIES =====
  function relTime(ts) {
    const d = Date.now() - ts;
    if (d < 10000) return 'just now';
    const s = Math.floor(d / 1000);
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const days = Math.floor(h / 24);
    if (days < 30) return days + 'd ago';
    return Math.floor(days / 30) + 'mo ago';
  }

  function ageClass(ts) {
    const days = (Date.now() - ts) / 86400000;
    if (days > 14) return 'age-ancient';
    if (days > 3) return 'age-old';
    return '';
  }

  function fmtUptime(ms) {
    if (!ms || ms < 0) return '';
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const h = Math.floor(m / 60);
    const d = Math.floor(h / 24);
    if (d > 0) return d + 'd ' + (h % 24) + 'h';
    if (h > 0) return h + 'h ' + (m % 60) + 'm';
    if (m > 0) return m + 'm ' + (s % 60) + 's';
    return s + 's';
  }

  function esc(str) {
    const el = document.createElement('span');
    el.textContent = str;
    return el.innerHTML;
  }

  function resolveAgent(id) {
    if (!id) return null;
    // Check identity map first (populated from /agents, /spawn, /sessions)
    const mapped = agentIdentityMap.get(id);
    if (mapped && mapped.identity) {
      // Extract fleet agent name from identity like "port-daddy:fleet:spider"
      const parts = mapped.identity.split(':');
      const fleetName = parts.length >= 3 && parts[1] === 'fleet' ? parts[2] : null;
      if (fleetName) return { fleetName, ...mapped };
    }
    // Fallback: substring match against known fleet agent names
    const lo = id.toLowerCase();
    for (const a of FLEET_AGENTS) {
      if (lo.includes(a.name)) return { fleetName: a.name, name: a.name, identity: '', purpose: '' };
    }
    // Use purpose from map if available
    if (mapped && mapped.purpose) {
      const shortPurpose = mapped.purpose.length > 30
        ? mapped.purpose.substring(0, 27) + '...'
        : mapped.purpose;
      return { fleetName: null, name: shortPurpose, identity: '', purpose: mapped.purpose };
    }
    return null;
  }

  function agentColor(id) {
    if (!id) return 'var(--text-muted)';
    const resolved = resolveAgent(id);
    if (resolved && resolved.fleetName) {
      const match = FLEET_AGENTS.find(a => a.name === resolved.fleetName);
      if (match) return match.color;
    }
    // Hash fallback for non-fleet agents
    let h = 0;
    for (let i = 0; i < id.length; i++) h = id.charCodeAt(i) + ((h << 5) - h);
    return 'hsl(' + (Math.abs(h) % 360) + ', 45%, 55%)';
  }

  function agentName(id) {
    if (!id) return 'system';
    const resolved = resolveAgent(id);
    if (resolved) {
      if (resolved.fleetName) return resolved.fleetName;
      return resolved.name;
    }
    return id.length > 25 ? id.substring(0, 22) + '...' : id;
  }

  function typeInfo(item) {
    if (item.feedType === 'note') {
      if (item.type === 'handoff') return { label: 'handoff', cls: 'type-handoff' };
      return { label: 'note', cls: 'type-note' };
    }
    if (item.feedType === 'session') {
      return item.status === 'active'
        ? { label: 'active', cls: 'type-session-start' }
        : { label: 'done', cls: 'type-session-end' };
    }
    // activity
    const t = item.type;
    if (t === 'security.violation') return { label: 'violation', cls: 'type-violation' };
    if (t === 'service.claim') return { label: 'claim', cls: 'type-claim' };
    if (t === 'session.start') return { label: 'start', cls: 'type-session-start' };
    if (t === 'session.end') return { label: 'end', cls: 'type-session-end' };
    if (t.startsWith('agent.')) return { label: 'agent', cls: 'type-agent' };
    if (t.startsWith('sugar')) return { label: 'sugar', cls: 'type-sugar' };
    if (t.startsWith('lock.')) return { label: 'lock', cls: 'type-lock' };
    return { label: t.split('.').pop(), cls: 'type-note' };
  }

  function periodLabel(ts) {
    const h = (Date.now() - ts) / 3600000;
    const d = h / 24;
    if (h < 1) return 'Last Hour';
    if (h < 6) return 'Today';
    if (d < 1) return 'Earlier Today';
    if (d < 2) return 'Yesterday';
    if (d < 7) return 'This Week';
    if (d < 14) return 'Last Week';
    if (d < 30) return 'This Month';
    return 'Older';
  }

  // ===== FETCH =====
  async function fetchJson(path) {
    try {
      const r = await fetch(BASE + path);
      if (!r.ok) throw new Error(r.statusText);
      return await r.json();
    } catch (e) {
      console.warn('fetch fail:', path, e.message);
      return null;
    }
  }

  // ===== DATA LOADING =====
  async function loadAll() {
    const [notesData, sessionsData, activityData, servicesData, agentsData, spawnData] =
      await Promise.all([
        fetchJson('/notes?limit=100'),
        fetchJson('/sessions'),
        fetchJson('/activity?limit=300'),
        fetchJson('/services'),
        fetchJson('/agents'),
        fetchJson('/spawn'),
      ]);

    const items = [];

    // Notes
    if (notesData && notesData.notes) {
      for (const n of notesData.notes) {
        items.push({
          id: 'note-' + n.id,
          feedType: 'note',
          type: n.type || 'note',
          timestamp: n.createdAt,
          content: n.content,
          agentId: null,
          sessionPurpose: n.sessionPurpose,
          sessionId: n.sessionId,
        });
      }
    }

    // Activity (filtered to interesting)
    if (activityData && activityData.entries) {
      for (const e of activityData.entries) {
        if (e.type === 'daemon.start' && !daemonStartTime) {
          daemonStartTime = e.timestamp;
        }
        if (INTERESTING_ACTIVITY.has(e.type)) {
          items.push({
            id: 'activity-' + e.id,
            feedType: 'activity',
            type: e.type,
            timestamp: e.timestamp,
            content: e.details || '',
            agentId: e.agentId,
            targetId: e.targetId,
            metadata: e.metadata,
          });
        }
      }
    }

    // Sessions
    allSessions = (sessionsData && sessionsData.sessions) || [];
    for (const s of allSessions) {
      items.push({
        id: 'session-' + s.id,
        feedType: 'session',
        type: 'session',
        timestamp: s.createdAt,
        content: s.purpose || 'Unnamed session',
        agentId: s.agentId,
        status: s.status,
        sessionId: s.id,
        completedAt: s.completedAt,
      });
    }

    // Deduplicate and sort
    const seen = new Set();
    allFeedItems = items.filter(i => {
      if (seen.has(i.id)) return false;
      seen.add(i.id);
      return true;
    }).sort((a, b) => b.timestamp - a.timestamp);

    // Stats
    const activeCount = allSessions.filter(s => s.status === 'active').length;
    $statActive.textContent = activeCount;
    $statSessions.textContent = allSessions.length;
    $statServices.textContent = (servicesData && servicesData.count) || 0;
    $statNotes.textContent = (notesData && notesData.notes) ? notesData.notes.length : 0;
    $sessionsActiveBadge.textContent = activeCount;

    // Build agent identity map for display resolution
    agentIdentityMap.clear();
    for (const a of ((agentsData && agentsData.agents) || [])) {
      const identity = [a.identity_project, a.identity_stack, a.identity_context]
        .filter(Boolean).join(':');
      agentIdentityMap.set(a.id, {
        name: identity || a.purpose || a.id,
        identity: identity,
        purpose: a.purpose || '',
      });
    }
    // Spawned agents: identity often embedded in the spawn record
    for (const a of ((spawnData && spawnData.agents) || [])) {
      const id = a.id || a.name;
      agentIdentityMap.set(id, {
        name: a.identity || a.purpose || id,
        identity: a.identity || '',
        purpose: a.purpose || a.task || '',
      });
    }
    // Sessions: map agentId -> purpose for display
    for (const s of allSessions) {
      if (s.agentId && !agentIdentityMap.has(s.agentId)) {
        agentIdentityMap.set(s.agentId, {
          name: s.purpose || s.agentId,
          identity: s.identityProject || '',
          purpose: s.purpose || '',
        });
      }
    }

    // Agent ribbon
    const activeAgentIds = new Set();
    for (const a of ((agentsData && agentsData.agents) || [])) activeAgentIds.add(a.id);
    for (const a of ((spawnData && spawnData.agents) || [])) activeAgentIds.add(a.id || a.name);
    for (const s of allSessions) {
      if (s.status === 'active' && s.agentId) activeAgentIds.add(s.agentId);
    }
    renderRibbon(activeAgentIds);

    $loading.style.display = 'none';
    renderFeed();
    renderSessionsPanel();
    startUptimeTimer();
  }

  // ===== RENDERING =====
  function renderRibbon(activeIds) {
    $ribbon.textContent = '';
    for (const agent of FLEET_AGENTS) {
      const isActive = [...activeIds].some(id => id.toLowerCase().includes(agent.name));
      const isSelected = activeAgentFilter && agentName(activeAgentFilter).toLowerCase() === agent.name;
      const chip = document.createElement('div');
      chip.className = 'agent-chip' + (isActive ? ' active' : '') + (isSelected ? ' selected' : '');
      chip.style.setProperty('--chip-color', agent.color);
      chip.style.cursor = 'pointer';
      const dot = document.createElement('div');
      dot.className = 'agent-chip-dot';
      dot.style.background = agent.color;
      const label = document.createElement('span');
      label.textContent = agent.name;
      chip.appendChild(dot);
      chip.appendChild(label);
      chip.addEventListener('click', () => {
        const matchingItem = allFeedItems.find(i =>
          i.agentId && agentName(i.agentId).toLowerCase() === agent.name
        );
        setAgentFilter(matchingItem ? matchingItem.agentId : agent.name);
      });
      $ribbon.appendChild(chip);
    }
  }

  // Collapse runs of identical-type events
  function collapseRuns(items) {
    const result = [];
    let i = 0;
    while (i < items.length) {
      const item = items[i];
      // Only collapse activity events, not notes or sessions
      if (item.feedType === 'activity') {
        let runEnd = i + 1;
        while (runEnd < items.length &&
               items[runEnd].feedType === 'activity' &&
               items[runEnd].type === item.type) {
          runEnd++;
        }
        const runLen = runEnd - i;
        if (runLen >= COLLAPSE_THRESHOLD) {
          result.push({
            collapsed: true,
            type: item.type,
            count: runLen,
            items: items.slice(i, runEnd),
            timestamp: item.timestamp,
            endTimestamp: items[runEnd - 1].timestamp,
          });
          i = runEnd;
          continue;
        }
      }
      result.push({ collapsed: false, item });
      i++;
    }
    return result;
  }

  function renderFeed() {
    let filtered = allFeedItems;
    if (currentFilter === 'notes') filtered = filtered.filter(i => i.feedType === 'note');
    else if (currentFilter === 'activity') filtered = filtered.filter(i => i.feedType === 'activity');
    else if (currentFilter === 'sessions') filtered = filtered.filter(i => i.feedType === 'session');

    // Agent filter: show only this agent's events
    if (activeAgentFilter) {
      const filterName = agentName(activeAgentFilter).toLowerCase();
      filtered = filtered.filter(i => {
        const itemName = agentName(i.agentId).toLowerCase();
        return itemName === filterName;
      });
    }

    $feedCount.textContent = filtered.length;

    if (filtered.length === 0) {
      $feed.innerHTML =
        '<div class="feed-empty">' +
          '<div class="feed-empty-icon"></div>' +
          '<div style="font-size:12px">No items match this filter</div>' +
        '</div>';
      return;
    }

    // Group by time period, then collapse within each group
    const groups = [];
    let curLabel = null, curGroup = null;
    for (const item of filtered) {
      const label = periodLabel(item.timestamp);
      if (label !== curLabel) {
        curLabel = label;
        curGroup = { label, items: [] };
        groups.push(curGroup);
      }
      curGroup.items.push(item);
    }

    let html = '';
    let collapsedIdx = 0;

    for (const group of groups) {
      html += '<div class="time-marker">' + esc(group.label) + '</div>';
      const collapsed = collapseRuns(group.items);

      for (const entry of collapsed) {
        if (entry.collapsed) {
          const info = typeInfo(entry.items[0]);
          const age = ageClass(entry.timestamp);
          const gid = 'cg-' + (collapsedIdx++);
          const summaryText = entry.count + ' ' + info.label + ' events';

          html += '<div class="feed-item-collapsed ' + age + '" data-group="' + gid + '">' +
            '<span class="collapsed-count">' + entry.count + '</span>' +
            '<span class="feed-item-type ' + info.cls + '">' + info.label + '</span>' +
            '<span class="collapsed-text">' + esc(summaryText) + '</span>' +
            '<span class="feed-item-time">' + relTime(entry.timestamp) + '</span>' +
          '</div>';
          html += '<div class="collapsed-items" id="' + gid + '">';
          for (const sub of entry.items) {
            html += renderItem(sub);
          }
          html += '</div>';
        } else {
          html += renderItem(entry.item);
        }
      }
    }

    $feed.innerHTML = html;

    // Collapsed group toggles
    $feed.querySelectorAll('.feed-item-collapsed').forEach(el => {
      el.addEventListener('click', () => {
        const gid = el.dataset.group;
        const target = document.getElementById(gid);
        if (target) target.classList.toggle('open');
      });
    });

    // Session card expanders
    $feed.querySelectorAll('.session-card').forEach(el => {
      el.addEventListener('click', () => {
        const notesEl = el.querySelector('.session-notes-expand');
        if (notesEl) {
          notesEl.classList.toggle('open');
          if (notesEl.classList.contains('open') && notesEl.dataset.loaded !== 'true') {
            loadSessionNotes(el.dataset.sessionId, notesEl);
          }
        }
      });
    });

    // Note expand toggles
    $feed.querySelectorAll('.feed-item-content.expandable').forEach(el => {
      el.addEventListener('click', () => {
        const expanded = el.dataset.expanded === 'true';
        const preview = el.querySelector('.content-preview');
        const full = el.querySelector('.content-full');
        const toggle = el.querySelector('.expand-toggle');
        if (expanded) {
          preview.style.display = '';
          full.style.display = 'none';
          if (toggle) toggle.textContent = ' ...';
          el.dataset.expanded = 'false';
        } else {
          preview.style.display = 'none';
          full.style.display = '';
          if (toggle) toggle.textContent = ' [collapse]';
          el.dataset.expanded = 'true';
        }
      });
    });

    // Agent name click -> filter to that agent's timeline
    $feed.querySelectorAll('.feed-item-agent[data-agent-filter]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const agentId = el.dataset.agentFilter;
        if (!agentId) return;
        setAgentFilter(agentId);
      });
    });
  }

  // ===== AGENT FILTER =====
  let activeAgentFilter = null;

  function setAgentFilter(agentId) {
    if (activeAgentFilter === agentId) {
      // Toggle off
      activeAgentFilter = null;
      document.querySelectorAll('.agent-chip').forEach(c => c.classList.remove('selected'));
    } else {
      activeAgentFilter = agentId;
      // Highlight matching chip
      document.querySelectorAll('.agent-chip').forEach(c => {
        const chipName = c.textContent.trim().toLowerCase();
        const filterName = agentName(agentId).toLowerCase();
        c.classList.toggle('selected', chipName === filterName);
      });
    }
    renderFeed();
  }

  function renderItem(item) {
    if (item.feedType === 'session') return renderSessionCard(item);
    const color = agentColor(item.agentId);
    const name = agentName(item.agentId);
    const info = typeInfo(item);
    const age = ageClass(item.timestamp);
    const raw = esc(item.content || '');
    const needsExpand = raw.length > 200;
    const preview = needsExpand ? raw.substring(0, 200) : raw;

    let purpose = '';
    if (item.sessionPurpose) {
      purpose = '<div class="feed-item-session-purpose">' + esc(item.sessionPurpose) + '</div>';
    }

    // Agent name is clickable — filters feed to this agent
    const agentClick = ' data-agent-filter="' + esc(item.agentId || '') + '" style="cursor:pointer"';

    let contentHtml;
    if (needsExpand) {
      contentHtml =
        '<div class="feed-item-content expandable" data-expanded="false">' +
          '<span class="content-preview">' + preview + '</span>' +
          '<span class="content-full" style="display:none">' + raw + '</span>' +
          '<span class="expand-toggle"> ...</span>' +
        '</div>';
    } else {
      contentHtml = '<div class="feed-item-content">' + raw + '</div>';
    }

    return '<div class="feed-item ' + age + '">' +
      '<div class="feed-item-header">' +
        '<div class="feed-item-agent-dot" style="background:' + color + '"></div>' +
        '<span class="feed-item-agent"' + agentClick + ' style="color:' + color + ';cursor:pointer">' + esc(name) + '</span>' +
        '<span class="feed-item-type ' + info.cls + '">' + info.label + '</span>' +
        '<span class="feed-item-time">' + relTime(item.timestamp) + '</span>' +
      '</div>' +
      contentHtml +
      purpose +
    '</div>';
  }

  function renderSessionCard(item) {
    const color = agentColor(item.agentId);
    const name = agentName(item.agentId);
    const info = typeInfo(item);
    const age = ageClass(item.timestamp);
    const dotCls = item.status === 'active' ? 'active' : 'completed';
    const cardCls = item.status === 'active' ? ' active-session' : '';

    return '<div class="feed-item session-card ' + age + cardCls + '" data-session-id="' + item.sessionId + '">' +
      '<div class="feed-item-header">' +
        '<div class="session-status-dot ' + dotCls + '"></div>' +
        '<span class="feed-item-agent" style="color:' + color + '">' + esc(name) + '</span>' +
        '<span class="feed-item-type ' + info.cls + '">' + info.label + '</span>' +
        '<span class="feed-item-time">' + relTime(item.timestamp) + '</span>' +
      '</div>' +
      '<div class="feed-item-content">' + esc(item.content) + '</div>' +
      '<div class="session-notes-expand" data-loaded="false"></div>' +
    '</div>';
  }

  async function loadSessionNotes(sessionId, container) {
    if (sessionNotesCache[sessionId]) {
      renderSessionNotesInline(sessionNotesCache[sessionId], container);
      return;
    }
    container.innerHTML = '<div style="font-size:10px;color:var(--text-muted);padding:4px 0">Loading...</div>';
    const data = await fetchJson('/sessions/' + encodeURIComponent(sessionId) + '/notes');
    const notes = (data && data.notes) || [];
    sessionNotesCache[sessionId] = notes;
    container.dataset.loaded = 'true';
    renderSessionNotesInline(notes, container);
  }

  function renderSessionNotesInline(notes, container) {
    if (!notes.length) {
      container.innerHTML = '<div style="font-size:10px;color:var(--text-muted);padding:4px 0">No notes</div>';
      return;
    }
    let html = '';
    for (const n of notes.slice(0, 6)) {
      html += '<div class="session-note-item">' +
        '<span class="note-time">' + relTime(n.createdAt) + '</span>' +
        esc((n.content || '').substring(0, 100)) +
      '</div>';
    }
    if (notes.length > 6) {
      html += '<div style="font-size:9px;color:var(--text-muted);padding:2px 0 2px 10px">+' + (notes.length - 6) + ' more</div>';
    }
    container.innerHTML = html;
  }

  function renderSessionsPanel() {
    const sorted = [...allSessions].sort((a, b) => {
      if (a.status === 'active' && b.status !== 'active') return -1;
      if (b.status === 'active' && a.status !== 'active') return 1;
      return b.createdAt - a.createdAt;
    });

    let html = '';
    for (const s of sorted.slice(0, 25)) {
      const dotCls = s.status === 'active' ? 'active' : 'completed';
      const rowCls = s.status === 'completed' ? ' is-completed' : '';
      const color = agentColor(s.agentId);
      html += '<div class="session-row' + rowCls + '">' +
        '<div class="session-row-dot ' + dotCls + '"></div>' +
        '<div class="session-row-body">' +
          '<div class="session-row-purpose">' + esc(s.purpose || 'Unnamed') + '</div>' +
          '<div class="session-row-meta">' +
            '<span style="color:' + color + '">' + agentName(s.agentId) + '</span>' +
            '<span>' + s.status + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="session-row-age">' + relTime(s.createdAt) + '</div>' +
      '</div>';
    }
    $sessionsPanel.innerHTML = html;
  }

  // ===== SSE =====
  let refreshTimeout;

  function connectSSE() {
    if (sseSource) sseSource.close();
    sseSource = new EventSource(BASE + '/dashboard/events');

    sseSource.onopen = () => {
      $connDot.className = 'conn-dot connected';
      $connLabel.textContent = 'live';
    };

    sseSource.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.type === 'connected') {
          $connDot.className = 'conn-dot connected';
          $connLabel.textContent = 'live';
          return;
        }
        if (d.type === 'refresh') {
          clearTimeout(refreshTimeout);
          refreshTimeout = setTimeout(loadAll, 600);
        }
      } catch (e) { /* ignore */ }
    };

    sseSource.onerror = () => {
      $connDot.className = 'conn-dot disconnected';
      $connLabel.textContent = 'offline';
    };
  }

  // ===== UPTIME =====
  function startUptimeTimer() {
    if (uptimeInterval) clearInterval(uptimeInterval);
    if (!daemonStartTime) return;
    function tick() {
      $uptime.textContent = 'up ' + fmtUptime(Date.now() - daemonStartTime);
    }
    tick();
    uptimeInterval = setInterval(tick, 1000);
  }

  // ===== FILTER BUTTONS =====
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderFeed();
    });
  });

  // ===== SESSIONS TOGGLE =====
  $sessionsToggle.addEventListener('click', () => {
    $sessionsPanel.classList.toggle('open');
    $sessionsArrow.classList.toggle('open');
  });

  // ===== PERIODIC REFRESH =====
  setInterval(() => {
    renderFeed();
    renderSessionsPanel();
  }, 30000);

  // ===== INIT =====
  loadAll();
  connectSSE();

})();
</script>
</body>
</html>
