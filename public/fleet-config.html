<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PortDaddy · Agentic Control Plane</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ebony:    '#1E1B18',
            ebony2:   '#2A2622',
            ebony3:   '#343028',
            cinnabar: '#CC3D2E',
            sand:     '#D4C5A9',
            sandmid:  '#A8967E',
            sandlow:  '#6B5D4F',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; }
    body { background: #1E1B18; color: #D4C5A9; font-family: 'JetBrains Mono', monospace; }

    /* Pulse dot animation */
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.8; }
      70%  { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .pulse-active::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-ring 2s ease-out infinite;
    }

    /* Beam animation along SVG path */
    @keyframes beam-flow {
      0%   { stroke-dashoffset: 400; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { stroke-dashoffset: 0;   opacity: 0; }
    }
    .beam-path {
      stroke-dasharray: 8 392;
      stroke-dashoffset: 400;
      animation: beam-flow 2.5s linear infinite;
    }

    /* Channel pill */
    .ch-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .ch-listen   { background: rgba(212,197,169,0.08); border: 1px solid rgba(212,197,169,0.2); color: #D4C5A9; }
    .ch-broadcast { background: rgba(204,61,46,0.12);  border: 1px solid rgba(204,61,46,0.35);  color: #e8735a; }

    /* Card hover */
    .agent-card {
      border: 1px solid rgba(212,197,169,0.1);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .agent-card:hover {
      border-color: rgba(204,61,46,0.4);
      box-shadow: 0 0 0 1px rgba(204,61,46,0.15);
    }
    .agent-card.active-card {
      border-color: rgba(204,61,46,0.5);
    }

    /* Configure button */
    .btn-configure {
      background: rgba(204,61,46,0.15);
      border: 1px solid rgba(204,61,46,0.35);
      color: #e8735a;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .btn-configure:hover {
      background: rgba(204,61,46,0.3);
      border-color: rgba(204,61,46,0.7);
      box-shadow: 0 0 8px rgba(204,61,46,0.25);
    }

    /* Sidebar */
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 6px;
      font-size: 13px; cursor: pointer;
      transition: background 0.15s;
      color: #A8967E;
    }
    .nav-item:hover  { background: rgba(212,197,169,0.06); color: #D4C5A9; }
    .nav-item.active { background: rgba(204,61,46,0.15); color: #D4C5A9; border-left: 2px solid #CC3D2E; }

    /* Outcome badges */
    .badge-clean    { background: rgba(34,197,94,0.12);  border: 1px solid rgba(34,197,94,0.3);  color: #4ade80; }
    .badge-findings { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }
    .badge-running  { background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); color: #fbbf24; }
    .badge-idle     { background: rgba(107,93,79,0.2);   border: 1px solid rgba(107,93,79,0.4);  color: #A8967E; }
    .badge-idea     { background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.3); color: #a78bfa; }

    /* YAML sync toast */
    @keyframes slide-in {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .yaml-toast {
      animation: slide-in 0.2s ease-out;
    }

    /* Prompt editor */
    .prompt-textarea {
      background: #141210;
      border: 1px solid rgba(212,197,169,0.15);
      color: #D4C5A9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.15s;
    }
    .prompt-textarea:focus {
      outline: none;
      border-color: rgba(204,61,46,0.5);
    }

    /* Scrollbar */
    ::-webkit-scrollbar       { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(212,197,169,0.15); border-radius: 2px; }
  </style>
</head>
<body x-data="fleetApp()" x-init="init()" class="h-screen flex flex-col overflow-hidden">

  <!-- Top bar -->
  <header class="flex items-center justify-between px-5 py-3 border-b border-sand/10 flex-shrink-0" style="background: #161310;">
    <div class="flex items-center gap-3">
      <!-- Antenna icon (SVG, no emoji) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CC3D2E" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 20V12"/>
        <path d="M5 7.5A9 9 0 0 1 19 7.5"/>
        <path d="M2 4.5A14 14 0 0 1 22 4.5"/>
        <path d="M8 10.5a5 5 0 0 1 8 0"/>
        <circle cx="12" cy="12" r="1.5" fill="#CC3D2E" stroke="none"/>
      </svg>
      <span class="text-sand font-semibold text-sm tracking-wide">PortDaddy</span>
      <span class="text-sandlow text-xs">:</span>
      <span class="text-sandmid text-xs font-normal tracking-widest uppercase">Agentic Control Plane</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Daemon status -->
      <div class="flex items-center gap-1.5 text-xs" :class="daemonOk ? 'text-green-400' : 'text-red-400'">
        <div class="relative w-2 h-2">
          <div class="w-2 h-2 rounded-full" :class="daemonOk ? 'bg-green-500' : 'bg-red-500'"></div>
          <div x-show="daemonOk" class="absolute inset-0 w-2 h-2 rounded-full bg-green-500 animate-ping opacity-50"></div>
        </div>
        <span x-text="daemonOk ? 'daemon running' : 'daemon offline'"></span>
      </div>
      <span class="text-sandlow text-xs" x-text="project"></span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <nav class="w-44 flex-shrink-0 border-r border-sand/10 py-4 px-2 flex flex-col gap-1" style="background: #161310;">
      <template x-for="item in navItems" :key="item.id">
        <div class="nav-item" :class="{ active: activeTab === item.id }" @click="activeTab = item.id">
          <span x-html="item.icon"></span>
          <span x-text="item.label"></span>
        </div>
      </template>

      <div class="mt-auto pt-4 border-t border-sand/10">
        <div class="text-sandlow text-xs px-2 mb-2">Project</div>
        <div class="text-sand text-xs px-2 truncate font-medium" x-text="project || 'port-daddy'"></div>
        <div class="text-sandlow text-xs px-2 mt-1" x-text="fleetFile"></div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto p-6">

      <!-- AGENTS TAB -->
      <div x-show="activeTab === 'agents'">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-sand font-semibold text-lg">Fleet Agents</h1>
            <p class="text-sandlow text-xs mt-0.5" x-text="`${agents.length} agents · ${activeCount} active`"></p>
          </div>
          <button class="btn-configure text-xs px-3 py-1.5 rounded-md flex items-center gap-1.5" @click="addAgent()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Add Agent
          </button>
        </div>

        <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));">
          <template x-for="agent in agents" :key="agent.name">
            <div class="agent-card rounded-xl p-4 flex flex-col gap-3" :class="{ 'active-card': agent.isActive }"
                 style="background: #2A2622;">

              <!-- Agent header -->
              <div class="flex items-start justify-between gap-2">
                <div class="flex items-start gap-2.5">
                  <!-- Radio icon with status -->
                  <div class="relative flex-shrink-0 mt-0.5">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"
                         :stroke="agent.isActive ? '#CC3D2E' : '#6B5D4F'">
                      <path d="M12 20V12"/>
                      <path d="M6 8.5A8 8 0 0 1 18 8.5"/>
                      <path d="M3 5.5A13 13 0 0 1 21 5.5"/>
                      <path d="M9 11A4 4 0 0 1 15 11"/>
                      <circle cx="12" cy="12" r="1.5" :fill="agent.isActive ? '#CC3D2E' : '#6B5D4F'" stroke="none"/>
                    </svg>
                    <div x-show="agent.isActive" class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-green-500">
                      <div class="w-2 h-2 rounded-full bg-green-500 animate-ping opacity-60 absolute inset-0"></div>
                    </div>
                  </div>
                  <div>
                    <div class="text-sand font-semibold text-sm" x-text="agent.name"></div>
                    <div class="text-sandlow text-xs mt-0.5 leading-snug" x-text="agent.description"></div>
                  </div>
                </div>

                <!-- Trigger badge -->
                <div class="flex-shrink-0">
                  <div class="flex items-center gap-1 px-2 py-1 rounded-md text-xs"
                       :class="agent.triggerType === 'schedule' ? 'text-sandmid bg-sand/5 border border-sand/10' : 'text-amber-400 bg-amber-400/8 border border-amber-400/20'">
                    <!-- Clock icon for schedule, Zap for event -->
                    <template x-if="agent.triggerType === 'schedule'">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                    </template>
                    <template x-if="agent.triggerType === 'event'">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </template>
                    <span x-text="agent.trigger"></span>
                  </div>
                </div>
              </div>

              <!-- Last run story -->
              <div class="rounded-lg p-2.5 flex flex-col gap-1.5" style="background: rgba(0,0,0,0.25);">
                <div class="flex items-center gap-2">
                  <span class="text-sandlow text-xs" x-text="agent.lastRun || 'never run'"></span>
                  <template x-if="agent.lastOutcome">
                    <span class="ch-pill text-xs font-semibold"
                          :class="`badge-${agent.lastOutcome.toLowerCase()}`"
                          x-text="agent.lastOutcome"></span>
                  </template>
                </div>
                <template x-if="agent.lastStory">
                  <div class="text-sandmid text-xs italic leading-snug" x-text="`"${agent.lastStory}"`"></div>
                </template>
                <template x-if="!agent.lastStory">
                  <div class="text-sandlow text-xs italic">Waiting for first run…</div>
                </template>
              </div>

              <!-- Channels -->
              <div class="flex gap-3">
                <!-- Listening -->
                <template x-if="agent.listening.length > 0">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1 mb-1.5 text-sandlow text-xs">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3v5z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3v5z"/></svg>
                      Listening
                    </div>
                    <div class="flex flex-wrap gap-1">
                      <template x-for="ch in agent.listening" :key="ch">
                        <span class="ch-pill ch-listen" x-text="ch"></span>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Broadcasting -->
                <template x-if="agent.broadcasting.length > 0">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1 mb-1.5 text-sandlow text-xs">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                      Broadcasting
                    </div>
                    <div class="flex flex-wrap gap-1">
                      <template x-for="ch in agent.broadcasting" :key="ch">
                        <span class="ch-pill ch-broadcast" x-text="ch"></span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Artifacts -->
              <template x-if="agent.artifacts && agent.artifacts.length > 0">
                <div>
                  <div class="flex items-center gap-1 mb-1.5 text-sandlow text-xs">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Artifacts
                  </div>
                  <div class="flex flex-col gap-0.5">
                    <template x-for="f in agent.artifacts" :key="f">
                      <div class="text-xs text-sandmid truncate" style="font-family: monospace;" x-text="f"></div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Footer -->
              <div class="flex items-center justify-between pt-1 border-t border-sand/8">
                <div class="text-xs text-sandlow" x-text="agent.identity"></div>
                <button class="btn-configure text-xs px-2.5 py-1 rounded-md flex items-center gap-1.5"
                        @click="openConfig(agent)">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
                  Configure
                </button>
              </div>

            </div>
          </template>
        </div>
      </div>

      <!-- CHANNELS TAB -->
      <div x-show="activeTab === 'channels'">
        <div class="mb-6">
          <h1 class="text-sand font-semibold text-lg">Channel Network</h1>
          <p class="text-sandlow text-xs mt-0.5">How agents talk to each other. Pulses show live message flow.</p>
        </div>

        <!-- Channel flow diagram -->
        <div class="rounded-xl border border-sand/10 overflow-hidden mb-6" style="background: #141210;">
          <svg id="channel-svg" width="100%" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="font-family: 'JetBrains Mono', monospace;">
            <!-- Background grid -->
            <defs>
              <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(212,197,169,0.03)" stroke-width="1"/>
              </pattern>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="720" height="420" fill="url(#grid)"/>

            <!-- ── LEFT COLUMN: publishers ── -->
            <!-- gardener node -->
            <g transform="translate(80, 90)">
              <rect x="-50" y="-18" width="100" height="36" rx="6" fill="#2A2622" stroke="rgba(204,61,46,0.4)" stroke-width="1"/>
              <circle cx="-34" cy="0" r="4" fill="#22c55e"/>
              <text x="-24" y="4" fill="#D4C5A9" font-size="11" font-weight="600">gardener</text>
            </g>

            <!-- qa node -->
            <g transform="translate(80, 190)">
              <rect x="-50" y="-18" width="100" height="36" rx="6" fill="#2A2622" stroke="rgba(204,61,46,0.4)" stroke-width="1"/>
              <circle cx="-34" cy="0" r="4" fill="#22c55e"/>
              <text x="-24" y="4" fill="#D4C5A9" font-size="11" font-weight="600">qa</text>
            </g>

            <!-- spark node -->
            <g transform="translate(80, 300)">
              <rect x="-50" y="-18" width="100" height="36" rx="6" fill="#2A2622" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
              <circle cx="-34" cy="0" r="4" fill="#a78bfa"/>
              <text x="-24" y="4" fill="#D4C5A9" font-size="11" font-weight="600">spark</text>
            </g>

            <!-- ── CENTRE COLUMN: channels ── -->
            <!-- git:committed -->
            <g transform="translate(310, 160)">
              <rect x="-72" y="-16" width="144" height="32" rx="5" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
              <text x="0" y="4" fill="#fbbf24" font-size="10" text-anchor="middle">git:committed</text>
            </g>

            <!-- git:status -->
            <g transform="translate(310, 90)">
              <rect x="-58" y="-16" width="116" height="32" rx="5" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
              <text x="0" y="4" fill="#86efac" font-size="10" text-anchor="middle">git:status</text>
            </g>

            <!-- qa:findings -->
            <g transform="translate(310, 250)">
              <rect x="-60" y="-16" width="120" height="32" rx="5" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
              <text x="0" y="4" fill="#f87171" font-size="10" text-anchor="middle">qa:findings</text>
            </g>

            <!-- spark:idea -->
            <g transform="translate(310, 330)">
              <rect x="-52" y="-16" width="104" height="32" rx="5" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
              <text x="0" y="4" fill="#a78bfa" font-size="10" text-anchor="middle">spark:idea</text>
            </g>

            <!-- ── RIGHT COLUMN: subscribers ── -->
            <!-- test-hunter -->
            <g transform="translate(610, 110)">
              <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#2A2622" stroke="rgba(212,197,169,0.15)" stroke-width="1"/>
              <text x="-40" y="4" fill="#D4C5A9" font-size="11" font-weight="600">test-hunter</text>
            </g>
            <!-- documentarian -->
            <g transform="translate(610, 175)">
              <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#2A2622" stroke="rgba(212,197,169,0.15)" stroke-width="1"/>
              <text x="-40" y="4" fill="#D4C5A9" font-size="10" font-weight="600">documentarian</text>
            </g>
            <!-- simplifier -->
            <g transform="translate(610, 240)">
              <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#2A2622" stroke="rgba(212,197,169,0.15)" stroke-width="1"/>
              <text x="-40" y="4" fill="#D4C5A9" font-size="11" font-weight="600">simplifier</text>
            </g>
            <!-- cartographer -->
            <g transform="translate(610, 305)">
              <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#2A2622" stroke="rgba(212,197,169,0.15)" stroke-width="1"/>
              <text x="-40" y="4" fill="#D4C5A9" font-size="10" font-weight="600">cartographer</text>
            </g>
            <!-- spider -->
            <g transform="translate(610, 370)">
              <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#2A2622" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
              <text x="-40" y="4" fill="#a78bfa" font-size="11" font-weight="600">spider</text>
            </g>

            <!-- ── PATHS: publisher → channel ── -->
            <!-- gardener → git:status -->
            <path d="M130,90 C200,90 220,90 238,90" stroke="rgba(34,197,94,0.25)" stroke-width="1.5" fill="none"/>
            <path d="M130,90 C200,90 220,90 238,90" stroke="#22c55e" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay: 0s"/>

            <!-- gardener → git:committed (fires via commit in loop) -->
            <!-- qa ← git:committed -->
            <path d="M130,190 C180,190 210,165 238,163" stroke="rgba(204,61,46,0.25)" stroke-width="1.5" fill="none"/>
            <path d="M130,190 C180,190 210,165 238,163" stroke="#CC3D2E" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:0.8s"/>

            <!-- qa → qa:findings -->
            <path d="M130,190 C180,190 210,245 238,250" stroke="rgba(239,68,68,0.2)" stroke-width="1.5" fill="none"/>
            <path d="M130,190 C180,190 210,245 238,250" stroke="#f87171" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:1.2s"/>

            <!-- spark → spark:idea -->
            <path d="M130,300 C200,300 220,325 238,330" stroke="rgba(139,92,246,0.25)" stroke-width="1.5" fill="none"/>
            <path d="M130,300 C200,300 220,325 238,330" stroke="#a78bfa" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:1.8s"/>

            <!-- ── PATHS: channel → subscriber ── -->
            <!-- git:committed → test-hunter -->
            <path d="M382,160 C450,160 490,112 555,112" stroke="rgba(251,191,36,0.2)" stroke-width="1.5" fill="none"/>
            <path d="M382,160 C450,160 490,112 555,112" stroke="#fbbf24" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:0.4s"/>

            <!-- git:committed → documentarian -->
            <path d="M382,160 C450,160 490,177 555,177" stroke="rgba(251,191,36,0.2)" stroke-width="1.5" fill="none"/>
            <path d="M382,160 C450,160 490,177 555,177" stroke="#fbbf24" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:0.6s"/>

            <!-- git:committed → simplifier -->
            <path d="M382,160 C450,160 490,240 555,240" stroke="rgba(251,191,36,0.2)" stroke-width="1.5" fill="none"/>
            <path d="M382,160 C450,160 490,240 555,240" stroke="#fbbf24" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:1.0s"/>

            <!-- git:committed → cartographer -->
            <path d="M382,160 C450,160 490,305 555,305" stroke="rgba(251,191,36,0.2)" stroke-width="1.5" fill="none"/>
            <path d="M382,160 C450,160 490,305 555,305" stroke="#fbbf24" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:1.4s"/>

            <!-- spark:idea → spider -->
            <path d="M362,330 C450,330 490,370 555,370" stroke="rgba(139,92,246,0.25)" stroke-width="1.5" fill="none"/>
            <path d="M362,330 C450,330 490,370 555,370" stroke="#a78bfa" stroke-width="1.5" fill="none" class="beam-path" style="animation-delay:2.2s"/>

            <!-- Labels -->
            <text x="310" y="20" fill="rgba(212,197,169,0.3)" font-size="9" text-anchor="middle" letter-spacing="2">PUBLISHERS</text>
            <text x="310" y="410" fill="rgba(212,197,169,0.3)" font-size="9" text-anchor="middle" letter-spacing="2">CHANNELS</text>
            <text x="610" y="20" fill="rgba(212,197,169,0.3)" font-size="9" text-anchor="middle" letter-spacing="2">SUBSCRIBERS</text>
            <text x="80" y="20" fill="rgba(212,197,169,0.3)" font-size="9" text-anchor="middle" letter-spacing="2">AGENTS</text>
          </svg>
        </div>

        <!-- Channel list -->
        <div class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
          <template x-for="ch in channels" :key="ch.name">
            <div class="rounded-xl p-4 border border-sand/10" style="background: #2A2622;">
              <div class="flex items-center justify-between mb-3">
                <span class="ch-pill ch-broadcast text-xs font-semibold" x-text="ch.name"></span>
                <span class="text-sandlow text-xs" x-text="ch.lastFired ? `last: ${ch.lastFired}` : 'never fired'"></span>
              </div>
              <div class="text-sandlow text-xs mb-3 leading-relaxed" x-text="ch.description"></div>
              <template x-if="ch.consumers && ch.consumers.length > 0">
                <div>
                  <div class="text-xs text-sandlow mb-1">Triggers</div>
                  <div class="flex flex-wrap gap-1">
                    <template x-for="c in ch.consumers" :key="c">
                      <span class="ch-pill ch-listen" x-text="c"></span>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- STORIES TAB -->
      <div x-show="activeTab === 'stories'">
        <div class="mb-6">
          <h1 class="text-sand font-semibold text-lg">Agent Stories</h1>
          <p class="text-sandlow text-xs mt-0.5">What each agent has done, in order.</p>
        </div>
        <div class="flex flex-col gap-2">
          <template x-for="story in stories" :key="story.id">
            <div class="flex gap-3 p-3 rounded-lg border border-sand/8" style="background: #2A2622;">
              <div class="flex-shrink-0 mt-1">
                <div class="w-2 h-2 rounded-full mt-1" :class="`badge-${story.outcome}`" style="background: currentColor;"></div>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-sand text-xs font-semibold" x-text="story.agent"></span>
                  <span class="ch-pill text-xs" :class="`badge-${story.outcome}`" x-text="story.outcome"></span>
                  <span class="text-sandlow text-xs ml-auto" x-text="story.time"></span>
                </div>
                <div class="text-sandmid text-xs leading-relaxed" x-text="story.summary"></div>
                <template x-if="story.artifacts && story.artifacts.length">
                  <div class="flex flex-wrap gap-1 mt-1.5">
                    <template x-for="f in story.artifacts" :key="f">
                      <span class="text-xs text-sandlow" style="font-family: monospace;" x-text="f"></span>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <template x-if="stories.length === 0">
            <div class="text-center text-sandlow text-sm py-16">No stories yet — agents will write here as they run.</div>
          </template>
        </div>
      </div>

      <!-- CONFIG TAB (prompt editor) -->
      <div x-show="activeTab === 'config'">
        <div class="mb-6">
          <h1 class="text-sand font-semibold text-lg">Configure Agent</h1>
          <p class="text-sandlow text-xs mt-0.5">Visual edits sync directly to <span class="text-sand font-medium" x-text="fleetFile"></span></p>
        </div>

        <template x-if="editingAgent">
          <div class="max-w-2xl flex flex-col gap-6">

            <!-- Name + description -->
            <div class="flex flex-col gap-1.5">
              <label class="text-xs text-sandlow uppercase tracking-wider">Agent Name</label>
              <input type="text" x-model="editingAgent.name"
                     class="bg-ebony3 border border-sand/15 rounded-md px-3 py-2 text-sand text-sm font-mono focus:outline-none focus:border-cinnabar/50"
                     @input="markDirty()" />
            </div>

            <!-- Trigger -->
            <div class="flex flex-col gap-1.5">
              <label class="text-xs text-sandlow uppercase tracking-wider">Trigger</label>
              <div class="flex gap-2">
                <select x-model="editingAgent.triggerType" @change="markDirty()"
                        class="bg-ebony3 border border-sand/15 rounded-md px-3 py-2 text-sand text-sm font-mono focus:outline-none focus:border-cinnabar/50">
                  <option value="event">Event (channel)</option>
                  <option value="schedule">Schedule (cron)</option>
                </select>
                <input type="text" x-model="editingAgent.trigger" @input="markDirty()"
                       class="flex-1 bg-ebony3 border border-sand/15 rounded-md px-3 py-2 text-sand text-sm font-mono focus:outline-none focus:border-cinnabar/50"
                       :placeholder="editingAgent.triggerType === 'schedule' ? '*/10 * * * *' : 'git:committed'" />
              </div>
            </div>

            <!-- Prompt -->
            <div class="flex flex-col gap-1.5">
              <label class="text-xs text-sandlow uppercase tracking-wider">Prompt</label>
              <textarea x-model="editingAgent.prompt" @input="markDirty()" rows="12"
                        class="prompt-textarea w-full rounded-md px-3 py-2.5"></textarea>
            </div>

            <!-- on_success / on_failure -->
            <div class="grid grid-cols-2 gap-4">
              <div class="flex flex-col gap-1.5">
                <label class="text-xs text-sandlow uppercase tracking-wider">On Success</label>
                <input type="text" x-model="editingAgent.onSuccess" @input="markDirty()"
                       placeholder="publish qa:clean"
                       class="bg-ebony3 border border-sand/15 rounded-md px-3 py-2 text-sand text-sm font-mono focus:outline-none focus:border-cinnabar/50"/>
              </div>
              <div class="flex flex-col gap-1.5">
                <label class="text-xs text-sandlow uppercase tracking-wider">On Failure</label>
                <input type="text" x-model="editingAgent.onFailure" @input="markDirty()"
                       placeholder="publish qa:findings"
                       class="bg-ebony3 border border-sand/15 rounded-md px-3 py-2 text-sand text-sm font-mono focus:outline-none focus:border-cinnabar/50"/>
              </div>
            </div>

            <!-- Save -->
            <div class="flex items-center gap-3">
              <button @click="saveAgent()" class="btn-configure text-sm px-4 py-2 rounded-md flex items-center gap-2">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save to YAML
              </button>
              <button @click="editingAgent = null; activeTab = 'agents'" class="text-sm text-sandlow hover:text-sand px-3 py-2">
                Cancel
              </button>
              <span x-show="yamlSyncMsg" class="yaml-toast text-xs text-green-400 flex items-center gap-1">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                <span x-text="yamlSyncMsg"></span>
              </span>
            </div>
          </div>
        </template>

        <template x-if="!editingAgent">
          <div class="text-sandlow text-sm py-16 text-center">
            Select an agent from the <button @click="activeTab='agents'" class="text-cinnabar hover:underline">Agents tab</button> and click Configure.
          </div>
        </template>
      </div>

    </main>
  </div>

  <script>
  function fleetApp() {
    return {
      activeTab: 'agents',
      project: 'port-daddy',
      fleetFile: 'pd-fleet.yml',
      daemonOk: false,
      editingAgent: null,
      yamlSyncMsg: '',
      isDirty: false,

      navItems: [
        { id: 'agents',   label: 'Agents',   icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V12"/><path d="M6 8.5A8 8 0 0 1 18 8.5"/><path d="M3 5.5A13 13 0 0 1 21 5.5"/><path d="M9 11A4 4 0 0 1 15 11"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>' },
        { id: 'channels', label: 'Channels', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' },
        { id: 'stories',  label: 'Stories',  icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22V12"/><path d="m17 7-5-5-5 5"/><path d="M5 21h14"/></svg>' },
        { id: 'config',   label: 'Configure', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>' },
      ],

      // Populated from pd-fleet.yml + live Port Daddy data
      agents: [
        {
          name: 'gardener',
          description: 'Watches for uncommitted changes and auto-commits with AI-generated messages.',
          triggerType: 'schedule', trigger: 'every 10 min',
          isActive: false,
          lastRun: '8 min ago', lastOutcome: 'clean',
          lastStory: 'No source changes detected — working tree clean',
          listening: [], broadcasting: ['git:status', 'git:committed'],
          artifacts: [],
          identity: 'port-daddy:fleet:gardener',
          prompt: 'git status --porcelain',
          onSuccess: 'publish git:status'
        },
        {
          name: 'qa',
          description: 'Adversarial code review — tries to break every commit before users do.',
          triggerType: 'event', trigger: 'git:committed',
          isActive: true,
          lastRun: '2 min ago', lastOutcome: 'clean',
          lastStory: 'No issues found in f38dc6b — fix(security): decryptSecret returns null',
          listening: ['git:committed'], broadcasting: ['qa:clean', 'qa:findings'],
          artifacts: [],
          identity: 'port-daddy:fleet:qa',
          prompt: `Review the most recent commit. Read every changed file.\nFor each change, identify inputs that would break it.\nIf you find bugs, write a test that exposes each one.\n\nIf clean, just say CLEAN.`,
          onSuccess: 'publish qa:clean', onFailure: 'publish qa:findings'
        },
        {
          name: 'test-hunter',
          description: 'Finds modules below 50% coverage and writes meaningful tests for them.',
          triggerType: 'event', trigger: 'git:committed',
          isActive: false,
          lastRun: '2 min ago', lastOutcome: 'clean',
          lastStory: 'All tracked modules above threshold — no gaps found',
          listening: ['git:committed'], broadcasting: [],
          artifacts: [],
          identity: 'port-daddy:fleet:test-hunter',
          prompt: `Run the test suite. Find modules below 50% coverage.\nFor each gap, write meaningful tests that exercise real code paths.`
        },
        {
          name: 'documentarian',
          description: 'Keeps all docs in sync with code — CLAUDE.md, README, website, skill files.',
          triggerType: 'event', trigger: 'git:committed',
          isActive: false,
          lastRun: '2 min ago', lastOutcome: 'clean',
          lastStory: 'CLAUDE.md updated — fleet daemon section matches new routes',
          listening: ['git:committed'], broadcasting: [],
          artifacts: ['CLAUDE.md', 'skills/port-daddy-cli/SKILL.md'],
          identity: 'port-daddy:fleet:documentarian'
        },
        {
          name: 'simplifier',
          description: 'Reviews recent changes for unnecessary complexity and simplifies without breaking anything.',
          triggerType: 'event', trigger: 'git:committed',
          isActive: false,
          lastRun: '2 min ago', lastOutcome: 'idle',
          lastStory: 'No simplifications found — code is sufficiently direct',
          listening: ['git:committed'], broadcasting: [],
          artifacts: [],
          identity: 'port-daddy:fleet:simplifier'
        },
        {
          name: 'cartographer',
          description: 'Maintains the V4 roadmap — moves items from NEXT to COMPLETE as commits land.',
          triggerType: 'event', trigger: 'git:committed',
          isActive: false,
          lastRun: '2 min ago', lastOutcome: 'clean',
          lastStory: 'Fleet daemon phase updated — 3 items moved to COMPLETE',
          listening: ['git:committed'], broadcasting: [],
          artifacts: ['docs/V4-UNIFIED-ROADMAP.md', '.cartographer/status.md'],
          identity: 'port-daddy:fleet:cartographer'
        },
        {
          name: 'spark',
          description: 'Generates one concrete feature idea per run, saved to .spark/ideas/.',
          triggerType: 'schedule', trigger: 'every 30 min',
          isActive: false,
          lastRun: '12 min ago', lastOutcome: 'idea',
          lastStory: 'spider-trie-pubsub-routing.md — pheromone trails × Arbiter staleness signals',
          listening: [], broadcasting: ['spark:idea'],
          artifacts: ['.spark/ideas/2026-04-01-pheromone-arbiter.md'],
          identity: 'port-daddy:fleet:spark'
        },
        {
          name: 'spider',
          description: 'Finds combinatorial connections between features. Produces syllogisms.',
          triggerType: 'event', trigger: 'spark:idea',
          isActive: false,
          lastRun: '11 min ago', lastOutcome: 'idea',
          lastStory: '7 new syllogisms: trie+pubsub routing, pheromone+Arbiter, symbol-claims+merge-queue…',
          listening: ['spark:idea'], broadcasting: ['spider:connections'],
          artifacts: ['.spider/connections/2026-04-01-session.md'],
          identity: 'port-daddy:fleet:spider'
        }
      ],

      channels: [
        { name: 'git:committed',    description: 'Fired after a successful commit — the primary work trigger for the fleet.', consumers: ['qa', 'test-hunter', 'documentarian', 'simplifier', 'cartographer'], lastFired: '2 min ago' },
        { name: 'git:status',       description: 'Gardener reports on uncommitted changes in the working tree.', consumers: [], lastFired: '8 min ago' },
        { name: 'qa:clean',         description: 'QA found no issues in the latest commit.', consumers: [], lastFired: '2 min ago' },
        { name: 'qa:findings',      description: 'QA found bugs or quality issues — payload includes worktree path.', consumers: ['notify-findings'], lastFired: 'never' },
        { name: 'spark:idea',       description: 'Spark proposed a new feature idea — triggers Spider to find connections.', consumers: ['spider'], lastFired: '12 min ago' },
        { name: 'spider:connections', description: 'Spider found new combinatorial possibilities between existing features.', consumers: [], lastFired: '11 min ago' },
      ],

      stories: [],

      get activeCount() {
        return this.agents.filter(a => a.isActive).length;
      },

      async init() {
        await this.checkDaemon();
        await this.loadStories();
        setInterval(() => this.checkDaemon(), 10000);
      },

      async checkDaemon() {
        try {
          const r = await fetch('http://localhost:9876/ping', { signal: AbortSignal.timeout(2000) });
          this.daemonOk = r.ok;
        } catch { this.daemonOk = false; }
      },

      async loadStories() {
        try {
          const r = await fetch('http://localhost:9876/notes?limit=20');
          if (!r.ok) return;
          const data = await r.json();
          const notes = data.notes || data || [];
          this.stories = notes.map((n, i) => ({
            id: i,
            agent: n.agent || this.agentFromSession(n.session_id),
            outcome: n.type === 'warning' ? 'findings' : n.type === 'progress' ? 'running' : 'clean',
            time: this.relativeTime(n.created_at),
            summary: n.content || n.body || '',
            artifacts: []
          }));
        } catch { /* daemon offline or no notes yet */ }
      },

      agentFromSession(sessionId) {
        if (!sessionId) return 'fleet';
        const m = sessionId.match(/fleet:(\w+)/);
        return m ? m[1] : 'fleet';
      },

      relativeTime(ts) {
        if (!ts) return '';
        const diff = Date.now() - new Date(ts).getTime();
        const m = Math.floor(diff / 60000);
        if (m < 1) return 'just now';
        if (m < 60) return `${m} min ago`;
        return `${Math.floor(m/60)}h ago`;
      },

      openConfig(agent) {
        this.editingAgent = { ...agent };
        this.activeTab = 'config';
        this.isDirty = false;
        this.yamlSyncMsg = '';
      },

      markDirty() {
        this.isDirty = true;
        this.yamlSyncMsg = '';
      },

      async saveAgent() {
        // POST to Port Daddy which writes the YAML
        try {
          const r = await fetch('http://localhost:9876/fleet/edit-agent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project: this.project,
              agent: this.editingAgent
            })
          });
          if (r.ok) {
            this.yamlSyncMsg = `Updated ${this.fleetFile}`;
            this.isDirty = false;
            // Update local agent list
            const idx = this.agents.findIndex(a => a.name === this.editingAgent.name);
            if (idx >= 0) this.agents[idx] = { ...this.agents[idx], ...this.editingAgent };
            setTimeout(() => this.yamlSyncMsg = '', 4000);
          }
        } catch {
          // Fallback: show what would be saved
          this.yamlSyncMsg = `Saved locally (daemon offline)`;
          setTimeout(() => this.yamlSyncMsg = '', 3000);
        }
      },

      addAgent() {
        this.editingAgent = {
          name: 'new-agent',
          description: 'Describe what this agent does.',
          triggerType: 'event',
          trigger: 'git:committed',
          isActive: false,
          prompt: '',
          listening: [], broadcasting: [], artifacts: [],
          identity: `${this.project}:fleet:new-agent`
        };
        this.activeTab = 'config';
      }
    }
  }
  </script>

</body>
</html>
