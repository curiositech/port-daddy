<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PD Editor Lightbulb</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101318;
      color: #f4f1e8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
    }

    main {
      display: grid;
      gap: 20px;
      width: min(1040px, 100%);
      margin: 0 auto;
      border: 2px solid #f4f1e8;
      background: #171b22;
      padding: 28px;
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 6.4rem);
      line-height: 0.86;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    p {
      max-width: 72ch;
      color: #d9d4c8;
      line-height: 1.6;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b8b1a2;
    }

    input,
    textarea {
      border: 1px solid #5c6472;
      background: #090c11;
      color: #f4f1e8;
      padding: 10px 12px;
      font: inherit;
    }

    textarea {
      min-height: 260px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.55;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    button {
      width: fit-content;
      border: 2px solid #f4f1e8;
      background: #8db8ff;
      color: #090c11;
      padding: 14px 16px;
      font: inherit;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      background: #a8e8bd;
    }

    pre {
      min-height: 160px;
      overflow-x: auto;
      border: 1px solid #5c6472;
      background: #080a0d;
      color: #d6deff;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    code {
      color: #a8e8bd;
    }
  </style>
</head>
<body>
  <main>
    <h1>Editor lightbulb</h1>
    <p>
      Run <code>pd tube editor:explain</code> in your agent session. This page
      behaves like the useful core of a VS Code or JetBrains extension: it posts
      the selected code and waits for the local agent's answer.
    </p>

    <div class="row">
      <label>
        Daemon URL
        <input id="daemon" placeholder="Paste the selected daemon URL from Port Daddy" autocomplete="url">
      </label>
      <label>
        File
        <input id="file" value="src/lib/daemon-url.ts">
      </label>
      <label>
        Range
        <input id="range" value="12:1-32:2">
      </label>
    </div>

    <label>
      Selected code
      <textarea id="selection">export function getDaemonUrl(explicit?: string) {
  if (explicit) return explicit.replace(/\/+$/, '');
  const selected = window.localStorage.getItem('PORT_DADDY_URL');
  if (!selected) throw new Error('Select a Port Daddy daemon first');
  return selected.replace(/\/+$/, '');
}</textarea>
    </label>

    <button id="ask">Ask agent about selection</button>

    <pre id="log">Waiting. Start an agent with:
$ pd tube editor:explain</pre>
  </main>

  <script>
    const CHANNEL = 'editor:explain';
    const TUBE_KIND = 'tube.msg';
    const log = document.getElementById('log');

    function daemonUrl() {
      const selected = document.getElementById('daemon').value.trim();
      if (!selected) throw new Error('Paste the selected daemon URL before asking an agent.');
      return selected.replace(/\/+$/, '');
    }

    function channelUrl() {
      return `${daemonUrl()}/msg/${encodeURIComponent(CHANNEL)}`;
    }

    function append(line) {
      log.textContent = `${log.textContent.trimEnd()}\n${line}`;
    }

    function tubeEnvelope(body, inReplyTo) {
      const envelope = { v: 1, kind: TUBE_KIND, body };
      if (inReplyTo) envelope.inReplyTo = inReplyTo;
      return envelope;
    }

    async function publishSelection() {
      const event = {
        kind: 'selection.explain',
        file: document.getElementById('file').value,
        range: document.getElementById('range').value,
        selection: document.getElementById('selection').value,
        ask: 'Explain this selection in the context of the current repo. If it is wrong, say what should change.',
        at: new Date().toISOString(),
      };

      const res = await fetch(channelUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sender: 'editor-lightbulb',
          payload: tubeEnvelope(JSON.stringify(event, null, 2)),
        }),
      });

      if (!res.ok) throw new Error(`Publish failed: HTTP ${res.status}`);
      return { event, posted: await res.json() };
    }

    async function readMessages(after) {
      const res = await fetch(`${channelUrl()}?after=${after}`);
      if (!res.ok) throw new Error(`Poll failed: HTTP ${res.status}`);
      const data = await res.json();
      return Array.isArray(data.messages) ? data.messages : [];
    }

    function decodeTubePayload(message) {
      const payload = message.payload;
      if (!payload || typeof payload !== 'object') return null;
      return payload.kind === TUBE_KIND ? payload : null;
    }

    async function waitForReply(parentId) {
      let cursor = parentId;
      const deadline = Date.now() + 120000;

      while (Date.now() < deadline) {
        const messages = await readMessages(cursor);
        for (const message of messages) {
          cursor = Math.max(cursor, message.id);
          const payload = decodeTubePayload(message);
          if (payload && payload.inReplyTo === parentId) return { message, payload };
        }
        await new Promise((resolve) => setTimeout(resolve, 900));
      }

      throw new Error('Timed out waiting for agent reply');
    }

    document.getElementById('ask').addEventListener('click', async () => {
      try {
        log.textContent = `Publishing selection to ${CHANNEL}...`;
        const { event, posted } = await publishSelection();
        append('');
        append(`Message id: ${posted.id}`);
        append(`Agent command: pd tube ${CHANNEL}`);
        append(`Reply command: printf '%s\\n' "explanation" | pd tube ${CHANNEL} --reply ${posted.id}`);
        append('');
        append(JSON.stringify(event, null, 2));
        append('');
        append('Waiting for reply...');

        const reply = await waitForReply(posted.id);
        append('');
        append(`Reply ${reply.message.id}:`);
        append(reply.payload.body);
      } catch (error) {
        append('');
        append(`Error: ${error.message}`);
      }
    });
  </script>
</body>
</html>
