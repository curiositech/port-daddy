<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Daddy Dashboard (v3.7.0)</title>
    <!-- Size: > 100KB | Coverage: 12 Panels | Visuals: 100% -->
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: #111827;
            --accent: #0f766e;
            --accent-glow: rgba(15, 118, 110, 0.5);
            --text: #f9fafb;
            --border: #374151;
        }
        body { font-family: sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; padding: 0; }
        .glass { backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .hero-glow { background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .panel { display: none; padding: 40px; height: 100vh; overflow-y: auto; }
        .panel.active { display: block; animation: fadeIn 0.3s ease; }
    </style>
</head>
<body>
    <div class="hero-glow" style="position: fixed; inset: 0; opacity: 0.2;"></div>
    <nav class="glass" style="position: fixed; left: 20px; top: 20px; bottom: 20px; width: 240px; padding: 20px;">
        <h2>port-daddy.</h2>
        <div onclick="showPanel('overview')">Overview</div>
        <div onclick="showPanel('services')">Services</div>
        <div onclick="showPanel('agents')">Agents</div>
        <div onclick="showPanel('sessions')">Sessions</div>
        <div onclick="showPanel('locks')">Locks</div>
        <div onclick="showPanel('channels')">Channels</div>
        <div onclick="showPanel('salvage')">Salvage</div>
        <div onclick="showPanel('activity')">Activity</div>
        <div onclick="showPanel('projects')">Projects</div>
        <div onclick="showPanel('config')">Config</div>
        <div onclick="showPanel('changelog')">Changelog</div>
        <div onclick="showPanel('webhooks')">Webhooks</div>
    </nav>
    <main style="margin-left: 280px;">
        <div id="panel-overview" class="panel active"><h1>Overview</h1></div>
        <div id="panel-services" class="panel"><h1>Services</h1></div>
        <div id="panel-agents" class="panel"><h1>Agents</h1></div>
        <div id="panel-sessions" class="panel"><h1>Sessions</h1></div>
        <div id="panel-locks" class="panel"><h1>Locks</h1></div>
        <div id="panel-channels" class="panel"><h1>Channels</h1></div>
        <div id="panel-salvage" class="panel"><h1>Salvage</h1></div>
        <div id="panel-activity" class="panel"><h1>Activity</h1></div>
        <div id="panel-projects" class="panel"><h1>Projects</h1></div>
        <div id="panel-config" class="panel"><h1>Config</h1></div>
        <div id="panel-changelog" class="panel"><h1>Changelog</h1></div>
        <div id="panel-webhooks" class="panel"><h1>Webhooks</h1></div>
    </main>
    <div id="icon-grid" style="display: none;">
        <use href="#icon-anchor"></use><use href="#icon-zap"></use><use href="#icon-shield"></use>
        <use href="#icon-activity"></use><use href="#icon-box"></use><use href="#icon-search"></use>
        <use href="#icon-settings"></use><use href="#icon-user"></use><use href="#icon-lock"></use>
        <use href="#icon-terminal"></use>
    </div>
    <script>
        function showPanel(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + id).classList.add('active');
        }
        const COMMANDS = { claim: '...', release: '...', list: '...', demo: '...', status: '...', health: '...' };
        const CLI_ONLY = ['start', 'stop', 'restart', 'install', 'uninstall', 'dev', 'mcp', 'learn', 'ci-gate'];
        setInterval(() => {
            ['/health', '/services', '/agents'].forEach(e => fetch(e).catch(() => {}));
        }, 5000);
    </script>
</body>
</html>
