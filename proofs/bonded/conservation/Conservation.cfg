SPECIFICATION Spec

\* The model is bounded by MaxMint, so eventually all Next actions are
\* disabled. We do not assert liveness — only the Conservation safety
\* invariant. Skip deadlock detection so TLC reports SUCCESS when it
\* exhausts the bounded state space without breaking the invariant.
CHECK_DEADLOCK FALSE

CONSTANTS
  Agents = {a1, a2, a3}
  MaxBalance = 3
  MaxMint = 6

INVARIANTS
  Conservation
  NoNegative
  Safety
