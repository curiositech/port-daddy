\* The dbEpoch rule under the backup-restore adversary: RevocationFinal and
\* Availability both hold, and every stale database can replay to current.
CONSTANTS
    Cards = {c1, c2}
    MaxEpoch = 5
    MaxRollback = 2
    Rollback = TRUE
    Epoched = FALSE
    DbEpoched = TRUE
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    RevocationFinal
    Availability
    ReplayRecovers
    EpochHeadroom
