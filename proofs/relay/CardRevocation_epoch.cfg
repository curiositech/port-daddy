\* The card-epoch rule: the over-strict control. RevocationFinal holds, but
\* Availability is violated: after any revocation every outstanding card is
\* refused. CI runs this config with -continue and requires exactly that.
CONSTANTS
    Cards = {c1, c2}
    MaxEpoch = 5
    MaxRollback = 2
    Rollback = TRUE
    Epoched = TRUE
    DbEpoched = FALSE
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    RevocationFinal
    EpochHeadroom
    Availability
