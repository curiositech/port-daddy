\* claim-signaling.cfg
\*
\* TLC / Apalache configuration for proofs/economics/claim-signaling.tla.
\*
\* Default entry: delta = 26/100 = 0.26 (just above the closed-form
\* threshold delta* ≈ 0.2531). The IC invariant should hold here.
\*
\* To re-run at other delta values, edit DeltaNum below OR use
\* proofs/economics/sweep-delta.sh which generates per-delta cfg files
\* in proofs/economics/.sweep/ and runs them in turn.
\*
\* Horizon = 8 rounds: enough to amortise the 3-round graduated trigger
\* twice over and let the cooperative payoff compound. The state space
\* is small under TLC; Apalache scales to higher horizons if needed.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  DeltaNum = 26
  DeltaDen = 100
  Horizon = 8
  PunishmentRounds = 3

INVARIANTS
  NoUnilateralDeviationPositive
