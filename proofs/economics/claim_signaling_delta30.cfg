\* claim_signaling_delta30.cfg
\*
\* NEGATIVE CONTROL. TLC configuration for
\* proofs/economics/claim_signaling.tla at delta = 30/100 = 0.30, which is
\* BELOW the closed-form threshold delta* ~= 0.3425 proved by
\* delta-threshold.z3. The invariant NoUnilateralDeviationPositive MUST
\* be violated under this configuration: below the threshold the IC
\* inequality 1 <= 2*(d + d^2 + d^3) fails, so a one-shot deviation
\* strictly pays even after the 3-round graduated-trigger punishment.
\*
\* This is the committed counterexample referenced by the solution to
\* exercise ex:bonded-tla-two-deltas in
\* website-v2/public/whitepaper/agent-transactions-whitepaper.tex, and by
\* the "Negative control" row in proofs/economics/README.md.
\*
\* The proofs.yml CI step "Negative control: delta 0.30 must violate"
\* (job "TLA+ / claim-signaling (TLC)") re-runs this exact cfg on every
\* PR and asserts (i) TLC reports the invariant violated and (ii) the
\* printed counterexample trace has the same number of states as the
\* one committed in claim_signaling_delta30.run.log. If this cfg ever
\* stops violating the invariant, that is a CI failure, not a quiet
\* pass -- see sweep-delta.sh, which sweeps the same range and expects
\* VIOLATED at delta = 0.30.
\*
\* All other constants are identical to claim_signaling.cfg.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  DeltaNum = 30
  DeltaDen = 100
  Horizon = 4
  PunishmentRounds = 3

INVARIANTS
  NoUnilateralDeviationPositive
