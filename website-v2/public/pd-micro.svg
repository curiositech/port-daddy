<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align: -0.125em;" role="img" aria-label="pd">
  <defs>
    <mask id="micro-pd-mask">
      <g stroke="white" stroke-width="1.5" stroke-linecap="butt" fill="none">
        <path d="M 9 7 L 9 17" />
        <circle cx="11" cy="11" r="2" />
      </g>
    </mask>
  </defs>
  <style>
    .pd-micro-center { transform-origin: 12px 12px; animation: pd-flip-micro 6s cubic-bezier(0.77, 0, 0.17, 1) infinite; }
    .spin-radar-micro { transform-origin: 12px 12px; animation: spin-radar 4s linear infinite; }
    @keyframes pd-flip-micro { 0%, 15% { transform: rotate(0deg); } 45%, 65% { transform: rotate(180deg); } 85%, 100% { transform: rotate(360deg); } }
    @keyframes spin-radar { 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pd-micro-center, .spin-radar-micro { animation: none; } }
  </style>
  <g class="spin-radar-micro" stroke="#20DEB0" stroke-width="1" fill="none">
    <circle cx="12" cy="12" r="10" stroke-dasharray="8 4 2 4" />
    <line x1="12" y1="2" x2="12" y2="4" stroke-linecap="round" />
    <line x1="12" y1="22" x2="12" y2="20" stroke-linecap="round" />
    <line x1="2" y1="12" x2="4" y2="12" stroke-linecap="round" />
    <line x1="22" y1="12" x2="20" y2="12" stroke-linecap="round" />
  </g>
  <g class="pd-micro-center">
    <g stroke="#2076FE" stroke-width="1.5" stroke-linecap="butt" fill="none">
      <path d="M 9 7 L 9 17" />
      <circle cx="11" cy="11" r="2" />
    </g>
    <g stroke="#20DEB0" stroke-width="1.5" stroke-linecap="butt" fill="none">
      <path d="M 15 17 L 15 7" />
      <circle cx="13" cy="13" r="2" />
    </g>
    <g stroke="#FFB505" stroke-width="1.5" stroke-linecap="butt" fill="none" mask="url(#micro-pd-mask)">
      <path d="M 15 17 L 15 7" />
      <circle cx="13" cy="13" r="2" />
    </g>
  </g>
</svg>
