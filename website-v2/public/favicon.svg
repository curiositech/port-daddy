<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Port Daddy">
  <!--
    Favicon — the distinct P·d monogram on the brand's dark chip (#070B12).
    Background rationale: #070B12 is a near-black with a deliberate cool-blue
    undertone (it is NOT pure black) that harmonizes with the cobalt #2076FE
    primary instead of fighting the cool palette. All three foreground colors
    clear 4.5:1 contrast against it, so the glyph stays crisp at 16px in both
    light and dark browser chrome. A thin cobalt rim defines the tile edge.
  -->
  <defs>
    <mask id="pd-fav-int" maskContentUnits="userSpaceOnUse">
      <rect width="300" height="300" fill="white" />
      <g stroke="black" stroke-width="22" stroke-linecap="butt" fill="none">
        <line x1="118" y1="118" x2="118" y2="205" />
        <circle cx="143" cy="143" r="27" />
      </g>
    </mask>
  </defs>
  <rect x="6" y="6" width="288" height="288" rx="56" fill="#070B12" stroke="#2076FE" stroke-width="3" />
  <circle cx="150" cy="150" r="118" fill="none" stroke="#1B2740" stroke-width="6" />
  <g stroke="#2076FE" stroke-width="22" stroke-linecap="butt" fill="none">
    <line x1="118" y1="118" x2="118" y2="205" />
    <circle cx="143" cy="143" r="27" />
  </g>
  <g stroke="#20DEB0" stroke-width="22" stroke-linecap="butt" fill="none">
    <line x1="182" y1="182" x2="182" y2="95" />
    <circle cx="157" cy="157" r="27" />
  </g>
  <g stroke="#FFB505" stroke-width="22" stroke-linecap="butt" fill="none" mask="url(#pd-fav-int)">
    <line x1="182" y1="182" x2="182" y2="95" />
    <circle cx="157" cy="157" r="27" />
  </g>
</svg>
