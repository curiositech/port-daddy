<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Port Daddy">
  <!-- Favicon-grade small mark, LIGHT theme.
       The interlocked P/D monogram only (radar dropped — it disappears below
       ~32px). Deepened seafoam/amber for contrast on light/cream grounds.
       Renders crisp at 16/24/32px. Transparent background. -->
  <defs>
    <mask id="pd-small-intersection-light" maskContentUnits="userSpaceOnUse">
      <g stroke="white" stroke-width="10" stroke-linecap="butt" fill="none">
        <line x1="32" y1="15" x2="32" y2="85" />
        <circle cx="48" cy="40" r="16" />
      </g>
    </mask>
  </defs>
  <style>
    :root {
      --cobalt: #2076FE;
      --seafoam: #12B88F;
      --amber: #F5A623;
    }
  </style>
  <g>
    <g stroke="var(--cobalt)" stroke-width="10" stroke-linecap="butt" fill="none">
      <line x1="32" y1="15" x2="32" y2="85" />
      <circle cx="48" cy="40" r="16" />
    </g>
    <g stroke="var(--seafoam)" stroke-width="10" stroke-linecap="butt" fill="none">
      <line x1="68" y1="85" x2="68" y2="15" />
      <circle cx="52" cy="60" r="16" />
    </g>
    <g stroke="var(--amber)" stroke-width="10" stroke-linecap="butt" fill="none" mask="url(#pd-small-intersection-light)">
      <line x1="68" y1="85" x2="68" y2="15" />
      <circle cx="52" cy="60" r="16" />
    </g>
  </g>
</svg>
