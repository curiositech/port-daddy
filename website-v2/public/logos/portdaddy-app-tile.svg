<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" role="img" aria-label="Port Daddy">
  <!-- App tile (apple-touch-icon source). The P/D monogram centered on a solid
       cream tile with a faint radar grid, so it reads as a finished app icon
       (iOS/macOS composite their own rounding). Rasterized to
       public/apple-touch-icon.png by scripts/rasterize-logos.py. -->
  <defs>
    <mask id="pd-tile-intersection" maskContentUnits="userSpaceOnUse">
      <g stroke="white" stroke-width="13" stroke-linecap="butt" fill="none">
        <line x1="68" y1="50" x2="68" y2="130" />
        <circle cx="86" cy="78" r="19" />
      </g>
    </mask>
  </defs>
  <rect width="180" height="180" rx="40" fill="#F4F7FA" />
  <g stroke="#DCE3EB" stroke-width="1" fill="none">
    <circle cx="90" cy="90" r="34" />
    <circle cx="90" cy="90" r="60" />
    <line x1="20" y1="90" x2="160" y2="90" stroke-dasharray="3 3" />
    <line x1="90" y1="20" x2="90" y2="160" stroke-dasharray="3 3" />
  </g>
  <g>
    <g stroke="#2076FE" stroke-width="13" stroke-linecap="butt" fill="none">
      <line x1="68" y1="50" x2="68" y2="130" />
      <circle cx="86" cy="78" r="19" />
    </g>
    <g stroke="#12B88F" stroke-width="13" stroke-linecap="butt" fill="none">
      <line x1="112" y1="130" x2="112" y2="50" />
      <circle cx="94" cy="102" r="19" />
    </g>
    <g stroke="#F5A623" stroke-width="13" stroke-linecap="butt" fill="none" mask="url(#pd-tile-intersection)">
      <line x1="112" y1="130" x2="112" y2="50" />
      <circle cx="94" cy="102" r="19" />
    </g>
  </g>
</svg>
