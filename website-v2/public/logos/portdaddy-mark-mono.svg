<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Port Daddy">
  <!-- Monochrome inline mark. Inherits `currentColor` so it tints to the
       surrounding text/icon color — use in buttons, nav, footers, anywhere a
       single-color glyph is wanted. The interlocked P/D monogram, no radar,
       no second color. -->
  <g stroke="currentColor" stroke-width="10" stroke-linecap="butt" fill="none">
    <line x1="32" y1="15" x2="32" y2="85" />
    <circle cx="48" cy="40" r="16" />
    <line x1="68" y1="85" x2="68" y2="15" />
    <circle cx="52" cy="60" r="16" />
  </g>
</svg>
