<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <mask id="favicon-intersection" maskContentUnits="userSpaceOnUse">
      <g stroke="white" stroke-width="10" stroke-linecap="butt" fill="none">
        <line x1="32" y1="15" x2="32" y2="85" />
        <circle cx="48" cy="40" r="16" />
      </g>
    </mask>
  </defs>

  <style>
    :root {
      --cobalt: #2076FE;
      --seafoam: #20DEB0; 
      --amber: #FFB505;   
    }
  </style>

  <g>
    <g stroke="var(--cobalt)" stroke-width="10" stroke-linecap="butt" fill="none">
      <line x1="32" y1="15" x2="32" y2="85" />
      <circle cx="48" cy="40" r="16" />
    </g>
    
    <g stroke="var(--seafoam)" stroke-width="10" stroke-linecap="butt" fill="none">
      <line x1="68" y1="85" x2="68" y2="15" />
      <circle cx="52" cy="60" r="16" />
    </g>
    
    <g stroke="var(--amber)" stroke-width="10" stroke-linecap="butt" fill="none" mask="url(#favicon-intersection)">
      <line x1="68" y1="85" x2="68" y2="15" />
      <circle cx="52" cy="60" r="16" />
    </g>
  </g>
</svg>
