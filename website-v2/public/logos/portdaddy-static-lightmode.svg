<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-label="Port Daddy">
  <!-- Big glossy STATIC mark, LIGHT theme. The full radar + P/D monogram with a
       glossy sheen (radial highlight + soft glow on the strokes). No animation;
       use where motion is unwanted (print, PDFs, dense pages, og fallbacks).
       Companion: portdaddy-static-darkmode.svg. -->
  <defs>
    <mask id="pd-static-light-intersection" maskContentUnits="userSpaceOnUse">
      <g stroke="white" stroke-width="14" stroke-linecap="butt" fill="none">
        <line x1="110" y1="110" x2="110" y2="210" />
        <circle cx="135" cy="135" r="25" />
      </g>
    </mask>
    <radialGradient id="pd-gloss-light" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="pd-soft-glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --cobalt: #2076FE;
      --seafoam: #12B88F;
      --amber: #F5A623;
      --bg-light: #F4F7FA;
      --radar-grid: #DCE3EB;
    }
  </style>

  <rect width="300" height="300" fill="var(--bg-light)" />

  <g stroke="var(--radar-grid)" stroke-width="1" fill="none">
    <circle cx="150" cy="150" r="45" />
    <circle cx="150" cy="150" r="90" />
    <circle cx="150" cy="150" r="135" />
    <line x1="15" y1="150" x2="285" y2="150" stroke-dasharray="4 4" />
    <line x1="150" y1="15" x2="150" y2="285" stroke-dasharray="4 4" />
    <line x1="55" y1="55" x2="245" y2="245" stroke-dasharray="2 6" />
    <line x1="55" y1="245" x2="245" y2="55" stroke-dasharray="2 6" />
  </g>

  <g>
    <circle cx="150" cy="150" r="125" fill="none" stroke="var(--seafoam)" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 145 25 L 155 25" stroke="var(--seafoam)" stroke-width="3" fill="none" />
    <path d="M 145 275 L 155 275" stroke="var(--seafoam)" stroke-width="3" fill="none" />
    <path d="M 25 145 L 25 155" stroke="var(--seafoam)" stroke-width="3" fill="none" />
    <path d="M 275 145 L 275 155" stroke="var(--seafoam)" stroke-width="3" fill="none" />
    <line x1="150" y1="25" x2="150" y2="45" stroke="var(--seafoam)" stroke-width="2" stroke-linecap="round" />
    <line x1="150" y1="275" x2="150" y2="255" stroke="var(--seafoam)" stroke-width="2" stroke-linecap="round" />
    <line x1="25" y1="150" x2="45" y2="150" stroke="var(--seafoam)" stroke-width="2" stroke-linecap="round" />
    <line x1="275" y1="150" x2="255" y2="150" stroke="var(--seafoam)" stroke-width="2" stroke-linecap="round" />
  </g>

  <g>
    <circle cx="150" cy="150" r="105" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="40 10 5 10" opacity="0.8"/>
    <circle cx="150" cy="150" r="115" fill="none" stroke="var(--cobalt)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  </g>

  <g stroke="var(--cobalt)" stroke-width="2" fill="none">
    <path d="M 213 87 A 90 90 0 0 0 187 68" />
    <path d="M 87 87 A 90 90 0 0 1 113 68" />
    <path d="M 213 213 A 90 90 0 0 1 187 232" />
    <path d="M 87 213 A 90 90 0 0 0 113 232" />
  </g>

  <g filter="url(#pd-soft-glow-light)">
    <g stroke="var(--cobalt)" stroke-width="14" stroke-linecap="butt" fill="none">
      <line x1="110" y1="110" x2="110" y2="210" />
      <circle cx="135" cy="135" r="25" />
    </g>
    <g stroke="var(--seafoam)" stroke-width="14" stroke-linecap="butt" fill="none">
      <line x1="190" y1="190" x2="190" y2="90" />
      <circle cx="165" cy="165" r="25" />
    </g>
    <g stroke="var(--amber)" stroke-width="14" stroke-linecap="butt" fill="none" mask="url(#pd-static-light-intersection)">
      <line x1="190" y1="190" x2="190" y2="90" />
      <circle cx="165" cy="165" r="25" />
    </g>
  </g>

  <circle cx="150" cy="150" r="4" fill="var(--bg-light)" stroke="var(--cobalt)" stroke-width="2"/>

  <!-- Glossy sheen: a soft top-left highlight that gives the mark its sheen. -->
  <circle cx="150" cy="150" r="135" fill="url(#pd-gloss-light)" />
</svg>
