<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Port Daddy Landing Live Glory Capture</title>
    <style>
      :root {
        --bg: #f8f3ea;
        --ink: #17120d;
        --muted: #6a6054;
        --line: #241b13;
        --soft-line: rgba(36, 27, 19, 0.16);
        --panel: #fffaf2;
        --terminal: #17120d;
        --terminal-ink: #f8edda;
        --terminal-muted: #c8bca7;
        --accent: #e7532e;
        --accent-2: #168171;
        --accent-3: #5596e6;
        --shadow: 12px 14px 0 rgba(23, 18, 13, 0.16);
      }

      :root[data-theme="dark"] {
        --bg: #11100e;
        --ink: #f8edda;
        --muted: #b4aa9a;
        --line: #eadcc5;
        --soft-line: rgba(234, 220, 197, 0.18);
        --panel: #1a1714;
        --terminal: #050505;
        --terminal-ink: #f8ead3;
        --terminal-muted: #b8a98f;
        --accent: #ff6a45;
        --accent-2: #4cc6af;
        --accent-3: #66a7ff;
        --shadow: 12px 14px 0 rgba(0, 0, 0, 0.44);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background:
          linear-gradient(90deg, var(--soft-line) 1px, transparent 1px),
          linear-gradient(0deg, var(--soft-line) 1px, transparent 1px),
          var(--bg);
        background-size: 64px 64px, 64px 64px, auto;
      }

      .chrome {
        position: absolute;
        left: 46px;
        right: 46px;
        top: 30px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 12px;
        font-weight: 900;
      }

      .mark {
        display: inline-grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 2px solid var(--line);
        background: var(--accent);
        color: #fff7eb;
        letter-spacing: 0;
      }

      .run-state {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 2px solid var(--line);
        background: var(--panel);
        padding: 10px 14px;
      }

      .run-state::before {
        content: "";
        width: 10px;
        height: 10px;
        background: var(--accent-2);
      }

      .terminal {
        position: absolute;
        left: 74px;
        top: 128px;
        z-index: 10;
        width: 760px;
        height: 430px;
        border: 2px solid var(--line);
        background: var(--terminal);
        color: var(--terminal-ink);
        box-shadow: var(--shadow);
        transform-origin: top left;
        will-change: transform, opacity;
      }

      .terminal-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 44px;
        border-bottom: 2px solid color-mix(in srgb, var(--terminal-ink) 20%, transparent);
        padding: 0 18px;
        color: var(--terminal-muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      .window-dots {
        display: flex;
        gap: 8px;
      }

      .window-dots span {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--terminal-muted);
      }

      .terminal-body {
        padding: 22px 24px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 18px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .prompt {
        color: var(--accent-2);
      }

      .terminal-muted {
        color: var(--terminal-muted);
      }

      .terminal-glow {
        color: #e8b35e;
      }

      .capture {
        position: absolute;
        overflow: hidden;
        border: 2px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
        will-change: transform, opacity;
      }

      .fleetbar-shell {
        left: 94px;
        top: 78px;
        z-index: 20;
        width: 1092px;
        height: 610px;
        opacity: 0;
        transform-origin: center;
      }

      .menu-bar {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 44px;
        padding: 0 20px;
        border-bottom: 2px solid var(--line);
        background: color-mix(in srgb, var(--panel) 92%, var(--ink));
      }

      :root[data-theme="dark"] .menu-bar {
        background: #20201f;
      }

      .traffic {
        display: flex;
        gap: 8px;
      }

      .traffic span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
      }

      .traffic span:nth-child(1) { background: #f15f57; }
      .traffic span:nth-child(2) { background: #f7c64b; }
      .traffic span:nth-child(3) { background: #57c86b; }

      .menubar-icon {
        position: relative;
        display: inline-grid;
        width: 42px;
        height: 30px;
        place-items: center;
        border-radius: 999px;
        background: #5c7432;
      }

      .menubar-icon::before {
        content: "";
        width: 16px;
        height: 20px;
        border-left: 3px solid #fff7df;
        border-bottom: 3px solid #fff7df;
        transform: skewX(-18deg);
      }

      .menu-copy {
        color: var(--muted);
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .popover-stage {
        position: relative;
        height: calc(100% - 44px);
        background:
          radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 32%),
          linear-gradient(135deg, color-mix(in srgb, var(--panel) 72%, var(--bg)), var(--bg));
      }

      .popover-image {
        position: absolute;
        left: 82px;
        top: 18px;
        width: 430px;
        height: 540px;
        border: 2px solid color-mix(in srgb, var(--line) 72%, transparent);
        border-radius: 0;
        object-fit: cover;
        object-position: top;
        box-shadow: 10px 12px 0 rgba(0, 0, 0, 0.18);
      }

      .fleetbar-callout {
        position: absolute;
        left: 566px;
        top: 112px;
        right: 70px;
        border: 2px solid var(--line);
        background: var(--panel);
        padding: 28px;
      }

      .fleetbar-callout strong {
        display: block;
        font-size: 34px;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .fleetbar-callout span {
        display: block;
        margin-top: 14px;
        color: var(--muted);
        font-size: 16px;
        font-weight: 800;
        line-height: 1.4;
      }

      .surface {
        left: 50px;
        top: 36px;
        z-index: 30;
        width: 1180px;
        height: 650px;
        opacity: 0;
        transform-origin: center;
      }

      .surface img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: top center;
      }

      .surface-title {
        position: absolute;
        left: 18px;
        top: 18px;
        z-index: 2;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 10px 13px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 12px;
        font-weight: 950;
      }

      .timeline {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 28px;
        z-index: 60;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 2px solid var(--line);
        background: var(--panel);
      }

      .timeline-step {
        border-right: 2px solid var(--line);
        padding: 11px 14px;
        font-size: 12px;
        font-weight: 950;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .timeline-step:last-child {
        border-right: 0;
      }

      .timeline-step.active {
        background: var(--accent);
        color: #fff7eb;
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="chrome" id="chrome">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span class="mark">PD</span>
          <span>Port Daddy live run</span>
        </div>
        <div class="run-state" id="topStatus">daemon nominal</div>
      </div>

      <section class="terminal" id="terminal" aria-label="Terminal">
        <div class="terminal-top">
          <div class="window-dots"><span></span><span></span><span></span></div>
          <div>~/coding/port-daddy</div>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
      </section>

      <section class="capture fleetbar-shell" id="fleetbar" aria-label="FleetBar menu bar app">
        <div class="menu-bar">
          <div class="traffic"><span></span><span></span><span></span></div>
          <span class="menubar-icon" aria-hidden="true"></span>
          <span class="menu-copy">FleetBar</span>
          <span class="menu-copy">Flow</span>
          <span class="menu-copy">Agents</span>
        </div>
        <div class="popover-stage">
          <img class="popover-image" id="fleetbarImage" alt="FleetBar popover" />
          <div class="fleetbar-callout">
            <strong>Menu-bar command center.</strong>
            <span>Daemon report, recent work, touched files, and the Console jump all live in the Mac surface.</span>
          </div>
        </div>
      </section>

      <figure class="capture surface" id="flow" aria-label="Fleet Control Center Flow">
        <span class="surface-title">Flow</span>
        <img id="flowImage" alt="Fleet Control Center Flow" />
      </figure>

      <figure class="capture surface" id="agents" aria-label="Fleet Control Center Agents">
        <span class="surface-title">Agents</span>
        <img id="agentsImage" alt="Fleet Control Center Agents" />
      </figure>

      <div class="timeline">
        <div class="timeline-step" id="stepTerminal">Terminal</div>
        <div class="timeline-step" id="stepFleetbar">FleetBar</div>
        <div class="timeline-step" id="stepFlow">Flow</div>
        <div class="timeline-step" id="stepAgents">Agents</div>
      </div>
    </main>

    <script>
      const DURATION = 12.4
      const defaultSnapshot = {
        status: {
          activePorts: '21',
          fleet: '1 project, 8 agents, 3/8 launchable',
          runtime: 'nominal',
        },
        sessions: [
          'Landing live-glory video',
          'Fleet agent: cartographer',
          'QA agent found issues',
          'Promote Fleet Control Center entrance',
          'Render real FleetBar popover',
          'Record Flow and Agents surfaces',
        ],
      }

      const params = new URLSearchParams(window.location.search)
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      const manual = params.get('manual') === '1'
      document.documentElement.dataset.theme = theme

      const state = { snapshot: defaultSnapshot }
      const terminal = document.getElementById('terminal')
      const chrome = document.getElementById('chrome')
      const terminalBody = document.getElementById('terminalBody')
      const fleetbar = document.getElementById('fleetbar')
      const flow = document.getElementById('flow')
      const agents = document.getElementById('agents')
      const fleetbarImage = document.getElementById('fleetbarImage')
      const flowImage = document.getElementById('flowImage')
      const agentsImage = document.getElementById('agentsImage')
      const topStatus = document.getElementById('topStatus')

      function clamp(value, min = 0, max = 1) {
        return Math.max(min, Math.min(max, value))
      }

      function smooth(edge0, edge1, x) {
        const v = clamp((x - edge0) / (edge1 - edge0))
        return v * v * (3 - 2 * v)
      }

      function short(text, max = 46) {
        if (!text) return 'Port Daddy agent'
        return text.length > max ? `${text.slice(0, max - 1)}...` : text
      }

      function mediaAsset(name) {
        return `../../public/media/landing-live-glory/${name}-${theme}.png`
      }

      function normalizeSnapshot(snapshot) {
        const sessions = Array.isArray(snapshot.sessions) && snapshot.sessions.length
          ? snapshot.sessions
          : defaultSnapshot.sessions
        return {
          status: { ...defaultSnapshot.status, ...(snapshot.status || {}) },
          sessions: sessions.slice(0, 8),
        }
      }

      function paintStatic() {
        const { status } = state.snapshot
        topStatus.textContent = `daemon ${status.runtime || 'nominal'}`
        fleetbarImage.src = mediaAsset('fleetbar-popover')
        flowImage.src = mediaAsset('live-flow')
        agentsImage.src = mediaAsset('live-agents-panel')
      }

      function paintTerminal(t) {
        const { status, sessions } = state.snapshot
        const rawLines = [
          '<span class="prompt">$</span> pd status',
          `<span class="terminal-muted">Port Daddy is running - ${status.runtime || 'nominal'}</span>`,
          `<span class="terminal-muted">Fleet: ${status.fleet || `${sessions.length} agent(s) visible`}</span>`,
          '<span class="prompt">$</span> pd notes --limit 6',
          ...sessions.slice(0, 5).map((session, index) => `<span class="terminal-glow">agent-${String(index + 1).padStart(2, '0')}</span> ${short(session, 46)}`),
          '<span class="prompt">$</span> open -a FleetBar',
        ]
        const joined = rawLines.join('\n')
        const reveal = Math.floor(joined.length * smooth(0.12, 2.65, t))
        terminalBody.innerHTML = joined.slice(0, reveal)
      }

      function setTimeline(t) {
        document.querySelectorAll('.timeline-step').forEach((step) => step.classList.remove('active'))
        if (t < 3.05) document.getElementById('stepTerminal').classList.add('active')
        else if (t < 5.75) document.getElementById('stepFleetbar').classList.add('active')
        else if (t < 9.1) document.getElementById('stepFlow').classList.add('active')
        else document.getElementById('stepAgents').classList.add('active')
      }

      function fadeInOut(t, start, end, outStart, outEnd) {
        return smooth(start, end, t) * (1 - smooth(outStart, outEnd, t))
      }

      function renderFrame(time) {
        const t = ((time % DURATION) + DURATION) % DURATION
        const terminalOut = smooth(3.0, 4.1, t)
        const chromeOut = smooth(5.15, 5.85, t)
        const fleetAlpha = fadeInOut(t, 2.65, 3.5, 5.15, 5.95)
        const flowAlpha = fadeInOut(t, 5.55, 6.35, 8.75, 9.35)
        const agentsAlpha = smooth(8.95, 9.75, t)

        paintTerminal(t)
        setTimeline(t)

        chrome.style.opacity = String(1 - chromeOut)
        terminal.style.opacity = String(1 - terminalOut)
        terminal.style.transform = `translate(${terminalOut * -58}px, ${terminalOut * 24}px) scale(${1 - terminalOut * 0.22})`

        fleetbar.style.opacity = String(fleetAlpha)
        fleetbar.style.transform = `translate(${(1 - smooth(2.65, 3.5, t)) * 82}px, ${(1 - smooth(2.65, 3.5, t)) * 26}px) scale(${0.94 + smooth(2.65, 3.5, t) * 0.06})`

        flow.style.opacity = String(flowAlpha)
        flow.style.transform = `translate(${(1 - smooth(5.55, 6.35, t)) * 76}px, ${(1 - smooth(5.55, 6.35, t)) * 20}px) scale(${0.95 + smooth(5.55, 6.35, t) * 0.05})`

        agents.style.opacity = String(agentsAlpha)
        agents.style.transform = `translate(${(1 - agentsAlpha) * 76}px, ${(1 - agentsAlpha) * 20}px) scale(${0.95 + agentsAlpha * 0.05})`

        return true
      }

      window.setSnapshot = (snapshot) => {
        state.snapshot = normalizeSnapshot(snapshot || defaultSnapshot)
        paintStatic()
        renderFrame(0)
      }

      window.renderFrame = renderFrame
      window.setSnapshot(defaultSnapshot)

      Promise.all([
        fleetbarImage.decode?.().catch(() => undefined) || Promise.resolve(),
        flowImage.decode?.().catch(() => undefined) || Promise.resolve(),
        agentsImage.decode?.().catch(() => undefined) || Promise.resolve(),
      ]).then(() => renderFrame(0))

      if (!manual) {
        const started = performance.now()
        function tick() {
          renderFrame((performance.now() - started) / 1000)
          requestAnimationFrame(tick)
        }
        requestAnimationFrame(tick)
      }
    </script>
  </body>
</html>
