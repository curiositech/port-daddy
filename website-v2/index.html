<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pd_logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/pd_logo_darkmode.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Port Daddy - Local Communication Substrate for Coding Agents</title>

    <!-- Primary Meta Tags -->
    <meta name="description" content="Port Daddy is the local layer under coding agents: shared notes, file claims, actor messages, backend readiness, budgets, and recoverable handoffs in one Mac control plane." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portdaddy.dev/" />
    <meta property="og:title" content="Port Daddy - Local Communication Substrate for Coding Agents" />
    <meta property="og:description" content="A Mac control plane and local daemon where coding agents share notes, claims, messages, readiness, budgets, and recoverable handoffs." />
    <meta property="og:image" content="https://portdaddy.dev/img/hero-portdaddy.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Port Daddy" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://portdaddy.dev/" />
    <meta property="twitter:title" content="Port Daddy - Local Communication Substrate for Coding Agents" />
    <meta property="twitter:description" content="A Mac control plane and local daemon where coding agents share notes, claims, messages, readiness, budgets, and recoverable handoffs." />
    <meta property="twitter:image" content="https://portdaddy.dev/img/hero-portdaddy.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://portdaddy.dev/" />

    <!-- FOWT Prevention: Set theme before any rendering -->
    <script>
      (function() {
        const theme = localStorage.getItem('pd-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
