name: Voice rules

on:
  push:
    branches: [main, 'research/**']
  pull_request:
    branches: [main]

jobs:
  voice-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run voice-rule check
        run: npm run check:voice-rules
