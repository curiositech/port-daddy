# ---------------------------------------------------------------------------
# (backend, capability) → concrete id. Every value MUST have a `models:` row
# above; tests/unit/model-registry-canon.test.js enforces that plus price
# coverage, so a phantom cannot re-enter the way kimi-k2-instruct did.
#
# NOTE: `agy` has deliberately NO table. Antigravity owns its own model names and
# account default (lib/spawn-forecast.ts) and PD never sends it a --model. Adding
# invented ids here would be exactly the fabrication this registry exists to stop.
# ---------------------------------------------------------------------------
backends:
  claude:
    cheap: claude-haiku-4-5
    balanced: claude-sonnet-5
    high: claude-opus-5
    max-thinking: claude-fable-5
    code: claude-sonnet-5
  openai:
    # The gpt-5.6 family fills three rungs by its documented positioning: Luna
    # for cost-sensitive volume, Terra to balance intelligence and cost, Sol for
    # complex work. max-thinking stays with the always-thinking premium model so
    # routine work never silently lands on the priciest id.
    cheap: gpt-5.6-luna
    balanced: gpt-5.6-terra
    high: gpt-5.6-sol
    max-thinking: gpt-5.5-pro
    code: gpt-5.3-codex
  codex:
    cheap: gpt-5.4-mini
    balanced: gpt-5.3-codex
    high: gpt-5.4
    max-thinking: gpt-5.4
    code: gpt-5.3-codex
  cloudflare:
    # Rungs drawn from the admitted universe above. `cheap` is the ship default
    # so the ladder and the role table cannot disagree about the same fleet.
    cheap: '@cf/qwen/qwen3-30b-a3b-fp8'
    balanced: '@cf/openai/gpt-oss-20b'
    high: '@cf/openai/gpt-oss-120b'
    max-thinking: '@cf/deepseek-ai/deepseek-v4-pro-0813'
    code: '@cf/qwen/qwen2.5-coder-32b-instruct'
