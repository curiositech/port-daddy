  # ---- OpenAI (direct API; also the aider transport) ----
  # Every id below was live-probed against GET /v1/models on 2026-08-23, and every
  # `reasoningEfforts` list was live-probed by sending each effort value to
  # POST /v1/responses and recording which ones the model actually accepts.
  #
  # WHY THAT SECOND PROBE EXISTS. The adapter used to hardcode
  # `reasoning: { effort: 'minimal' }`, which was correct for the original gpt-5
  # generation and is rejected by every model after it. The result was an HTTP 400
  # on FOUR of the five rungs this backend resolves — balanced, high, max-thinking
  # and code were all dead, and only `cheap` (gpt-5-mini, the one model that still
  # takes `minimal`) worked. A registry that pins the id but not the parameter
  # values that id accepts leaves exactly this gap, so the accepted set is a row
  # field like price and context window: declared once, resolved, never guessed.
  # `defaultEffort` is the cheapest supported rung, because Responses API caps
  # count reasoning tokens against max_output_tokens.
