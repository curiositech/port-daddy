  # ---- OpenAI gpt-5.6 (direct API) ----
  # Operator request, 2026-08-23. The family ships as three sibling ids rather
  # than a tiered ladder, and the ONE difference this repo can actually source is
  # that all three accept a `max` reasoning effort that no earlier model does —
  # live-probed, not inferred. Nothing else separates them that a black-box probe
