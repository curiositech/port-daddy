# Port Daddy canonical model reference — the ONE source of truth for model IDs.
#
# WHY THIS FILE EXISTS (supplant, 2026-08-23): before it, a concrete model ID had
# to be independently correct in four places — the registry (lib/model-registry-data.ts),
# the price table (lib/cost-tracker.ts, or launch fails closed), the context-window
# table, and backend-catalog's advertised `models[]` (or the UI offers models the
# resolver never picks). Every drift incident found in the 2026-08-22 audit was a
# consequence of that split, including a PHANTOM Cloudflare id sitting in the
# registry's `high` slot (see the kimi note below). Folding price + context +
# status + verification into ONE row per id makes "registry ⊆ priced ⊆ verified"
# a structural tautology instead of a rule someone has to remember.
#
# THIS FILE IS THE SOURCE; two artifacts are GENERATED from it and committed:
#   lib/model-registry-data.ts            — daemon plane (keeps the import-graph
#                                            property: resolves identically under
#                                            bun / @swc/jest / tsc / dist)
#   apps/shared/model-registry.generated.ts — cloud plane (Workers CANNOT import
#                                            lib/, which is exactly why apps/ forked
#                                            its own hardcoded copies and drifted)
# Regenerate with:  npx tsx scripts/generate-model-registry.ts --write
# A drift test asserts both artifacts byte-match a fresh generation.
#
# NEVER hardcode a model ID at a call site. Declare (backend, capability) and call
# resolveModel() — lib/model-registry.ts. The no-hardcoded-model-ids guard enforces
# this across lib/ routes/ cli/ mcp/ core/ config/ apps/ scripts/ schemas/ roles/
# fleet/ website-v2/src/ plus pd-fleet.yml and README.md.

provenance:
  generatedAt: '2026-08-23'
  generatedBy: 'config/models.yaml — hand-edited source of truth; scripts/generate-model-registry.ts emits the artifacts'
  source: >-
    Anthropic ids + pricing from the claude-api skill reference (2026-06-24 cache;
    undated ID form is mandatory — never append date suffixes). OpenAI ids
    live-probed against GET /v1/models on 2026-08-23. Gemini ids live-probed against
    GET /v1beta/models on 2026-08-23 — this probe caught `gemini-3.1-pro` as a
    PHANTOM (only `gemini-3.1-pro-preview` is served), which would have 404'd in
    production. Cloudflare ids + unit pricing + context windows from the Cloudflare
    model pages (developers.cloudflare.com/workers-ai/models/*) cross-checked against
    the operator-supplied 2026-08-12 catalog export.

# ---------------------------------------------------------------------------
# Vocabularies. Six competing tier vocabularies existed across the repo before
# this file; they are reconciled here as declared mappings rather than duplicated
# lookup tables in each consumer.
# ---------------------------------------------------------------------------
vocabularies:
  capabilities: [cheap, balanced, high, max-thinking, code]

  # Legacy fleet/console tier names.
  tierAliases:
    low: cheap
    mid: balanced
    high: high

  # agent-harbor schema vocabulary (schemas/agent-harbor/v0/*.json). Declared here
  # so the persisted contract and the registry agree without a data migration.
  harborTiers:
    fast: cheap
    mid: balanced
    strong: high
    local: cheap
    custom: balanced

  # Claude Code CLI accepts family nicknames rather than API ids on its --model
  # flag. This is a TRANSPORT vocabulary, not a model list.
  cliAliases:
    claude-cli:
      cheap: haiku
      balanced: sonnet
      high: opus
      max-thinking: opus
      code: sonnet

# Backend-name aliases → canonical family key. Resolved in exactly one place:
# canonicalBackend() in lib/model-registry.ts.
backendAliases:
  anthropic: claude
  claude-cli: claude
  # aider drives OpenAI models; its former standalone gpt-4.1 table was drift
  # (two generations stale), not an intentional product difference. Codex, by
  # contrast, keeps its own table — the codex CLI genuinely ships a different
  # lineup (gpt-5.3-codex), so it is NOT aliased.
  aider: openai

# ---------------------------------------------------------------------------
# Model catalog — ONE row per concrete id the registry references.
#
# status:     ga | deprecated | retired
# plane:      direct-api | workers-ai | ai-gateway | cli | local
# verifiedBy: live-probe   — an API listing/call confirmed this id on verifiedAt
#             vendor-docs  — vendor's own model page states id + pricing
#             cf-catalog   — operator-supplied Cloudflare catalog export
#             carried      — pre-existing row, NOT verifiable from this environment
# priceBasis: vendor-docs | estimate   (estimate = priced for fail-closed telemetry
#             admission; the number is a planning figure, not a vendor quote)
# Prices are USD per 1M tokens.
# ---------------------------------------------------------------------------
