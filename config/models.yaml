  # ---- OpenAI gpt-5.6 (direct API) ----
  # Operator request, 2026-08-23. CORRECTION to this file's first attempt at
  # this family, recorded because the mistake is instructive: the rows were
  # added as unranked PEERS carrying gpt-5.5's price and a 400k context window,
  # on the reasoning that a black-box probe could not separate them and that
  # inventing a ranking was worse than admitting ignorance. The probe genuinely
  # could not — all three answered three checkable reasoning problems correctly,
  # with comparable reasoning budgets, and GET /v1/models exposes neither price
  # nor context. But the vendor documents all of it, and not reading the docs is
  # not the same as the docs not existing. Every figure below is from
  # developers.openai.com; the effort sets are the live probe, which agrees with
  # the docs exactly.
  #
  # OpenAI states the ordering itself — "Start with GPT-5.6 Sol for complex
  # reasoning and coding, choose GPT-5.6 Terra to balance intelligence and cost,
  # or use GPT-5.6 Luna for cost-sensitive, high-volume workloads" — so the rungs
  # below are quoted positioning, not a benchmark this repo ran.
  #
  # What does NOT differentiate them: context window (1,050,000 on all three),
  # max output (128,000), and reasoning depth (identical effort ladders). Price
  # and stated positioning are the whole difference.
  #
  # A fourth sibling, gpt-5.6-cyber, is documented and deliberately absent: it
  # live-probed as `model_not_found` for this account. A documented model this
  # deployment cannot call is a phantom from here, and cataloguing it would
  # reintroduce exactly the class of row this file exists to prevent.
  #
  # PRICE CAVEAT: the vendor's table qualifies every figure as "short context",
  # implying a long-context band this repo has not resolved. Cost estimates on
  # very large prompts may therefore run low.
  #
  # Both API shapes serve this family (Responses AND Chat Completions, both
  # live-probed at 200). The adapter takes Responses — it is where reasoning
  # effort and typed reasoning items live.
  gpt-5.6-sol:
    provider: openai
    plane: direct-api
    priceIn: 4.00
    priceOut: 20.00
    priceCachedIn: 0.40
    contextWindow: 1050000
    capabilities: [function-calling, reasoning]
    status: ga
    verifiedAt: '2026-08-23'
    verifiedBy: live-probe
    priceBasis: vendor-docs
    reasoningEfforts: [none, low, medium, high, xhigh, max]
    defaultEffort: low
    notes: >-
      "Frontier model for complex professional work." The vendor default effort
      is `medium`; this registry defaults to `low` deliberately, because
      Responses API caps count reasoning tokens against max_output_tokens and a
      cost-capped run should not spend its answer budget on thinking it was not
      asked for. Callers wanting more ask for it by name.
  gpt-5.6-terra:
    provider: openai
    plane: direct-api
    priceIn: 2.00
    priceOut: 12.00
    priceCachedIn: 0.20
    contextWindow: 1050000
    capabilities: [function-calling, reasoning]
    status: ga
    verifiedAt: '2026-08-23'
    verifiedBy: live-probe
    priceBasis: vendor-docs
    reasoningEfforts: [none, low, medium, high, xhigh, max]
    defaultEffort: low
    notes: '"GPT-5.6 model that balances intelligence and cost."'
  gpt-5.6-luna:
