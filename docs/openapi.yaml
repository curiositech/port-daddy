            type: string
        - name: sessionId
          in: query
          schema:
            type: string
        - name: agentId
          in: query
          schema:
            type: string
        - name: task
          in: query
          schema:
            type: string
        - name: files
          in: query
          schema:
            type: string
          description: Comma-separated file paths
      responses:
        '200':
          description: Coordination advice with evidence and executable actions
    post:
      tags: [advisor]
      summary: Run structured coordination preflight
      operationId: runCoordinationPreflight
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectRoot:
                  type: string
                project:
                  type: string
                sessionId:
                  type: string
                agentId:
                  type: string
                task:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                changedFiles:
                  type: array
                  items:
                    type: string
                includeChannels:
                  type: boolean
                includeTupleHints:
                  type: boolean
      responses:
        '200':
          description: Coordination advice with summary, input echo, and advice array
        '400':
          $ref: '#/components/responses/ValidationError'

  # ===========================================================================
  # AGENTS
  # ===========================================================================
  /agents:
    post:
      tags: [agents]
      summary: Register an agent
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Unique agent identifier
                name:
                  type: string
                type:
                  type: string
                  default: cli
                  description: Agent type
                identity:
                  type: string
                  description: Semantic identity for context-aware salvage (e.g. myapp:api)
                worktreeId:
                  type: string
                  description: Git worktree identifier
                purpose:
                  type: string
                  description: What this agent is working on
                metadata:
                  type: object
                agentCard:
                  type: object
                maxServices:
                  type: integer
                  description: Maximum number of services this agent can claim
                maxLocks:
                  type: integer
                  description: Maximum number of locks this agent can hold
      responses:
        '200':
          description: Agent registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  registered:
                    type: boolean
                  salvageHint:
                    type: object
                    description: Hint about dead agents in the same project
                    nullable: true
                    properties:
                      count:
                        type: integer
                      project:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [agents]
      summary: List all agents
      operationId: listAgents
      parameters:
        - name: active
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only show active agents
        - name: identity
          in: query
          schema:
            type: string
          description: Filter by identity prefix
        - name: purpose
          in: query
          schema:
            type: string
          description: Filter by purpose
      responses:
        '200':
          description: List of agents
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}:
    get:
      tags: [agents]
      summary: Get agent info
      operationId: getAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
        '404':
          description: Agent not found
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [agents]
      summary: Unregister an agent
      operationId: unregisterAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  unregistered:
                    type: boolean
        '400':
          description: Agent not found or error
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/heartbeat:
    post:
      tags: [agents]
      summary: Send agent heartbeat
      operationId: agentHeartbeat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XPid'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Agent not found
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/inbox:
    post:
      tags: [agents]
      summary: Send a message to an agent's inbox
      operationId: sendInboxMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                from:
                  type: string
                  description: Sender identifier
                type:
                  type: string
                  default: message
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  messageId:
                    type: integer
        '400':
          description: Content required or validation error
        '429':
          description: Resource limit exceeded
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [agents]
      summary: Read an agent's inbox
      operationId: listInboxMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: unread
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only show unread messages
        - name: limit
          in: query
          schema:
            type: integer
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp
      responses:
        '200':
          description: Inbox messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/InboxMessage'
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [agents]
      summary: Clear an agent's inbox
      operationId: clearInbox
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inbox cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/inbox/stats:
    get:
      tags: [agents]
      summary: Get inbox statistics
      operationId: getInboxStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inbox stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  total:
                    type: integer
                  unread:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/inbox/{messageId}/read:
    put:
      tags: [agents]
      summary: Mark a single inbox message as read
      operationId: markInboxMessageRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Message marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/inbox/read-all:
    put:
      tags: [agents]
      summary: Mark all inbox messages as read
      operationId: markAllInboxMessagesRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: All messages marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  marked:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # LOCKS
  # ===========================================================================
  /locks:
    get:
      tags: [locks]
      summary: List all locks
      operationId: listLocks
      parameters:
        - name: owner
          in: query
          schema:
            type: string
          description: Filter by lock owner
      responses:
        '200':
          description: List of locks
        '500':
          $ref: '#/components/responses/InternalError'

  /locks/{name}:
    post:
      tags: [locks]
      summary: Acquire a lock
      operationId: acquireLock
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XAgentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  type: string
                  description: Lock owner (defaults to x-agent-id header or PID)
                ttl:
                  type: integer
                  default: 300000
                  description: Time-to-live in milliseconds
                metadata:
                  type: object
      responses:
        '200':
          description: Lock acquired
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  owner:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid TTL
        '409':
          description: Lock already held by another owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  code:
                    type: string
                    example: LOCK_HELD
                  owner:
                    type: string
                  expiresAt:
                    type: string
        '429':
          description: Agent lock limit exceeded
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [locks]
      summary: Extend lock TTL
      operationId: extendLock
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XAgentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  type: string
                ttl:
                  type: integer
                  description: New TTL in milliseconds
      responses:
        '200':
          description: Lock extended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Lock not found or not owned
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [locks]
      summary: Check lock status
      operationId: checkLock
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lock status
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [locks]
      summary: Release a lock
      operationId: releaseLock
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XAgentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  type: string
                  description: Must match lock owner (unless force=true)
                force:
                  type: boolean
                  default: false
                  description: Force release regardless of owner
      responses:
        '200':
          description: Lock released
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  released:
                    type: boolean
        '403':
          description: Lock not found or not owned
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # MESSAGING
  # ===========================================================================
  /msg:
    get:
      tags: [messaging]
      summary: List all channels
      operationId: listChannelsViaMsg
      responses:
        '200':
          description: List of channels
        '500':
          $ref: '#/components/responses/InternalError'

  /channels:
    get:
      tags: [messaging]
      summary: List all channels (alias)
      operationId: listChannels
      responses:
        '200':
          description: List of channels
        '500':
          $ref: '#/components/responses/InternalError'

  /msg/{channel}:
    post:
      tags: [messaging]
      summary: Publish a message to a channel
      operationId: publishMessage
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  description: Message payload (any JSON value)
                sender:
                  type: string
                expires:
                  type: integer
                  description: Message TTL in milliseconds
      responses:
        '200':
          description: Message published
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                    description: Message ID
        '400':
          description: Invalid channel name
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [messaging]
      summary: Get messages from a channel
      operationId: getMessages
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: after
          in: query
          schema:
            type: integer
          description: Only messages after this ID
      responses:
        '200':
          description: Channel messages
        '400':
          description: Invalid channel name
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [messaging]
      summary: Clear all messages in a channel
      operationId: clearChannel
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel cleared
        '400':
          description: Invalid channel name
        '500':
          $ref: '#/components/responses/InternalError'

  /msg/{channel}/poll:
    get:
      tags: [messaging]
      summary: Long-poll for next message on a channel
      operationId: pollChannel
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            default: 0
          description: Only messages after this ID
        - name: timeout
          in: query
          schema:
            type: integer
            default: 30000
            maximum: 60000
          description: Long-poll timeout in milliseconds
      responses:
        '200':
          description: Message received or timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message: {}
        '400':
          description: Invalid channel name
        '429':
          description: Too many concurrent connections
        '500':
          $ref: '#/components/responses/InternalError'

  /msg/{channel}/subscribe:
    get:
      tags: [messaging]
      summary: Subscribe to channel via Server-Sent Events (SSE)
      operationId: subscribeToChannel
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream: {}
        '400':
          description: Invalid channel name
        '429':
          description: Too many concurrent SSE connections
        '503':
          description: Subscription limit exceeded
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # WEBHOOKS
  # ===========================================================================
  /webhooks:
    post:
      tags: [webhooks]
      summary: Register a webhook
      operationId: registerWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                  description: Event types to subscribe to
                secret:
                  type: string
                  description: HMAC signing secret
                filterPattern:
                  type: string
                  description: Pattern to filter events by target ID
                metadata:
                  type: object
      responses:
        '200':
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
        '400':
          description: URL required or validation error
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [webhooks]
      summary: List webhooks
      operationId: listWebhooks
      parameters:
        - name: active
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only show active webhooks
      responses:
        '200':
          description: List of webhooks
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/events:
    get:
      tags: [webhooks]
      summary: List available webhook event types
      operationId: listWebhookEvents
      responses:
        '200':
          description: Available events with descriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  events:
                    type: array
                    items:
                      type: string
                  descriptions:
                    type: object
                    additionalProperties:
                      type: string

  /webhooks/{id}:
    get:
      tags: [webhooks]
      summary: Get webhook by ID
      operationId: getWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook details
        '404':
          description: Webhook not found
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [webhooks]
      summary: Update a webhook
      operationId: updateWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                filterPattern:
                  type: string
                active:
                  type: boolean
                metadata:
                  type: object
      responses:
        '200':
          description: Webhook updated
        '400':
          description: Validation error
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [webhooks]
      summary: Delete a webhook
      operationId: deleteWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook deleted
        '404':
          description: Webhook not found
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/{id}/test:
    post:
      tags: [webhooks]
      summary: Send a test delivery to a webhook
      operationId: testWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test delivery sent
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      summary: List webhook deliveries
      operationId: listWebhookDeliveries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Delivery history
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # ACTIVITY
  # ===========================================================================
  /activity:
    get:
      tags: [activity]
      summary: Get recent activity
      operationId: getActivity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: type
          in: query
          schema:
            type: string
          description: Filter by activity type
        - name: agent
          in: query
          schema:
            type: string
          description: Filter by agent ID
        - name: target
          in: query
          schema:
            type: string
          description: Filter by target pattern
      responses:
        '200':
          description: Recent activity entries
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [activity]
      summary: Clear the activity log
      operationId: clearActivity
      responses:
        '200':
          description: Activity log cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /activity/timeline:
    get:
      tags: [activity]
      summary: Get unified timeline (activity + notes)
      operationId: getActivityTimeline
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: agent
          in: query
          schema:
            type: string
        - name: session
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Unified timeline
        '500':
          $ref: '#/components/responses/InternalError'

  /activity/subscribe:
    get:
      tags: [activity]
      summary: Subscribe to activity log via SSE
      operationId: subscribeToActivity
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream: {}
        '429':
          description: Too many concurrent SSE connections
        '500':
          $ref: '#/components/responses/InternalError'

  /activity/range:
    get:
      tags: [activity]
      summary: Get activity by time range
      operationId: getActivityRange
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: integer
          description: Start timestamp (Unix ms)
        - name: end
          in: query
          schema:
            type: integer
          description: End timestamp (defaults to now)
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: Activity in range
        '400':
          description: Start timestamp required
        '500':
          $ref: '#/components/responses/InternalError'

  /activity/summary:
    get:
      tags: [activity]
      summary: Get activity summary by type
      operationId: getActivitySummary
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            default: 0
          description: Unix timestamp
      responses:
        '200':
          description: Activity summary
        '500':
          $ref: '#/components/responses/InternalError'

  /activity/stats:
    get:
      tags: [activity]
      summary: Get activity log statistics
      operationId: getActivityStats
      responses:
        '200':
          description: Activity statistics
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # SALVAGE (formerly Resurrection)
  # ===========================================================================
  /salvage:
    get:
      tags: [salvage]
      summary: List salvage queue entries
      operationId: listSalvage
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project identity
        - name: stack
          in: query
          schema:
            type: string
          description: Filter by stack identity
      responses:
        '200':
          description: Salvage queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaleAgent'
                  count:
                    type: integer
                  filtered:
                    type: boolean
        '500':
          $ref: '#/components/responses/InternalError'

  /salvage/pending:
    get:
      tags: [salvage]
      summary: List agents pending salvage
      operationId: listPendingSalvage
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: stack
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Pending agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaleAgent'
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /salvage/reap:
    post:
      tags: [salvage]
      summary: Trigger reaper to check for dead agents
      operationId: reapSalvage
      responses:
        '200':
          description: Reaper triggered
        '500':
          $ref: '#/components/responses/InternalError'

  /salvage/claim/{agentId}:
    post:
      tags: [salvage]
      summary: Claim a dead agent's work
      operationId: claimSalvage
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newAgentId:
                  type: string
      responses:
        '200':
          description: Work claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agent:
                    $ref: '#/components/schemas/StaleAgent'
                  context:
                    type: object
        '400':
          description: Agent not in salvage queue
        '500':
          $ref: '#/components/responses/InternalError'

  /salvage/complete/{agentId}:
    post:
      tags: [salvage]
      summary: Mark salvage as complete
      operationId: completeSalvage
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newAgentId]
              properties:
                newAgentId:
                  type: string
                  description: ID of the agent that completed the work
      responses:
        '200':
          description: Salvage marked complete
        '400':
          description: newAgentId required
        '500':
          $ref: '#/components/responses/InternalError'

  /salvage/abandon/{agentId}:
    post:
      tags: [salvage]
      summary: Return agent to salvage queue
      operationId: abandonSalvage
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent returned to queue
        '500':
          $ref: '#/components/responses/InternalError'

  /salvage/{agentId}:
    delete:
      tags: [salvage]
      summary: Dismiss agent from salvage queue
      operationId: dismissSalvage
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent dismissed
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # CHANGELOG
  # ===========================================================================
  /changelog:
    post:
      tags: [changelog]
      summary: Add a changelog entry
      operationId: addChangelogEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, summary]
              properties:
                identity:
                  type: string
                  description: Semantic identity the change applies to
                summary:
                  type: string
                  description: Short summary of the change
                type:
                  type: string
                  enum: [feature, fix, refactor, docs, chore, breaking]
                description:
                  type: string
                  description: Detailed description
                sessionId:
                  type: string
                agentId:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Entry added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                  identity:
                    type: string
                  ancestors:
                    type: array
                    items:
                      type: string
        '400':
          description: Missing identity or summary, or invalid type

    get:
      tags: [changelog]
      summary: List recent changelog entries
      operationId: listChangelog
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp
        - name: format
          in: query
          schema:
            type: string
            enum: [flat, tree, keep-a-changelog]
          description: Export format (returns markdown)
        - name: raw
          in: query
          schema:
            type: string
            enum: ['true']
          description: Return raw markdown text/markdown when format is set
      responses:
        '200':
          description: Changelog entries or formatted markdown

  /changelog/identities:
    get:
      tags: [changelog]
      summary: List all distinct identities with changelog entries
      operationId: listChangelogIdentities
      responses:
        '200':
          description: Identity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  identities:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer

  /changelog/session/{sessionId}:
    get:
      tags: [changelog]
      summary: List changelog entries for a session
      operationId: listChangelogBySession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session changelog entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessionId:
                    type: string
                  entries:
                    type: array
                    items: {}
                  count:
                    type: integer

  /changelog/agent/{agentId}:
    get:
      tags: [changelog]
      summary: List changelog entries for an agent
      operationId: listChangelogByAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        '200':
          description: Agent changelog entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agentId:
                    type: string
                  entries:
                    type: array
                    items: {}
                  count:
                    type: integer

  /changelog/{id}:
    get:
      tags: [changelog]
      summary: Get a single changelog entry by numeric ID or list by identity
      description: >
        When id is a numeric value, returns a single entry. When id is a string
        identity (e.g. myapp:api), returns entries for that identity with optional
        tree expansion, rollup, or export format.
      operationId: getChangelogEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Numeric entry ID or semantic identity string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: tree
          in: query
          schema:
            type: string
            enum: ['true']
          description: Include descendant identities
        - name: rollup
          in: query
          schema:
            type: string
            enum: ['true']
          description: Aggregate view
        - name: format
          in: query
          schema:
            type: string
            enum: [flat, tree, keep-a-changelog]
        - name: raw
          in: query
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Entry or entries
        '404':
          description: Entry not found (numeric ID only)

  # ===========================================================================
  # TUNNEL
  # ===========================================================================
  /tunnel/providers:
    get:
      tags: [tunnel]
      summary: Check which tunnel providers are installed
      operationId: listTunnelProviders
      responses:
        '200':
          description: Provider availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  providers:
                    type: object
                    properties:
                      ngrok:
                        type: boolean
                      cloudflared:
                        type: boolean
                      localtunnel:
                        type: boolean
        '500':
          $ref: '#/components/responses/InternalError'

  /tunnel/{id}:
    post:
      tags: [tunnel]
      summary: Start a tunnel for a service
      operationId: startTunnel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Service identity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [ngrok, cloudflared, localtunnel]
                  default: ngrok
      responses:
        '200':
          description: Tunnel started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  serviceId:
                    type: string
                  provider:
                    type: string
                  url:
                    type: string
                    format: uri
        '400':
          description: Invalid identity or provider, or tunnel error
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [tunnel]
      summary: Stop a tunnel for a service
      operationId: stopTunnel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tunnel stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  serviceId:
                    type: string
        '400':
          description: Invalid identity or tunnel error
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [tunnel]
      summary: Get tunnel status for a service
      operationId: getTunnelStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tunnel status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  serviceId:
                    type: string
                  provider:
                    type: string
                  port:
                    type: integer
                  url:
                    type: string
                    nullable: true
                  status:
                    type: string
                  pid:
                    type: integer
                  startedAt:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tunnels:
    get:
      tags: [tunnel]
      summary: List all active tunnels
      operationId: listTunnels
      responses:
        '200':
          description: Active tunnels
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tunnels:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceId:
                          type: string
                        provider:
                          type: string
                        port:
                          type: integer
                        url:
                          type: string
                          nullable: true
                        status:
                          type: string
                        pid:
                          type: integer
                        startedAt:
                          type: integer
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # DNS
  # ===========================================================================
  /dns:
    get:
      tags: [dns]
      summary: List all DNS records
      operationId: listDnsRecords
      parameters:
        - name: pattern
          in: query
          schema:
            type: string
          description: Identity pattern to filter
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: DNS records
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/status:
    get:
      tags: [dns]
      summary: DNS system status
      operationId: getDnsStatus
      responses:
        '200':
          description: DNS status including resolver info
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/cleanup:
    post:
      tags: [dns]
      summary: Remove stale DNS records
      operationId: cleanupDns
      responses:
        '200':
          description: Cleanup result
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/setup:
    post:
      tags: [dns]
      summary: Initialize /etc/hosts managed section
      operationId: setupDnsResolver
      responses:
        '200':
          description: Resolver set up
        '501':
          description: Resolver not configured
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/teardown:
    post:
      tags: [dns]
      summary: Remove /etc/hosts managed section
      operationId: teardownDnsResolver
      responses:
        '200':
          description: Resolver torn down
        '501':
          description: Resolver not configured
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/sync:
    post:
      tags: [dns]
      summary: Rebuild /etc/hosts from DNS registry
      operationId: syncDnsResolver
      responses:
        '200':
          description: Resolver synced
        '501':
          description: Resolver not configured
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/resolver:
    get:
      tags: [dns]
      summary: Get resolver status
      operationId: getDnsResolverStatus
      responses:
        '200':
          description: Resolver status
        '500':
          $ref: '#/components/responses/InternalError'

  /dns/{id}:
    post:
      tags: [dns]
      summary: Register DNS for a service
      operationId: registerDns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Service identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                hostname:
                  type: string
                  description: Custom hostname (auto-generated if omitted)
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
      responses:
        '200':
          description: DNS registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hostname:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Hostname conflict
        '500':
