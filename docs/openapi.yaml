  # ===========================================================================
  # SPAWN
  # ===========================================================================
  /spawn:
    post:
      tags: [spawn]
      summary: Launch an AI agent
      operationId: spawnAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backend, identity, budgetUsd, task]
              properties:
                backend:
                  type: string
                  enum: [ollama, lmstudio, claude, claude-cli, gemini, cloudflare, openai, groq, deepseek, xai, codex, aider, custom, cli:claude-code, cli:codex, cli:agy, cli:gemini, cli:groq, cli:grok]
                model:
                  type: string
                  description: Model name (backend-specific)
                modelTier:
                  type: string
                  enum: [low, mid, high]
                  description: Optional backend-specific model tier shortcut
                identity:
                  type: string
                  description: Semantic identity for the spawned agent and project budget attribution
                budgetUsd:
                  type: number
                  exclusiveMinimum: 0
                  description: Positive finite hard spend ceiling for this launch in USD. Final telemetry over this cap returns status=over_budget with transcript telemetry preserved.
                purpose:
                  type: string
                task:
                  type: string
                  description: Task description or prompt
                files:
                  type: array
                  items:
                    type: string
                workdir:
                  type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: Extra environment variables
                timeout:
                  type: integer
                  description: Timeout in milliseconds
      responses:
        '200':
          description: Agent spawned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agentId:
                    type: string
                  backend:
                    type: string
                    enum: [ollama, lmstudio, claude, claude-cli, gemini, cloudflare, openai, groq, deepseek, xai, codex, aider, custom, cli:claude-code, cli:codex, cli:agy, cli:gemini, cli:groq, cli:grok]
                    description: Effective backend that actually ran after preflight and forced-backend resolution.
                  model:
                    type: string
                    description: Effective model used for telemetry/cost/result provenance.
                  requestedBackend:
                    type: string
                    enum: [ollama, lmstudio, claude, claude-cli, gemini, cloudflare, openai, groq, deepseek, xai, codex, aider, custom, cli:claude-code, cli:codex, cli:agy, cli:gemini, cli:groq, cli:grok]
                    description: Backend requested by the caller before any forced-backend override.
                  effectiveBackend:
                    type: string
                    enum: [ollama, lmstudio, claude, claude-cli, gemini, cloudflare, openai, groq, deepseek, xai, codex, aider, custom, cli:claude-code, cli:codex, cli:agy, cli:gemini, cli:groq, cli:grok]
                    description: Backend that actually ran after preflight and forced-backend resolution.
                  requestedModel:
                    type: string
                    description: Model requested by the caller before any forced-backend override.
                  effectiveModel:
                    type: string
                    description: Model used by the effective runtime for telemetry/cost/result provenance.
                  backendOverrideSource:
                    type: string
                    enum: [none, env, persisted, preflight]
                    description: Source that selected a different effective backend, or none when requested/effective are identical.
                  status:
                    type: string
                    enum: [running, completed, failed, killed, over_budget]
                    description: Spawn lifecycle status. over_budget is terminal and occurs when final exact telemetry cost exceeds the request budgetUsd hard cap after transcript telemetry is recorded.
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [spawn]
      summary: List active spawned agents
      operationId: listSpawnedAgents
      responses:
        '200':
          description: Active spawned agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agents:
                    type: array
                    items: {}
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /spawn/{id}:
    delete:
