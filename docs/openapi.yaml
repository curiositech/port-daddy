openapi: 3.1.0
info:
  title: Port Daddy API
  version: 3.27.0
  description: >
    Authoritative port management and service orchestration for multi-agent
    development. Provides atomic port assignment, pub/sub messaging, distributed
    locks, agent registry, session coordination, and project:stack:context
    semantic identities.
  license:
    name: MIT

servers:
  - url: http://localhost:9876
    description: Local daemon default. Use `pd status` or `PORT_DADDY_URL` when your live daemon is elsewhere.

tags:
  - name: services
    description: Service claiming, releasing, and querying
  - name: health
    description: Service health monitoring and wait operations
  - name: info
    description: Version, metrics, health, status, and port utilities
  - name: sessions
    description: Session lifecycle, notes, and file claims
  - name: agents
    description: Agent registry, heartbeats, and inbox
  - name: locks
    description: Distributed locking with TTL and ownership
  - name: messaging
    description: Pub/sub messaging and SSE subscriptions
  - name: webhooks
    description: Webhook subscription management
  - name: activity
    description: Activity log queries and statistics
  - name: salvage
    description: Agent self-healing and work reclamation (formerly resurrection)
  - name: changelog
    description: Hierarchical changelog with identity-based rollup
  - name: tunnel
    description: Tunnel creation and management for exposing local services
  - name: dns
    description: Local DNS records mapping semantic identities to hostnames
  - name: briefing
    description: Project briefing generation
  - name: sugar
    description: Compound commands for common workflows
  - name: launch
    description: Context-aware startup hints
  - name: spawn
    description: AI agent launcher
  - name: harbors
    description: Agent grouping and coordination zones
  - name: orchestrator
    description: Service orchestration (up/down)
  - name: projects
    description: Project scanning and registry
  - name: config
    description: Configuration loading
  - name: fleet-control
    description: Bond escrow, project wallets, budget pause-and-ask, and fleet panic controls
  - name: advisor
    description: Deterministic coordination preflight and suggestibility
  - name: actors
    description: Durable maritime actor directory
  - name: memory
    description: Episodic memory, session harvest, and backend-neutral continuation handoffs

paths:
  # ===========================================================================
  # SERVICES
  # ===========================================================================
  /claim:
    post:
      tags: [services]
      summary: Claim a port with semantic identity
      description: >
        Claims a port for a service identified by a semantic identity string.
        Idempotent — re-claiming updates last_seen and returns existing port.
      operationId: claimPort
      parameters:
        - $ref: '#/components/parameters/XAgentId'
        - $ref: '#/components/parameters/XPid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Semantic identity (e.g. myapp:api:main)
                  example: myapp:api:main
                port:
                  type: integer
                  description: Preferred port (1024-65535). If omitted, auto-assigned from range.
                range:
                  type: array
                  items:
                    type: integer
                  minItems: 2
                  maxItems: 2
                  description: "[start, end] port range for auto-assignment"
                expires:
                  type: integer
                  description: TTL in milliseconds
                pair:
                  type: string
                  description: Paired service identity
                cmd:
                  type: string
                  description: Command used to start the service
                cwd:
                  type: string
                  description: Working directory of the service
                pid:
                  type: integer
                  description: Process ID of the service
                metadata:
                  type: object
                  description: Arbitrary metadata (max 10KB)
      responses:
        '200':
          description: Port claimed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  port:
                    type: integer
                  existing:
                    type: boolean
                    description: True if this was an existing claim that was renewed
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Agent resource limit exceeded
        '500':
          $ref: '#/components/responses/InternalError'

  /release:
    delete:
      tags: [services]
      summary: Release services by ID or pattern
      operationId: releaseService
      parameters:
        - $ref: '#/components/parameters/XAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Service identity to release
                expired:
                  type: boolean
                  description: If true, release all expired services
      responses:
        '200':
          description: Service(s) released
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  released:
                    type: integer
                  releasedPorts:
                    type: array
                    items:
                      type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /services:
    get:
      tags: [services]
      summary: Find/list services
      operationId: listServices
      parameters:
        - name: pattern
          in: query
          schema:
            type: string
          description: Identity pattern to match (supports * wildcard)
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status
        - name: port
          in: query
          schema:
            type: integer
          description: Filter by port number
        - name: expired
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Filter by expiration status
      responses:
        '200':
          description: List of matching services
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /services/{id}:
    get:
      tags: [services]
      summary: Get a single service by identity
      operationId: getService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Service identity
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    $ref: '#/components/schemas/Service'
        '404':
          description: Service not found
        '500':
          $ref: '#/components/responses/InternalError'

  /services/{id}/endpoints/{env}:
    put:
      tags: [services]
      summary: Set endpoint URL for a service environment
      operationId: setServiceEndpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: env
          in: path
          required: true
          schema:
            type: string
          description: Environment name (e.g. dev, staging, production)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Endpoint set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /wait/{id}:
    get:
      tags: [services]
      summary: Block until a service exists or timeout
      operationId: waitForService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: timeout
          in: query
          schema:
            type: integer
            default: 30000
            maximum: 120000
          description: Timeout in milliseconds (max 120000)
      responses:
        '200':
          description: Service found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  resolved:
                    type: integer
                  requested:
                    type: integer
                  timedOut:
                    type: boolean
        '408':
          description: Timeout waiting for service
        '500':
          $ref: '#/components/responses/InternalError'

  /wait:
    post:
      tags: [services]
      summary: Block until multiple services exist or timeout
      operationId: waitForMultipleServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Service identities to wait for
                timeout:
                  type: integer
                  default: 30000
                  maximum: 120000
      responses:
        '200':
          description: All services found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  resolved:
                    type: integer
                  requested:
                    type: integer
                  timedOut:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '408':
          description: Timeout waiting for services
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # HEALTH
  # ===========================================================================
  /services/health:
    get:
      tags: [health]
      summary: List all service health statuses
      operationId: listHealthStatuses
      responses:
        '200':
          description: Health status for all services
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  uptime_seconds:
                    type: integer
                  active_ports:
                    type: integer
                  pid:
                    type: integer
                  fleet:
                    type: object
                    nullable: true
                    properties:
                      running:
                        type: boolean
                      projects:
                        type: integer
                      agents:
                        type: integer
                      watchers:
                        type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /services/health/{id}:
    get:
      tags: [health]
      summary: Check health of a single service
      operationId: checkServiceHealth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Health check result
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # INFO
  # ===========================================================================
  /version:
    get:
      tags: [info]
      summary: Get daemon version and metadata
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 3.8.3
                  codeHash:
                    type: string
                  startedAt:
                    type: integer
                    description: Unix timestamp when daemon started
                  service:
                    type: string
                    example: port-daddy
                  api:
                    type: string
                    example: semantic
                  node_version:
                    type: string
                  pid:
                    type: integer
                  uptime:
                    type: integer
                    description: Uptime in seconds
                  installDir:
                    type: string

  /metrics:
    get:
      tags: [info]
      summary: Get daemon metrics
      operationId: getMetrics
      responses:
        '200':
          description: Daemon metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: integer
                  total_assignments:
                    type: integer
                  total_releases:
                    type: integer
                  active_ports:
                    type: integer
                  uptime_seconds:
                    type: integer
                  uptime_formatted:
                    type: string
                  messages_published:
                    type: integer
                  validation_failures:
                    type: integer

  /health:
    get:
      tags: [info]
      summary: Daemon health check
      operationId: healthCheck
      responses:
        '200':
          description: Daemon is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  uptime_seconds:
                    type: integer
                  active_ports:
                    type: integer
                  pid:
                    type: integer

  /status:
    get:
      tags: [info]
      summary: Combined health, metrics, and process info
      operationId: getStatus
      responses:
        '200':
          description: Full status report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  pid:
                    type: integer
                  uptimeSeconds:
                    type: integer
                  uptimeHuman:
                    type: string
                  metrics:
                    type: object
                    properties:
                      activePorts:
                        type: integer
                      memoryRSS:
                        type: integer
                      avgResponseMs:
                        type: number
                  fleet:
                    type: object
                    nullable: true
                    properties:
                      running:
                        type: boolean
                      startedAt:
                        type: integer
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            projectDir:
                              type: string
                            running:
                              type: boolean
                            agents:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  type:
                                    type: string
                                    enum: [manual, triggered, scheduled]
                                  status:
                                    type: string
                                    enum: [running, queued, paused, scheduled, armed, idle]
                                  running:
                                    type: boolean
                                  paused:
                                    type: boolean
                                  uptime:
                                    type: integer
                                  queueDepth:
                                    type: integer
                                    description: Pending wakeups collapsed into this agent mailbox
                            watchers:
                              type: integer
                            channels:
                              type: integer
                            startedAt:
                              type: integer
                      totalAgents:
                        type: integer
                      totalWatchers:
                        type: integer

  /ports/request:
    post:
      tags: [info]
      summary: Request a port (legacy compatibility wrapper)
      operationId: requestPort
      parameters:
        - $ref: '#/components/parameters/XPid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: string
                  description: Project name
                preferred:
                  type: integer
                  description: Preferred port number
      responses:
        '200':
          description: Port assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  port:
                    type: integer
                  message:
                    type: string
                  existing:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /ports/release:
    delete:
      tags: [info]
      summary: Release a port (legacy compatibility wrapper)
      operationId: releasePort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                port:
                  type: integer
                project:
                  type: string
      responses:
        '200':
          description: Port released
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /ports/active:
    get:
      tags: [info]
      summary: List active port assignments
      operationId: listActivePorts
      responses:
        '200':
          description: Active ports
          content:
            application/json:
              schema:
                type: object
                properties:
                  ports:
                    type: array
                    items:
                      type: object
                      properties:
                        port:
                          type: integer
                        project:
                          type: string
                        pid:
                          type: integer
                        started:
                          type: integer
                        last_seen:
                          type: integer
                        alive:
                          type: boolean
                        age_minutes:
                          type: integer
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /ports/system:
    get:
      tags: [info]
      summary: List system/well-known ports in use
      operationId: listSystemPorts
      parameters:
        - name: range_only
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Only show ports within the managed range
        - name: unmanaged_only
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Only show ports not managed by Port Daddy
      responses:
        '200':
          description: System ports
          content:
            application/json:
              schema:
                type: object
                properties:
                  ports:
                    type: array
                    items:
                      type: object
                      properties:
                        port:
                          type: integer
                        managed_by_port_daddy:
                          type: boolean
                        project:
                          type: string
                          nullable: true
                  count:
                    type: integer
                  total_system_ports:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /ports/cleanup:
    post:
      tags: [info]
      summary: Release stale ports
      operationId: cleanupPorts
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  freed:
                    type: array
                    items: {}
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # SESSIONS
  # ===========================================================================
  /sessions:
    post:
      tags: [sessions]
      summary: Start a new session
      operationId: startSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  description: Description of what this session is for
                agentId:
                  type: string
                  description: Agent that owns this session
                files:
                  type: array
                  items:
                    type: string
                  description: Files to claim for this session
                force:
                  type: boolean
                  default: false
                  description: Force file claims even with conflicts
                metadata:
                  type: object
                  description: Arbitrary session metadata
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                    description: Session ID
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: File conflicts detected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                    example: FILE_CONFLICT
                  conflicts:
                    type: array
                    items: {}
                  hint:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [sessions]
      summary: List sessions
      operationId: listSessions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, abandoned]
        - name: agent
          in: query
          schema:
            type: string
          description: Filter by agent ID
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project
        - name: purpose
          in: query
          schema:
            type: string
          description: Filter by purpose (substring match)
        - name: worktree
          in: query
          schema:
            type: string
          description: Filter by worktree ID
        - name: all
          in: query
          schema:
            type: string
            enum: ['true']
          description: Include sessions from all worktrees
        - name: allWorktrees
          in: query
          schema:
            type: string
            enum: ['true']
          description: Alias for all
        - name: notes
          in: query
          schema:
            type: string
            enum: ['true']
          description: Include notes in response
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{id}:
    get:
      tags: [sessions]
      summary: Get session details including notes and files
      operationId: getSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/Session'
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [sessions]
      summary: End or abandon a session
      operationId: updateSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [completed, abandoned]
                  description: Set to 'abandoned' to abandon the session
                note:
                  type: string
                  description: Optional closing note
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  releasedFiles:
                    type: array
                    items:
                      type: string
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [sessions]
      summary: Delete session and cascade to notes and file claims
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{id}/phase:
    put:
      tags: [sessions]
      summary: Set session phase
      operationId: setSessionPhase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  type: string
                  description: Phase name
      responses:
        '200':
          description: Phase set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  phase:
                    type: string
                  previousPhase:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{id}/notes:
    post:
      tags: [sessions]
      summary: Compatibility alias for adding a note to a session
      description: Legacy spelling for targeted note writes. New callers should use POST /notes with sessionId in the request body; this route delegates to the same quickNote path.
      operationId: addSessionNote
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                type:
                  type: string
                  description: Note type (e.g. note, progress, decision, blocker)
      responses:
        '200':
          description: Note added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  noteId:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [sessions]
      summary: Get notes for a session
      operationId: getSessionNotes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
          description: Filter by note type
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp — only notes after this time
      responses:
        '200':
          description: Session notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  count:
                    type: integer
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{id}/files:
    post:
      tags: [sessions]
      summary: Claim files for a session
      operationId: claimSessionFiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                  description: File paths to claim
                regions:
                  type: array
                  items:
                    type: object
                    required: [path]
                    properties:
                      path:
                        type: string
                      startLine:
                        type: integer
                        minimum: 1
                      endLine:
                        type: integer
                      symbol:
                        type: string
                  description: Region-level claims
                force:
                  type: boolean
                  default: false
                  description: Force claims even with conflicts
      responses:
        '200':
          description: Files claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  claimed:
                    type: array
                    items:
                      type: string
                  conflicts:
                    type: array
                    items: {}
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Session not found
        '409':
          description: File conflicts detected
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [sessions]
      summary: Release files from a session
      operationId: releaseSessionFiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: paths
          in: query
          schema:
            type: string
          description: Comma-separated file paths to release
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                regions:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      startLine:
                        type: integer
                      endLine:
                        type: integer
      responses:
        '200':
          description: Files released
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  released:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalError'

  /notes:
    post:
      tags: [sessions]
      summary: Add a note through the canonical note write path
      description: Canonical note write endpoint. Pass sessionId to target a known session, or omit it to resolve the active session/quick-note context.
      operationId: quickNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                agentId:
                  type: string
                sessionId:
                  type: string
                  description: Target session ID. When omitted, the daemon resolves active session context or creates an implicit quick-note session.
                type:
                  type: string
      responses:
        '200':
          description: Note added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  noteId:
                    type: integer
                  sessionId:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [sessions]
      summary: Recent notes across all sessions
      operationId: listRecentNotes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: type
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp
      responses:
        '200':
          description: Recent notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /files:
    get:
      tags: [sessions]
      summary: List all active file claims across all sessions
      operationId: listAllFileClaims
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: Filter by file path
        - name: symbol
          in: query
          schema:
            type: string
          description: Filter by symbol name
        - name: agent
          in: query
          schema:
            type: string
          description: Filter by agent ID
        - name: purpose
          in: query
          schema:
            type: string
          description: Filter by session purpose
      responses:
        '200':
          description: Active file claims
        '500':
          $ref: '#/components/responses/InternalError'

  /files/who-owns:
    get:
      tags: [sessions]
      summary: Check who owns a specific file
      operationId: getFileOwner
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: File path to check
        - name: startLine
          in: query
          schema:
            type: integer
          description: Start line for range filter
        - name: endLine
          in: query
          schema:
            type: integer
          description: End line for range filter
      responses:
        '200':
          description: File ownership info
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /actors:
    get:
      tags: [actors]
      summary: List durable maritime actors
      operationId: listMaritimeActors
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Filter live evidence by project identity
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum session/salvage evidence rows to inspect
      responses:
        '200':
          description: Canonical actor roster with live body, session, and salvage signals
        '500':
          $ref: '#/components/responses/InternalError'

  /actors/{id}:
    get:
      tags: [actors]
      summary: Read one durable maritime actor by id or alias
      operationId: getMaritimeActor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Actor id or alias, for example coxswain, navigator, or cartographer
        - name: project
          in: query
          schema:
            type: string
          description: Filter live evidence by project identity
      responses:
        '200':
          description: Actor record
        '404':
          description: Unknown actor id or alias
        '500':
          $ref: '#/components/responses/InternalError'

  /actors/{id}/inbox:
    get:
      tags: [actors]
      summary: Read messages queued to one durable maritime actor mailbox
      operationId: listMaritimeActorInbox
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Actor id or alias, for example coxswain, navigator, or cartographer
        - name: unread
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Only return unread messages when true
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum messages to return
        - name: since
          in: query
          schema:
            type: integer
          description: Only return messages created after this epoch-millis timestamp
      responses:
        '200':
          description: Actor mailbox messages
        '404':
          description: Unknown actor id or alias
        '501':
          description: Actor inbox unavailable in this runtime
        '500':
          $ref: '#/components/responses/InternalError'

  /actors/{id}/inbox/stats:
    get:
      tags: [actors]
      summary: Read durable actor mailbox depth
      operationId: getMaritimeActorInboxStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Actor id or alias, for example coxswain, navigator, or cartographer
      responses:
        '200':
          description: Actor mailbox message counts
        '404':
          description: Unknown actor id or alias
        '501':
          description: Actor inbox unavailable in this runtime
        '500':
          $ref: '#/components/responses/InternalError'

  /actors/{id}/inbox/read-all:
    put:
      tags: [actors]
      summary: Mark all durable actor mailbox messages as read
      operationId: markMaritimeActorInboxRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Actor id or alias, for example coxswain, navigator, or cartographer
      responses:
        '200':
          description: Actor mailbox messages marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  actorId:
                    type: string
                  inboxTarget:
                    type: string
                  marked:
                    type: integer
        '404':
          description: Unknown actor id or alias
        '501':
          description: Actor inbox unavailable in this runtime
        '500':
          $ref: '#/components/responses/InternalError'

  /actors/{id}/message:
    post:
      tags: [actors]
      summary: Queue a message to one durable maritime actor mailbox
      operationId: messageMaritimeActor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Actor id or alias, for example coxswain, navigator, or cartographer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Message content to queue
                from:
                  type: string
                type:
                  type: string
                wake:
                  type: boolean
                  description: Try to hail the compatibility fleet body when one exists
                project:
                  type: string
      responses:
        '200':
          description: Message queued
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Unknown actor id or alias
        '501':
          description: Actor inbox unavailable in this runtime
        '500':
          $ref: '#/components/responses/InternalError'

  /advisor:
    get:
      tags: [advisor]
      summary: Get coordination advice from query parameters
      operationId: getAdvisorAdvice
      parameters:
        - name: projectRoot
          in: query
