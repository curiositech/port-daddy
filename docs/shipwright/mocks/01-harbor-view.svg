<?xml version="1.0" encoding="UTF-8"?>
<!--
  HARBOR VIEW · light-theme, paper ground, ink text.
  Every fill/stroke is inline to avoid CSS class-order bugs (lesson learned).
  Ships are data marks: class = kind, size = LOC, stern-dot = fleet status.
-->
