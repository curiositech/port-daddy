<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetBar Popover — Operator Deck (north-star mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Recursive:wght,MONO@400..800,0..1&display=swap" rel="stylesheet">
<style>
  /* ============ base ============ */
  * { margin:0; padding:0; box-sizing:border-box; }
  html { font-size:16px; }
  body {
    font-family:'Recursive', system-ui, sans-serif;
    font-variation-settings:'MONO' 0;
    background:#8b8781; /* neutral backdrop */
    min-height:100vh;
    padding:48px 32px 64px;
  }
  .mono { font-family:'Recursive', monospace; font-variation-settings:'MONO' 1; }
  .display { font-family:'Big Shoulders Display', sans-serif; }

  .stage { display:flex; gap:48px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  figure.unit { display:flex; flex-direction:column; gap:12px; }
  figcaption.cap {
    font-family:'Big Shoulders Display', sans-serif;
    font-size:14px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:#26231f; text-align:center;
  }

  /* ============ theme tokens ============ */
  .popover.light {
    --bg:#f2eee6; --ink:#121212; --mut:#5f584a; --card:#f8f5ee;
    --acc:#FFDB33; --acc-t:#8A5A00; --may:#C41E30; --ok:#1f7a4d; --amb:#a66f00;
    --flag-red:#C41E30; --flag-blue:#1e4f8f; --flag-yel:#FFDB33; --flag-white:#fbfaf5;
  }
  .popover.dark {
    --bg:#1e1b18; --ink:#f5f3ed; --mut:#a89f8f; --card:#272320;
    --acc:#FFDB33; --acc-t:#FFDB33; --may:#F26475; --ok:#6fbf8e; --amb:#e3b341;
    --flag-red:#e04a58; --flag-blue:#5b8ed0; --flag-yel:#FFDB33; --flag-white:#f5f3ed;
  }

  /* ============ popover shell ============ */
  /* Exception: 12px radius on the container only — a macOS primitive. Everything inside is square. */
  .popover {
    width:420px;
    background:var(--bg); color:var(--ink);
    border:2px solid var(--ink);
    border-radius:12px;
    overflow:hidden;
  }
  .sec { padding:18px 18px 16px; border-bottom:2px solid var(--ink); }

  .eyebrow {
    display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    margin-bottom:12px;
  }
  .flag { flex:none; display:inline-block; vertical-align:-1px; }

  /* ============ shared interactive ============ */
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :is(button, input, .rcard):focus-visible {
    outline:4px solid var(--acc); outline-offset:0; /* mustard ring seats against the 2px ink border */
  }

  .btn {
    font-family:'Big Shoulders Display', sans-serif;
    font-size:15px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    padding:8px 14px; border:2px solid var(--ink); background:var(--bg);
  }
  .btn.fill { background:var(--acc); color:#121212; border-color:#121212; }
  .btn.fill:hover { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .btn.ghost:hover { background:var(--ink); color:var(--bg); }
  .btn.deny { color:var(--may); border-color:var(--may); }
  .btn.deny:hover { background:var(--may); color:#fbfaf5; }

  /* ============ 1 · intent composer ============ */
  .ask {
    font-family:'Big Shoulders Display', sans-serif;
    font-size:26px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;
    margin-bottom:12px;
  }
  .composer { display:flex; gap:8px; }
  .composer input {
    flex:1; min-width:0; font-size:16px; padding:10px 12px;
    background:var(--card); border:2px solid var(--ink);
    font-family:'Recursive', monospace; font-variation-settings:'MONO' 1;
  }
  .composer input::placeholder { color:var(--mut); opacity:1; }
  .composer input:hover { background:var(--bg); }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip {
    font-size:14px; font-weight:500; padding:5px 10px;
    background:var(--card); border:2px solid var(--ink);
  }
  .chip:hover { background:var(--acc); color:#121212; border-color:#121212; }

  /* ============ 2 · human gates ============ */
  .gates .eyebrow { color:var(--may); }
  .gate {
    border:2px solid var(--may); background:var(--card);
    padding:12px 14px; margin-bottom:10px;
  }
  .gate:last-of-type { margin-bottom:0; }
  .gate-state {
    display:flex; align-items:center; gap:8px; color:var(--may);
    font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    margin-bottom:8px;
  }
  .gate-body { font-size:16px; line-height:1.45; margin-bottom:10px; }
  .gate-body strong { font-weight:700; }
  .gate .row { display:flex; gap:8px; flex-wrap:wrap; }

  /* ============ 3 · resume strip ============ */
  .resume-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .rcard {
    display:flex; flex-direction:column; gap:4px; text-align:left;
    background:var(--card); border:2px solid var(--ink); padding:10px;
  }
  .rcard:hover { background:var(--acc); color:#121212; border-color:#121212; }
  .rcard:hover .r-task, .rcard:hover .r-meta, .rcard:hover .r-time { color:#121212; }
  .r-proj {
    font-family:'Big Shoulders Display', sans-serif;
    font-size:15px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    overflow-wrap:anywhere;
  }
  .r-task { font-size:14px; color:var(--mut); line-height:1.3; overflow-wrap:anywhere; }
  .r-meta { font-size:13px; font-weight:700; margin-top:auto; }
  .r-meta.ok  { color:var(--ok); }
  .r-meta.amb { color:var(--amb); }
  .r-meta.mut { color:var(--mut); }
  .r-time { font-size:13px; color:var(--mut); font-family:'Recursive', monospace; font-variation-settings:'MONO' 1; }

  /* ============ 4 · quick actions ============ */
  .quick { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:14px 18px; border-bottom:2px solid var(--ink); }
  .qa {
    font-family:'Big Shoulders Display', sans-serif;
    font-size:15px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    line-height:1.25; padding:10px 6px;
    background:var(--bg); border:2px solid var(--ink);
  }
  .qa:hover { background:var(--ink); color:var(--bg); }

  /* ============ fleet drawer (collapsed) ============ */
  .drawer {
    display:block; width:100%; text-align:left;
    background:var(--card); border:0; border-bottom:2px solid var(--ink);
    padding:12px 18px;
  }
  .drawer:hover { background:var(--acc); color:#121212; }
  .drawer:hover .needs, .drawer:hover .g { color:#121212; }
  .drawer-line { display:flex; align-items:baseline; gap:6px; font-size:14px; font-weight:600; }
  .drawer-line .needs { color:var(--may); font-weight:700; }
  .drawer-line .disclose { margin-left:auto; font-size:14px; }
  .glance { display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .g {
    display:inline-flex; align-items:center; gap:5px;
    font-size:13px; font-weight:700; letter-spacing:.05em;
    font-family:'Recursive', monospace; font-variation-settings:'MONO' 1;
  }

  /* ============ footer micro-row ============ */
  .foot { display:flex; align-items:center; gap:8px; padding:10px 18px; }
  .dot { width:10px; height:10px; background:var(--ok); border:2px solid var(--ink); flex:none; }
  .stat { font-size:13px; color:var(--mut); }
  .link {
    margin-left:auto; background:none; border:2px solid transparent;
    font-size:14px; font-weight:600; padding:2px 6px; color:var(--acc-t);
  }
  .link + .link { margin-left:0; }
  .link:hover { border-color:var(--ink); color:var(--ink); }
</style>
</head>
<body>

<!-- ICS signal flag symbols: 14×10, 1px currentColor border, fills via theme vars -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="f-hotel" viewBox="0 0 14 10"><!-- left white / right red vertical halves -->
      <rect width="7" height="10" fill="var(--flag-white)"/><rect x="7" width="7" height="10" fill="var(--flag-red)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-foxtrot" viewBox="0 0 14 10"><!-- red field, white diamond -->
      <rect width="14" height="10" fill="var(--flag-red)"/>
      <polygon points="7,1.5 12.5,5 7,8.5 1.5,5" fill="var(--flag-white)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-bravo" viewBox="0 0 14 10"><!-- solid red, swallowtail notch on fly edge -->
      <polygon points="0,0 14,0 9.5,5 14,10 0,10" fill="var(--flag-red)"/>
      <polygon points=".5,.5 13,.5 8.9,5 13,9.5 .5,9.5" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-victor" viewBox="0 0 14 10"><!-- white, red X -->
      <clipPath id="cv"><rect width="14" height="10"/></clipPath>
      <rect width="14" height="10" fill="var(--flag-white)"/>
      <path d="M0,0 L14,10 M14,0 L0,10" stroke="var(--flag-red)" stroke-width="2" clip-path="url(#cv)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-delta" viewBox="0 0 14 10"><!-- blue/yellow/blue horizontal bands -->
      <rect width="14" height="10" fill="var(--flag-yel)"/>
      <rect width="14" height="3" fill="var(--flag-blue)"/><rect y="7" width="14" height="3" fill="var(--flag-blue)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-yankee" viewBox="0 0 14 10"><!-- yellow, red diagonal stripes -->
      <clipPath id="cy"><rect width="14" height="10"/></clipPath>
      <rect width="14" height="10" fill="var(--flag-yel)"/>
      <path d="M-3,7 L7,-3 M1,13 L13,1 M7,15 L19,3" stroke="var(--flag-red)" stroke-width="2" clip-path="url(#cy)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-mike" viewBox="0 0 14 10"><!-- white, blue X -->
      <clipPath id="cm"><rect width="14" height="10"/></clipPath>
      <rect width="14" height="10" fill="var(--flag-white)"/>
      <path d="M0,0 L14,10 M14,0 L0,10" stroke="var(--flag-blue)" stroke-width="2" clip-path="url(#cm)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="f-quebec" viewBox="0 0 14 10"><!-- solid yellow -->
      <rect width="14" height="10" fill="var(--flag-yel)"/>
      <rect x=".5" y=".5" width="13" height="9" fill="none" stroke="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="stage">

  <!-- ================= LIGHT / WARM PAPER ================= -->
  <figure class="unit">
    <figcaption class="cap">Light · Warm Paper</figcaption>
    <section class="popover light" aria-label="FleetBar popover, light variant">

      <!-- 1 · INTENT COMPOSER -->
      <div class="sec" aria-label="Intent composer">
        <h1 class="ask">What should the fleet do?</h1>
        <form class="composer" onsubmit="return false">
          <input type="text" placeholder="rebase PR #663 onto main, rerun the spawner suite" aria-label="Tell the fleet what to do">
          <button class="btn fill" type="submit">Submit</button>
        </form>
        <div class="chips">
          <button class="chip" type="button">Fix the flaky spawner test</button>
          <button class="chip" type="button">Catch me up on overnight work</button>
        </div>
      </div>

      <!-- 2 · HUMAN GATES -->
      <div class="sec gates" aria-label="Human gates">
        <p class="eyebrow"><svg class="flag" width="14" height="10"><use href="#f-foxtrot"/></svg> Needs you · 2</p>
        <article class="gate">
          <p class="gate-state"><svg class="flag" width="14" height="10"><use href="#f-foxtrot"/></svg> Foxtrot — approval gate</p>
          <p class="gate-body"><strong>code-reviewer</strong> requests: merge PR #664 <span class="mono">(pd embed)</span> — est. <span class="mono">$0.14</span></p>
          <div class="row">
            <button class="btn fill" type="button">Approve</button>
            <button class="btn ghost" type="button">Modify</button>
            <button class="btn deny" type="button">Deny</button>
          </div>
        </article>
        <article class="gate">
          <p class="gate-state"><svg class="flag" width="14" height="10"><use href="#f-victor"/></svg> Victor — claim conflict</p>
          <p class="gate-body"><strong>nightshift</strong> wants <span class="mono">cli/commands/embed.ts</span> — conflicts with <strong>your</strong> open claim</p>
          <div class="row">
            <button class="btn ghost" type="button">Force parley</button>
          </div>
        </article>
      </div>

      <!-- 3 · RESUME -->
      <div class="sec" aria-label="Resume work">
        <p class="eyebrow">Resume</p>
        <div class="resume-grid">
          <button class="rcard" type="button">
            <span class="r-proj">port-daddy</span>
            <span class="r-task">icos-signals-skill</span>
            <span class="r-meta ok">PR #663 green</span>
            <span class="r-time">2h ago</span>
          </button>
          <button class="rcard" type="button">
            <span class="r-proj">sobriety-tools</span>
            <span class="r-task">landing rework</span>
            <span class="r-meta amb">paused</span>
            <span class="r-time">today</span>
          </button>
          <button class="rcard" type="button">
            <span class="r-proj">expungement-guide</span>
            <span class="r-task">blog pipeline</span>
            <span class="r-meta mut">idle</span>
            <span class="r-time">since Tue</span>
          </button>
        </div>
      </div>

      <!-- 4 · QUICK ACTIONS -->
      <div class="quick" aria-label="Quick actions">
        <button class="qa" type="button">Show me what you built</button>
        <button class="qa" type="button">Talk to the fleet</button>
        <button class="qa" type="button">Console</button>
      </div>

      <!-- COLLAPSED FLEET DRAWER -->
      <button class="drawer" type="button" aria-expanded="false">
        <span class="drawer-line">Fleet drawer — 16 crew · 3 working · <span class="needs">1 needs you</span> <span class="disclose">▸</span></span>
        <span class="glance">
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-hotel"/></svg> H 3</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-foxtrot"/></svg> F 1</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-victor"/></svg> V 1</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-yankee"/></svg> Y 2</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-mike"/></svg> M 9</span>
        </span>
      </button>

      <!-- FOOTER MICRO-ROW -->
      <footer class="foot">
        <span class="dot" role="img" aria-label="daemon healthy"></span>
        <span class="stat mono">stable :9876 · v3.23</span>
        <button class="link" type="button">Secrets</button>
        <button class="link" type="button">Quit</button>
      </footer>
    </section>
  </figure>

  <!-- ================= DARK / WARM EBONY ================= -->
  <figure class="unit">
    <figcaption class="cap">Dark · Warm Ebony</figcaption>
    <section class="popover dark" aria-label="FleetBar popover, dark variant">

      <!-- 1 · INTENT COMPOSER -->
      <div class="sec" aria-label="Intent composer">
        <h1 class="ask">What should the fleet do?</h1>
        <form class="composer" onsubmit="return false">
          <input type="text" placeholder="rebase PR #663 onto main, rerun the spawner suite" aria-label="Tell the fleet what to do">
          <button class="btn fill" type="submit">Submit</button>
        </form>
        <div class="chips">
          <button class="chip" type="button">Fix the flaky spawner test</button>
          <button class="chip" type="button">Catch me up on overnight work</button>
        </div>
      </div>

      <!-- 2 · HUMAN GATES -->
      <div class="sec gates" aria-label="Human gates">
        <p class="eyebrow"><svg class="flag" width="14" height="10"><use href="#f-foxtrot"/></svg> Needs you · 2</p>
        <article class="gate">
          <p class="gate-state"><svg class="flag" width="14" height="10"><use href="#f-foxtrot"/></svg> Foxtrot — approval gate</p>
          <p class="gate-body"><strong>code-reviewer</strong> requests: merge PR #664 <span class="mono">(pd embed)</span> — est. <span class="mono">$0.14</span></p>
          <div class="row">
            <button class="btn fill" type="button">Approve</button>
            <button class="btn ghost" type="button">Modify</button>
            <button class="btn deny" type="button">Deny</button>
          </div>
        </article>
        <article class="gate">
          <p class="gate-state"><svg class="flag" width="14" height="10"><use href="#f-victor"/></svg> Victor — claim conflict</p>
          <p class="gate-body"><strong>nightshift</strong> wants <span class="mono">cli/commands/embed.ts</span> — conflicts with <strong>your</strong> open claim</p>
          <div class="row">
            <button class="btn ghost" type="button">Force parley</button>
          </div>
        </article>
      </div>

      <!-- 3 · RESUME -->
      <div class="sec" aria-label="Resume work">
        <p class="eyebrow">Resume</p>
        <div class="resume-grid">
          <button class="rcard" type="button">
            <span class="r-proj">port-daddy</span>
            <span class="r-task">icos-signals-skill</span>
            <span class="r-meta ok">PR #663 green</span>
            <span class="r-time">2h ago</span>
          </button>
          <button class="rcard" type="button">
            <span class="r-proj">sobriety-tools</span>
            <span class="r-task">landing rework</span>
            <span class="r-meta amb">paused</span>
            <span class="r-time">today</span>
          </button>
          <button class="rcard" type="button">
            <span class="r-proj">expungement-guide</span>
            <span class="r-task">blog pipeline</span>
            <span class="r-meta mut">idle</span>
            <span class="r-time">since Tue</span>
          </button>
        </div>
      </div>

      <!-- 4 · QUICK ACTIONS -->
      <div class="quick" aria-label="Quick actions">
        <button class="qa" type="button">Show me what you built</button>
        <button class="qa" type="button">Talk to the fleet</button>
        <button class="qa" type="button">Console</button>
      </div>

      <!-- COLLAPSED FLEET DRAWER -->
      <button class="drawer" type="button" aria-expanded="false">
        <span class="drawer-line">Fleet drawer — 16 crew · 3 working · <span class="needs">1 needs you</span> <span class="disclose">▸</span></span>
        <span class="glance">
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-hotel"/></svg> H 3</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-foxtrot"/></svg> F 1</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-victor"/></svg> V 1</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-yankee"/></svg> Y 2</span>
          <span class="g"><svg class="flag" width="14" height="10"><use href="#f-mike"/></svg> M 9</span>
        </span>
      </button>

      <!-- FOOTER MICRO-ROW -->
      <footer class="foot">
        <span class="dot" role="img" aria-label="daemon healthy"></span>
        <span class="stat mono">stable :9876 · v3.23</span>
        <button class="link" type="button">Secrets</button>
        <button class="link" type="button">Quit</button>
      </footer>
    </section>
  </figure>

</div>
</body>
</html>
