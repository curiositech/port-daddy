# COMMITTED deploy config — non-credential values only (resource ids are
# useless without an API token). Runtime secrets are set via
# `wrangler secret put` and survive deploys.
#
# Port Daddy Steward — Cloudflare Worker (P1 PR 1 scaffold)
#
# One Durable Object per repo holds the Steward's seat: charter, wake inbox,
# alarm heartbeat, and the append-only deck-log / merge-ledger fabric in the
# shared port-daddy-relay D1 database. See docs/plans/THE_FULL_WHEEL.md §11 P1
# and docs/adr/0109-the-steward-single-approver.md.
#
# Provisioning (run once):
#
#   1. Apply the ledger schema to the shared D1 database:
#        wrangler d1 execute port-daddy-relay --file=./schema.sql
#
#   2. Commission the seat (the bearer token every route requires; without it
#      the Worker answers 503 "seat not commissioned"):
#        openssl rand -hex 32 | wrangler secret put STEWARD_ADMIN_TOKEN
#
#   2b. Give the tick eyes (read-only survey of PRs/checks/reviews; without it
#       every wake logs "Tick held: cannot survey" and renders no verdicts).
#       A fine-grained PAT or App installation token with contents:read +
#       pull_requests:read + checks:read on this repo:
#        wrangler secret put STEWARD_GITHUB_TOKEN
#
#   2c. Arm the landing hand (OPTIONAL — presence of this secret is the
#       switch; without it every LAND verdict logs "seat holds no landing
#       capability" and nothing merges). Mint a SEPARATE fine-grained PAT,
#       scoped to this one repo, with Contents: Read+Write and
#       Pull requests: Read+Write — and NO admin/bypass rights. Non-admin is
#       load-bearing: GitHub refuses the merge whenever branch protection
#       (required checks, reviews) is unsatisfied, so the charter's "never
#       land over a real red" is enforced by the platform. This token is held
#       by the seat and by nothing else — revoking it disarms landing without
#       touching the survey eyes:
#        wrangler secret put STEWARD_LAND_TOKEN
#
#       Protected paths (.github/workflows/, Formula/, core/kernel/,
#       apps/relay/src/auth.ts, docs/adr/) additionally require a per-PR
#       operator grant before the seat will land them:
#        curl -X POST -H "Authorization: Bearer $STEWARD_ADMIN_TOKEN" \
#          https://<worker>/steward/<owner>/<repo>/ship-it/<prNumber>
#
#   3. Deploy — automatic: every push to main touching apps/steward/** deploys
#      via .github/workflows/deploy-steward.yml (secrets above survive every
#      deploy). For first-time provisioning or out-of-band repair:
#        wrangler deploy --config wrangler.deploy.toml

name = "pd-steward"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Shared append-only history fabric — same database the relay and
# fleet-executor already use (fleet_runs / fleet_run_steps live here too).
[[d1_databases]]
binding = "DB"
database_name = "port-daddy-relay"
database_id = "0907431b-9af0-48b5-b2b0-07e6b660bd41"

# The seats themselves. new_sqlite_classes: SQLite-backed DOs are the current
# platform default and give the seat transactional storage semantics.
[[durable_objects.bindings]]
name = "STEWARD"
class_name = "StewardDO"

[[migrations]]
tag = "v1-steward-seat"
new_sqlite_classes = ["StewardDO"]
