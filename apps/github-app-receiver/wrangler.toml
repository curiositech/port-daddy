# Cloudflare Worker config for the GitHub App webhook receiver.
#
# Two values must be set by the operator before `wrangler deploy`:
#
#   1. GITHUB_WEBHOOK_SECRET (secret)
#         echo "<value>" | wrangler secret put GITHUB_WEBHOOK_SECRET
#      Must match the webhook secret registered on the GitHub App.
#
#   2. DAEMON_FORWARD_URL (var, set below or via secret if sensitive)
#      The HTTPS URL the operator's Port Daddy daemon (or its public
#      tunnel — smee.io for dev, cloudflared / ngrok / Tailscale Funnel
#      for prod) listens on. The Worker POSTs the normalized webhook
#      envelope to this URL.
#
# Optional:
#   FORWARD_AUTH_TOKEN (secret) — bearer token the daemon expects.
#         echo "<value>" | wrangler secret put FORWARD_AUTH_TOKEN
#   FORWARD_TIMEOUT_MS (var)    — forward timeout in ms (default 8000).

name = "github-app-receiver"
main = "src/worker.ts"
compatibility_date = "2026-05-01"

# Override per environment with `--env <name>` or `[env.production]` blocks.
[vars]
DAEMON_FORWARD_URL = "https://plain-coins-nyc-generated.trycloudflare.com/fleet/github/webhook"
FORWARD_TIMEOUT_MS = "8000"

[observability]
enabled = true

# Secrets (do not commit values):
#   GITHUB_WEBHOOK_SECRET
#   FORWARD_AUTH_TOKEN   (optional)
