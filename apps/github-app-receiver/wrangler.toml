# Cloudflare Worker config for the GitHub App webhook receiver.
#
# THREE secrets must be set before `wrangler deploy`:
#
#   1. GITHUB_WEBHOOK_SECRET (secret)
#         openssl rand -base64 32 | wrangler secret put GITHUB_WEBHOOK_SECRET
#      Must match the webhook secret registered on the GitHub App.
#
#   2. DAEMON_FORWARD_URL (var, set below)
#      The HTTPS URL the cloudflared tunnel exposes, pointing at the daemon.
#      The Worker only forwards to /msg/* paths on this URL.
#
#   3. FORWARD_AUTH_TOKEN (secret) — REQUIRED, not optional
#         openssl rand -base64 32 | tee /dev/stderr | wrangler secret put FORWARD_AUTH_TOKEN
#      Set the same value on the daemon side:
#         echo 'PD_WEBHOOK_FORWARD_TOKEN=<value>' >> ~/.port-daddy/.env
#      The daemon rejects /msg POSTs without a matching Bearer token.
#
#   4. FORWARD_TIMEOUT_MS (var)    — forward timeout in ms (default 8000).

name = "github-app-receiver"
main = "src/worker.ts"
compatibility_date = "2026-05-01"

# Override per environment with `--env <name>` or `[env.production]` blocks.
[vars]
DAEMON_FORWARD_URL = "https://plain-coins-nyc-generated.trycloudflare.com/fleet/github/webhook"
FORWARD_TIMEOUT_MS = "8000"

[observability]
enabled = true

# Secrets (do not commit values):
#   GITHUB_WEBHOOK_SECRET
#   FORWARD_AUTH_TOKEN   (REQUIRED — worker refuses to start without it)
