# Cloudflare Worker — GitHub App webhook receiver + cloud fleet executor.
#
# No tunnel, no daemon, no Anthropic API key required.
# Fleet ships run entirely via Cloudflare Workers AI.
#
# Secrets (set via `wrangler secret put <NAME>` before first deploy):
#   GITHUB_WEBHOOK_SECRET   — HMAC secret matching the GitHub App webhook setting
#   GITHUB_APP_PRIVATE_KEY  — RSA private key PEM (base64-encoded or raw with \n)
#
# To deploy:
#   cd apps/github-app-receiver
#   echo "<secret>" | wrangler secret put GITHUB_WEBHOOK_SECRET
#   cat ~/.cloudflared/github-app.pem | base64 | wrangler secret put GITHUB_APP_PRIVATE_KEY
#   wrangler deploy

name = "github-app-receiver"
main = "src/worker.ts"
compatibility_date = "2026-05-01"

[vars]
# Numeric GitHub App ID (visible on the App settings page at github.com/settings/apps)
GITHUB_APP_ID = "YOUR_APP_ID_HERE"

[ai]
binding = "AI"

[observability]
enabled = true

# Secrets (do not commit values):
#   GITHUB_WEBHOOK_SECRET
#   GITHUB_APP_PRIVATE_KEY
