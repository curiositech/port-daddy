<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Port Daddy Scout</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <img class="brand-mark" src="assets/icons/scout-icon.svg" alt="" width="44" height="44">
      <div>
        <div class="eyebrow">Port Daddy Scout</div>
        <h1>Send visual issue</h1>
      </div>
      <div class="status" id="daemonStatus">Local</div>
    </header>

    <section class="capture">
      <div class="capture__text">
        <div>
          <strong id="captureTitle">No capture yet</strong>
          <span id="captureBadge" class="capture__badge" hidden>Captured</span>
        </div>
        <span id="captureMeta">Capture the active tab or draw a region.</span>
      </div>
      <div class="capture__actions">
        <button id="capturePage" type="button">Capture page</button>
        <button id="selectRegion" type="button">Select region</button>
      </div>
      <figure class="capture__preview" id="capturePreview" hidden>
        <img id="capturePreviewImage" alt="Captured page preview">
        <span id="captureRegionBox" class="capture__region" hidden></span>
      </figure>
      <section class="dom-card" id="domCard" hidden>
        <div class="dom-card__header">
          <strong>DOM context</strong>
          <span id="domCount">0 elements</span>
        </div>
        <ul id="domSummary"></ul>
      </section>
    </section>

    <label>
      <span>Brief</span>
      <textarea id="brief" rows="4" placeholder="What should Port Daddy fix or investigate?"></textarea>
    </label>

    <div class="grid">
      <label>
        <span>Kind</span>
        <select id="kind">
          <option value="fix">Fix</option>
          <option value="bug">Bug</option>
          <option value="nit">Nit</option>
          <option value="feedback">Feedback</option>
          <option value="question">Question</option>
        </select>
      </label>
      <label>
        <span>File under</span>
        <select id="assignee">
          <option value="review-queue">Review queue only</option>
          <option value="local-agent">Local spawn target</option>
          <option value="cloud-fleet">Cloud fleet queue</option>
        </select>
      </label>
    </div>

    <label id="agentRow">
      <span>Spawn target</span>
      <input id="targetAgent" type="text" placeholder="cartographer, qa, spark">
    </label>

    <label id="projectChoiceRow">
      <span>Project</span>
      <select id="projectChoice">
        <option value="">Loading Port Daddy projects...</option>
      </select>
      <small id="projectHint">Projects come from the local daemon.</small>
    </label>

    <label id="projectManualRow" hidden>
      <span>Manual project root</span>
      <input id="projectDir" type="text" placeholder="/Users/me/coding/my-app">
    </label>

    <label>
      <span>Published daemon endpoint</span>
      <input id="daemonUrl" type="url" inputmode="url" autocomplete="off" placeholder="Connect Scout from Port Daddy">
    </label>

    <label class="check">
      <input id="startAgent" type="checkbox">
      <span>
        <strong>Spawn work now</strong>
        <small>Off opens the issue without starting work.</small>
      </span>
    </label>

    <button class="submit" id="submitIssue" type="button">Open issue</button>
    <p class="message" id="message"></p>
  </main>
  <script src="daemon-endpoint.js"></script>
  <script src="popup.js"></script>
</body>
</html>
