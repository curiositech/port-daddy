# Source spec for the single native app target. Generated Xcode projects are
# not committed. CI and local compilation are unsigned; these defaults do not
# select an App Store Connect record or reserve a build number.
name: PortDaddy
options:
  bundleIdPrefix: ai.portdaddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"
packages:
  PortDaddyKit:
    path: .
targets:
  PortDaddy:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PortDaddyKit
        product: PortDaddyKit
    settings:
      base:
        INFOPLIST_FILE: PortDaddy-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: PortDaddy
        PRODUCT_BUNDLE_IDENTIFIER: ai.portdaddy.PortDaddy
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  PortDaddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PortDaddy
    settings:
      base:
        TEST_TARGET_NAME: PortDaddy
        PRODUCT_BUNDLE_IDENTIFIER: ai.portdaddy.PortDaddyUITests
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  PortDaddy:
    build:
      targets:
        PortDaddy: all
        PortDaddyUITests: [test]
    test:
      targets:
        - PortDaddyUITests
