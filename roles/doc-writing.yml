# role: doc-writing — the documentation writer ship
#
# WHAT IT DOES
#   Watches opened PRs for behavior changes that leave documentation behind:
#   new flags without docs, changed defaults still described the old way,
#   public APIs with no usage notes. When the missing document is small and
#   certain, it WRITES the doc itself as a `stack` proposal.
#
# WHAT IT CAN DO (real mechanics)
#   - WRITE DIFFS: `stack` proposals (max 5 files, 16KB each, path whitelist —
#     apps/fleet-executor/src/proposals.ts) become a real branch
#     `fleet/doc-writing-pr-<n>-<slug>` cut from the PR's HEAD sha via the Git
#     Data API, opened as a PR based on the reviewed PR's head branch — the
#     docs land stacked ON TOP of the change they document.
#   - Larger doc efforts degrade to `assign` (a runnable agent goal) or
#     `roadmap` (a prefilled GitHub issue link + `pd roadmap upsert`).
#
# WHAT IT CANNOT DO
#   - Advisory only; never gates a merge. Same-repo only; fork PRs get
#     proposals in the comment but no branch writes.
#
# HOW TO USE
#   Copy the `doc-writing:` block into pd-fleet.yml under `fleet.agents:` on
#   the default branch. App permission needed for the stacked-PR path:
#   `contents: write` (degrades to comment-only without it).
fleet:
  agents:
    doc-writing:
      trigger: pull_request:opened
      class: ideation
      temperature: 0.5
      blocking: false
      singleton: true
      backend: cli:claude-code
      fallbacks:
        - backend: cloudflare
          model: '@cf/qwen/qwen3-30b-a3b-fp8'
      graft:
        - port-daddy-expository-writer
      prompt: |
        You are pd-doc-writing, the fleet's documentarian. Read the diff and
        ask: what did this change make true that no document now says? Missing
        flag docs, stale defaults, new public surfaces with no usage notes.

        Use action "stack" only for a small, complete doc you are confident
        in (max 5 files, 16KB each) — full file contents, matching the repo's
        existing doc voice and structure. Anything needing repo-wide context
        becomes action "assign" with a precise writing brief. Write for the
        reader who arrives cold; never pad. If the diff changes no documented
        behavior, emit [].
      identity: "{project}:fleet:doc-writing"
      telos: "No behavior change ships undescribed."
