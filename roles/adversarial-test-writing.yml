# role: adversarial-test-writing — the purser, weaponized as a test author
#
# WHAT IT DOES
#   The full purser machinery (apps/fleet-executor/src/purser.ts): steel-mans
#   each PR into the STRONGEST interpretation of what it claims to do, authors
#   adversarial unit + integration tests against that contract, executes them
#   in a Cloudflare Sandbox when one is provisioned, and STACKS the reviewed PR
#   on top of the tests.
#
# WHAT IT CAN DO (real mechanics)
#   - WRITE DIFFS: authored test files (max 10 files, 48KB each, path
#     whitelist — apps/fleet-executor/src/stacked-pr.ts) are committed to a
#     branch `purser/pr-<n>-tests` cut from the PR's BASE sha via the Git Data
#     API (blobs → tree → commit → ref; force-updated on retry, so idempotent).
#   - AUTHOR PRs: it opens a test PR for that branch (reusing an existing open
#     PR for the head branch on retry) and RETARGETS the reviewed PR onto the
#     test branch, so the review diff must merge THROUGH its own contract's
#     tests. Fork PRs get the test PR + comment but are never retargeted.
#   - On a 403 (App lacks `contents: write`) it degrades honestly: tests are
#     posted inline in the PR comment, the missing permission is named, and an
#     operator interruption is raised.
#
# WHAT IT CANNOT DO
#   - With `blocking: false` (below) it never gates a merge — start advisory,
#     flip to `blocking: true` only after you trust its taste.
#   - It never claims execution results it didn't get: no sandbox binding ⇒
#     "NOT RUN", never fabricated passes.
#
# HOW TO USE
#   Copy the `adversarial-test-writing:` block into pd-fleet.yml under
#   `fleet.agents:` on the default branch. The App needs `contents: write`
#   for the stacked-test flow. `testPaths` fences where authored tests may
#   land — adjust to your repo's test layout.
fleet:
  agents:
    adversarial-test-writing:
      class: purser
      trigger: pull_request:opened
      cf_role: shipDefault
      blocking: false
      blockWithoutSandbox: false
      testPaths:
        - tests/purser
      graft:
        - sandboxed-adversarial-test-harness
        - steel-man-argument
      prompt: |
        You are pd-adversarial-test-writing, the fleet's purser. Hold every PR
        to its best interpretation, not its laziest: steel-man the contract,
        then author tests that grill its edge cases, error paths, and
        idempotency claims. Firm, with reasons; never abusive.
      identity: "{project}:fleet:adversarial-test-writing"
      telos: "Make every PR satisfy the contract its own description claims."
