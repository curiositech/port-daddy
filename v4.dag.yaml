# RETIRED-BY: ADR-0126
# ============================================================================
# RETIRED — superseded, kept as history.
#
# The critical path this graph encodes is dead as a plan: it runs
# XVIII -> I -> XVII -> II/III, and Part XVII (the daemon sync protocol) was
# rejected by ADR-0049's non-goals. A critical path through a rejected node
# orders nothing.
#
# The surviving fragment is ADR-0115 (replication classes, sync spine,
# co-signed PairingReceipt), which absorbed what Part XVII got right.
#
# Authority: docs/adr/0126-shared-harbors-resequencing.md, Formal supersessions.
# Retained deliberately (demote by default, delete only a merged twin).
# ============================================================================

# Port Daddy V4 Implementation DAG
# Format: WinDAGs V3-compatible DAGDefinition
#
# This file encodes the dependency graph for implementing V4.
# Validate with: node scripts/validate-dag.js v4.dag.yaml
#
# Node types:
#   concrete  — fully specified, ready to implement
#   vague     — expands into sub-DAG as upstream completes
#
# Commitment levels:
#   COMMITTED    — proven approach, persist until hard failure
#   TENTATIVE    — moderate confidence, reconsider on quality drop
#   EXPLORATORY  — novel, reconsider frequently

id: port-daddy-v4
name: "Port Daddy V4: Harbor-First Architecture"
description: >
  Full implementation plan for V4 — harbor enforcement, remote sync,
  pheromones, MCP tools, dashboard, anchors, and operational tooling.
  27 plan parts organized into 6 tiers with sub-DAGs for complex nodes.

# Declarative intent, not a concrete model id (ADR-0057 model-abstraction
# unification): "<backend>:<capability>", resolved via lib/model-registry.ts
# resolveModel({backend, capability}) by any future runtime consumer of this
# DAG plan. No code currently executes this field (scripts/validate-dag.js
# only checks the key is present) — kept declarative so a future executor
# never inherits a stale pinned model id.
default_model: claude:balanced

coordination_model:
  type: dag
  failure_semantics:
    supported_failure_types: [crash, crash-recovery, omission]
    recovery_mechanisms: [retry, redecompose, escalate]
    requires_compensation: false
    termination_guarantee: guaranteed

execution:
  max_parallel: 4
  checkpoint_strategy: per-wave
  mode: async

metadata:
  project: port-daddy
  version_target: "4.0"
  # Two branches from XVIII converge at II/III:
  #   XVIII → I → II/III (enforcement branch)
  #   XVIII → XVII → II/III (sync branch)
  # Longest single chain: XVIII → XVII → II/III (sync is 1500 LOE)
  critical_path: [part-xviii, part-xvii, part-ii-iii]
  critical_path_alt: [part-xviii, part-i, part-ii-iii]
  estimated_total_loe: 10950  # lines of new/modified code

# ═══════════════════════════════════════════════════════════════
# NODES
# ═══════════════════════════════════════════════════════════════

nodes:

  # ─── Tier 0: Foundations (no V4 deps) ───────────────────────

  - id: part-xviii
    type: concrete
    name: "Key Management"
    plan_part: 18
    tier: 0
    version: "4.0"
    critical_path: true
    commitment_level: COMMITTED
    loe: 400
    description: >
      File-based key storage at ~/.config/port-daddy/keys/ with 0600 permissions.
      HMAC signing key for harbor cards. signing_keys and revoked_jtis tables.
      Zero-downtime key rotation via kid-based JWT header lookup.
      JTI revocation with TTL-based cleanup. V4.1 adds Ed25519.
    produces:
      - lib/key-manager.ts
      - schema: signing_keys
      - schema: revoked_jtis
      - directory: ~/.config/port-daddy/keys/
    skills:
      - typescript-module
      - crypto-implementation
    input:
      requires: []
    output:
      type: module
      exports: [loadSigningKey, rotateKey, revokeJTI, verifyJTI]

  - id: part-vii
    type: concrete
    name: "Semantic Trie"
    plan_part: 7
    tier: 0
    version: "4.0"
    critical_path: false
    commitment_level: COMMITTED
    loe: 300
    description: >
      In-memory radix trie keyed on colon-delimited identity tokens.
      Built from SQLite on daemon startup, kept consistent with every write.
      Replaces SQL LIKE queries on hot path. Purely a cache — SQLite is
      source of truth, trie rebuilt on restart.
    produces:
      - lib/token-trie.ts
    skills:
      - typescript-module
      - data-structure-implementation
    input:
      requires: []
    output:
      type: module
      exports: [TokenTrie, TrieNode, insert, lookup, wildcardMatch]

  - id: part-vi
