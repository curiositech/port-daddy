        name: "pd harbor share / pd harbor join — keypair export/import CLI (remaining gap)"
        depends_on: []
        loe: 100
      - id: part-xvii.2
        name: "Relay harbor-fingerprint namespacing + membership (shipped: apps/relay/src/harbors.ts)"
        depends_on: []
        loe: 0
      - id: part-xvii.3
        name: "Per-(harbor,channel) SSE fan-out Durable Object (shipped: apps/relay/src/harbor-channel.ts; untested)"
        depends_on: []
        loe: 0
      - id: part-xvii.4
        name: "Per-harbor daily quota + rate limiting (shipped: apps/relay/src/harbor-quota.ts)"
        depends_on: []
        loe: 0
      - id: part-xvii.5
        name: "Direct test coverage for harbor-channel.ts (remaining gap — SSE fan-out/revocation/rate-limit untested)"
        depends_on: [part-xvii.2]
        loe: 100
      - id: part-xvii.6
        name: "Operator docs: cross-device harbor sharing walkthrough (remaining gap)"
        depends_on: [part-xvii.1]
        loe: 0
    produces:
