  # ─── Tier 4: Sync & Networking ──────────────────────────────

  - id: part-xvii
    type: vague
    name: "Remote Harbor via Relay Federation"
    plan_part: 17
    tier: 4
    version: "4.0"
    critical_path: true
    commitment_level: COMMITTED
    loe: 200
    role_description: >
      REDEFINED per ADR-0027 (Relay Harbor Mesh) and the "V4 Remote Harbor:
      Redefinition" decision — this was originally scoped as distributed
      state replication (WebSocket bidirectional sync, HLC, 5-bucket
      Merkle, LWW conflict resolution; the description/sub_dag below through
      2026-08 read as that original scope and were never migrated after the
      ADR landed). The accepted decision: a harbor whose membership is
      shared across daemons via out-of-band Ed25519 keypair exchange, with
      pub/sub coordination (not state sync) provided by the PD Relay under
      harbor-fingerprint namespacing. Session state (sessions, notes,
      locks, agents) stays local per daemon — that's a privacy feature,
      not a gap. Most of this is already shipped: apps/relay/src/harbors.ts
      (harbor create/join/membership, ADR-0049 X2 slice),
      apps/relay/src/harbor-channel.ts (per-harbor-channel Durable Object:
      SSE fan-out, revocation broadcast, rate limiting — ships with zero
      direct test coverage as of 2026-08, a real gap), and
      apps/relay/src/harbor-quota.ts (per-harbor daily quota). The loe:200
      remaining is the daemon-side `pd harbor share` / `pd harbor join`
      keypair-exchange CLI verbs (cli/commands/harbors.ts currently only
      has create/enter/leave/show/destroy — no share/join) plus operator
      docs for cross-device harbor sharing. No HLC. No Merkle diffing. No
      LWW/CRDT conflict resolution — those are explicitly rejected, not
      deferred.
    dependency_list: [part-xviii]
    estimated_expansion_depth: 6
    sub_dag:
