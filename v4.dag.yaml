      - apps/relay/src/harbor-channel.ts
      - apps/relay/src/harbor-quota.ts
      - cli/commands/harbors.ts (share/join verbs — not yet added)
      - tests/unit/routes-harbors.test.js
    soft_deps: [part-i, part-xiii, part-xv]

