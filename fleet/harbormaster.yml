# fleet/harbormaster.yml — Harbormaster fleet ship snippet (ADR-0037).
#
# This is a snippet, not a standalone fleet config. Paste the `agents:` and
# `channels:` blocks below into the root `pd-fleet.yml`'s corresponding
# sections, or use `pd fleet up harbormaster` once the engine grows the
# include-snippet primitive.
#
# Backend rationale: cli:claude-code so the sub-dispatches harbormaster
# opens when a rebase conflicts use the operator's claude-code subscription
# (the worker actor receiving the sub-dispatch will be claude-code-backed
# too — keeping conflict resolution on the same backend reduces variance).
#
# Triggers:
#   - cron every 30 seconds: belt-and-suspenders polling in case the
#     dispatch:accepted channel ever drops events.
#   - channel dispatch:accepted: immediate reaction when the operator
#     accepts a dispatch via `pd review --accept`. This is the fast path.

agents:
  harbormaster:
    triggers:
      - cron: '*/30 * * * * *'
      - channel: 'dispatch:accepted'
    body: lib/harbormaster.ts
    backend: cli:claude-code
    # The body is long-running, not a one-shot agent. Singleton + no
    # cooldown — the body itself owns the polling cadence.
    singleton: true
    cooldown_ms: 0
    # Allowed tools are intentionally narrow. The body shells out to
    # git/gh/pd only; no Read/Write/Edit of arbitrary files.
    allowedTools: "Bash(git*),Bash(gh*),Bash(pd note*),Bash(pd dispatch*)"
    identity: "{project}:harbormaster"
    telos: "Serialize merges of operator-accepted dispatches; route conflicts back."
    on_success: publish harbormaster:merged
    on_failure: publish harbormaster:blocked

channels:
  dispatch:accepted:
    description: "Operator accepted a dispatch via pd review --accept; harbormaster polls"
    consumers: [ harbormaster ]

  harbormaster:merged:
    description: "Harbormaster merged a dispatch's PR successfully"

  harbormaster:conflict:
    description: "Harbormaster hit a rebase conflict; sub-dispatch routed back to worker"

  harbormaster:blocked:
    description: "Harbormaster could not merge (CI red, branch protection, etc.); operator action needed"
