[workspace]
resolver = "2"
members = [
  "pd-bosun",
  "pd-console",
  "kernel/pd-anchor",
  "kernel/pd-compat",
  "kernel/pd-core",
  "kernel/pd-eventlog",
  "kernel/pd-mesh",
  "kernel/pd-runtime",
  "kernel/pd-tui",
  "kernel/pd-rs",
]

# harbor-card-rs and pd-tui live inside core/ but are NOT members of this
# workspace: harbor-card-rs is a standalone FFI cdylib that scripts/build-core.sh
# compiles on its own (own target-dir), and pd-tui is the ratatui skeleton from
# the worktree, intentionally omitted until merged with kernel/pd-tui. Without an
# explicit exclude, cargo aborts building either one with "current package
# believes it's in a workspace when it's not" (broke compiled-daemon-smoke).
exclude = [
  "harbor-card-rs",
  "pd-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Port Daddy contributors"]
repository = "https://github.com/curiositech/port-daddy"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ed25519-dalek = "2.1"
hex = "0.4"
ratatui = { version = "0.29", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
