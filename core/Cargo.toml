[workspace]
resolver = "2"
members = [
  "pd-bosun",
  "pd-broker",
  "pd-console",
  "kernel/pd-anchor",
  "kernel/pd-compat",
  "kernel/pd-core",
  "kernel/pd-eventlog",
  "kernel/pd-mesh",
  "kernel/pd-runtime",
  "kernel/pd-tui",
  "kernel/pd-vault",
  "kernel/pd-rs",
]

# harbor-card-rs, pd-tui, and pd-timeline-proto live inside core/ but are NOT
# members of this workspace. harbor-card-rs is a standalone FFI cdylib that
# scripts/build-core.sh compiles on its own (own target-dir); pd-tui is the
# ratatui skeleton from the worktree (omitted until merged with kernel/pd-tui);
# pd-timeline-proto is the Metalsmith R&D window (macOS-only winit+wgpu+Vello+
# Parley), which also declares its own empty `[workspace]` table so it builds as
# a separate workspace root with its own Cargo.lock. Excluding them keeps the
# Linux `rust-console` CI job from trying to compile macOS/GPU code. Without an
# explicit exclude, cargo aborts with "current package believes it's in a
# workspace when it's not" (broke compiled-daemon-smoke).
#
# NB: core/Cargo.lock is intentionally left at its committed state; `cargo check`
# expands it in-place on this toolchain regardless of these crates (a pre-existing
# repo condition), and CI does not pass --locked, so the job stays green.
exclude = [
  "harbor-card-rs",
  "pd-tui",
  "pd-timeline-proto",
  "pd-flag-proto",
  "pd-harbor-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Port Daddy contributors"]
repository = "https://github.com/curiositech/port-daddy"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ed25519-dalek = "2.1"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
ratatui = { version = "0.29", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

# Stripping debuginfo from the test profile keeps the gpui test binary's
# compilation under this machine's memory ceiling (debuginfo=2 on the combined
# gpui+app crate SIGBUSes rustc). Tests still run with full assertions.
[profile.test]
debug = false
