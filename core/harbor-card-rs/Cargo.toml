[package]
name = "harbor-card-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
base64 = "0.22"
chrono = "0.4"
thiserror = "1.0"
zeroize = "1.8"
# hv:2 signs the SHA-256 digest of the JWT signing input, not the input itself
# (see the module docs). Already in the tree transitively via ed25519-dalek;
# named directly because this crate depends on it for protocol reasons, not as
# an incidental transitive.
sha2 = "0.10"

[dev-dependencies]
proptest = "1.4"
# Adversarial redteam integration suite needs to forge/sign tokens and drive the
# JSON FFI directly, so it pulls the signing + encoding crates as dev-deps.
ed25519-dalek = "2.1"
base64 = "0.22"
serde_json = "1.0"
