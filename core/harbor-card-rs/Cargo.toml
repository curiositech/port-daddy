[package]
name = "harbor-card-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
base64 = "0.22"
chrono = "0.4"
thiserror = "1.0"
zeroize = "1.8"

[dev-dependencies]
proptest = "1.4"
# Criterion baseline for the live-production subset/constant-time-compare path.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "subset_bench"
harness = false
