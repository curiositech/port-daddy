[workspace]
resolver = "2"
members = [
  "pd-anchor",
  "pd-compat",
  "pd-core",
  "pd-eventlog",
  "pd-mesh",
  "pd-runtime",
  "pd-tui",
  "pd-vault",
  "pd-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Port Daddy contributors"]
repository = "https://github.com/curiositech/port-daddy-kernel-rs"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
