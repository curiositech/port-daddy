[package]
name = "pd-anchor"
description = "Anchor identity, signed cards, capability envelopes, and evidence roots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# rlib for in-Rust use + tests; cdylib for the C ABI the TS daemon loads via koffi
# (ADR-0054 — the kernel is the canonical macaroon impl). Mirrors harbor-card-rs.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
pd-core = { path = "../pd-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Criterion baseline for the kernel hot paths (schedule CPM + macaroon verify).
# default-features off drops the plotters/gnuplot HTML-report machinery we don't
# need in CI; the statistical timing + confidence intervals are unaffected.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "schedule_bench"
harness = false

[[bench]]
name = "macaroon_bench"
harness = false
