[package]
name = "pd-anchor"
description = "Anchor identity, signed cards, capability envelopes, and evidence roots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# rlib for in-Rust use + tests; cdylib for the C ABI the TS daemon loads via koffi
# (ADR-0054 — the kernel is the canonical macaroon impl). Mirrors harbor-card-rs.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
pd-core = { path = "../pd-core" }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = "2.17"

[dev-dependencies]
# Property-based fuzzing of the FFI boundary (adversarial redteam suite): feed
# millions of structured-random byte strings at the C-ABI exports and assert every
# one fails closed (non-null sentinel JSON, never a panic across the boundary).
proptest = "1.4"
# Criterion baseline for the kernel hot paths (schedule CPM + macaroon verify).
# default-features off drops the plotters/gnuplot HTML-report machinery we don't
# need in CI; the statistical timing + confidence intervals are unaffected.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "schedule_bench"
harness = false

[[bench]]
name = "macaroon_bench"
harness = false
