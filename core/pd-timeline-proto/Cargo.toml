# Empty [workspace] table makes this crate its OWN workspace root with its own
# Cargo.lock. Without it, cargo treats this excluded-but-nested crate as part of
# the parent `core/` workspace's resolution and pulls the entire wgpu/vello/
# winit dep tree (~520 packages) into core/Cargo.lock — a noisy diff that churns
# the Linux CI. This mirrors how harbor-card-rs keeps its own lockfile.
[workspace]

[package]
name = "pd-timeline-proto"
version = "0.1.0"
edition = "2021"
description = "Metalsmith R&D: a standalone macOS window rendering a 'Voyage Timeline' with custom GPU vector graphics (Vello) + high-quality text (Parley). Proves the bare-metal rendering ceiling beyond gpui's widget model. NOT wired into pd-console or the daemon."
license = "MIT"
publish = false

# This crate is intentionally EXCLUDED from the core/ workspace (see core/Cargo.toml).
# It pulls heavy, macOS-centric GPU deps (wgpu/Metal, Vello, Parley) that must stay
# out of the Linux `rust-console` CI job. Build it explicitly:
#   cd core/pd-timeline-proto && cargo run --release

[[bin]]
name = "pd-timeline-proto"
path = "src/main.rs"

[dependencies]
# GPU vector renderer (compute-based path rendering on wgpu).
vello = "0.3"
# wgpu is re-exported by vello; pin the matching minor so surface/device types line up.
wgpu = "22"
# Windowing + event loop.
winit = "0.30"
# Text shaping + layout (HarfRust-backed) and font loading.
parley = "0.2"
# Color / brush helpers used by both vello and parley examples.
peniko = "0.2"
# 2D geometry: points, bezier paths, affines.
kurbo = "0.11"
# Async surface acquisition for wgpu.
pollster = "0.4"
# Real-data fetch from the Port Daddy daemon at startup (blocking, one-shot).
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging the chosen backend + frame timing.
env_logger = "0.11"
log = "0.4"
