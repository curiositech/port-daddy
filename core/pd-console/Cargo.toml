[package]
name = "pd-console"
version = "3.22.0"
edition = "2021"
description = "Port Daddy operator console — GPU-native standalone app (ADR-0046 Phase 1). GPUI shell over the engine; a headless TUI repl renders the same panes."

# The engine REPL — headless, builds everywhere (no gpui). This is the CI/Linux gate.
[[bin]]
name = "pd-console-repl"
path = "src/bin/repl.rs"

# The real thing: GPU-native standalone window. gpui is Metal/macOS-centric and a heavy
# build, so it is gated behind the `gpui` feature: default `cargo check` (Linux CI) skips
# this bin and never compiles gpui; the macOS CI job builds it with `--features gpui`.
[[bin]]
name = "pd-console"
path = "src/main.rs"
required-features = ["gpui"]

[features]
# Pulls in the GPU shell. Off by default so the lib + repl compile fast on Linux.
# `gpui` also pulls in `rodio` for the procedural UI sound layer (macOS CoreAudio),
# so the headless repl + Linux CI never compile an audio backend.
gpui = ["dep:gpui", "dep:rodio"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dirs = "5"
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gpui = { version = "0.2.2", optional = true }
# Procedural UI sound — synthesized in-process (no audio assets shipped). Gated
# behind `gpui`; `default-features = false` drops the MP3/Vorbis/FLAC decoders we
# never use, keeping the build lean (we only synth raw f32 sample buffers).
rodio = { version = "0.20", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
