[package]
name = "pd-console"
version = "0.2.0"
edition = "2021"
description = "Port Daddy operator console — GPU-native standalone app (ADR-0046 Phase 1). GPUI shell over the engine."

# The engine REPL — still useful headless / in CI
[[bin]]
name = "pd-console-repl"
path = "src/bin/repl.rs"

# The real thing: GPU-native standalone window app
[[bin]]
name = "pd-console"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
